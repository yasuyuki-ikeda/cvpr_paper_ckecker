name: Collect arXiv cs.CV papers

on:
  schedule:
    # Every Saturday 10:00 JST (= Saturday 01:00 UTC). GitHub may start it a little late.
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to collect (ending today, JST)"
        default: "7"
        required: true

permissions:
  contents: write

concurrency:
  group: collect-arxiv-cv
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect papers
        env:
          TZ: Asia/Tokyo
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: python -u collect_arxiv_cv.py --days "$DAYS"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result
          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi
          git commit -m "Add arXiv cs.CV results ($(TZ=Asia/Tokyo date +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
