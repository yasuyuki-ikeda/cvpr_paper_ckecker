sing four of its finding maps."}}], ["2026-11-04", "PLANTEUR: A Crop-Type Segmentation Benchmark for Tropical Regions", "PLANTEUR：熱帯地域のための作物型セグメンテーションベンチマーク", "", "あり", "衛星・航空画像", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2611.05223", "summary": ["既存のベンチマークでは、熱帯地域の地理参照データが不足しています。", "PLANTEURは、作物タイプのセグメンテーションのために、小包由来のラベルを持つSentinel-2、Sentinel-1、およびLandsat-8データを使用します。", "ベンチマークには、8つのクラスが含まれており、2つの分割プロトコルを持つモデルタイプを評価します。"], "figure": {"images": ["https://arxiv.org/html/2611.05223v1/figures/map.png"], "caption": "Figure 1 : PLANTEUR pixels illustrated on maps of the six tropical regions included in the dataset. Note that the whitespace represents pixels that do not include labels, whether due to being non-agricultural (e.g., mountains) or labels not existing in the data source."}}], ["2026-11-04", "Diffusion Plug-in Priors for Self-Supervised Ultrasound Video Restoration", "自己監督超音波のビデオ復帰のための拡散の差込式のPriors", "", "公開予定", "動画", "特徴表現", "", "", "●", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2611.05206", "summary": ["超音波ビデオは、ハードウェアに制約された空間分解能と信号に依存するスペックルによって制限されており、監視された復元のための低解像度と高解像度の集録はほとんどありません。", "UltraDiffは、範囲に制約された最大事後定式化の下でDMサンプラーの潜在シードを最適化することにより、各フレームを復元する前に、凍結された事前訓練された拡散モデルをプラグインとして使用します。", "自然なイメージの前のUltraDiffは最も強いベースライン上の1.24dBによってPSNRを改善し、超音波関連の前処理はそれを更に改善する。"], "figure": {"images": ["https://arxiv.org/html/2611.05206v2/figure1.png"], "caption": "Figure 1: Motivating comparison of ultrasound video restoration. We compare reconstructed frames from LR ultrasound sequences with HR references and representative methods, including EDSR, ZSSR-Cycle, and UltraDiff. The zoom-in regions highlight structural details and tissue texture: UltraDiff suppresses noise while better preserving anatomical structures and the tissue echotexture."}}], ["2026-11-04", "TAQ-MOTR: Tracking-Aware Detection Query Formation for End-to-End Multiple Object Tracking", "TAQ-MOT reen arrows), and only the learned process reaches levels above a in a_{\\rm in} . There, the consistency los…"}}], ["2026-10-31", "Any Forcing: Any-Step Generality and One-Step Stability for Autoregressive Video Generation", "任意の強制：任意のステップの一般性と自己回帰ビデオ生成のためのワンステップの安定性", "", "なし", "動画", "動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.42031", "summary": ["既存の方法は固定サンプリングステップに制限されており、生成品質と効率のバランスの柔軟性が制限されており、ワンステップ生成は視覚品質の低下とエラーの蓄積に悩まされています。", "任意の強制は，実分布とステップ間整合性アライメントのための敵対的弁別器と，意味的関連性と価値寄与のための訓練なしの適応記憶選択機構を持つ統一されたフレームワークを提案した。", "任意の強制は、短いビデオと長いビデオの生成のための単一のH100GPU上で20.9と24.7FPSを達成します。"], "figure": {"images": ["https://arxiv.org/html/2610.42031v1/long_video.png"], "caption": "Figure 1 : Visual comparison of short- and long-video generation. Existing methods exhibit degraded visual quality and suffer from long-horizon error accumulation under one-step sampling. Any Forcing achieves stable one-step generation and long-horizon consistency."}}], ["2026-10-31", "GeoFlip Preview: Benchmarking Geometry-Sensitive Physics in Video Generation", "GeoFlipプレビュー:ビデオ生成におけるジオメトリに敏感な物理学のベンチマーク", "", "なし", "イベントカメラ・動画・画像", "動画", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.42002", "summary": ["ビデオ生成モデルは、初期ジオメトリの変化に正しく対応するのに苦労しています", "GeoFlipは、ビデオ生成における物理的な一貫性をテストするために、制御された幾何学的介入と物理的参照を備えたベンチマークを導入します", "ベンチマークは、16のモデルを442の共有条件で三次元にわたって評価し、0.906と0.929のランク相関を達成します"], "figure": {"images": ["https://arxiv.org/html/2610.42002v2/asset01_geometry_motivation.png"], "caption": "Figure 1 : Plausible motion can miss geometry-dependent outcomes. Increasing overhang flips the reference outcome, while Wan2.2-I2V-A14B falls in both conditions. Initial geometry is enlarged (0 s); outcomes are shown at 1.5 s."}}], ["2026-10-31", "MoETok: Sparse Expert Routing for 1D Visual Tokenizers", "MoETok:1Dビジュアルトークナイザーのためのスパースエキスパートルーティング", "", "なし", "画像・テキスト", "3D データ", "", "", "", "●", axiv.org/abs/2610.41983", "summary": ["既存のベンチマークでは、モデルがストリーミングビデオの理解に歴史的な証拠を使用するかどうかは決定されません。", "TwinPastは、回答が歴史的証拠の変化に従っているかどうかをテストするために、350人の人間レビュービデオペアを使用しています。", "34のモデル構成はqwen3-VL-8BおよびDeepSeek-Flashのための性能を改善する歴史的な入力と、評価される。"], "figure": {"images": ["https://arxiv.org/html/2610.41983v1/TwinPast_MainFigure.png"], "caption": "Figure 1 : TwinPast overview. Existing benchmarks can reward answers without historical evidence. TwinPast fixes recent context, questions, and options while changing history and correct answers; PairAcc requires both branches correct."}}], ["2026-10-31", "Does Vendor Image Processing Matter? Learning Echocardiography Display Appearance from Native Beamspace Data", "ベンダーの画像処理は重要ですか？ ネイティブビームスペースデータから心エコー図表示の外観を学ぶ", "", "あり", "医用画像", "特徴表現", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2611.00184", "summary": ["ベンダーで処理された心エコー画像は、文書化されていない処理により、モデルのパフォーマンスと堅牢性に影響を与える可能性があります。", "ネイティブビームスペース輝度モード超音波からＧｅｎｅｒａｌｅｃｌｉｃディスプレイ外観を再現するために，小さな畳み込みニューラルネットワークを訓練した。", "Beamspace CNNは最適のpointwise明るさの地図上の43%テスト平均の絶対誤差を減らす。"], "figure": {"images": ["https://arxiv.org/html/2611.00184v1/fig_pipeline_mie2027.png"], "caption": "Figure 1: Left: appearance learning against the vendor display. Right: the same frame without and with filtering."}}], ["2026-10-31", "IGDA-ICMH: an Importance Guided Feature and Network Dual Adaptation Framework towards Image Compression for Machine and Human Vision", "IGDA-ICMH:機械および人間の視野のためのイメージ圧縮の方の重要性の導かれた特徴およびネットワークの二重適応のフレームワーク", "", "なし", "画像", "バウンディングボックス・ラベル", "●", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.41924", "summary": ["既存の方法では、ダウンストリームマシンビジョンタスクに対するさまざまな機能とネットワーク層の不均等な貢献を見落としています。", "暗黙的なニューラル表現を適用し，特徴とネットワーク重み適応を設計する重要性ガイド付き特徴とネットワーク二重適応（ＩＧＤＡ）フレームワークを提案した。", "このフレームワークは、ICMHのための既存の暗黙的な神経表現ベースの方法よりも有意に優れた性能を達成する。"], "figure": {"images": ["https://arxiv.org/html/2610.41924v1/figures/network.jpg", "https://a "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40302", "summary": ["X線血管造影における冠動脈セグメンテーションのためのディープラーニングモデルは、トレーニングで表されていないセンターからのデータでは不十分に機能します。", "Ｎｎｕ-Ｎｅｔモデルから生成された擬似ラベルとプレコントラストフレーム減算からのコントラストマップを用いた自己訓練を用いることを提案した。", "XCADプールで訓練されたモデルは、マクロ平均サイコロスコアを2.7ポイント改善しました。"], "figure": null}], ["2026-10-30", "LoRe-MIM: Lost-or-Replaced Masked Image Modeling for Self-Supervised Representation Learning in Whole-Body PET/CT", "LoRe-MIM:全身PET/CTにおける自己教師あり表現学習のための失われたまたは置き換えられたマスクされた画像モデリング", "", "なし", "医用画像", "ラベル・マスク", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40284", "summary": ["既存の方法は、時間、コスト、および限られた大規模なデータセットのために、全身PET/CTに注釈を付ける上で課題に直面しています。", "LoRe-MIMは、マルチモーダル表現を学習するために、画像領域をゼロに置き換えるか、相補的な画像モダリティに置き換えるマスキング戦略を使用します。", "LoRe-MIMは、6つのダウンストリームタスクで最先端のベースラインを上回っています。"], "figure": {"images": ["https://arxiv.org/html/2610.40284v1/overview.png"], "caption": "Figure 1: Overview of the proposed masking approach."}}], ["2026-10-30", "TaskFrame: Connecting Task-Level Planning with Frame-Level Control for Game Agents", "TaskFrame:ゲームエージェントのタスクレベルの計画とフレームレベルの制御を接続する", "Tencent", "なし", "画像・テキスト", "テキスト・行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40276", "summary": ["既存の方法は、動的な視覚環境で高レベルのタスク推論と低遅延のアクション制御を組み合わせるのに苦労しています。", "TaskFrameは、視覚言語プランナーと因果トランスコントローラを備えた階層的なプランナーコントローラフレームワークを使用して、タスクレベルの計画とフレームレベ", "タスクフレームは、閉ループ評価でベースラインよりも高い戦闘成功率を達成します。"], "figure": {"images": ["https://arxiv.org/html/2610.40276v1/teaser.png"], "caption": "Figure 1: Overview of TaskFrame. Once per task, the task planner decomposes a high-level instruction into ordered atomic goals, each terminated by a special goal token whose hidden state is cached as a goal embedding. At every frame, the frame controller takes the embedding of the active goal and the latest visual input and emits native keyboard-and-mouse actions."}}]]}</script>
<script>
const {headers, groups, summaryHeaders, rows} = JSON.parse(document.getElementById("data").textContent);
// Column kinds: date, text (free-text filter), company (one dropdown entry per
// company; a cell can list several, joined by "; "), code, flag (●). Each row
// carries one extra, hidden object at the end: the alphaXiv URL and the summary.
const kinds = ["date", "text", "text", "company", "code", "text", "text"]
  .concat(Array(headers.length - 7).fill("flag"));
const widths = {1: "w-title", 2: "w-ja", 3: "w-co", 5: "w-io", 6: "w-io"};
let selected = null;  // the row shown in the lower pane
const ANY = "\u0000", SOME = "\u0001";  // "すべて" and "(企業あり)"
const companiesOf = value => value ? value.split("; ") : [];
const filters = [];
let sortCol = 0, sortDir = -1;

// Top row: group names spanning their columns, empty cells elsewhere.
const groupRow = document.getElementById("groups");
for (let i = 0; i < headers.length; i++) {
  const group = groups.find(g => g.first === i);
  const th = document.createElement("th");
  if (group) {
    th.textContent = group.name;
    th.colSpan = group.count;
    th.className = "group";
    i += group.count - 1;
  } else {
    th.className = "blank";
  }
  groupRow.appendChild(th);
}

const headRow = document.getElementById("heads");
const filterRow = document.getElementById("filters");
headers.forEach((name, i) => {
  const th = document.createElement("th");
  th.textContent = name;
  th.className = "sort " + (widths[i] || (kinds[i] === "flag" ? "w-flag" : ""));
  th.addEventListener("click", () => {
    sortDir = sortCol === i ? -sortDir : (kinds[i] === "flag" ? -1 : 1);
    sortCol = i;
    render();
  });
  headRow.appendChild(th);

  const cell = document.createElement("th");
  let control = null;
  if (kinds[i] === "text") {
    control = document.createElement("input");
    control.type = "search";
    control.placeholder = "含む文字";
  } else if (kinds[i] === "company") {
    const counts = {};
    rows.forEach(r => companiesOf(r[i]).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
    control = document.createElement("select");
    control.add(new Option("すべて", ANY));
    control.add(new Option("(企業あり)", SOME));
    control.add(new Option("(空欄)", ""));
    Object.keys(counts).sort((a, b) => a.localeCompare(b, "en", {sensitivity: "base"}))
      .forEach(c => control.add(new Option(`${c} (${counts[c]})`, c)));
  } else {
    const values = kinds[i] === "flag" ? ["●", ""]
      : [...new Set(rows.map(r => r[i]))].sort().reverse();
    control = document.createElement("select");
    control.add(new Option("すべて", ANY));
    values.forEach(v => control.add(new Option(v === "" ? "(空欄)" : v, v)));
  }
  if (control) {
    control.addEventListener("input", render);
    cell.appendChild(control);
  }
  filters[i] = control;
  filterRow.appendChild(cell);
});

function matches(row) {
  return filters.every((control, i) => {
    if (!control) return true;
    if (control.value === ANY) return true;
    if (kinds[i] === "company") {
      if (control.value === SOME) return row[i] !== "";
      return control.value === "" ? row[i] === "" : companiesOf(row[i]).includes(control.value);
    }
    if (control.tagName === "SELECT") return row[i] === control.value;
    const query = control.value.trim().toLowerCase();
    return !query || row[i].toLowerCase().includes(query);
  });
}

function link(href, text) {
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener";
  return a;
}

function render() {
  const shown = rows.filter(matches).sort((a, b) =>
    sortDir * a[sortCol].localeCompare(b[sortCol], "ja", {numeric: true}));
  const body = document.createElement("tbody");
  body.id = "rows";
  for (const row of shown) {
    const tr = body.insertRow();
    if (row === selected) tr.className = "selected";
    headers.forEach((_, i) => {
      const td = tr.insertCell();
      if (i === 1) {
        // A plain click shows the summary below; Ctrl/middle click still opens alphaXiv.
        const a = link(row[row.length - 1].alpha, row[i]);
        a.addEventListener("click", event => {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.button !== 0) return;
          event.preventDefault();
          showDetail(row, tr);
        });
        td.appendChild(a);
      } else {
        td.textContent = row[i];
      }
      if (kinds[i] === "code" || kinds[i] === "flag") td.className = "c";
      else if (kinds[i] === "date") td.className = "nw";
    });
  }
  document.getElementById("rows").replaceWith(body);
  headRow.querySelectorAll("th").forEach((th, i) => {
    th.classList.toggle("asc", i === sortCol && sortDir > 0);
    th.classList.toggle("desc", i === sortCol && sortDir < 0);
  });
  document.getElementById("count").textContent = `${rows.length} 件中 ${shown.length} 件を表示`;
}

const detail = document.getElementById("detail");
const splitter = document.getElementById("splitter");

function showDetail(row, tr) {
  selected = row;
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  tr.classList.add("selected");
  const extra = row[row.length - 1];
  document.getElementById("d-title").textContent = row[1];
  document.getElementById("d-ja").textContent = row[2];
  document.getElementById("d-alpha").href = extra.alpha;
  const body = document.getElementById("d-summary");
  body.replaceChildren();
  summaryHeaders.forEach((name, k) => {
    const line = body.insertRow();
    const th = document.createElement("th");
    th.textContent = name;
    line.appendChild(th);
    line.insertCell().textContent = extra.summary[k] || "（要約なし）";
  });
  const images = document.getElementById("d-images");
  const caption = document.getElementById("d-caption");
  images.replaceChildren();
  caption.textContent = extra.figure ? extra.figure.caption : "（図なし：arXiv に HTML 版が無いか、図が見つかりません）";
  (extra.figure ? extra.figure.images : []).forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Figure 1";
    img.addEventListener("error", () => {
      img.remove();
      if (!images.children.length) caption.textContent = "（図を読み込めません）" + caption.textContent;
    });
    images.appendChild(img);
  });
  detail.hidden = splitter.hidden = false;
}

function hideDetail() {
  selected = null;
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  detail.hidden = splitter.hidden = true;
}

document.getElementById("d-close").addEventListener("click", hideDetail);
document.addEventListener("keydown", event => { if (event.key === "Escape") hideDetail(); });
splitter.addEventListener("pointerdown", event => {
  event.preventDefault();
  splitter.setPointerCapture(event.pointerId);
  const move = e => {
    const height = Math.min(Math.max(window.innerHeight - e.clientY, 80), window.innerHeight - 160);
    detail.style.height = `${height}px`;
  };
  splitter.addEventListener("pointermove", move);
  splitter.addEventListener("pointerup", () => splitter.removeEventListener("pointermove", move), {once: true});
});

document.getElementById("reset").addEventListener("click", () => {
  filters.forEach(control => { if (control) control.value = control.tagName === "SELECT" ? ANY : ""; });
  render();
});
render();
</script>
