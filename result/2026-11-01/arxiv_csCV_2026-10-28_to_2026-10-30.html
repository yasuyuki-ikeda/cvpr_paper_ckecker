イベントラベルに紐づいた31,678件の手動レビュー済みインスタンスマスクを提供しています。"]}], ["2026-10-30", "Accurate MRI-free PET Quantification and Reliability Assessment via CT-to-MRI Synthesis and Conformal Prediction", "CT-MRI合成と共形予測による正確なMRIフリー PET定量化と信頼性評価", "", "なし", "医用画像", "医用画像・ラベル", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40478", "summary": ["MRIはPET定量化に利用できないことが多いため、正確なSUVR測定が制限されます。", "CT-MRI合成と、mriフリーのPET定量化と信頼性評価のための共形予測を組み合わせたものです。", "この手法はMAE±およびPearson r =で皮質SUVRを達成し、87人中85人が90%のカバレッジで明確なアミロイド陽性決定を示しました。"]}], ["2026-10-30", "InfantNet: A Large Scale Dataset for Infant Body Pose and Shape Estimation", "InfantNet:幼児の体の姿勢と形状推定のための大規模なデータセット", "Sony", "なし", "医用画像・多視点画像・姿勢", "姿勢", "", "", "", "", "", "●", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40467", "summary": ["既存の方法とデータセットは成人向けに設計されており、幼児の体の比率、関節の限界、および自己閉塞を処理できません。", "InfantNetは、2Dキーポイントで注釈を付けた108,902枚の画像と、SMILパラメータを用いた3D姿勢・形状注釈を含むサブセットを含む大規模なデータセットを導入しています。", "InfantNetで微調整するとパフォーマンスが向上し、3Dポーズと形状の推定はSMPLベースのモデルに匹敵する利益を示します。"]}], ["2026-10-30", "A Unified Benchmark for Aerial-Enhanced Autonomous Driving: The KITScenes Aerial Dataset", "空中で強化された自動運転のための統一されたベンチマーク：KITScenes Aerial Dataset", "", "あり", "衛星・航空画像", "データセット・評価", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40455", "summary": ["既存の作業には、空中で強化された自動運転タスクの統一されたベンチマークがありません。", "KITScenes Aerialは、航空画像と高解像度のニューラル表現でKITScenesマルチモーダルデータセットを拡張しています。", "空中コンテキストは、53クラスのマップを倍以上に改善し、より高解像度の画像で4.3マップを追加します。"]}], ["2026-10-30", "PhysInsert: Physically Plausible Object Insertion with Geometric Priors and Bidirectional Object-Scene Interactions", "PhysInsert：幾何学的なプリオールと双方向のオブジェクトとシーンの相互作用による物理的にもっともらしいオブジェクトの挿入", "", "なし", "画像・テキスト・姿勢", "3D データ", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40453", "summary": ["既存の方法は、ポーズ、照明適応、および双方向のオブジェクト-シーン相互作用に関する十分な制約を欠いている。", "PhysInsertは、ジオメトリガイド付き適応(Geometry-Guided Adaptation)と2Dオブジェクト-シーン空間監督を用いて、オブジェクトやシーンを幾何学的およびテキストストリームと共同に適応させます。", "実験は改善されたイメージの忠誠を示し、ユーザーの調査はより正確な配置およびよりよい照明統合を確認する。"]}], ["2026-10-30", "Soil Moisture Estimation in Precision Agriculture: A Knowledge Distillation Approach", "精密農業における土壌水分推定：知識蒸留アプローチ", "", "なし", "衛星・航空画像", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40432", "summary": ["高解像度画像は土壌水分推定の解析にコストが高く、計算負荷も高いです。", "土壌水分蒸留(SMD)は、知識蒸留フレームワークとユニモーダル教師を用いてマルチモーダル土壌水分推定を強化します。", "SMDは、土壌パッチのMAPEが最先端ベースラインに比べて2%、作物で1.2%の改善を達成しています。"]}], ["2026-10-30", "Uncertainty-aware Feedback Loop Diagnosis: integrating reinforcement learning and conformal prediction for reliable wafer defect classification", "不確実性を意識したフィードバックループ診断：信頼性の高いウェーハ欠陥分類のための強化学習と共形予測の統合", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40421", "summary": ["高スループットウェハー欠陥分類は、深層学習手法におけるフルサーフェススキャンの必要性により妨げられています。", "UFLDは適応的測定獲得のための強化学習と、不確実性推定および最適停止のための共形予測を統合しています。", "提案されたUFLDは、取得時間を約40ドル短縮し、98.4%の検査精度を実現し、追加の学習信頼推定ネットワークを必要としません。"]}], ["2026-10-30", "Continuous-Action World Models: Learning Cross-Embodiment Spatiotemporal Dynamics Priors", "連続行動世界モデル：クロス実施形態の時空間力学の事前学習", "", "なし", "テキスト", "行動", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40401", "summary": ["既存の方法は、さまざまな実施形態と実行頻度にわたってロボットアクション生成をサポートするのに苦労しています。", "CoAWMは、共有された潜在関数空間を使用して時空間ダイナミクスをキャプチャし、関数の事前訓練とワールドモデルのバックボーンに接続することによ", "このフレームワークは、ロボットの経験を転送するための統一的な基盤を持ち、クロスエボディメントおよびクロス周波数のアクション生成をサポートします。"]}], ["2026-10-30", "HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model", "HiFOR:視野言語行為モデルのための行為導かれた世界の基づいている階層的な先見の明", "", "なし", "画像・テキスト", "行動・画像・ラベル", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40373", "summary": ["既存のVLAモデルは、短期的なダイナミクスと長期的な目標を分離し、予測された先物を効果的に行動政策に統合することができません。", "HiFORは、アクション主導の世界検索、短期状態、マイルストーン、目標の予測、そしてターゲットを絞った行動指針のための将来の潜在的表現を組織化する階層的なフォーサイトフレームワークを提案します。", "HiFORは、階層的予測と構造化された潜在世界モデリングを通じて予測された未来をアクションポリシーに統合し、2つのシミュレーションベンチマークと6つの実世界タスクにおけるタスク性能を向上させます。"]}], ["2026-10-30", "Wizard: Manipulate Any World in Real Time via Agentic Control", "ウィザード：Agentic制御を介してリアルタイムで任意の世界を操作", "Tencent", "なし", "動画・姿勢", "動画", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40339", "summary": ["既存の方法は、リアルタイムの対話性と新しい環境や文字への一般化に苦労しています。", "Wizardは多様なデータセットと構造化された表現を用いて、適応型マスキング機構とエージェントフレームワークを備えたビデオ生成モデルを条件付けます。", "ウィザードは750シーン、178キャラクターにわたるゼロショットの一般化を実現し、キャラクターの動きをリアルタイムかつ正確に制御します。"]}], ["2026-10-30", "RFW-A: Agentic Procedural Generation of 400K Articulated Assets over 500 Categories", "RFW-A:400Kの500の部門上の連結された資産のAgentic手続き型生成", "", "なし", "", "ラベル・行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40333", "summary": ["高品質の多関節アセットを大規模に構築することは、手作業によるアノテーションや手続き型モデリングのコストが高いために困難です。", "RFW-Aはエージェントシンセシスと手続き生成を組み合わせ、カテゴリレベルの資産生成のための再利用可能なプログラムを作成します。", "RFW-Aは、アセットあたりAPIコストを$0.05に削減しますが、アセットあたりのエージェントシンセシスは$1.24です。"]}], ["2026-10-30", "Radiology Guideline-derived Decision Graph for Efficient Clinical Decision Support", "効率的な臨床意思決定支援のための放射線学ガイドライン導出意思決定グラフ", "", "公開予定", "医用画像・テキスト", "医用画像・ラベル・テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40327", "summary": ["放射線リスク層別化と管理計画の自動化は、散文、表、および相互参照された定義にまたがる臨床ガイドライン基準が分散されているため、困難です。", "GDGraphは、大規模な言語モデルを用いてガイドラインを分割し、意思決定部分グラフを抽出し、実行可能な意思決定グラフに集約することで、ガイドラインの作成とケース評価を切り離しています。", "GDGraphは、検索拡張型GPT-4oやグラフガイド型GPT-4o(思考連鎖付き)と比較して、System Oneの精度を57.3%から90.8%に向上させ、レイテンシーとコストを低く抑えています。"]}], ["2026-10-30", "Textual Response-Aware Guidance for Zero-Shot Adversarial Robustness of Vision-Language Models", "視覚言語モデルのゼロショット敵対的ロバスト性のためのテキスト応答認識ガイダンス", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40309", "summary": ["VLMは強力なゼロショット汎化技術にもかかわらず、敵対攻撃に対して脆弱です", "TRAGは入力埋め込みに対する事前学習済みテキストエンコーダ応答を用いて視覚表現のドリフトを制約します", "TRAGは、アーキテクチャやタスクを問わず最先端のクリーンかつ堅牢なパフォーマンスを実現します"]}], ["2026-10-30", "Self-training for cross-centre coronary vessel segmentation in X-ray angiography using pre-contrast frame subtraction", "プレコントラストフレームサブトラクションを用いたx線血管造影におけるクロスセンター冠血管セグメンテーションのためのセルフ", "", "なし", "医用画像", "ラベル・医用画像・マスク", "", "●", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40302", "summary": ["X線血管造影における冠動脈セグメンテーションのためのディープラーニングモデルは、トレーニングで表されていないセンターからのデータでは不十分に機能します。", "本論文は、nnU-Netモデルから生成された擬似ラベルと、コントラスト前のフレーム減算によるコントラストマップを用いた自己学習を提案しています。", "XCADプールで訓練されたモデルは、マクロ平均後のDiceスコアを2.7ポイント向上させました。"]}], ["2026-10-30", "LoRe-MIM: Lost-or-Replaced Masked Image Modeling for Self-Supervised Representation Learning in Whole-Body PET/CT", "LoRe-MIM:全身PET/CTにおける自己教師あり表現学習のための失われたまたは置き換えられたマスクされた画像モデリング", "", "なし", "医用画像", "ラベル・マスク", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40284", "summary": ["既存の方法は、注釈の不足と全身PET/CT分析のための限られた大規模データセットに苦労しています。", "LoRe-MIMは、画像領域をゼロに置き換えるか、補完的なイメージングモダリティデータに置き換えてマルチモーダル表現を学習するマスキング戦略を用います。", "LoRe-MIMは6つの下流タスクで最先端のベースラインを上回り、全身PET/CTスキャンを6,531件行います。"]}], ["2026-10-30", "TaskFrame: Connecting Task-Level Planning with Frame-Level Control for Game Agents", "TaskFrame:ゲームエージェントのタスクレベルの計画とフレームレベルの制御を接続する", "Tencent", "なし", "画像・テキスト", "テキスト・行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40276", "summary": ["既存の方法は、動的な視覚環境で高レベルのタスク推論と低遅延のアクション制御を組み合わせるのに苦労しています。", "TaskFrameは、視覚言語プランナーと因果トランスコントローラを備えた階層的なプランナーコントローラフレームワークを使用して、タスクレベルの計画とフレームレベ", "TaskFrameはクローズドループ評価において基準よりも高い戦闘成功率を達成しています。"]}], ["2026-10-29", "Benchmarking color judgment in multimodal LLMs with CIE-computable ench：Mllmはビデオ会話でどれだけ覚えていますか？", "", "なし", "画像・テキスト・動画", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40131", "summary": ["既存のビデオQAベンチマークは、以前のターンを参照していない独立した質問のために、コンテキスト内のビデオメモリを測定できません。", "VideoMemBenchは、タイピングされたクロスターン依存関係でつながれた長いマルチターン対話のデータセットを導入し、人間の専門家によって検証されています。", "データセット内の2,476ターンのうち1,387ターンは、以前のターンに依存しており、コンテキスト内ビデオメモリの課題を強調しています。"]}], ["2026-10-29", "It Takes Two to Probe, Thousands to Retrieve: Putting Vision--Language Probes to the Retrieval Test", "プローブには二人、検索には数千人かかりますビジョン-言語プローブを検索テストに入れます", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40124", "summary": ["既存の方法では、視覚言語プローブが検索性能とどのように関連しているかを明確に理解していません。", "本論文では、2つのプロービングベンチマークを用いてVLMを検索タスクで評価し、異なるネガティブサンプリング戦略を比較しています。", "\\texttt{\\textsc{Svo}}では、200〜430個のランダムネガを使うと10個のネガと同じ精度が得られますが、\\texttt{\\textsc{SugarCrepe}}では順序が逆です。"]}], ["2026-10-29", "Learning a Motion Manifold to Constrain Ambiguity in Unsupervised 4D Medical Image Interpolation", "教師なし4D医用画像補間におけるあいまいさを制限するためのモーションマニホールドの学習", "", "なし", "医用画像", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40121", "summary": ["動きの曖昧さは、教師なしの4D医療画像補間では、中間解剖学が異なるため、類似したエンドポイントの一致が原因で生じます。", "フレームワークは，クロスサンプルスペクトル基底学習とサンプル条件付きｃａｙｌｅｙ基底再配向を用いて，サンプル固有の変動を保持しながら候補運動場を制限する運動多様体を学習する。", "この方法は、中間体積なしでACDCおよび4D肺において最先端の性能を達成し、中間監督を用いた方法に対して競争力のある結果を得ています。"]}], ["2026-10-29", "SynthFaces: Balanced Large Scale Human Dataset", "SynthFaces:バランスのとれた大規模な人間のデータセット", "", "なし", "画像", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40119", "summary": ["既存のデータセットには偏りがあり、機密情報が含まれているため、不公平な生成モデルが発生します。", "私たちは、単位埋め込みの多様体におけるフローマッチング生成モデルを用いてArc2Face拡散モデルを展開します。", "私たちのアプローチは、実際のデータセットには存在しない生成的忠実度とラベル多様性を実現し、高度にバランスの取れた同一性中心のデータセットを実現しています。"]}], ["2026-10-29", "SelfThinker: Self-Evolving Reasoning via Reliability-Verified Intrinsic Visual Thoughts", "SelfThinker：信頼性を介して自己進化推論-検証された本質的な視覚的思考", "", "あり", "画像・テキスト", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40115", "summary": ["既存の視覚的思考の連鎖方法は、トレーニング中に人間の注釈付きヘルパー画像に依存し、テスト時に画像生成が遅くなる必要があります。", "SelfThinkerは、自己生成の視覚的思考を用いて人間の画像注釈を使わずに理解を深め、条件付き点ごとの相互情報で候補をスコアリングし、フローマッチングによってジェネレーターを洗練させます。", "SelfThinkerは自然イメージと空間ベンチマークにも広く移行し、ThinkMorph-7Bの7ベンチマーク平均を11.3ポイント引き上げました。"]}], ["2026-10-29", "RepConTUR: A Report-Conditioned Volumetric Multimodal Model for Abdominal Tumor Segmentation", "RepConTUR:腹部腫瘍のセグメンテーションのためのレポート条件付き体積マルチモーダルモデル", "", "あり", "画像・テキスト", "テキスト・マスク", "", "●", "", "●", "", "●", "●", "●", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40094", "summary": ["腹部CTにおける自動腫瘍セグメンテーションは、用量計算を歪め、編集時間を増加させる偽陽性によって制限される。", "RepConTURは、放射線報告書上で腫瘍のセグメンテーションを条件付け、4つの関連タスクを共同で行う3Dマルチモーダルモデルです。", "RepConTURは、複数のデータセットにおいてテキストプロンプトベースラインや視覚のみモデルよりも高いDSC、精度、F1スコアを達成しています。"]}], ["2026-10-29", "Neural Blind Deconvolution for Image Scanning Microscopy", "イメージの走査の顕微鏡検査のための神経の盲目のDeconvolution", "", "なし", "画像", "画像・バウンディングボックス", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40088", "summary": ["ISMの既存の方法は、サンプルおよびシステムによって誘発される収差のために無効なPSFモデルに依存しています", "トレーニングフリーのブラインドディップフレームワークは、試験片と検出器に依存するPSFsを共同で推定します", "ブラインドDIPは、固定PsfでマルチイメージデコンボリューションとDIPよりも細かい構造を回復します"]}], ["2026-10-29", "Morphology-Aware Channel-Decoupled Mamba Network for Medical Image Segmentation", "医用画像セグメンテーションのための形態認識チャネルデカップリングマンバネットワーク", "", "なし", "医用画像", "マスク・医用画像", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40085", "summary": ["CTにおける正確な多臓器セグメンテーションは、臓器の形状、大きさ、低い組織コントラスト、あいまいな境界の変化のために困難である。", "MCDNetは、形態認識チャネルデカップリング状態空間ブロックを用いて特徴チャネルを分離し、変形可能な畳み込みとチャネル注意を備えた局所特徴を適応させます。", "MCDNetは、シナプス腹部CTデータセットにおいて、多臓器セグメンテーションにおいて平均Dice類似係数81.61%を達成しています。"]}], ["2026-10-29", "Uncertainty-aware Coarse-to-Fine Main Pancreatic Duct Segmentation for Width Measurement in 3D MRCP", "3D MRCPでの幅測定のための不確実性を認識した粗から微細な主膵管セグメンテーション", "", "なし", "", "マスク", "", "●", "", "", "", "●", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40073", "summary": ["容積測定MRCPからの自動化されたMPDの分析は読者の可変性および不確実性わかっている方法の欠乏がunderexplored原因に残る。", "MrcpスキャンからのMPDセグメンテーションと幅予測のための不確実性推定を備えた粗から微細なディープラーニングパイプライン。", "この方法は散瞳MPD検出において0.634 DSC、0.744精度、0.593リコール、75.0%の感度を達成しました。"]}], ["2026-10-29", "BRACHIO: Broad Representations Across Centres for Head-and-neck Imaging Oncology (HECKTOR 2026)", "ブラキオ：頭頸部イメージング腫瘍学のためのセンター全体の広範な表現（HECKTOR2026）", "", "なし", "医用画像", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40068", "summary": ["既存の方法は、頭頸部癌イメージングのための多中心PET/CTスキャンからの密でグローバルな情報と苦労しています。", "論文では、PETスキャンで訓練された2D DINOv2エンコーダや、SimMIMから初期化されたSwinUNETRを持つDynUNetなど、自己教師ありの事前学習済みエンコーダを使用しています。", "この手法は、セグメンテーションで平均Diceが0.5409、N段階でバランスの取れた精度が0.6432、RFS予後でC指数が0.6577に達します。"]}], ["2026-10-29", "Localizing Concepts in Visual Autoregressive Models", "視覚的自己回帰モデルでの概念のローカライズ", "", "なし", "動画・画像", "位置・対応関係", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40061", "summary": ["次のスケールの視覚的自己回帰モデルにおける概念の局在化は未解明である", "LoCoは、自己回帰モデルにおいてレイヤー、スケール、位置の概念をマッピングするモデルに依存しないフレームワークです", "LoCoは計算負荷を削減しつつ、最先端の性能を実現し、無害な有用性も維持します"]}], ["2026-10-29", "EPC-RawDC: Equivariant Physics Constrained 3D Diffusion with Raw Data Consistency for CBCT to CT Image Synthesis", "EPC-RawDC:CbctからCT画像合成のための生データの一貫性を持つ等変物理制約された3D拡散", "", "あり", "画像", "画像", "", "", "", "●", "", "", "●", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40046", "summary": ["既存のCBCTからCT合成法は、基礎となる獲得物理学の使用を欠いており、定量的精度を制限しています。", "EPC-RawDCは、スキャナ固有のCBCTフォワードモデルからの物理的制約と体積生成モデリングを組み合わせたものです。", "EPC-RawDCはPsnrをSynthrad2025で2.66dB、JUSTで2.10dB向上させ、MAEを20.3%、19.0%削減しました。"]}], ["2026-10-29", "Segment Anything Model Based Context Guided Mamba Unet for Medical Image Segmentation", "医療画像セグメンテーションのためのセグメント何でもモデルベースのコンテクストガイド付きマンバUnet", "", "公開予定", "医用画像", "医用画像・マスク", "", "●", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40029", "summary": ["医療画像のセグメンテーションには、グローバルな文脈的理解と細かい構造的精度の両方が必要ですが、既存の手法はドメイン特有の適応性に欠け、解剖学的詳細の保存に苦労しています。", "SAMBA-UNetを提案し、SAMのコンテキスト知識とMambaの階層的特徴学習を統合し、階層的コンテキスト強化モジュールとLoRA/アダプターベースの微調整を行います。", "Samba-unetは、最先端のパフォーマンスを実現し、複数の医療データセット間で一般化、セグメンテーションの精度、計算効率のバランスを取ります。"]}], ["2026-10-29", "DINOv2 for PET: A Pre-Training Domain Benchmark Across Classification, Segmentation, and Prognosis", "DINOV2FOR PET:分類、セグメンテーション、予後にわたるプレトレーニングドメインベンチマーク", "", "あり", "医用画像", "マスク・ラベル", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40018", "summary": ["PET特有のDINOモデルは、複数のタスクやデータセットで未開発で十分に検証されていません。", "PET-DINOv2-2Dは、2D PETデータ上で事前学習され、自然画像および医療画像のエンコーダーと比べてベンチマークされたDINOv2モデルです。", "PET-DINOv2-2Dは、事前学習データが少ないにもかかわらず、3つのPETタスクで既存モデルに匹敵または上回る性能を発揮しています。"]}], ["2026-10-29", "Greenscapes: Optimized Vegetation Configurations in Cities", "Greenscapes:都市における最適化された植生構成", "", "なし", "画像・テキスト", "3D データ・テキスト", "", "", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40007", "summary": ["既存の方法は、都市植生設計の機能的側面と美的側面のバランスをとることができない。", "本論文は、条件付けられたVLMを用いて植生レイアウトを生成し、CMA-ESと実現可能性修復を用いて最適化する手法を提案しています。", "この手法は、代理モデルと知覚記述子を通じて機能的最適化と美的最適化の両方を実現します。"]}], ["2026-10-29", "How Much Should a VLA Trust Its Reasoning? Step-Level Guidance as a Measured Action-Value Function", "VLAはその推論をどれだけ信頼すべきですか？ 測定されたアクション値関数としてのステップレベルのガイダンス", "", "なし", "画像・テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40002", "summary": ["既存のVLAポリシーは、推論が正しいかどうかに依存しますが、正しい見た目のトレースは計画を誤解させる可能性があります。", "CoC-CFGは、推論を減衰または増幅するためにオイラーステップごとに一つの重みを使用して、推論スパンなしでポリシーのコンテキストと同じコンテクストの間に分類子のないガイダンスを適用します。", "クローズドループでは、300シーン中262シーンを通過し、元のポリシーの252ポイントを上回り、隠れたテストセットでは8.135159の評価フィードバックスコアで他の手法を上回っています。"]}], ["2026-10-29", "Blind Video Denoising for Vocal Tract rtMRI using a Self-Supervised Ensemble", "自己監督アンサンブルを使用して声道rtMRIのためのブラインドビデオノイズ除去", "", "なし", "画像", "画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39972", "summary": ["声道のリアルタイムRTMRIは、時間的な解像度と信号品質のトレードオフによりノイズを導入し、発音の詳細を隠します。", "分散安定化された非局所平均フィルタと二重モデル融合戦略からの擬似監視と時空間超解像学習を組み合わせた自己教師付きノイズ除去フレームワーク。", "アンサンブルは見えない被写体では信号対雑音比を11.9dB向上させ、重度のノイズ下ではピーク信号対雑音比を7.6〜11.8dB改善します。"]}], ["2026-10-29", "Mind The Gap (MTG-AD): Dataset and Fine-grained Evaluation for End-to-End Inline Audio Descriptions", "Mind The Gap(MTG-AD):エンドツーエンドのインラインオーディオ記述のためのデータセットときめ細かい評価", "Google", "あり", "画像・テキスト", "音声・軌跡・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39955", "summary": ["既存の作業では、多様なユーザー生成コンテンツのエンドツーエンドのインラインオーディオ記述のきめ細かな評価が欠けています。", "論文では、36時間分の動画と8k+の説明を含むMTG-ADデータセットと、参照不要の指標を持つ評価フレームワークであるMTG-AD-Evalを提案しています。", "このフレームワークはエンドツーエンドのタスクパフォーマンスを評価し、自動化された指標と人間の品質評価の間に有意な相関関係を示しています。"]}], ["2026-10-29", "UniRA: Unified Representation Alignment and Auto-Encoding for Efficient Diffusion Generation", "UniRA:効率的な拡散生成のための統一された表現アライメントと自動エンコード", "", "なし", "画像", "画像・ラベル", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39948", "summary": ["拡散変圧器は、訓練収束が遅く、計算コストが高いことに悩まされています。", "UniRAは表現のアライメントとオートエンコーディングを単一の目的に統合し、表現空間トークナイザー、拡散バックボーン、外部表現モデルを共同最適化しています。", "UniRAはトレーニングステップを最大5つに短縮し、ImageNetクラス条件生成におけるFIDの最先端のDiTに匹敵またはそれを超えます。"]}], ["2026-10-29", "ElasticFormer: Detecting Objects in HRW Shots via Elastic Computing Vision Transformer", "ElasticFormer:Elastic Computing Vision Transformerを介してHRWショット内のオブジェクトを検出する", "Alibaba", "なし", "画像", "バウンディングボックス", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39946", "summary": ["高解像度の広角ショットは、極度の希少性、ギガピクセル解像度、多様なターゲット数という課題に直面しています", "ElasticFormerは、elasticselectorモジュールを使用して前景の割合に基づいてリソースを動的に割り当てるスパースバックボーンを使用します", "ElasticFormerはバックボーン-フロップを80%削減し、固定比スパース法と比較してAP50を大幅に改善します"]}], ["2026-10-29", "BiHashFormer: Hash-Driven Dual-Branch Transformer for Efficient Object Detection in HRW Shots", "BiHashFormer:Hrwの打撃の有効な目的の検出のためのハッシュ主導の二重分岐変圧器", "Alibaba", "なし", "画像・テキスト", "バウンディングボックス", "●", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39937", "summary": ["高解像度の広角写真は、極端な前景の希薄さ、ギガピクセル解像度、前景と背景の交差という課題に直面し、従来の検出器や注意機構の妨げとなっています。", "BiHashFormerは、ハッシュに基づくデュアルブランチトランスフォーマーを使用し、キーと値のペアの半分を破棄する圧縮ブランチと、低コストのハッシュ検索を実行", "BiHashFormerは37.5%バックボーンフロップを減らし、AP50をPANDAベンチマークで81.0%に改善します。"]}], ["2026-10-29", "MLLM-GS: Multimodal Large Language Model Prior-Guided Fast Novel View Synthesis in Extreme Environments", "MLLM-GS:極端な環境でのマルチモーダル大言語モデル事前ガイド高速小説ビュー合成", "", "あり", "画像・テキスト・多視点画像", "3D データ・テキスト・画像", "", "", "", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39936", "summary": ["既存の方法は、劣化固有のモデルに依存しており、多様な極端な環境全体で一般化を制限しています。", "MLLM-GSは、ビューの強調と高速3D再構築のために2つのブランチを持つマルチモーダルの大規模言語モデル事前誘導フレームワークを使用しています。", "後者はラスタライズ、ガウスメモリレイアウト、パラメータ更新を最適化し、冗長計算、メモリアクセスのオーバーヘッド、最適化コストを削減することで3DGSの効率を向上させます。"]}], ["2026-10-29", "Spectral Invariant Fusion and Refinement for Domain Generalized Semantic Segmentation", "ドメイン一般化意味セグメンテーションのためのスペクトル不変融合と精緻化", "", "なし", "", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39926", "summary": ["ドメイン一般化セマンティックセグメンテーションは、トレーニング中にターゲットドメインデータにアクセスせずに、目に見えないドメイン上の正確な密な予測を必要とします。", "SIFRは、事前の相互作用とデコーダの洗練を調整するためにスペクトルモデリングを使用して、融合と復号段階でドメインシフトに取り組む周波数認識デュアルストリームフレームワークを提案しています。", "SIFRはスペクトルガイドによる不変融合やスペクトルデコーダの精緻化を通じて、残差ドメインバイアスを低減することで、ドメインの堅牢性とセグメンテーション精度を向上させます。"]}], ["2026-10-29", "PhysAg3D: Bridging 3D Generative and Agentic Models for High-Fidelity and Physically-Interactive Assets", "Physag3d:高忠実度で物理的にインタラクティブなアセットのための3D生成モデルとAgenticモデルのブリッ", "Huawei", "あり", "画像・メッシュ", "メッシュ・3D データ", "", "", "", "●", "", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39924", "summary": ["単一の画像からインタラクティブな3Dアセットを生成するには、リアルな外観、描写された物体への忠実さ、そしてもっともらしい物理的挙動が必要です。", "PhysAg3Dは、3D生成モデルとエージェント推論およびツール使用を組み合わせており、視覚言語エージェントが画像から意味的な部分や物理的事前処理を推論し、3Dジェネレーターが同じ画像からテクスチャ付きメッシュを生成する仕組みです。", "このフレームワークは剛体的な表現とコンプライアンス変形の両方に対応し、定量的・定性的評価により、詳細で画像に整合した資産ともっともらしい相互作用を示します。"]}], ["2026-10-29", "TokenRepel: Generating Diverse Image Sets Without Compromising Quality", "TokenRepel:品質を損なうことなく多様な画像セットを生成する", "", "なし", "テキスト", "画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39913", "summary": ["既存のテキストから画像へのモデルでは、同じプロンプトから類似の画像が生成され、視覚的な多様性が制限されます。", "TokenRepelは、特徴トークンの角度を増加させるトークン反発機構と、画像品質を維持するためのトークン密度保持機構を使用しています。", "この手法は、3つの事前学習済みモデル間で同等の画像精度を維持しつつ、視覚的多様性の大幅な向上を実現しています。"]}], ["2026-10-29", "sDMD: Sinkhorn Distribution Matching Distillation", "sDMD:シンクホーン分布マッチング蒸留", "", "なし", "画像", "位置・対応関係", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39889", "summary": ["DMDのモード探索動作は、生徒を教師モードのサブセットに折りたたむことができます", "sDMDは識別子出力に基づくシンクホーン補正を適応的に活性化し、外れ値サンプルを目標に誘導します", "sDMDは2〜4ステップのサンプリングでDMD2に比べてサンプル多様性を向上させます"]}], ["2026-10-29", "What Survives Label Downsampling? Exact Region Survival for Coarse Segmentation Targets", "ラベルダウンサンプリングを生き残るものは何ですか？ 粗いセグメンテーションターゲットのための正確な領域の生存", "", "なし", "画像", "ラベル・マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39880", "summary": ["既存のラベルダウンサンプリング法では、多くの領域が失われ、形状を正確に再構築することが困難になります。", "MatchDownは、領域とグリッドセル間の最小コストマッチングを用いて、従来のダウンサンプリング手法よりも多くの領域を保持する粗いターゲットを構築します。", "MatchDown-Pは最小限の領域数を正確に失いますが、他の方法はCO8の4〜5倍の領域を失います。"]}], ["2026-10-29", "Parametric Gaussian Noise Mixer (PGNM): Unified Synthesis of Camera Noise and Film Grain", "パラメトリックガウスノイズミキサ（PGNM）：カメラノイズとフィルムグレインの統一合成", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39868", "summary": ["既存のノイズ合成法は物理モデルやニューラルネットワークに依存しており、カメラノイズやフィルムグレインの複雑さを正確に捉えることはできません。", "本論文では、正規化された畳み込みとルックアップテーブルを用いてクリーン画像からノイズを生成するパラメトリックなガウスノイズミキサー(PGNM)を提案しています。", "このモデルはSIDDで最も低い平均分布誤差と相関誤差を達成し、フィルムグレインでも競争力を維持しています。"]}], ["2026-10-29", "M-PFT: Angular Margin for Calibrated Prompt-Tuning of Fine-Tuned Vision-Language Models", "M-PFT:微調整された視覚言語モデルの目盛りを付けられた敏速調整のための角差", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39861", "summary": ["プロンプトチューンドVLMは、ベースクラスで不信、新規クラスで過信というベースから新規への二重誤キャリブレーションに悩まされます。", "M-PFTは、クラス識別性と意味的アンカリングを促進する2つの補完的な目的を導入し、余弦類似性と角距離を最小化することで角マージンを拡大します。", "M-PFTは新規クラスで平均キャリブレーション誤差を1削減しつつ、ベースクラスで競争力を保ち、同等の精度を維持します。"]}], ["2026-10-29", "Open-set multi-view seahorse re-identification from underwater photograph sequences", "水中写真シーケンスからのオープンセットマルチビュータツノオトシゴの再識別", "", "なし", "画像", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39857", "summary": ["水中写真の品質にばらつきがあり、正確な動物再識別は困難です。", "本論文は、マルチビュー画像シーケンスを用いた分類学的分類、性別決定、オープンセット再識別の手法を提案しています。", "この手法は複数の写真からの情報を組み合わせることで最先端の性能を実現しています。"]}], ["2026-10-29", "LiDAR-SHIELD: A Fully Dockerized Adversarial Robustness Assessment Framework for LiDAR-Based 3D Perception Models", "LiDAR-SHIELD:LiDARベースの3D知覚モデルのための完全にドッキングされた敵対的ロバスト性評価フレームワーク", "", "あり", "LiDAR・3D データ", "マスク・バウンディングボックス・3D データ", "●", "●", "", "", "", "●", "", "", "●", "●", "●", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39848", "summary": ["既存の敵対的な攻撃の実装は断片化されており、特定のモデルとタスクのための手動の環境設定が必要です。", "LiDAR-SHIELDは、3つのHTTPエンドポイントを通じてモデルを公開するDocker化されたフレームワークであり、任意のモデルを単一のローダー関数で統合できます。", "このフレームワークは、3Dセマンティックセグメンテーションとオブジェクト検出の両方をサポートし、統一プロトコルで対応し、各タスクに対して最先端の攻撃を統合しています。"]}], ["2026-10-29", "Aligning Medical Vision Language Models at the Capability Boundary with Entropy Adaptive Rubric Grounding", "エントロピー適応ルーブリック接地と能力境界での医療ビジョン言語モデルの整列", "", "なし", "医用画像", "医用画像", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39835", "summary": ["現在の医学の視野の言語モデルは重大な診断場合の間違った行動に報酬を与えます", "MedCBRは境界認識型優先最適化とルーブリックに基づく強化学習の2段階を用いています", "二つのステージを組み合わせることで、ベースライン上で超加法的なゲインを実現します"]}], ["2026-10-29", "GROME: GROunding Factorized MEmory into Video World Models", "GROME:ビデオの世界のモデルに因数分解されたメモリを接地", "", "なし", "動画", "動画・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39812", "summary": ["観察されたコンテンツがコンテキストウィンドウの外に位置すると、ビデオ世界モデルの長期的な一貫性を維持するのは困難です。", "GROMは、歴史的証拠を静的要素と動的要素に分離し、ネイティブ条件付け経路を通じてビデオ世界モデルに統合する因数分解メモリフレームワークを導入します。", "GROMEは既存の手法に比べてシーンの持続性と動的エンティティの忠実度を高めつつ、視覚的な品質と制御性を維持します。"]}], ["2026-10-29", "SCOPE: Semantic COdec Pre-Editing for Object-Preserving Compression", "スコープ:オブジェクト保存圧縮のためのセマンティックコーデックの事前編集", "", "なし", "画像", "画像・バウンディングボックス", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39778", "summary": ["標準コーデックは、下流のタスク精度よりも人間の知覚に最適化されています。", "SCOPEは、コーデックファミリーや圧縮の厳しさに基づいて圧縮前に画像を修正する条件付き画像プリエディタです。", "プリエディターは、異なるコーデックファミリーや検出アーキテクチャ間で一貫した向上を得て、ビットレートと検出精度のトレードオフを向上させます。"]}], ["2026-10-29", "Quantum-Inspired Convolutional Networks for High-Resolution Pseudo-Label Generation from Multimodal Earth Observation Data", "マルチモーダル地球観測データからの高分解能擬似ラベル生成のための量子に触発された畳み込みネットワーク", "", "なし", "衛星・航空画像", "ラベル・衛星・航空画像", "", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39773", "summary": ["マルチモーダル地球観測データからの正確な土地被覆マッピングは、不足しているか高価な高解像度注釈のために困難である。", "量子に触発された畳み込み符号器-復号器ネットワークは、Sentinel-1SAR、Sentinel-2マルチスペクトル、およびMODISランドカバーデータを使用して擬似ラベルを生成します。", "このフレームワークは、古典的なベースラインと比べて、より空間的に一貫性がありクラス整合性のある擬似ラベルを生成します。"]}], ["2026-10-29", "Cross-Encoder Anchor Refinement for Zero-Shot Anomaly Detection", "ゼロショット異常検出のためのクロスエンコーダーアンカーリファイナンス", "", "なし", "テキスト", "ラベル・画像", "", "", "", "", "", "", "", "", "", "", "", "", "●", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39727", "summary": ["ゼロショット異常検出は、文脈的表現と補完的な局所証拠を組み合わせた識別的参照を構築する上で課題に直面しています。", "Cross-Encoder Anchor Refinement(CEAR)は、事前に学習された畳み込みエンコーダとcross-attentionを使用して空間アンカーをリファインすることで、アンカーステージで同じ画像の2つの視覚エンコーディングパスを接続します。", "CEARは、ピクセルレベルの最大F1スコアで4.45ポイントのゲイン、11のローカリゼーションデータセットで平均精度で3.79ポイントのゲインを達成しています。"]}], ["2026-10-29", "WorldProbe: When Video World Models Fall Apart under Long-Horizon Spatial Exploration", "WorldProbe:ビデオワールドモデルが長い地平線の空間探査の下で崩壊するとき", "", "あり", "動画", "行動", "", "", "", "●", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39721", "summary": ["既存のベンチマークは、広範なカメラの動きを持つ長い地平線の空間探査の下でビデオワールドモデルを評価することができません。", "WorldProbeは、生成中にオンラインのカメラアクションを調整するために目標条件付きマルチモーダルエージェントを使用します。", "WorldProbeは4次元にわたる164件のテストケースを評価し、局所的な指標の劣化と長期的な不整合の出現を明らかにしました。"]}], ["2026-10-29", "NIF: Normal-Intersection Fields for Geometrically Consistent Oriented Box Refinement", "NIF:幾何学的に一貫性のある配向ボックス洗練のための法線交差フィールド", "", "あり", "", "バウンディングボックス", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39715", "summary": ["既存の方法は、境界整合性に影響を与える結合パラメータの誤差のために、正確な配向ボックス検出に苦労しています。", "NIFは法線交差場を用いて、境界アンカーからの外向き法線に沿った符号付き距離を予測することで、向き付けたボックスを精緻化します。", "NIFはDOTA-v1.0で78.00%のmAPを達成し、フィールド誤差を低減しながらDIOR-RおよびHRSCの指標を改善しています。"]}], ["2026-10-29", "Confidence Filtering in Video-Based Gait Assessment: Measurement Error versus Selection Shift", "ビデオベースの歩行評価における信頼性フィルタリング：測定誤差と選択シフト", "", "なし", "医用画像・動画・姿勢", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39704", "summary": ["ビデオベースの歩行評価は、低い自信の観察を排除し、選択シフトが動きの評価に影響を与える。", "本論文は、2つのコホートにおける信頼選択とランダム選択を比較し、測定および選択シフトの分解とシミュレーションを行っています。", "信頼度フィルタリングは、誤差が信頼度に依存する場合に局所誤差を低減しますが、系統誤差が参加者内で再分配される場合には、0.58度のバイアスを導入することができます。"]}], ["2026-10-29", "DEQ-Stereo: Deep Euilibrium Video Stereo Matching via Adaptive Convergence", "DEQ-Stereo：適応収束を介した深い平衡ビデオステレオマッチング", "", "なし", "動画・姿勢", "位置・対応関係", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39701", "summary": ["反復的洗練モデルは高い計算コストと、動画ストリームにおける速度と精度の厳格なトレードオフに直面します。", "DEQ-Stereoは、深い平衡パラダイムを使用して、収束が満たされると適応的に洗練を終了し、ConvSGUとTSTを使用して高速収束とクロスフレームコヒーレンスを実現します。", "DEQ-Stereoは、精度とレイテンシのトレードオフに優れた最先端のパフォーマンスを実現します。"]}], ["2026-10-29", "Event-SAMA: Language-Grounded Video Object Segmentation on Neuromorphic Event Streams", "イベント様：言語に基づいたビデオオブジェクトのセグメンテーション", "", "なし", "画像", "イベントカメラ・マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39676", "summary": ["参照ビデオオブジェクトセグメンテーションにはイベントストリームデータセットやモデルが欠けています。", "Event-SAMA-239Kは、sama-239kコーパスからの合成イベントと、オプティカルフロー、フィルム、またはサッケードアップサンプリングを使用して追加データを変換し、その後に線形イベントジェネレータを使用します。", "イベント様は、MeViS valid_uで24.37$boldsymbol{\\text{J}}\\boldsymbol{\\text{&}}\\boldsymbol{\\text{F}}Revを達成し、ReVOS有効なサブセットで22.33the Boldsymbol{\\text{J}}\\boldsymbol{\\text{&}}\\boldsymbol{\\text{F}}firstを達成し、最初のイベントネイティブRVOSベースラインを確立します。"]}], ["2026-10-29", "EditAgent: Rethinking Agentic Image Editing", "EditAgent:Agentic画像編集を再考", "Adobe", "なし", "画像・テキスト", "画像・テキスト", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39664", "summary": ["既存のagentic画像エディタは、ケースの40％以上で使用可能な結果を生成するために失敗し、編集タイプ全体で信頼性の低い裁判官を持っています。", "EditAgentは、ステップを一般的な方法や特殊な方法にルーティングし、検証レコードを候補者に添付することにより、アクションと観測スペースを拡張します。", "EditAgentは三つのベンチマークで二つのオープンウェイトエディタを改善し、裁判官の呼び出しを半分以上削減します。"]}], ["2026-10-29", "AB-Attention: Accurate Block Attention for Accelerating Video Diffusion Transformers", "AB-Attention:加速のビデオ拡散の変圧器のための正確なブロックの注意", "", "あり", "動画・テキスト", "動画", "", "", "", "●", "", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39663", "summary": ["ビデオ拡散トランスは、推論中の3D全注意による二次コストに直面します。", "AB-Attentionは、ブロック内クラスタリングと包含確率重み付けを使用して、トークンを置換することなく、高スパース性で密な注意を近似します。", "AB-Attentionはベースラインと比較して注意の89-92％をスキップし、PSNRを最大4.4-dB改善し、2.23times\\times speed高速化を達成します。"]}], ["2026-10-29", "Look at Where You Think: Localization-Head Alignment for Fine-Grained Perception in Thinking VLMs", "あなたが考える場所を見てください：ローカリゼーション-Vlmsを考える際のきめの細かい知覚のためのヘッドアライメント", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39649", "summary": ["思考型VLMは、数千トークンの理由を考えても高解像度画像の細かいディテールを見落とします。", "ローカリゼーション・ヘッドアライメント(LHA)は、推論中に焦点領域に集中するように頭部を合わせることで、注意を訓練信号として機能させます。", "V*、HR-Bench 4K、TreeBenchのベンチマークでは、LHAはQwen3.5-4Bの精度を74.1%から76.6%に向上させ、単一パスの4Bで評価した最高の結果となりました。これはマルチパスズームやリリースされた7Bモデルを上回るものです。"]}], ["2026-10-29", "Annotation-Free Representation Learning for Polyp Retrieval in Colonoscopy Videos", "大腸内視鏡検査におけるポリープ除去のためのアノテーション-フリー表現学習ビデオ", "", "あり", "動画", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39648", "summary": ["既存の方法は、大腸内視鏡ビデオにおけるポリプトラックレット表現のための手動注釈に依存しており、その実用性を制限する。", "本論文は、時間的自己教師あり学習を用いて生の大腸内視鏡ビデオからトラックレット表現を直接学習する注釈なしフレームワークを提案しています。", "この方法は、トラックレットの採取および再識別において自己監督ベースラインおよび監督ベースラインの両方を上回り、少量のポリープ採取においてわずか2例で最先端の結果を達成しています。"]}], ["2026-10-29", "FlexTry-On: A Time-Efficient Framework for Multi-Scenario Virtual Try-on", "FlexTry-On:マルチシナリオ仮想試着のための時間効率の高いフレームワーク", "", "なし", "テキスト", "特徴表現", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39646", "summary": ["既存のメソッドはシナリオ固有のものであり、異なる試行設定に対して別々の処理が必要です。", "FlexTry-Onは、共通のコンディショニング戦略とデュアルコンディショニング拡散トランスを備えた統一された拡散ベースのフレームワークを使用します。", "このフレームワークは複数のベンチマークで競争力を発揮し、別々のアーキテクチャを使わずに未知のクロスドメインシナリオにも対応します。"]}], ["2026-10-29", "Where Do Vision Language Models Fail at 3D Reasoning?", "視覚言語モデルは3D推論でどこで失敗するのですか？", "", "あり", "画像 アーチファクトを引き起こす。", "MemoryFusionは、短期記憶と長期記憶バンクとフュージョンのための時間平滑化モジュールを備えた2段階フレームワークを使用しています。", "MemoryFusionは、フレームベースやビデオベースの手法と比べて、優れたフュージョン品質と時間的一貫性を実現しています。"]}], ["2026-10-29", "Unlimited OCR Works 2", "無制限のOCR作品2", "", "なし", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39308", "summary": ["既存の方法は、文書の長さが長くなるにつれて計算コストが増加するため、超長文書解析のスケーラビリティに苦労しています。", "Unlimited OCR 2は、スパース参照スライディングウィンドウアテンションおよび無限地平線デコーディングパラダイムを用いて計算コストを抑えます。", "100ページのスケールで、無制限のOCR2は、完全な注意とR-SWAでそれぞれ7.0$\\times5と5.6step\\times stepのステップごとのスピードアップを実現します。"]}], ["2026-10-29", "CAD-WAM: Anticipating Geometry for Text-to-CAD Generation", "CAD-WAM:テキストからCADへの生成のためのジオメトリの予測", "", "あり", "テキスト", "行動", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39306", "summary": ["Llmに基づく既存の方法は、マルチステップのテキストからCADへの生成のための明示的な幾何学的監督を欠いています。", "CAD-WAMは、事前学習された変分オートエンコーダとLLMバックボーンを使用して、ジオメトリ条件付きアクション生成と次の状態予測を結合します。", "次一状態の監督は、動作の予測のみを目的に訓練されたモデルと比べて、平均面取り距離を13.2%削減します。"]}], ["2026-10-29", "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "Jepasによるプラトニック表現仮説の証明と改善", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39302", "summary": ["既存の研究には、マルチモーダルモデルがスケールするのと同じ表現に収束すると推測するプラトニック表現仮説の証明とレシピが欠けています。", "この論文は、JEPAに対してプラトン表現定理を証明し、良好なビューと有界ミスアライメントで訓練した場合、同じ表現を最大1回転まで学習できることを示しています。", "109MパラメータのテキストJEPAは、72Bパラメータまでの言語モデルよりも画像エンコーダとの整合性が良好であり、良好なビューでは、次のトークン予測よりも42倍少ないサンプルが必要です。"]}], ["2026-10-29", "Youtu-Parsing-Omni: One Encoder, One Schema, All Modalities", "Youtu-Parsing-Omni:1つのエンコーダ、1つのスキーマ、すべてのモダリティ", "", "あり", "テキスト", "動画・画像・音声", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39301", "summary": ["既存のオムニモーダルパーサは、複数のモダリティにわたる統一された空間-時間的接地とクロスモーダル融合を欠いています。", "Youtu-Parsing-Omniは、各モダリティごとに1つのエンコーダ、各タスクに1つのスキーマを使用し、統一された るのに苦労しています", "COGSは、15,675のアーティファクトフィルタリングされたオブジェクトを含む大規模な3DGSデータセットを40", "COGS-Benchは、ガウス属性がアーキテクチャ間で一様に有益ではないことを示しています"]}], ["2026-10-29", "Multi-level Constrained Learning for Underwater Image Enhancement", "水中画像強調のためのマルチレベル制約学習", "", "あり", "画像", "画像", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39183", "summary": ["水中画像強調は、カラーマッピング、詳細補正の強度、劣化した観測との整合性の指定に制限があります。", "MCL-UIEは、MCT、UGWR、RADRとのペアド・スーパーバイズド・フレームワークを用いて、修復作業と訓練目標を制約しています。", "MCL-UIEは16件のフルリファレンスデータセットとメトリクス比較のうち13件で1位にランクされ、参照なしベンチマークでも競争力のある視覚的結果を生み出しています。"]}], ["2026-10-29", "EmbodiExp: Compositional Experience Transfer for Embodied Agents", "EmbodiExp:具体化されたエージェントのための組成経験の転送", "", "なし", "", "行動", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39180", "summary": ["課題間での経験を移転することは依然として困難であり、これまで効果的だった戦略が現状に適用できなかったり、意図した成果を生み出せなかったりすることがあります。", "EmbodiExpは、サブゴール、適用条件、適応可能なポリシー、および検証可能な結果を指定する結果ベースのサブゴールエクスペリエンスを使用して、タスク実行中に移", "凍結経験バンクを用いた折り畳みベースのプロトコルの下での複数の具体化ベンチマークに関する実験は，EmbodiExpの有効性を実証した。"]}], ["2026-10-29", "Edited Endpoints as Partial Goals for Image-to-Video Generation", "画像からビデオへの生成のための部分的な目標として編集されたエンドポイント", "", "あり", "画像", "動画・画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39179", "summary": ["編集されたエンドポイントは、フルフレームビデオトランジション条件付けに使用すると、時間的なアーティファクトを誘導することができます。", "部分的条件付けは、画像編集者の注意から推定された編集関連領域のみを制約します。", "TC-Bench-I2Vの3つの骨格にまたがる時間的アーティファクトを部分的に減少させ、顕著なTCR差はありません。"]}], ["2026-10-29", "EgoContact: Evaluating Physical Intelligence with Egocentric Video", "EgoContact:自己中心的なビデオとの物理的な知性の評価", "Microsoft", "なし", "イベントカメラ・動画", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39167", "summary": ["自己中心的なビデオは、接触点予測と物体の局在化の評価に制限があるため、物理知能の検証ツールとしては十分に活用されていません。", "EgoContactは、接触前の観測、意味的意図、ピクセル精度の接触位置など、22.5Kの手動で検証された相互作用イベントを含む大規模なデータセットです。", "EgoContactをメモ なっていることを示しています。"]}], ["2026-10-29", "Fed-IGTD: A federated learning-based framework for tabular-to-image encoding", "Fed-IGTD:表形式から画像へのエンコーディングのためのフェデレーション学習ベースのフレームワーク", "", "なし", "画像", "画像", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39008", "summary": ["タブラーから画像への符号化方法は中央集権的なパラダイムに従い、データの漏洩やプライバシー侵害のリスクがあります。", "Fed-IGTDは、フェデレーション学習を使用して、クライアントが共通の特徴空間を共有し、グローバル相関行列の再構成と特徴からピクセルへのマッピングのた", "DP-FedAvgは小さい顧客のコホートとの適当なプライバシーの予算の下で地図を描く構造のステップより実用性をもっと低下させる。"]}], ["2026-10-29", "AlbumVSR: Identity-Preserving Face Video Super-Resolution from a Personal Photo Album", "AlbumVSR:個人的な写真アルバムからのアイデンティティ維持の表面ビデオ超解像", "", "なし", "画像", "姿勢・画像", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39001", "summary": ["既存の方法は、深刻な劣化の下で顔のアイデンティティを維持するために失敗します。", "AlbumVSRは個人的な写真アルバムをアイデンティティの合図の拡散の変圧器を調節するのに使用する。", "AlbumVSRはArcFace similarityを改善し、重い劣化を伴うベンチマークでPSNRdBに直面しています。"]}], ["2026-10-29", "What do MLLMs know about 'Waldo'? Evaluating Visual Reasoning under Multi-Instance Multi-Object Challenges", "Mllmは「ワルド」について何を知っていますか？ マルチインスタンスマルチオブジェクトチャレンジの下での視覚的推論の評価", "Microsoft", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38957", "summary": ["既存のベンチマークは視覚的な曖昧さを欠いており、オブジェクトインスタンスが少なく、複雑なシナリオでの視覚的推論の評価を制限しています。", "MIMO-Benchは、視覚的に曖昧な環境でMLLMを評価するためのマルチインスタンス、マルチオブジェクトシナリオのベンチマークを導入します。", "MIMO-Benchは、属性バインディングおよび数値カウントタスクにわたる3,802の画像質問ペアを含み、マルチインスタンス・マルチオブジェクト設定における現行モデルの限界を明らかにしています。"]}], ["2026-10-29", "GradSplat: Gradients Inside the Forward Pass for Feed-Forward 3D Gaussian Splatting", "GradSplat:フィードフォワード3Dガウススプラッティングのためのフォワードパス内のグラデーション", "", "あり", "画像", "画像", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38951", "summary": ["フィードフォワード3Dガウススプラッティングには、ガウス形状、スケール、回転による精度の問題があります。", "GradSplatはフォワードパス内でグラデーションステップを用いてターゲットビューなしでガウスを精錬します。", "GradSplatは、6ビューのRealEstate10Kやその他のデータセットで、ファインチューニングなしで最高のPSNRおよびSSIMを実現しています。"]}], ["2026-10-29", "OneScene-Bench: Do Vision-Language Models Integrate Evidence Across Views?", "OneScene-Bench：ビジョン言語モデルは、ビュー間で証拠を統合していますか？", "", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38926", "summary": ["既存のマルチイメージ評価では、視覚言語モデルのクロスビュー統合機能を分離することができません。", "OneScene-Benchは、実際のマルチビューシーンにおける3つの機能を評価する管理されたベンチマークです:ユニークなオブジェクトカウント、クロスビューの整合性、空間推論です。", "カウント精度は、補完的なビューで4.5-50.0％、完全な重複の例で45.5-81.5％に低下します。"]}], ["2026-10-29", "Beyond Region Memory: Local Point Tracking for Vocal Cord Localization in Video Laryngoscopy", "地域の記憶を越えて:ビデオLaryngoscopyの声帯の局在化のためのローカルポイント追跡", "", "なし", "動画・テキスト", "バウンディングボックス・軌跡・動画", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38830", "summary": ["緊急ビデオ喉頭鏡検査における信頼性の高い声帯位置特定は、急速な組織変形、鏡面突出、器具閉塞のため困難です。", "ローカルポイントトラッキング(LPT)は、シングルフレーム検出器、ローカルポイント伝播、状態なしマスクの精緻化を組み合わせて、ミスフレームを通った点を追跡し、バウンディングボックスを精錬します。", "LPTは両データセットにおいて、最高のmAP_50、成功AUC、欠損率で強力なパフォーマンスを発揮し、時間追跡の堅牢性と境界の厳密性を向上させます。"]}], ["2026-10-29", "Evaluating Visual Realism of AI-Generated Videos with Eye Tracking", "アイトラッキングによるAI生成ビデオの視覚的リアリズムの評価", "", "なし", "動画", "動画・軌跡", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38825", "summary": ["AIで生成されたビデオの既存の人間の評価は、明示的なフィードバックに依存しており、知覚への洞察が欠けています。", "この論文は、視線追跡データから視覚的リアリズムを予測する計算手法であるGazeEvalを提案しています。", "GazeEvalは、視線追跡データから視覚リアリズムを予測する確率で71.3%の精度を達成しています。"]}], ["2026-10-29", "A 211K Parameter Foundation Model: Genetic Prompting in Neural Cellular Automata", "211Kパラメータ基礎モデル：神経細胞オートマトンにおける遺伝的プロンプト", "", "なし", "医用画像", "マスク・医用画像", "", "●", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38776", "summary": ["医療画像セグメンテーションは臨床文脈にまたがる柔軟性を必要としますが、現行モデルではユーティリティをハイエンドインフラに縛り付けています。", "基礎-NCAは、潜在的なタスク空間上の遺伝的最適化と神経細胞オートマトンを使用して、再訓練せずに様々なセグメンテーションタスクに適応します。", "基本的な-NCAは211Kのパラメータを達成し、samベースのモデルよりも180倍小さく、既知のタスクでは84.5％、目に見えないタスクでは60.4％の平均サイコロスコアを"]}], ["2026-10-29", "RuleForge: Inferring and Instantiating Latent Visual Rules as Executable Programs", "RuleForge:実行可能プログラムとしての潜在的な視覚的ルールの推論とインスタンス化", "", "なし", "", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38737", "summary": ["既存のメソッドは、視覚的なルールの理解と信頼性の高いルールのインスタンス化との関係を探索することができません。", "RuleForgeは、視覚的なルール理解とルール条件付き実行ファイル生成を共同で学習する、バックボーンに依存しないフレームワークです。", "RuleForgeは、馴染みのあるルールで選択式の正確さを20.93ポイント、保留されたルール構成で28.42ポイント向上させます。"]}], ["2026-10-29", "inkGround: Benchmarking Fine-grained Visual Grounding Capabilities of Vision-Language Models for Cursive Handwriting in the Wild", "inkGround:野生の筆記体手書きのための視覚言語モデルのきめの細かい視覚接地機能のベンチマーク", "", "あり", "画像・テキスト", "テキスト・軌跡", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38720", "summary": ["既存の画像-軌跡ペアデータセットは制御された条件下で記録され、作家のカバレッジと文体の多様性が制限されます。", "inkGroundは、カメラでキャプチャされた筆跡画像と、事前学習済みモデルで生成され人間の評価者によって検証された参照軌跡を組み合わせ、テキスト条件付きポイントグラウンディングでVLMを評価します。", "4つのオープンソースVlmと3つのクローズドソースVlmが共有プロンプトでベンチマークされ、クローズドソースモデルは参照に近い読みやすい軌道を生成します。"]}], ["2026-10-29", "Geometry Matters in Packed 3D Attention", "幾何学は、パックされた3Dの注意で重要です", "", "なし", "テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38694", "summary": ["詰め込まれた3D注意は、シーケンス位置に基づく位置メカニズムにより幾何学的情報を保存できません", "PACK3Dは真のトークングリッド座標に軸方向RoPEを用いて、メモリレイアウトと注意ジオメトリを分離します", "PACK3Dは15構造の共同タスクでのパフォーマンスを向上させ、65kトークンのウィンドウ付き注意遅延に匹敵します"]}], ["2026-10-29", "AskStream: When and What to Ask Proactively under Uncertainty in Streaming Video Understanding", "AskStream：いつ、何をストリーミングビデオの理解の不確実性の下で積極的に尋ねるべきか", "", "なし", "画像・テキスト・動画", "テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38678", "summary": ["既存の積極的なパラダイムは、不確実性の下で無限の待機や幻覚につながる、完全な情報を前提としています。", "AskStreamは、ビデオとユーザーの不確実性の下で、いつ、何を尋ねるべきかを調査するための3つのアクション（待機、質問、回答）を備えたマルチターンベンチマークを", "このベンチマークはAsk-F1で52.18%の成功率を達成し、不確実性下での積極的な情報探索の限界を浮き彫りにしています。"]}], ["2026-10-28", "Cross-Primitive Consistency in Jev", "Jevにおけるクロスプリミティブ一貫性", "", "あり", "テキスト", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38623", "summary": ["既存の研究では、Jevにおけるクロスプリミティブ一貫性の体系的な評価が欠けています。", "PrimaConsは4軸ベンチマークと、凍結されたバックボーンに接続された残留ネットワークCPRCを導入し、クロスプリミティブの整合性を向上させています。", "CPRCは、クロスプリミティブの不整合を58.57%削減し、精度を+2.97%向上させます。"]}], ["2026-10-28", "TRIM: Temporal Run-Time Monitoring of 3D Object Detection via Activation Statistics", "TRIM:アクティベーション統計による3Dオブジェクト検出の一時的なランタイムモニタ", "", "なし", "3D データ", "バウンディングボックス", "●", "", "", "", "", "●", "", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38613", "summary": ["3Dオブジェクト検出用の既存のランタイムモニターは、各フレームを個別に評価し、オクルージョンの時間的進化、ポイントのスパース性、シーンの複雑さを", "TRIMは中間活性化のコンパクトなチャネルごとの統計を用い、時間畳み込みネットワークで短系列を処理して検出器を改変せずに見逃したオブジェクトの故障を検出します。", "時間モニタリングにより、単一フレームモニタリングと比較してAUROCは0.686から0.704に改善され、誤報率は0.818から0.759に減少します。"]}], ["2026-10-28", "V-CAPE: Visual Consistency Assessment for Product Image Editing", "V-CAPE:製品画像編集のための視覚的一貫性評価", "", "なし", "画像・テキスト・3D データ", "画像・テキスト", "", "", "●", "●", "", "", "●", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38611", "summary": ["生成画像編集における視覚的一貫性の検証は、特に大規模に見ては依然として解決されていません。", "V-CAPEは、視覚的な一貫性評価のために注釈付き40,000件の製品画像ペアを含んだ大規模なデータセットです。", "視覚言語モデルはAutoQAで65%未満の精度にとどまり、データセットの課題を浮き彫りにしています。"]}], ["2026-10-28", "Data Scaling Laws in Stereo Matching: From In-domain Fitting to Cross-domain Generalization", "ステレオマッチングにおけるデータスケーリング則：ドメイン内近似からクロスドメイン一般化へ", "", "あり", "画像", "位置・対応関係", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38600", "summary": ["ステレオマッチングにおける合成データを用いたモデル性能のスケーリングは十分に探求されていません。", "本論文は、20万サンプルの合成データセットを用いて、ドメイン内およびドメイン横断のデータスケーリング法則を調査しています。", "ドメイン内訓練では、データに対して二つの体制のスケーリング振る舞いが見られ、べき乗則から飽和へと移行します。"]}], ["2026-10-28", "SpectralTF-MAE: A Pre-trained Spectral Foundation Model for Tokamak Fusion Plasma Diagnostics", "SpectralTF-MAE:トカマク核融合プラズマ診断のための事前訓練されたスペクトル基礎モデル", "", "なし", "医用画像", "3D データ", "", "", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38593", "summary": ["トカマクプラズマ診断のための既存の学習ベースのアプローチは、ラベル付きデータに大きく依存しており、タスク固有です。", "SpectralTF-MAEは、ピーク認識マスキング戦略と共有トランスエンコーダを用いた自己教師ありスペクトル再構成を用いて、移転可能な表現を学習します。", "このモデルは、自己監督型スペクトル前学習を通じて複数の下流タスクで競争性能を達成します。"]}], ["2026-10-28", "RoSAMDepth: Robust Self-supervised Depth Estimation Leveraging Segment Anything Model", "RoSAMDepth:セグメントAnythingモデルを活用した堅牢な自己監視深さ推定", "", "あり", "深度", "深度", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38587", "summary": ["既存の方法では、オブジェクトレベルの情報を考慮することができず、悪条件下では深さの偏差やぼかしが発生します。", "RoSAMDepthは、SAMのオブジェクトレベルの事前データを3つの側面に統合しています:セグメントガイド表現の対比、適応的な地域外れ値マスキング、そしてオブジェクトレベルの信頼性推定です。", "実験では、RoSAMDepthは、複数のデータセットや気象条件にわたって最先端の方法よりも優れていることが示されています。"]}], ["2026-10-28", "Detecting Fine-Grained Differences between Image Datasets", "画像データセット間のきめ細かな違いの検出", "", "なし", "画像・テキスト", "テキスト・画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38547", "summary": ["既存の方法では、Mllmを使用して概念を提案し、画像レベルの埋め込みを選択しますが、これはコストがかかり、画像データセット間の微妙な違いを見逃す可", "本論文は、細粒度のパッチ埋め込みを用いて広範なリストから概念を選び、データにより適合するように最適化することを提案しています。", "この方法はMLLM提案をコンセプト選択に置き換えることでコストを削減し、冗長でない概念に焦点を当てることで微妙な違いの検出を改善します。"]}], ["2026-10-28", "From the Superderivative to a Relative-Gradient Edge Operator", "超微分から相対勾配エッジ演算子へ", "", "なし", "画像", "画像", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38530", "summary": ["既存のエッジ検出器は、絶対的なグレーレベルの差を測定し、グローバル強度の再スケーリングへの不変性を欠いています。", "本論文は、超微分から導出され、勾配核と点ごとの割り算によって実装された対数勾配大きさ演算子を提案しています。", "演算子は相対変化を測定し、グローバル強度の再スケーリングに不変なエッジ強度マップを提供します。"]}], ["2026-10-28", "Self-Consistency Geometry Injection for Multi-view Consistent Image Generation", "複数の眺めの一貫したイメージの生成のための自己一貫性の幾何学の注入", "", "あり", "多視点画像", "画像・多視点画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38518", "summary": ["既存の方法では、ジオメトリ推論とテクスチャ合成が結合されているため、生成は不正確なジオメトリ予測に対して脆弱になります。", "RGMVは、パラメータフリーのSCGおよびRGIモジュールを提案し、複数のジオメトリ予測を生成し、その信頼性を測定し、RGB合成におけるジオメトリ注入を変調します。", "RGMVは、マルチビュー生成において信頼できるジオメトリの手がかりを保持し、信頼性の低い手がかりを減衰させることで幾何学的品質を向上させます。"]}], ["2026-10-28", "The Power Watershed as a Differentiable Segmentation Layer", "微分可能なセグメンテーション層としてのパワー分水界", "", "あり", "画像", "ラベル・マスク・画像", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38516", "summary": ["既存のセグメンテーション法は正確な境界定義を欠いており、手動しきい値によって制限されています。", "パワー分水界（Pw）は、pが無限大に近づくにつれてシードされたランダムウォーカー（RW）の限界として導出される微分可能なセグメンテーション層である。", "WS層は、合成データ上の正確な境界セグメンテーションを達成し、有限p解法でベースライン上でインスタンスF1スコアを0.015-0.020向上させます。"]}], ["2026-10-28", "Similar Scores, Opposite Failures: Human Correction as an Instrument for Video Caption Evaluation", "同様のスコア、反対の失敗：ビデオキャプション評価のための手段としての人間の修正", "", "なし", "動画・画像・テキスト", "テキスト・動画", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38511", "summary": ["既存の指標では、密なマルチウィンドウの動画説明で人間のレビュー担当者が受け入れたキャプションと拒否したキャプションを区別できません。", "この論文は人間の修正と固定失敗分類法を用いて動画キャプションを評価し、注釈者が字幕を編集し、品質管理レビュアーが注釈をチェックしています。", "参考文献の重複指標は受け入れられたキャプションと却下されたキャプションを区別せず、異なるレビューの細分度は有意に異なる結果をもたらします。"]}], ["2026-10-28", "UnMixMamba: Unmixing Guided State Space Subpixel Mapping of Crops from MODIS Time Series", "UnMixMamba:MODIS時系列からの作物のガイド付き状態空間サブピクセルマッピングの混合解除", "", "なし", "画像", "画像・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38507", "summary": ["既存の方法は、スペクトル-時間結合、クラス内エンドメンバーの変動、および高分解能グリッド上の均一な微細化に苦労しています。", "UnMixMambaはこれらの課題に対応するためにTSSDの因数分解、$×8ドルのスーパー解像度、Mambaトークン予算を使用しています。", "UnMixMambaは、アルバータ州2015年のデータ上で他の手法よりも高いOA、mIoU、AA、Kappaを達成しています。"]}], ["2026-10-28", "Residual Motion Splatting for Continuous Space-Time Video Super-Resolution", "連続的な時空のビデオ超解像のためにSplatting残りの動き", "", "なし", "画像・動画", "画像・動画・軌跡", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38499", "summary": ["既存の方法では、融合前にフレームごとのサンプルをリサンプリングすると、サブピクセル位置が失われます。", "論文は、連続軌道を予測し、低解像度の特徴を高解像度グリッドに投影し、可視性の重みを予測する残留運動スプラッティング手法を提案しています。", "この方法は、最先端手法よりも1倍速く再構成の忠実度と知覚品質を向上させます。"]}], ["2026-10-28", "Vision-Based Density Estimation for Adaptive Traffic Control", "適応トラヒック制御のためのビジョンベースの密度推定", "", "なし", "画像", "行動・画像", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38497", "summary": ["カメラベースの交通状態推定は，不均一な交通フローにおける重度の車両閉塞と重複によって制限される。", "時空間予測のためのCNNとSt3Dnetを使用して、車両密度推定、予測ダイナミックスモデリング、およびポリシー最適化にデカップリングフレームワーク。", "密度推定段階は、インド・ジャイプールのランバーグ4から40枚の注釈付き交差画像で評価され、検証平均絶対誤差(MAE)は3.32ドル/分0.95ドル、平均絶対パーセンテージ誤差(MAPE)は14.5%と報告されました。"]}], ["2026-10-28", "Calibrating Track-Query Updates at Test Time for Multi-Object Tracking", "マルチオブジェクト追跡のためのテスト時のトラッククエリ更新のキャリブレーション", "", "なし", "動画・画像・テキスト", "軌跡", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38494", "summary": ["既存のクエリ伝播トラッカーは、視覚的に類似したターゲットが重なったり交差したりすると、idの関連付けに苦労します。", "Test-time Track-Query Calibration(TQC)は、近くのアクティブトラックに向けられたトラッククエリの更新からの有界補正を使用してトラッカー出力をキャリブ", "TQCは、限られた推論オーバーヘッドを持つ九つのテスト設定でHOTAを平均+0.38改善します。"]}], ["2026-10-28", "Geometry-Aware Trajectory State Modeling for Few-Shot Action Recognition", "数ショットアクション認識のためのジオメトリ認識軌道状態モデリング", "", "なし", "動画", "ラベル", "", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38482", "summary": ["少数のショットアクション認識には、いくつかのラベル付きビデオからの識別的な運動ダイナミクスが必要ですが、既存の軌道ベースの方法は、多くの場合、サンプリングされた視覚的特徴のキャリアとして軌道を扱うか、2D変位ベースの記述子で運動を要約します。", "GeoTRAMは、StateMotionとRelMotionを用いて軌道内状態の進化と状態条件局所的な局所相互作用の秩序ある進 ummary": ["既存のFL法は、神経画像処理タスクにおけるデータ量の不均一性を考慮していない。", "論文では、1つの大規模サイトと複数の小規模サイトを含む異種なデータ量を持つフェデレーションの使用を提案しています。", "異種連合は、低データ体制において中央集権訓練と同等の精度でより良いパフォーマンスを達成します。"]}], ["2026-10-28", "Neighbourhood shortcuts in building damage assessment from very-high-resolution satellite imagery: diagnosis and a building-evidence plug-in", "非常に高解像度の衛星画像からの建物の損傷評価における近所のショートカット：診断と建物証拠プラグイン", "", "なし", "衛星・航空画像", "バウンディングボックス", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38162", "summary": ["既存のモデルは、非常に高解像度の衛星画像からの損傷評価を構築する際に近隣のショートカットに依存しており、損傷検出の体系的なエラーにつなが", "この論文は、既存のモデルを再学習せずに2人の専門家を加える建築証拠プラグインを提案しています。1人は建物自体に焦点を当て、もう1つは入れ替わった近隣環境に焦点を当てています。", "プラグインは隣接する建物と意見が異なる建物のエラーを8〜18%削減し、損傷した建物を40〜69%削減します。"]}], ["2026-10-28", "REEL: Same Frames, Different Answers and Different Costs", "リール：同じフレーム、異なる答えと異なるコスト", "", "なし", "テキスト・動画・画像", "テキスト・動画", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38158", "summary": ["各問題ごとに長い動画を処理するのはスケーラブルでなく、メモリや計算能力の制限があります。", "REELは同じフレームから構築された3つの表現を比較し、メモリ選択が質問回答に与える影響を評価します。", "Prefix Stateは無制限のストレージでGPU時間が最も短く、Textは最小限のストレージで精度の変動があります。"]}], ["2026-10-28", "StepControl: Long-Horizon Human Motion Generation from Foot-Contact Schedules", "StepControl:足の接触スケジュールからの長い地平線の人間の動きの生成", "", "なし", "イベントカメラ・テキスト・姿勢", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.38153", "summary": ["既存の方法は、体の動きや行動を指定することに焦点を当てていますが、足の接触スケジュールによる制御がありません。", "StepControlは、自己回帰拡散モデルを使用して、ルート/ボディポーズや意味プロンプトを必要とせずに、バイナリ足接触スケジュールから全身運動を生成します。", "StepControlは、確率的なノイズスケジュールとウォームアップ戦略により、正確な接触タイミングと安定した長範囲生成を実現します。"]}], ["2026-10-28", "What Does LOL Measure? Hidden Label Shifts in Low-Light Enhancement Benchmarks", "LOLは何を測定しますか？ 低照度エンハンスメントベンチマークの隠れたラベルシフト", "", "なし", "画像", "画像", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38121", "summary": ["既存のベンチマークでは、低照度画像強調評価に影響を与える隠れたラベルシフトがあります。", "この論文は、正確な指標の実装のもとで18のチェックポイントを持つ2つのベンチマークを監査しています。", "テストラベルは場合によっては訓練ラベルと最大3.9 dBも異なります。"]}], ["2026-10-28", "Who Called? V33DA: A Physically Verified Multimodal Benchmark for Vocal Attribution in Zebra Finch Groups", "誰が電話したのですか？ V33DA:ゼブラフィンチ群におけるボーカル帰属のための物理的に検証されたマルチモーダルベンチマーク", "", "なし", "イベントカメラ・音声・姿勢", "データセット・評価", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38109", "summary": ["既存の作品は、動物群における声の帰属のための物理的に検証された根拠の真実を欠いています。", "V33DAは、5チャンネル音声、3Dポーズ、無線テレメトリーを用いた33,625件の検証済みイベントを用いて、シブラフィンチの鳴き声の帰属を評価しています。", "V33DAは固定プロトコルとコードを提供し、V33DA++は重複呼び出しイベントや+/-2 sのコンテキストウィンドウに対応しています。"]}], ["2026-10-28", "The Prestige: Benchmarking Cognitive Visual Reasoning using Magic Tricks", "プレステージ：手品を使用して認知視覚推論をベンチマーク", "", "あり", "画像・テキスト", "テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38103", "summary": ["既存のベンチマークには、手品のような複雑で欺瞞的なシナリオによる認知視覚推論のためのプローブが欠けています。", "プレステージは、オープンエンドの質問や敵対的なシナリオを通じて認知視覚推論のモデルをテストするために、プロの魔法の性能を使用しています。", "ベンチマークはモデルと人間のパフォーマンスの間に大きなギャップがあり、VLMの推論と評価の限界を浮き彫りにしています。"]}], ["2026-10-28", "From Next Day Wildfire to Next Days Wildfire: A New Multi-Continent Dataset of Active-Fire Spread for Sequence-to-Sequence Forecasting", "次の日の山火事から次の日の山火事まで：シーケンス間の予測のためのアクティブな火の広がりの新しいマルチコンチネントデータセット", "", "なし", "衛星・航空画像", "マスク", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38086", "summary": ["既存のベンチマークは、サイズと多様性が限られており、同様の環境からの大規模で長時間燃焼する火災に焦点を当てています。", "AFSeqは、1,194カ国からの火災イベントを含む新しいデータセットであり、UTAE-ARは、再発モジュールで強化されたU-Netと時間自動エンコーダを備えたモデルです。", "UTAE-ARは、最先端モデルに比べてパラメータ数を21.5%少なくしつつ、翌日の精度と長期予測を向上させています。"]}], ["2026-10-28", "Efficacy of Monocular Depth Estimation in Lunar Environments", "月の環境における単眼深度推定の有効性", "", "なし", "深度", "深度", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38080", "summary": ["既存の方法は、月面のような非地上、分布外の環境で正確な単眼深さ推定に苦労しています。", "本論文では、POLARデータセットとアポロ17号の画像を用いた月面環境における最先端の単眼深度推定手法をいくつか評価しています。", "この研究は、いくつかの高度な技術が非構造化月面の高精度3D再構築を可能にできることを示しています。"]}], ["2026-10-28", "Vision Tomography: Towards Portable 3D Bidirectional Face-Skull Inference from Visual Data", "ビジョントモグラフィー：視覚データからのポータブル3D双方向顔-頭蓋骨推論に向けて", "", "あり", "医用画像・画像", "行動", "", "", "", "", "", "", "●", "", "", "●", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.38065", "summary": ["従来のCTは高価で固定型であり、患者を放射線にさらすため、遠隔診断や法医学的識別などの用途において携帯性や安全性が制限されます。", "ビジョントモグラフィー(VT)は、密度の高いレイマッチングレジストレーションと共有係数空間を持つ3D双方向顔-頭蓋骨モルファブルモデル(BFSM)を用いて、視覚データから3D顔-頭蓋骨幾何学を再構築します。", "VTは、共有係数空間を持つ視覚データから3D顔頭蓋骨再建を実現し、組織の厚さ変動をモデル化することで、同じ頭蓋骨から1対多数の顔面再構築を可能にします。"]}], ["2026-10-28", "Classifying Urban Locations by Cyclist Facility Usage and Directional Alignment: A Validated Camera-Based Framework from Multi-Site Observations", "サイクリスト施設の使用状況と方向配置による都市の場所の分類：マルチサイト観測から検証されたカメラベースのフレームワーク", "", "なし", "イベントカメラ", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38045", "summary": ["既存のツールには、自転車が設計どおりに自転車施設を使用しているかどうかを評価する能力がありません。", "19回の展開では、モーショントリガーカメラがサイクリングイベントや施設利用パターンを分析しました。", "この研究では、誤通電話の視覚的検証による自動検出精度92.9%を達成しました。"]}], ["2026-10-28", "Can Event Detectors Leave the Broadcast Camera? Evidence from Tennis", "イベント検出器は放送カメラから離れることができますか？ テニスからの証拠", "", "なし", "画像・テキスト・イベントカメラ", "テキスト・イベントカメラ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38042", "summary": ["モノランナービデオでは、テニスではボールのバウンドとラケットのヒットの区別がつきにくいです。", "論文は、8つのクリップにまたがる345のフレームレベルのバウンスとヒットの注釈を用いたベンチマークを提案し、ビジョン言語モデルやRallyArbを含む様々なモデルを評価しています。", "RallyArbは電話やコートレベルのクリップで0.8を超える跳ね返りF1を実現していますが、視覚言語モデルは接触フレームを約0.1秒外します。"]}], ["2026-10-28", "Where Can We Fool the Model's Mind? Response-Guided Semantic Probing and Adaptive Routing for Transferable Attacks on Black-Box MLLMs", "モデルの心をどこでだますことができますか？ ブラックボックスMllmに対する転送可能な攻撃のための応答ガイド付きセマンティックプロービングと適応ルーティン", "", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38013", "summary": ["Mllmに対する既存の攻撃は、代理モデルの顕著性を使用して摂動を割り当てますが、これはモデルが意味的にどのように解釈したり、異なる画像領域に依存したりするかを反映していない可能性があります。", "VISTAは応答由来意味脆弱性を用いて意味的に脆弱な領域を特定し、エントロピー適応シンクホーンルーティングと代理アンサンブルを用いて、摂動を脆弱領域に集中させます。", "VISTAはPSNRを30dB以上に保つ間に最大97%の攻撃成功率を達成し、VISTA-Proxyは最終被害者に問い合わせることなく最大93%のASRを達成します。"]}], ["2026-10-28", "Frequency-Adaptive Gaussian Grids for Efficient Image Representation", "効率的な画像表現のための周波数適応ガウスグリッド", "Intel", "なし", "画像", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38007", "summary": ["既存の方法は、画像処理における構造化表現と非構造化表現の間のトレードオフに直面している。", "ガウスグリッドは2次元ガウスと特徴グリッドをハイブリッドに統合し、局所周波数成分に基づく計算を適応させます。", "高解像度の自然画像を用いてこの手法を評価し、GPUネイティブのデータセットストレージとしての応用を示しました。JPEG+ZIPデータアーカイブで、復号速度が$1.24$〜$2.14\\times$、PCIeデータトラフィックを$23\\times$〜$176\\times$削減したことを示しました。"]}], ["2026-10-28", "Hierarchical Diffusion for Camera-controlled Autoregressive Video Generation", "カメラ制御の自己回帰ビデオ生成のための階層的拡散", "", "なし", "画像・動画・姿勢", "動画・画像・3D データ", "", "", "●", "●", "", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37983", "summary": ["長尺ビデオカメラ制御生成は、カメラ制御の組み込みにおいてエラーの蓄積や曖昧さに直面します。", "本論文は、自己回帰生成と階層的長文脈ノイズ除去を組み合わせた枠組みを提案し、幾何学の整合性を強制しドリフトを緩和します。", "階層的ノイズ除去戦略は、コストを抑えつつ完全な時間的コンテキストに基づく効果的な条件付けを可能にし、RealEstate10kやDL3DVでの従来の手法を上回ります。"]}], ["2026-10-28", "Meta-Initialization of Implicit Neural Representations to Accelerate Deformable Medical Image Registration", "変形可能な医用画像登録を加速するための暗黙的な神経表現のメタ初期化", "", "なし", "医用画像・3D データ", "位置・対応関係", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37965", "summary": ["変形可能な医療画像登録のための暗黙的神経表現法は、新しい画像ペアごとにパラメータ最適化を必要とし、適応速度を制限します。", "本論文では、既に解明された登録タスクからの事前学習を活用し、適応を加速させるためにReptileやSTRAINERのメタ初期化を提案しています。", "どちらのスキームも、ランダムな初期化よりも初期の反復で高いダイスと低いHD9 h：モバイルデバイス上での画像生成と編集のためのベンチマーク", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.37599", "summary": ["既存のベンチマークには、デバイス上のモデルとサーバー側のモデルの間の機能のギャップに関するガイダンスがありません。", "モバイルユーザーのニーズに基づいたベンチマークMoI-Benchを紹介します。64のサブタスクと1150のサンプルで構成されています。", "デカップリングされたOperation x Target設計は、コンパクトモデルの改善に向けたより詳細な指針を提供します。"]}], ["2026-10-28", "Zero-Shot Multimodal Event Spotting in Soccer Broadcasts", "サッカー中継でのゼロショットマルチモーダルイベントスポッティング", "", "なし", "テキスト", "イベントカメラ・動画", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37583", "summary": ["既存の方法は、サッカー放送でのイベントスポッティングのための大規模な注釈付きデータセットとサッカー固有のトレーニングに依存しています。", "汎用マルチモーダルモデルとコンパクトなビジュアルストーリーボードを使用して、イベントを検出、分類、および時間的にローカライズするゼロショットフレームワーク。", "最適な構成は72.0%のF1@5sを実現し、個々のフレームと比較して推論コストを72%削減します。"]}], ["2026-10-28", "As the Story Unfolds: Watching a Film and Identifying Characters as a Human Does", "物語が展開するにつれて：映画を見て、人間としてのキャラクターを識別する", "", "なし", "画像・テキスト・動画", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37579", "summary": ["既存の方法は、外部データなしで映画から文字を識別することができません。", "この論文は、キャラクター名付けタスクと、映画のセリフや視覚的手がかりからキャラクターを特定するためのビデオと対話モデルを提案しています。", "この論文は、映画の展開に伴いキャラクターバンクを構築するための進歩的な枠組みを紹介しています。"]}], ["2026-10-28", "The Noise Plane: A Diffusion Bridge Across Exponent and Dispersion", "ノイズ平面：指数と分散を横切る拡散ブリッジ", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37576", "summary": ["既存の拡散ノイズ除去モデルはガウス摂動を使用しますが、センサノイズは多様な信号依存の統計法則に従います。", "論文では、ノイズ指数$p$と累積測定$ν$を用いてノイズ面を定義する統一拡散フレームワーク、$p$-Bridgeを提案しています。", "共有ネットワークは推定指数を用いたオラクル選択された5つの専門モデルに匹敵する堅牢性を実現しています。"]}], ["2026-10-28", "ReferStream: Interactive Subject Injection for Streaming Video Generation", "ReferStream:ストリーミングビデオ生成のための対話型サブジェクトインジェクション", "", "あり", "動画・テキスト", "動画", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37566", "summary": ["ストリーミング動画生成中に新しい被写体を自然に注入するには、既存の映像に視覚的な参照を統合しつつ、確立された被写体とシーンを保持する必要があります。", "ReferStreamは、現在のシーンを用いた参照構築と過渡キャッシュ注入を組み合わせ、参照潜在を最新のシーン潜在のターゲット領域に配置します。", "ReferStreamベンチの実験は、比較ベースラインよりもテキストの遵守、被験者の類似性、およびカウント精度のための高いスコアを示しています。"]}], ["2026-10-28", "GroundControl: Satellite-Conditioned Multi-View Diffusion for Reconstruction-Free Novel View Synthesis", "GroundControl:再構成のない新しい眺めの統合のための衛星調節された複数の眺めの拡散", "", "あり", "衛星・航空画像・画像・3D データ", "3D データ・衛星・航空画像・画像", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37545", "summary": ["既存のマルチビュー拡散モデルは、シーン外挿中に非現実的な空間レイアウトを幻覚", "GroundControlは衛星画像を用いて、マルチビュー拡散モデルをストリートレベルの画像と並べて調整します", "このモデルは、ソースビューとビューの重なりが最小限のシーンにおいて、ノベルビュー合成においてベースラインを上回る性能を示します"]}], ["2026-10-28", "A note on data-efficient finetuning of vision foundation models", "Vision foundationモデルのデータ効率的な微調整に関する注意事項", "", "なし", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37510", "summary": ["既存の方法は、ビジョン基礎モデルの効率的な微調整のためのリソースの制限の下で体系的な評価を欠いています。", "本論文は、VP、LP、FFT、LoRAなど、さまざまな基礎モデルファミリーやトランスファーパラダイムの性能をハイパーパラメータチューニングを用いて評価しています。", "本論文は、従来の研究と比べてモデルや技術の選択を広げています。"]}], ["2026-10-28", "ALADDIN: Adversarial Latent Diffusion Distillation for One-Step Identity Swapping", "アラジン：ワンステップのアイデンティティ交換のための敵対的な潜在拡散蒸留", "", "なし", "画像・姿勢", "位置・対応関係", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.37503", "summary": ["既存のワンステップフェイススワッパーは、アイデンティティの転送を維持しながら、リアリズムとターゲット属性の保存に苦労しています。", "ALADDINは、事前に訓練されたフローマッチングモデルからジェネレータを初期化し、同一性とターゲット保存の制約の下で敵対的に訓練します。", "アラジンは、28倍少ないネットワーク評価と桁違いに少ないトレーニングペアで、最先端のリアリズムとターゲット保存を実現しています。"]}], ["2026-10-28", "How Reliable Is Individualized Functional-Network Attribution in Resting-State fMRI Cognitive Prediction in ADNI?", "ADNIにおける安静状態fMRI認知予測における個別化機能ネットワーク帰属はどのくらい信頼性がありますか？", "Siemens", "なし", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37472", "summary": ["安静状態fMRIにおける個別化された機能ネットワーク帰属のテスト・再検査信頼性は、ほとんど定量化されていません。", "本論文では、凍結状態機能的結合予測因子と被験者レベルの置換帰無を用いて、被験者ごとのネットワークアブレーション帰属を評価しています。", "スプリットハーフの信頼性はほぼ上限に達しますが、スキャン再スキャンで低下し、マッチしたペアはz~6.6-6.9を示します。"]}], ["2026-10-28", "PerceptRL: Making Visual Perception Rewardable in MLLMs from Answers to Interactions", "PerceptRL:答えから相互作用へのMLLMsの視覚認識をRewardable作ること", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37471", "summary": ["きめの細かい視覚は，推論に焦点を当てた最適化を制約する知覚誤差のために，Ｍｌｌｍｓの学習後のボトルネックである。", "PerceptRLはマルチエージェントパイプラインを用いて、密度の高い画像キャプションから検証済みの誤りを抽出し、固定回答ラベルとルールベースの報酬を備えたQAペアに変換します。また、細かいケースや密度の高いケースには、視覚ツールを用いたマルチターン検査で対応します。", "PerceptRLは7つのベンチマークで平均71.6%の精度を達成し、ベースモデルを15.7ポイント上回り、評価された最強のフロンティアVLMを5.2ポイント上回っています。"]}], ["2026-10-28", "Representing the Unseen: Rethinking Visual Imagination for Spatial Reasoning", "目に見えないものを表現する：空間推論のための視覚的想像力を再考する", "", "なし", "画像", "画像", "", "", "", "●", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37437", "summary": ["既存のビジュアルワールドモデルは、空間推論のデフォルト表現としてRGBを使用しますが、下流の推論には最も効果的ではない可能性があります。", "論文では、922問と6つの代替表現を持つシミュレーターベースのベンチマークImagiRepと、適応的表現選択の戦略であるGEARSを紹介します。", "代替表現は空間推論においてRGBよりも優れており、GEARSは既存の方法よりも性能を向上させます。"]}], ["2026-10-28", "Segmentation Confidence for Arbitrary CNNs", "任意のCnnのセグメンテーション信頼度", "", "なし", "医用画像・3D データ", "マスク", "", "●", "", "", "", "●", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37431", "summary": ["予測の不確実性を推定するための既存の方法には、カスタムアーキテクチャと専用のトレーニング設定が必要です。", "既存のセグメンテーションパイプラインに再学習なしで追加可能なボクセルベースの不確実性推定手法を提案します。", "私たちの手法は、不確実性マップから単一の信頼スコアを推定し、未表示データにおけるセグメンテーション性能を予測します。"]}], ["2026-10-28", "When Visual Evidence Is Insufficient: How Instructions, Post-Training, and Internal Activations Shape Refusal in Multimodal Language Models", "視覚的証拠が不十分な場合：マルチモーダル言語モデルにおける指示、トレーニング後、および内部活性化の形成方法", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37430", "summary": ["既存のMllmは、視覚的な証拠が質問に答えるには不十分であるときに確実に認識することができず、サポートされていない回答につながります。", "本論文は推論時間指示、トレーニング後手法、内部活性化介入を操作し、MLLMにおける拒否への影響を研究しています。", "活性化介入は、視覚的に答えることができるサンプルに無差別拒否することなく、拒否の小さいが、譲渡可能な変化を生成します。"]}], ["2026-10-28", "CTBakeGS: training-free baking of photorealistic CT volume renderings into 3D Gaussian splats", "CTBakeGS:フォトリアリスティックなCTボリュームレンダリングを3Dガウススプラットにトレーニングフリーベーキング", "", "なし", "医用画像・3D ガウス・動画", "3D ガウス・医用画像・動画", "", "", "", "", "●", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37406", "summary": ["既存の医療アプローチでは、CTボリュームを3DGSモデルに変換するために数分から数時間のトレーニングが必要です。", "CTBakeGSは、適応オクトリー上にsplatsを配置し、色、不透明度、およびsplat保持を計算することにより、トレーニングなしでCTボリュームを3DGSモデルに変換します。", "200万スプラットモデルは、骨で32.6 +/- 0.9 dB、造影強化血管で30.1 +/- 1.0 dB、皮膚・骨で32.3 +/- 1.5 dBのPSNRを記録しました。"]}], ["2026-10-28", "PDRVLA: A Vision-Language-Action Model with Physical Dynamics Representations", "PDRVLA:物理力学表現を持つビジョン-言語-アクションモデル", "", "なし", "テキスト・画像", "動画・行動・深度", "", "", "", "●", "●", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37381", "summary": ["既存のVLAモデルは物理力学の理解を欠いています", "PDRVLAは軽量の物理動力モジュールを用いて、視覚言語の特徴から物理的トークンを抽出し、条件アクション生成に至ります", "PDRVLAはLIBEROで99.3%、LIBERO-Plusで89.9%の成功率を達成しています"]}], ["2026-10-28", "EmbeddingGemma 2: Unified and Efficient Multimodal Representations", "埋め込み2：統一された効率的なマルチモーダル表現", "Google", "なし", "動画・画像・音声", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37364", "summary": ["既存のマルチモーダルモデルには、複数のモダリティにわたる統一された効率的な表現が欠けています。", "EmbeddingGemma2は、単純化されたレイヤーごとの埋め込みと多段カリキュラムを使用して、テキスト、画像、オーディオ、ビデオ、および組み合わせを統一された空間で表", "EmbeddingGemma2は、専門モデルよりも優れており、包括的な埋め込みベンチマークでは二から十二倍大きいモデルです。"]}]]}</script>
<script>
const {headers, groups, summaryHeaders, rows} = JSON.parse(document.getElementById("data").textContent);
// Column kinds: date, text (free-text filter), company (one dropdown entry per
// company; a cell can list several, joined by "; "), code, flag (●). Each row
// carries one extra, hidden object at the end: the alphaXiv URL and the summary.
const kinds = ["date", "text", "text", "company", "code", "text", "text"]
  .concat(Array(headers.length - 7).fill("flag"));
const widths = {1: "w-title", 2: "w-ja", 3: "w-co", 5: "w-io", 6: "w-io"};
let selected = null;  // the row shown in the lower pane
const ANY = "\u0000", SOME = "\u0001";  // "すべて" and "(企業あり)"
const companiesOf = value => value ? value.split("; ") : [];
const filters = [];
let sortCol = 0, sortDir = -1;

// Top row: group names spanning their columns, empty cells elsewhere.
const groupRow = document.getElementById("groups");
for (let i = 0; i < headers.length; i++) {
  const group = groups.find(g => g.first === i);
  const th = document.createElement("th");
  if (group) {
    th.textContent = group.name;
    th.colSpan = group.count;
    th.className = "group";
    i += group.count - 1;
  } else {
    th.className = "blank";
  }
  groupRow.appendChild(th);
}

const headRow = document.getElementById("heads");
const filterRow = document.getElementById("filters");
headers.forEach((name, i) => {
  const th = document.createElement("th");
  th.textContent = name;
  th.className = "sort " + (widths[i] || (kinds[i] === "flag" ? "w-flag" : ""));
  th.addEventListener("click", () => {
    sortDir = sortCol === i ? -sortDir : (kinds[i] === "flag" ? -1 : 1);
    sortCol = i;
    render();
  });
  headRow.appendChild(th);

  const cell = document.createElement("th");
  let control = null;
  if (kinds[i] === "text") {
    control = document.createElement("input");
    control.type = "search";
    control.placeholder = "含む文字";
  } else if (kinds[i] === "company") {
    const counts = {};
    rows.forEach(r => companiesOf(r[i]).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
    control = document.createElement("select");
    control.add(new Option("すべて", ANY));
    control.add(new Option("(企業あり)", SOME));
    control.add(new Option("(空欄)", ""));
    Object.keys(counts).sort((a, b) => a.localeCompare(b, "en", {sensitivity: "base"}))
      .forEach(c => control.add(new Option(`${c} (${counts[c]})`, c)));
  } else {
    const values = kinds[i] === "flag" ? ["●", ""]
      : [...new Set(rows.map(r => r[i]))].sort().reverse();
    control = document.createElement("select");
    control.add(new Option("すべて", ANY));
    values.forEach(v => control.add(new Option(v === "" ? "(空欄)" : v, v)));
  }
  if (control) {
    control.addEventListener("input", render);
    cell.appendChild(control);
  }
  filters[i] = control;
  filterRow.appendChild(cell);
});

function matches(row) {
  return filters.every((control, i) => {
    if (!control) return true;
    if (control.value === ANY) return true;
    if (kinds[i] === "company") {
      if (control.value === SOME) return row[i] !== "";
      return control.value === "" ? row[i] === "" : companiesOf(row[i]).includes(control.value);
    }
    if (control.tagName === "SELECT") return row[i] === control.value;
    const query = control.value.trim().toLowerCase();
    return !query || row[i].toLowerCase().includes(query);
  });
}

function link(href, text) {
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener";
  return a;
}

function render() {
  const shown = rows.filter(matches).sort((a, b) =>
    sortDir * a[sortCol].localeCompare(b[sortCol], "ja", {numeric: true}));
  const body = document.createElement("tbody");
  body.id = "rows";
  for (const row of shown) {
    const tr = body.insertRow();
    if (row === selected) tr.className = "selected";
    headers.forEach((_, i) => {
      const td = tr.insertCell();
      if (i === 1) {
        // A plain click shows the summary below; Ctrl/middle click still opens alphaXiv.
        const a = link(row[row.length - 1].alpha, row[i]);
        a.addEventListener("click", event => {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.button !== 0) return;
          event.preventDefault();
          showDetail(row, tr);
        });
        td.appendChild(a);
      } else {
        td.textContent = row[i];
      }
      if (kinds[i] === "code" || kinds[i] === "flag") td.className = "c";
      else if (kinds[i] === "date") td.className = "nw";
    });
  }
  document.getElementById("rows").replaceWith(body);
  headRow.querySelectorAll("th").forEach((th, i) => {
    th.classList.toggle("asc", i === sortCol && sortDir > 0);
    th.classList.toggle("desc", i === sortCol && sortDir < 0);
  });
  document.getElementById("count").textContent = `${rows.length} 件中 ${shown.length} 件を表示`;
}

const detail = document.getElementById("detail");
const splitter = document.getElementById("splitter");

function showDetail(row, tr) {
  selected = row;
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  tr.classList.add("selected");
  const extra = row[row.length - 1];
  document.getElementById("d-title").textContent = row[1];
  document.getElementById("d-ja").textContent = row[2];
  document.getElementById("d-alpha").href = extra.alpha;
  const body = document.getElementById("d-summary");
  body.replaceChildren();
  summaryHeaders.forEach((name, k) => {
    const line = body.insertRow();
    const th = document.createElement("th");
    th.textContent = name;
    line.appendChild(th);
    line.insertCell().textContent = extra.summary[k] || "（要約なし）";
  });
  detail.hidden = splitter.hidden = false;
}

function hideDetail() {
  selected = null;
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  detail.hidden = splitter.hidden = true;
}

document.getElementById("d-close").addEventListener("click", hideDetail);
document.addEventListener("keydown", event => { if (event.key === "Escape") hideDetail(); });
splitter.addEventListener("pointerdown", event => {
  event.preventDefault();
  splitter.setPointerCapture(event.pointerId);
  const move = e => {
    const height = Math.min(Math.max(window.innerHeight - e.clientY, 80), window.innerHeight - 160);
    detail.style.height = `${height}px`;
  };
  splitter.addEventListener("pointermove", move);
  splitter.addEventListener("pointerup", () => splitter.removeEventListener("pointermove", move), {once: true});
});

document.getElementById("reset").addEventListener("click", () => {
  filters.forEach(control => { if (control) control.value = control.tagName === "SELECT" ? ANY : ""; });
  render();
});
render();
</script>
