間手がかりが欠けています。", "AVPS-360は、1次アンビソニックスの音声と230の録音にまたがる同期された360°映像を組み合わせます。", "このデータセットは、ソースIDやサウンドイベントラベルに紐づいた31,678件の手動レビュー済みインスタンスマスクを提供しています。"]}], ["2026-10-30", "Accurate MRI-free PET Quantification and Reliability Assessment via CT-to-MRI Synthesis and Conformal Prediction", "CTからMRIへの合成および共形予測による正確なMRIフリーPET定量化および信頼性評価", "", "なし", "医用画像", "医用画像・ラベル", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40478", "summary": ["MRIはPET定量化に利用できないことが多いため、正確なSUVR測定が制限されます。", "CTからMRIへの合成と共形予測を組み合わせ、MRIフリーPET定量化および信頼性評価を実現します。", "この手法はMAE±およびPearson r =で皮質SUVRを達成し、87人中85人が90%のカバレッジで明確なアミロイド陽性決定を示しました。"]}], ["2026-10-30", "InfantNet: A Large Scale Dataset for Infant Body Pose and Shape Estimation", "InfantNet:乳児の体型と形状推定のための大規模データセット", "Sony", "なし", "医用画像・多視点画像・姿勢", "姿勢", "", "", "", "", "", "●", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40467", "summary": ["既存の手法やデータセットは成人向けに設計されており、乳児の体格、可動制限、自己閉塞の処理に失敗しています。", "InfantNetは、2Dキーポイントで注釈を付けた108,902枚の画像と、SMILパラメータを用いた3D姿勢・形状注釈を含むサブセットを含む大規模なデータセットを導入しています。", "InfantNetでの微調整により性能が向上し、3D姿勢および形状推定はSMPLベースのモデルと同等の向上を示しています。"]}], ["2026-10-30", "A Unified Benchmark for Aerial-Enhanced Autonomous Driving: The KITScenes Aerial Dataset", "空中強化自動運転の統一ベンチマーク:KITScenes航空データセット", "", "あり", "衛星・航空画像", "データセット・評価", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40455", "summary": ["既存の研究には、空中強化型自動運転タスクに対する統一されたベンチマークが不足しています。", "KITScenes Aerialは、航空画像と高解像度のニューラル表現でKITScenesマルチモーダルデータセットを拡張しています。", "航空コンテキストは53クラスmAPを2倍以上に向上させ、4.3mAPを高解像度画像で追加します。"]}], ["2026-10-30", "PhysInsert: Physically Plausible Object Insertion with Geometric Priors and Bidirectional Object-Scene Interactions", "PhysInsert:幾何学的な事前解析と双方向のオブジェクト-シーン相互作用を用いた物理的に妥当なオブジェクト挿入", "", "なし", "画像・テキスト・姿勢", "3D データ", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40453", "summary": ["既存の手法では、ポーズ、照明適応、双方向のオブジェクトとシーンの相互作用に関する制約が十分にありません。", "PhysInsertは、ジオメトリガイド適応と2Dオブジェクト-シーン空間監督を用いて、幾何学的事前分布や双方向の相互作用とともにオブジェクトとシーンを共同適応します。", "実験では画像の忠実度が向上し、ユーザー研究でもより正確な配置とより良い照明統合が確認されています。"]}], ["2026-10-30", "Soil Moisture Estimation in Precision Agriculture: A Knowledge Distillation Approach", "精密農業における土壌水分推定:知識蒸留アプローチ", "", "なし", "衛星・航空画像", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40432", "summary": ["高解像度画像は土壌水分推定の解析にコストが高く、計算負荷も高いです。", "土壌水分蒸留(SMD)は、知識蒸留フレームワークとユニモーダル教師を用いてマルチモーダル土壌水分推定を強化します。", "SMDは、土壌パッチのMAPEが最先端ベースラインに比べて2%、作物で1.2%の改善を達成しています。"]}], ["2026-10-30", "Uncertainty-aware Feedback Loop Diagnosis: integrating reinforcement learning and conformal prediction for reliable wafer defect classification", "不確実性認識フィードバックループ診断:信頼性の高いウェハー欠陥分類のための強化学習と共形予測の統合", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40421", "summary": ["高スループットウェハー欠陥分類は、深層学習手法におけるフルサーフェススキャンの必要性により妨げられています。", "UFLDは適応的測定獲得のための強化学習と、不確実性推定および最適停止のための共形予測を統合しています。", "提案されたUFLDは、取得時間を約40ドル短縮し、98.4%の検査精度を実現し、追加の学習信頼推定ネットワークを必要としません。"]}], ["2026-10-30", "Continuous-Action World Models: Learning Cross-Embodiment Spatiotemporal Dynamics Priors", "連続作用世界モデル:交差身体的時空間的動力学の事前学習", "", "なし", "テキスト", "行動", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40401", "summary": ["既存の手法では、ロボットのアクション生成におけるクロス身体の時空間動態の事前分布を学習するのに苦労しています。", "CoAWMは、軌道アラインメントやアクション再構築を通じて事前学習された空間的および時間的構造を捉えるために、共有潜在機能空間を用います。", "このフレームワークは、統一された潜在空間とタスク条件付きアクション選択により、クロスエボビメントおよびクロス頻度のアクション生成をサポートします。"]}], ["2026-10-30", "HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model", "HiFOR:視覚・言語・行動モデルのための階層的先見性と行動主導の世界基盤", "", "なし", "画像・テキスト", "行動・画像・ラベル", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40373", "summary": ["既存のVLAモデルは短期的な動態と長期的な目標を分離しており、予測された未来を効果的に行動政策に統合できていません。", "HiFORは、アクション主導の世界検索、短期状態、マイルストーン、目標の予測、そしてターゲットを絞った行動指針のための将来の潜在的表現を組織化する階層的なフォーサイトフレームワークを提案します。", "HiFORは、階層的予測と構造化された潜在世界モデリングを通じて予測された未来をアクションポリシーに統合し、2つのシミュレーションベンチマークと6つの実世界タスクにおけるタスク性能を向上させます。"]}], ["2026-10-30", "Wizard: Manipulate Any World in Real Time via Agentic Control", "ウィザード:エージェント・コントロールによってリアルタイムであらゆる世界を操作", "Tencent", "なし", "動画・姿勢", "動画", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40339", "summary": ["既存の手法はリアルタイムのインタラクティビティや新しい環境やキャラクターへの一般化に苦戦しています。", "Wizardは多様なデータセットと構造化された表現を用いて、適応型マスキング機構とエージェントフレームワークを備えたビデオ生成モデルを条件付けます。", "ウィザードは750シーン、178キャラクターにわたるゼロショットの一般化を実現し、キャラクターの動きをリアルタイムかつ正確に制御します。"]}], ["2026-10-30", "RFW-A: Agentic Procedural Generation of 400K Articulated Assets over 500 Categories", "RFW-A:500カテゴリにわたる40万の連結資産のエージェントプロシージャル生成", "", "なし", "", "ラベル・行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40333", "summary": ["高品質な可動資産を大規模に構築することは、手作業による注釈や手続き型モデリングのコストが高いため困難です。", "RFW-Aはエージェントシンセシスと手続き生成を組み合わせ、カテゴリレベルの資産生成のための再利用可能なプログラムを作成します。", "RFW-Aは、アセットあたりAPIコストを$0.05に削減しますが、アセットあたりのエージェントシンセシスは$1.24です。"]}], ["2026-10-30", "Radiology Guideline-derived Decision Graph for Efficient Clinical Decision Support", "効率的な臨床意思決定支援のための放射線ガイドライン由来意思決定グラフ", "", "公開予定", "医用画像・テキスト", "医用画像・ラベル・テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40327", "summary": ["放射線リスクの階層化と管理計画の自動化は、臨床ガイドラインが散在し、表、相互参照された定義にまたがっているため困難です。", "GDGraphは、大規模な言語モデルを用いてガイドラインをセクション単位のチャンクに分割し、リンクされた定義を持つ局所的な意思決定部分グラフを抽出し、関連する分岐を実行可能な意思決定グラフに集約することで、ガイドラインの作成とケース評価を分離します。", "GDGraphは、検索拡張型GPT-4oやグラフ誘導型GPT-4oと比べて、システム1の精度を57.3%から90.8%に向上させ、遅延とコストを大幅に低く抑えています。"]}], ["2026-10-30", "Textual Response-Aware Guidance for Zero-Shot Adversarial Robustness of Vision-Language Models", "視覚言語モデルのゼロショット対抗的堅牢性のためのテキスト応答認識ガイダンス", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40309", "summary": ["VLMは強力なゼロショット汎化技術にもかかわらず、敵対攻撃に対して脆弱です", "TRAGは入力埋め込みに対する事前学習済みテキストエンコーダ応答を用いて視覚表現のドリフトを制約します", "TRAGは、アーキテクチャやタスクを問わず最先端のクリーンかつ堅牢なパフォーマンスを実現します"]}], ["2026-10-30", "Self-training for cross-centre coronary vessel segmentation in X-ray angiography using pre-contrast frame subtraction", "造影前フレーム減算を用いたX線血管造影における中心横断冠動脈断片の自己訓練", "", "なし", "医用画像", "ラベル・医用画像・マスク", "", "●", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40302", "summary": ["X線血管造影における冠動脈断片のディープラーニングモデルは、訓練に反映されていないセンターのデータではあまり効果が出ません。", "本論文は、nnU-Netモデルから生成された擬似ラベルと、コントラスト前のフレーム減算によるコントラストマップを用いた自己学習を提案しています。", "XCADプールで訓練されたモデルは、マクロ平均後のDiceスコアを2.7ポイント向上させました。"]}], ["2026-10-30", "LoRe-MIM: Lost-or-Replaced Masked Image Modeling for Self-Supervised Representation Learning in Whole-Body PET/CT", "LoRe-MIM:全身PET/CTにおける自己監督型表象学習のための失われまたは置換されたマスク画像モデリング", "", "なし", "医用画像", "ラベル・マスク", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40284", "summary": ["既存の手法は注釈の不足と全身PET/CT解析の大規模データセットの制限に苦慮しています。", "LoRe-MIMは、画像領域をゼロに置き換えるか、補完的なイメージングモダリティデータに置き換えてマルチモーダル表現を学習するマスキング戦略を用います。", "LoRe-MIMは、6,531件の全身PET/CTスキャンで、六つのダウンストリームタスクにわたって最先端のベースラインを上回っています。"]}], ["2026-10-30", "TaskFrame: Connecting Task-Level Planning with Frame-Level Control for Game Agents", "TaskFrame:ゲームエージェントのためのタスクレベル計画とフレームレベル制御の接続", "Tencent", "なし", "画像・テキスト", "テキスト・行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40276", "summary": ["既存の手法は、動的な視覚環境において高レベルのタスク推論と低遅延のアクション制御を組み合わせるのに苦労しています。", "TaskFrameは、階層的なプランナー・コントローラーフレームワークとビジョン言語プランナー、そして因果的なトランスフォーマーコントローラーを用いて、タスクレベルの計画とフレームレベルの制御を結びつけます。", "TaskFrameはクローズドループ評価において基準よりも高い戦闘成功率を達成しています。"]}], ["2026-10-29", "Benchmarking color judgment in multimodal d CCT: Multi-channel SPD recovery for per-shot camera color correction", "CCTを超えて:各ショットのカメラカラー補正のためのマルチチャンネルSPDリカバリー", "", "なし", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40175", "summary": ["既存のCCTベースの色補正では、同じ色度を持つメタメリック照明を区別できません", "カメラの白点とマルチチャネルALSを条件に基底辞書を用いた非負最小二乗法を用いて照明SPDを復元", "平均角度誤差は1.89度から1.20度に減少し、LEDのようなオフプランク群では尾部が1.7倍減少します"]}], ["2026-10-29", "EventSeeColor: Learning to Reconstruct Color from Monochrome Events", "EventSeeColor:モノクロイベントから色を再構築する方法を学ぶ", "", "なし", "イベントカメラ", "画像・イベントカメラ", "", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40166", "summary": ["従来のイベントベースの画像再構成はシーンの色を復元できず、同じ強度の表面を区別する能力を制限します。", "EventSeeColorは、イベント再構築されたグレースケールと整列されたイベントを用いて、意味論的文脈とクロマ監督と共に拡散カラーライザーを誘導します。", "EventSeeColorは、2つの実事象データセットにおいて外部手法の中で、構造的類似性、学習知覚スコア、色域色差を最も優れています。"]}], ["2026-10-29", "Hierarchical Step Decomposition for Training-free Online Video Step Grounding", "トレーニング不要のオンラインビデオステップグラウンディングのための階層的ステップ分解", "", "なし", "動画", "イベントカメラ・ラベル・動画", "", "", "", "", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40153", "summary": ["既存のオンラインビデオステップ接地手法では、固定長のビデオセグメントのためにノイズが多く、過剰にセグメント化された出力が発生します。", "階層的ステップ分解は、ストリーミング動画から構成された意味的に整合したイベントを用いて、ゼロショットステップ分類を行い、予測を精緻化します。", "HSDは冗長計算を減らし、固定長セグメントではなく意味的に整合した事象を処理することでより安定した予測を実現します。"]}], ["2026-10-29", "NeurEO: dissecting Earth observation embeddings with computational neuroscience", "NeurEO:計算神経科学を用いた地球観測埋め込みの解剖", "", "なし", "衛星・航空画像", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40137", "summary": ["地球埋め込みは地理空間データの意味的意味を曖昧にすることで解釈可能性を低下させます。", "本論文は計算神経科学的手法を用いて、AlphaEarthの埋め込みを自発的および刺激応答神経活動として解析することで解釈します。", "解析により、埋め込み特徴における高度に特異かつ方向性のあるチューニングが明らかになり、効果的な次元性が高まった表現の詳細が明らかになります。"]}], ["2026-10-29", "VideoMemBench: How Well Do MLLMs Remember in Video Conversations?", "VideoMemBench:MLLMはビデオ会話でどれくらい記憶力があるのですか?", "", "なし", "画像・テキスト・動画", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40131", "summary": ["既存のビデオQAベンチマークは、独立した問題によりコンテキスト内のビデオメモリを測定できていません。", "VideoMemBenchは、入力されたクロスターン依存関係によって接続されたマルチターンダイアログとビデオをペアにします。", "20のMLLMで2,476ターンと1,387依存関係を持つ326本の動画が評価されています。"]}], ["2026-10-29", "It Takes Two to Probe, Thousands to Retrieve: Putting Vision--Language Probes to the Retrieval Test", "探査には2つ、回収には数千が必要だ:視覚――言語の探査を回収にかけること", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40124", "summary": ["既存の手法では、正しい項目が数千の代替案を上回る検索タスクでVLMを正確に評価できていません。", "本論文は、2つのプロービングベンチマークを用いてVLMを検索タスクで評価し、モデルが異なるネガティブサンプルソースを持つ項目をどのようにランク付けするかを比較しています。", "\\texttt{\\textsc{\\textbf{svo}}}では、10枚のネガを回収しても、200〜430枚のランダムネガと同じ精度が得られます。"]}], ["2026-10-29", "Learning a Motion Manifold to Constrain Ambiguity in Unsupervised 4D Medical Image Interpolation", "教師なし4D医療画像補間における曖昧さを制約するためのモーションマニホールドの学習", "", "なし", "医用画像", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40121", "summary": ["動きの曖昧さは、教師なしの4D医療画像補間では、中間解剖学が異なるため、類似したエンドポイントの一致が原因で生じます。", "フレームワークは、クロスサンプルスペクトルベース学習とサンプル条件付きケイリー基底再指向を用いて、候補運動場を制限しつつ、候補運動場を学習します。", "この方法は、中間体積なしでACDCおよび4D肺において最先端の性能を達成し、中間監督を用いた方法に対して競争力のある結果を得ています。"]}], ["2026-10-29", "SynthFaces: Balanced Large Scale Human Dataset", "SynthFaces:バランスの取れた大規模ヒトデータセット", "", "なし", "画像", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40119", "summary": ["既存のデータセットは偏りがあり、機密性の高い情報を含むため、不公平な生成モデルが生まれます。", "恒等埋め込みの多様体における流れマッチング生成モデルを用いてArc2Face拡散モデルを展開した。", "私たちのアプローチは、実際のデータセットには存在しない生成的忠実度とラベル多様性を実現し、高度にバランスの取れた同一性中心のデータセットを実現しています。"]}], ["2026-10-29", "SelfThinker: Self-Evolving Reasoning via Reliability-Verified Intrinsic Visual Thoughts", "セルフシンカー:信頼性が検証された内在的視覚思考による自己進化的推論", "", "あり", "画像・テキスト", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.40115", "summary": ["既存の視覚的思考連鎖手法は、トレーニング中に人間が注釈付きヘルパー画像を用い、テスト時の画像生成が遅い必要があります。", "SelfThinkerは、自己生成の視覚的思考を用いて人間の画像注釈を使わずに理解を深め、条件付き点ごとの相互情報で候補をスコアリングし、フローマッチングによってジェネレーターを洗練させます。", "SelfThinkerは自然イメージと空間ベンチマークにも広く移行し、ThinkMorph-7Bの7ベンチマーク平均を11.3ポイント引き上げました。"]}], ["2026-10-29", "RepConTUR: A Report-Conditioned Volumetric Multimodal Model for Abdominal Tumor Segmentation", "RepConTUR:腹部腫瘍セグメンテーションのための報告条件付き体積多モーダルモデル", "", "あり", "画像・テキスト", "テキスト・マスク", "", "●", "", "●", "", "●", "●", "●", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40094", "summary": ["腹部CTにおける自動腫瘍断片は、誤陽性によって線量計算が歪み、編集時間が長くなるため制限されています。", "RepConTURは、放射線報告書上で腫瘍のセグメンテーションを条件付け、4つの関連タスクを共同で行う3Dマルチモーダルモデルです。", "RepConTURは、複数のデータセットにおいてテキストプロンプトベースラインや視覚のみモデルよりも高いDSC、精度、F1スコアを達成しています。"]}], ["2026-10-29", "Neural Blind Deconvolution for Image Scanning Microscopy", "画像走査顕微鏡のための神経盲解畳み込み", "", "なし", "画像", "画像・バウンディングボックス", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40088", "summary": ["既存のISM手法は、サンプルやシステムによる収差による無効なPSFモデルに依存しています", "トレーニングフリーの盲DIPフレームワークは、試料と検出器依存のPSFを共同で推定します", "ブラインドDIPは、固定PSFを持つマルチ画像デコンボリューションやDIPよりも細かい構造を復元します"]}], ["2026-10-29", "Morphology-Aware Channel-Decoupled Mamba Network for Medical Image Segmentation", "医療画像セグメンテーションのための形態認識チャネルデカップリングマンバネットワーク", "", "なし", "医用画像", "マスク・医用画像", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40085", "summary": ["CTでの正確な多臓器分割は、臓器の形状や大きさのばらつき、組織コントラストの低さ、境界の曖昧さにより困難です。", "MCDNetは、形態認識チャネルデカップリング状態空間ブロックを用いて特徴チャネルを分離し、変形可能な畳み込みとチャネル注意を備えた局所特徴を適応させます。", "MCDNetはSynapse腹部CTデータセットで平均Dice類似係数81.61%を達成し、従来の手法を上回っています。"]}], ["2026-10-29", "Uncertainty-aware Coarse-to-Fine Main Pancreatic Duct Segmentation for Width Measurement in 3D MRCP", "3D MRCPにおける幅測定のための粗〜細の粗〜細膵管分割", "", "なし", "", "マスク", "", "●", "", "", "", "●", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40073", "summary": ["体積型MRCPによる自動MPD解析は、リーダーの変動性や不確実性認識型の手法の欠如により、依然として十分に探求されていません。", "MRCPスキャンによるMPDセグメンテーションと幅予測のための不確実性推定を備えた粗〜細規模の深層学習パイプライン。", "この方法は散瞳MPD検出において0.634 DSC、0.744精度、0.593リコール、75.0%の感度を達成しました。"]}], ["2026-10-29", "BRACHIO: Broad Representations Across Centres for Head-and-neck Imaging Oncology (HECKTOR 2026)", "BRACHIO:頭頸部画像腫瘍学センター間の広範な表現(HECKTOR 2026)", "", "なし", "医用画像", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40068", "summary": ["既存の手法は、頭頸部がん画像診断における多中心PET/CTスキャンによる密度の高いグローバルな情報に苦戦しています。", "論文では、PETスキャンで訓練された2D DINOv2エンコーダや、SimMIMから初期化されたSwinUNETRを持つDynUNetなど、自己教師ありの事前学習済みエンコーダを使用しています。", "この手法は、セグメンテーションで平均Diceが0.5409、N段階でバランスの取れた精度が0.6432、RFS予後でC指数が0.6577に達します。"]}], ["2026-10-29", "Localizing Concepts in Visual Autoregressive Models", "視覚的自己回帰モデルにおける概念の局所化", "", "なし", "動画・画像", "位置・対応関係", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40061", "summary": ["既存の研究では、次次スケールの視覚的自己回帰モデルにおける概念の局在化についての理解が不足しています。", "LoCoは、自己回帰モデルの層、スケール、および位置全体で概念をローカライズするモデルに依存しないフレームワークです。", "LoCoは計算負荷を削減しつつ、最先端の性能を実現し、無害な有用性も維持します。"]}], ["2026-10-29", "EPC-RawDC: Equivariant Physics Constrained 3D Diffusion with Raw Data Consistency for CBCT to CT Image Synthesis", "EPC-RawDC:CBCTからCT画像合成のための生データ一貫性を持つ等変物理制約付き3D拡散", "", "あり", "画像", "画像", "", "", "", "●", "", "", "●", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40046", "summary": ["既存のCBCTからCTへの合成手法は、基礎となる獲得物理を活用しておらず、定量的精度を制限しています。", "EPC-RawDCは、ボリューメトリック生成モデリングとスキャナー固有のCBCTフォワードモデルからの物理制約を組み合わせています。", "EPC-RawDCはSynthRAD2025でPSNRを2.66 dB、JUSTで2.10 dB向上させ、MAEを20.3%および19.0%削減します。"]}], ["2026-10-29", "Segment Anything Model Based Context Guided Mamba Unet for Medical Image Segmentation", "医療画像セグメンテーションのためのモデルベースのコンテキストガイド付きMamba Unetをセグメント化", "", "公開予定", "医用画像", "医用画像・マスク", "", "●", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40029", "summary": ["医療画像のセグメンテーションには、グローバルな文脈的理解と細かい構造的精度の両方が必要ですが、既存の手法はドメイン特有の適応性に欠け、解剖学的詳細の保存に苦労しています。", "階層コンテキスト拡張モジュールとＬｏｒａ／アダプタベースの微調整を用いて，Ｓａｍｂａの階層特徴学習とｓａｍｂａのコンテキスト知識を統合するＳＡＭＢＡ-Ｕｎｅｔを提案した。", "SAMBA-UNetは、複数の医療データセットにわたる一般化、セグメンテーションの精度、計算効率のバランスを取った最先端の性能を実現しています。"]}], ["2026-10-29", "DINOv2 for PET: A Pre-Training Domain Benchmark Across Classification, Segmentation, and Prognosis", "PET向けのDINOv2:分類、セグメンテーション、予後を横断した事前学習ドメインベンチマーク", "", "あり", "医用画像", "マスク・ラベル", "", "●", "", "", "", "", "", "", "●", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40018", "summary": ["PET特有のDINOモデルは、複数のタスクやデータセットで未開発で十分に検証されていません。", "PET-DINOv2-2Dは、2D PETデータ上で事前学習され、自然画像および医療画像のエンコーダーと比べてベンチマークされたDINOv2モデルです。", "PET-DINOv2-2Dは、事前学習データが少ないにもかかわらず、3つのPETタスクで既存モデルに匹敵または上回る性能を発揮しています。"]}], ["2026-10-29", "Greenscapes: Optimized Vegetation Configurations in Cities", "緑地景観:都市における最適化された植生構成", "", "なし", "画像・テキスト", "3D データ・テキスト", "", "", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40007", "summary": ["既存の方法は、都市植生デザインの機能的側面と美的側面のバランスを取れていません。", "本論文は、条件付けられたVLMを用いて植生レイアウトを生成し、CMA-ESと実現可能性修復を用いて最適化する手法を提案しています。", "この手法は、代理モデルと知覚記述子を通じて機能的最適化と美的最適化の両方を実現します。"]}], ["2026-10-29", "How Much Should a VLA Trust Its Reasoning? Step-Level Guidance as a Measured Action-Value Function", "VLAは自らの推論をどの程度信頼すべきか?ステップレベルのガイダンスを測定されたアクションバリュー関数として", "", "なし", "画像・テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.40002", "summary": ["既存のVLAポリシーは論理が正しいかどうかに依存していますが、正しく見える痕跡は計画を誤導する可能性があります。", "CoC-CFGは、ポリシーのコンテキストと同じコンテキスト間で分類器不要のガイダンスを適用し、推論スパンを含まず、各オイラーステップごとに1つの重みを用いて推論を減衰または増幅します。", "クローズドループでは、300シーン中262シーンを通過し、元のポリシーの252ポイントを上回り、隠れたテストセットでは8.135159の評価フィードバックスコアで他の手法を上回っています。"]}], ["2026-10-29", "Blind Video Denoising for Vocal Tract rtMRI using a Self-Supervised Ensemble", "自己監督アンサンブルを用いた声道rtMRIのブラインドビデオノイズ除去", "", "なし", "画像", "画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39972", "summary": ["声道のリアルタイムRTMRIは、時間的な解像度と信号品質のトレードオフによりノイズを導入し、発音の詳細を隠します。", "分散安定化非局所平均フィルターおよび双重モデル融合戦略による疑似スーパービジョンと、時時的超分解学習を組み合わせた自己教師ありノイズ除去フレームワーク。", "アンサンブルは見えない被写体では信号対雑音比を11.9dB向上させ、重度のノイズ下ではピーク信号対雑音比を7.6〜11.8dB改善します。"]}], ["2026-10-29", "Mind The Gap (MTG-AD): Dataset and Fine-grained Evaluation for End-to-End Inline Audio Descriptions", "Mind The Gap(MTG-AD):エンドツーエンドのインライン音声記述のためのデータセットと細かい評価", "Google", "あり", "画像・テキスト", "音声・軌跡・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39955", "summary": ["既存の研究では、多様なユーザー生成コンテンツに対するエンドツーエンドのインライン音声説明の細かい評価が不足しています。", "論文では、36時間分の動画と8k+の説明を含むMTG-ADデータセットと、参照不要の指標を持つ評価フレームワークであるMTG-AD-Evalを提案しています。", "このフレームワークはエンドツーエンドのタスクパフォーマンスを評価し、自動化された指標と人間の品質評価の間に有意な相関関係を示しています。"]}], ["2026-10-29", "UniRA: Unified Representation Alignment and Auto-Encoding for Efficient Diffusion Generation", "UniRA:効率的な拡散生成のための統一表現アライメントとオートエンコーディング", "", "なし", "画像", "画像・ラベル", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39948", "summary": ["拡散トランスは訓練収束が遅く、計算コストが高いという問題があります。", "UniRAは表現のアライメントとオートエンコーディングを単一の目的に統合し、表現空間トークナイザー、拡散バックボーン、外部表現モデルを共同最適化しています。", "UniRAはトレーニングステップを最大5つに短縮し、ImageNetクラス条件生成におけるFIDの最先端のDiTに匹敵またはそれを超えます。"]}], ["2026-10-29", "ElasticFormer: Detecting Objects in HRW Shots via Elastic Computing Vision Transformer", "ElasticFormer:Elastic Computing Vision TransformerによるHRWショット内の物体検出", "Alibaba", "なし", "画像", "バウンディングボックス", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39946", "summary": ["高解像度の広角ショットは、極度の希少性、ギガピクセル解像度、多様なターゲット数という課題に直面しています", "ElasticForformerは、前景比率に基づいてリソースを動的に割り当てるスパースバックボーンと、3相トレーニングを用いた新しい損失関数を使用しています", "ElasticFormerは、固定比率のスパース法と比べてバックボーンFLOPを80%削減し、AP50を大幅に改善します"]}], ["2026-10-29", "BiHashFormer: Hash-Driven Dual-Branch Transformer for Efficient Object Detection in HRW Shots", "BiHashFormer:HRWショットにおける効率的な物体検出のためのハッシュ駆動デュアルブランチトランスフォーマー", "Alibaba", "なし", "画像・テキスト", "バウンディングボックス", "●", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39937", "summary": ["高解像度の広角写真は、極端な前景の希薄さ、ギガピクセル解像度、前景と背景の交差という課題に直面し、従来の検出器や注意機構の妨げとなっています。", "BiHashForformerはハッシュに基づく二重分岐トランスフォーマーを使用し、鍵値ペアの半分を破棄する圧縮分岐と、低コストのハッシュ検索を行う補償分岐を備えています。", "BiHashFormerはBBONE FLOPを37.5%削減し、PANDAベンチマークでAP50を81.0%に改善しました。"]}], ["2026-10-29", "MLLM-GS: Multimodal Large Language Model Prior-Guided Fast Novel View Synthesis in Extreme Environments", "MLLM-GS:マルチモーダル大規模言語モデルの事前誘導高速新視野合成 極端環境下", "", "あり", "画像・テキスト・多視点画像", "3D データ・テキスト・画像", "", "", "", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39936", "summary": ["既存の手法は劣化特異モデルに依存しており、多様な極端環境での一般化を制限しています。", "MLLM-GSは、ビューの強調と高速3D再構築のために2つのブランチを持つマルチモーダルの大規模言語モデル事前誘導フレームワークを使用しています。", "後者はラスタライズ、ガウスメモリレイアウト、パラメータ更新を最適化し、冗長計算、メモリアクセスのオーバーヘッド、最適化コストを削減することで3DGSの効率を向上させます。"]}], ["2026-10-29", "Spectral Invariant Fusion and Refinement for Domain Generalized Semantic Segmentation", "ドメイン一般化セマンティックセグメンテーションのためのスペクトル不変融合と精緻化", "", "なし", "", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39926", "summary": ["ドメイン一般化セマンティックセグメンテーションは、トレーニング中にターゲットドメインデータにアクセスできない状態で、見えないドメインに対して正確な密度予測を必要とします。", "SIFRは、スペクトルモデリングを用いて融合および復号段階の両方でドメインシフトに対応する周波数認識型デュアルストリームフレームワークを提案します。", "SIFRは、スペクトルガイドによる不変融合とデコーダの精緻化を通じて、残差ドメインバイアスを低減することで、ドメインの堅牢性とセグメンテーション精度を向上させます。"]}], ["2026-10-29", "PhysAg3D: Bridging 3D Generative and Agentic Models for High-Fidelity and Physically-Interactive Assets", "PhysAg3D:高忠実度かつ物理的にインタラクティブな資産のための3D生成モデルとエージェントモデルの橋渡し", "Huawei", "あり", "画像・メッシュ", "なし", "医用画像", "医用画像", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39835", "summary": ["現在の医療視覚言語モデルは、重要な診断ケースにおいて誤った行動を報いる", "MedCBRは境界認識型優先最適化とルーブリックに基づく強化学習の2段階を用いています", "実験では、段階を組み合わせることで超加算効果が得られ、平均精度は61.2%であることが示されています"]}], ["2026-10-29", "GROME: GROunding Factorized MEmory into Video World Models", "GROME: グランディング ビデオワールドモデルにモデルを分解した", "", "なし", "動画", "動画・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39812", "summary": ["観察されたコンテンツがコンテキストウィンドウの外に位置すると、ビデオ世界モデルの長期的な一貫性を維持するのは困難です。", "GROMは、歴史的証拠を静的要素と動的要素に分離し、ネイティブ条件付け経路を通じてビデオ世界モデルに統合する因数分解メモリフレームワークを導入します。", "GROMEは既存の手法に比べてシーンの持続性と動的エンティティの忠実度を高めつつ、視覚的な品質と制御性を維持します。"]}], ["2026-10-29", "SCOPE: Semantic COdec Pre-Editing for Object-Preserving Compression", "スコープ:オブジェクト保存圧縮のためのセマンティックCodec事前編集", "", "なし", "画像", "画像・バウンディングボックス", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39778", "summary": ["標準コーデックは、下流のタスク精度よりも人間の知覚に最適化されています。", "SCOPEは、コーデックファミリーや圧縮の厳しさに基づいて圧縮前に画像を修正する条件付き画像プリエディタです。", "プリエディターは、異なるコーデックファミリーや検出アーキテクチャ間で一貫した向上を得て、ビットレートと検出精度のトレードオフを向上させます。"]}], ["2026-10-29", "Quantum-Inspired Convolutional Networks for High-Resolution Pseudo-Label Generation from Multimodal Earth Observation Data", "マルチモーダル地球観測データから高解像度擬標書生成のための量子着想コンボリューショナルネットワーク", "", "なし", "衛星・航空画像", "ラベル・衛星・航空画像", "", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39773", "summary": ["マルチモーダル地球観測データから正確な土地被覆マッピングは、高解像度の注釈が乏しいか高コストであるため困難です。", "量子に着想を得た畳み込みエンコーダ・デコーダネットワークは、Sentinel-1 SAR、Sentinel-2の多波長画像、粗いMODIS地形マップを用いて擬似ラベルを生成します。", "このフレームワークは、低注釈シナリオにおける古典的なベースラインと比べて、より空間的に一貫性がありクラス整合性のある擬似ラベルを生成します。"]}], ["2026-10-29", "Cross-Encoder Anchor Refinement for Zero-Shot Anomaly Detection", "ゼロショット異常検出のためのクロスエンコーダアンカー精錬", "", "なし", "テキスト", "ラベル・画像", "", "", "", "", "", "", "", "", "", "", "", "", "●", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39727", "summary": ["ゼロショット異常検出は、文脈的表現と補完的な局所証拠を組み合わせた識別的参照を構築する上で課題に直面しています。", "クロスエンコーダアンカー精緻化(CEAR)は、アンカー段階で同じ画像に対して2つの視覚的エンコーディング経路を接続し、事前学習済み畳み込みエンコーダとクロスアテンションを用いて空間アンカーを精緻化します。", "CEARは11のローカリゼーションデータセットにおいて、ピクセルレベルの最大F1スコアで4.45ポイント、平均精度で3.79ポイントの向上を達成しています。"]}], ["2026-10-29", "WorldProbe: When Video World Models Fall Apart under Long-Horizon Spatial Exploration", "WorldProbe:ビデオ世界モデルが長期的空間探査の下で崩壊するとき", "", "あり", "動画", "行動", "", "", "", "●", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39721", "summary": ["既存のベンチマークでは、広範なカメラ運動を伴う長距離空間探索におけるビデオ世界モデルの評価が不十分です。", "WorldProbeは、生成中にオンラインのカメラアクションを調整するために目標条件付きマルチモーダルエージェントを使用します。", "WorldProbeは4次元にわたる164件のテストケースを評価し、局所的な指標の劣化と長期的な不整合の出現を明らかにしました。"]}], ["2026-10-29", "NIF: Normal-Intersection Fields for Geometrically Consistent Oriented Box Refinement", "NIF:幾何学的に一貫した向き付けボックス精緻化のための正規交差場", "", "あり", "", "バウンディングボックス", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39715", "summary": ["既存の手法は、予測パラメータの誤差により、向き付けボックス精緻化において幾何学的一貫性を維持できません。", "NIFは法線交差場を用いて、境界アンカーからの外向き法線に沿った符号付き距離を予測することで、向き付けたボックスを精緻化します。", "DOTA-v1.0では、NIFはそれぞれOriented R-CNN、LSKNet-S、Strip R-CNNで78.00%、79.11%、79.02%のmAPに達し、表1で単一スケールのSOTAで最高の結果を達成しました。"]}], ["2026-10-29", "Confidence Filtering in Video-Based Gait Assessment: Measurement Error versus Selection Shift", "ビデオベースの歩行評価における信頼フィルタリング:測定誤差と選択シフトの違い", "", "なし", "医用画像・動画・姿勢", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39704", "summary": ["ビデオベースの歩行評価は、動きの評価に影響を与える選択シフトを導入し、低信頼性の観察を破棄します。", "本論文は、2つのコホートにおける信頼選択とランダム選択を比較し、測定および選択シフトの分解とシミュレーションを行っています。", "信頼フィルタリングは、誤差が信頼度に依存する場合に局所誤差を低減しますが、系統誤差が参加者間で再分布すると0.58度のバイアスが生じる可能性があります。"]}], ["2026-10-29", "DEQ-Stereo: Deep Euilibrium Video Stereo Matching via Adaptive Convergence", "DEQ-ステレオ:適応収束によるディープ・ユーリブリウムビデオステレオマッチング", "", "なし", "動画・姿勢", "位置・対応関係", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39701", "summary": ["反復的洗練モデルは高い計算コストと、動画ストリームにおける速度と精度の厳格なトレードオフに直面します。", "DEQ-Stereoは、収束が達成されるとDeep Equilibriumパラダイムを用いて、ConvSGUとTSTを用いて高速収束とクロスフレームコヒーレンスを実現しています。", "DEQ-Stereoは、精度とレイテンシの優れたトレードオフで最先端の性能を実現しています。"]}], ["2026-10-29", "Event-SAMA: Language-Grounded Video Object Segmentation on Neuromorphic Event Streams", "Event-SAMA:ニューロモルフィックイベントストリーム上の言語基盤ビデオオブジェクトセグメンテーション", "", "なし", "画像", "イベントカメラ・マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39676", "summary": ["参照ビデオオブジェクトセグメンテーションにはイベントストリームデータセットやモデルが欠けています。", "Event-SAMA-239Kは、SAMA-239Kコーパスや追加データを、光学フロー、FILM、またはサケードアップサンプリングによるイベントストリームに変換します。", "イベント-SAMAはMeViS valid_uで24.37 $\\boldsymbol{\\text{J}}\\boldsymbol{\\text{&}}\\boldsymbol{\\text{F}}$、ReVOS有効部分セットで22.33 $\\boldsymbol{\\text{J}}\\boldsymbol{\\text{F}}$を達成しました。"]}], ["2026-10-29", "EditAgent: Rethinking Agentic Image Editing", "EditAgent:エージェント画像編集の再考", "Adobe", "なし", "画像・テキスト", "画像・テキスト", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39664", "summary": ["既存のエージェント画像編集者は40%以上のケースで有用な結果を出せず、編集タイプごとに信頼性の低い審査員がいます。", "EditAgentは、ステップを一般的な方法や特殊な方法にルーティングし、検証レコードを候補者に添付することにより、アクションと観測スペースを拡張します。", "EditAgentは2つのオープンウェイトエディターを3つのベンチマークで改善し、審査員の判定を半分以上削減します。"]}], ["2026-10-29", "AB-Attention: Accurate Block Attention for Accelerating Video Diffusion Transformers", "AB-注意:加速するビデオ拡散トランスのための正確なブロック注意", "", "あり", "動画・テキスト", "動画", "", "", "", "●", "", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39663", "summary": ["ビデオ拡散トランスは、推論中に3D完全な注意から二次コストに直面しています。", "AB-Attentionは、ブロック内クラスタリングと包含確率重み付けを用いて、トークンを置換せずに高スパーシティで高密度の注意を近似します。", "AB-注意はベースラインと比べて注意の89%を飛ばし、PSNRを最大4.4~dB向上させ、2.23ドル\\時間ドルの高速化を実現しています。"]}], ["2026-10-29", "Look at Where You Think: Localization-Head Alignment for Fine-Grained Perception in Thinking VLMs", "考える場所を見てください:思考型VLMにおける細かい知覚のためのローカライゼーション・ヘッドアライメント", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39649", "summary": ["思考型VLMは、数千トークンの理由を考えても高解像度画像の細かいディテールを見落とします。", "ローカリゼーション・ヘッドアライメント(LHA)は、推論中に焦点領域に集中するように頭部を合わせることで、注意を訓練信号として機能させます。", "V*、HR-Bench 4K、TreeBenchのベンチマークでは、LHAはQwen3.5-4Bの精度を74.1%から76.6%に向上させ、単一パスの4Bで評価した最高の結果となりました。これはマルチパスズームやリリースされた7Bモデルを上回るものです。"]}], ["2026-10-29", "Annotation-Free Representation Learning for Polyp Retrieval in Colonoscopy Videos", "大腸内視鏡検査におけるポリープ採取のための注釈なし表現学習", "", "あり", "動画", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39648", "summary": ["既存の方法は、大腸内視鏡ビデオでのポリープトラックレット表現に手動注釈に依存しているため、実用性が制限されています。", "本論文は、時間的自己教師あり学習を用いて生の大腸内視鏡ビデオからトラックレット表現を直接学習する注釈なしフレームワークを提案しています。", "この方法は、トラックレットの採取および再識別において自己監督ベースラインおよび監督ベースラインの両方を上回り、少量のポリープ採取においてわずか2例で最先端の結果を達成しています。"]}], ["2026-10-29", "FlexTry-On: A Time-Efficient Framework for Multi-Scenario Virtual Try-on", "FlexTry-On:マルチシナリオ仮想試着のための時間効率の良いフレームワーク", "", "なし", "テキスト", "特徴表現", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39646", "summary": ["既存の方法はシナリオごとに異なり、異なる試着環境ごとに別々の処理が必要です。", "FlexTry-Onは、共通の条件付け戦略と二重条件付き拡散トランスを用いた統一拡散ベースのフレームワークを使用しています。", "このフレームワークは複数のベンチマークで競争力を発揮し、別々のアーキテクチャを使わずに未知のクロスドメインシナリオにも対応します。"]}], ["2026-10-29", "Where Do Vision Language Models Fail at 3D Reasoning?", "視覚言語モデルは3D推論でどこに失敗しているのか?", "", "あり", "画像・テキスト", "テキスト・3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39639", "summary": ["視覚言語モデルは、正確な個別判断にもかかわらず、3Dオブジェクト特性の一貫した使用に苦労しています。", "本論文では、3D推論を評価するための手続き生成タスクを備えたベンチマークであるBedBenchを紹介します。", "BedBenchは、正確な財産回収だけでは一貫した使用を保証できないことを明らかにし、正確さを超えた評価の必要性を強調しています。"]}], ["2026-10-29", "Intrinsic Distribution Matching", "内在分布マッチング", "", "あり", "テキスト", "画像・テキスト", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39633", "summary": ["テキストから画像への生成は、細部を正確にレンダリングし、細部を細かく描写する必要があり、細かい調整の余地は限られています。", "イントリンシック分布マッチングは、外部エンコーダなしで特徴平均と標準偏差を照合するためにジェネレーターのEMAを使用します。", "IDMは中国語と英語のLongText-Benchで2つのネットワーク評価で最高得点を獲得しています。"]}], ["2026-10-29", "FutureWorld: A Plug-and-Play Causal Next-State Predictor for Interactive Video World Exploration", "FutureWorld:インタラクティブなビデオ世界探検のためのプラグアンドプレイの因果関係性次州予測器", "", "あり", "動画", "動画・行動", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39619", "summary": ["履歴ベースの手法は、ぼやけた詳細の保持、幾何学的歪み、生成された潜在的空間における意味的ドリフトにより誤りの再循環を引き起こします。", "本論文は、現在の潜在的および次の行動から未来のシーンの状態を予測し、次のビデオチャンクを生成する前にプラグアンドプレイの因果次チャンク予測器(C-NCP)を提案しています。", "C-NCPは誤差の蓄積を減らし、4つのベースジェネレーターを持つ3つのベンチマークにわたる長期的な一貫性を向上させます。"]}], ["2026-10-29", "UniTele: Learning Device-Conditioned Degradations for Unified Smartphone Telephoto Super-Resolution", "UniTele:統一スマートフォン望遠超解像度のためのデバイス条件による劣化学習", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39617", "summary": ["携帯電話の超望遠イメージングは、複雑な機器依存の劣化を抱えており、従来の手作業パイプラインでは十分に捉えられません。", "本論文では、少数の物理的キャプチャからデバイス固有の劣化を学習し、それらを転送して統一された超解像度モデルの訓練を行うことを提案しています。", "UniTeleの完全なトレーニングレシピは、提示されたベンチマーク上でペア修復の忠実度と知覚類似度を60%向上させます。"]}], ["2026-10-29", "DiFuse: Fusing Native Diffusion Representations for Spatial Reasoning in Unified Multimodal Models", "DiFuse:統一マルチモーダルモデルにおける空間推論のためのネイティブディフュージョン表現の融合", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39609", "summary": ["既存のUMMは視覚的理解と生成の間で非対称な情報フローを持っています。", "DiFuseは中間拡散表現をUMMの理解経路に統合します。", "DiFuseは、一般的なマルチモーダル理解を損なうことなく空間推論を向上させます。"]}], ["2026-10-29", "Evaluating Cultural Knowledge Editing in Vision-Language Models", "ビジョン言語モデルにおける文化知識編集の評価", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39602", "summary": ["VLMは、過小評価地域の文化特有の概念を認識するのに苦労しています", "CulturalBindベンチマークが導入され、VLMにおける文化認識知識編集を評価するために導入されました", "6つのドメインから1K概念の3.2K画像を用いて、クロスモーダル知識と編集を評価します"]}], ["2026-10-29", "GC-LIF: Spiking Group-Equivariant Neural Network With Group-Coupled Membrane Dynamics", "GC-LIF:群結合膜ダイナミクスを持つスパイキング群等変ニューラルネットワーク", "", "なし", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39601", "summary": ["既存のSNNはデータ増強なしには回転不変性を欠いています", "GC-LIFニューロンのパラメータは群軌道に沿って一定となり、群の等変量畳み込み後も同変性を保つためです", "SGE-Netは、エネルギー効率の高いデータセット群ペアのうち9組でSNNを上回る性能を示しています"]}], ["2026-10-29", "Operator-Aware Posterior Sampling for Multivariate Weather Downscaling", "多変量気象ダウンスケーリングのためのオペレーター対応後サンプリング", "", "あり", "", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39592", "summary": ["既存の手法は、異なる再解析システムや可変勾配の大きさに苦戦しています", "ペアデータから順方向演算子を学び、チャンネルごとの勾配を正規化します", "正規化はブロック最大ノルム下で最も急な下降に対応します"]}], ["2026-10-29", "TactoHand: Learning Geometry-Based Dense Hand-Surface Interaction Fields from Video", "TactoHand:動画から学べる幾何学ベースの高密度手表面インタラクションフィールド", "", "あり", "動画", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39585", "summary": ["既存の手法には、触覚データなしで手表面の相互作用フィールドを学習するためのスケーラブルで低コストな方法が不足しています。", "TactoHandは時間変換器と物理レイヤーを用いて、ビデオから接触、接近、3D力場を予測します。", "TactoHandは接触と近接の推定を改善し、動作のロールアウトにおける位置や回転誤差を減らします。"]}], ["2026-10-29", "DOSE: Dominance-Guided Ordinal Severity Estimation from Sparse Relative Annotations", "DOSE:スパース相対注釈からの優性指向順序重症度推定", "", "あり", "医用画像", "マスク・画像", "", "●", "", "●", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39584", "summary": ["既存の手法では、医療重症度等級は順序性に関わらず独立したカテゴリーとして扱われています", "DOSEはグローバル比較グラフを用いて、スパースペアワイズ比較を集約し、優性スコアを推定します", "DOSEは異なるペア予算下の3つのデータセットでペアワイズランキングベースラインを上回る性能を発揮しています"]}], ["2026-10-29", "BEACON: Distilled Begin/End-Aware Structured Decoding for Continuous Sign Language Segmentation", "ビーコン:連続手話セグメンテーションのための蒸留開始/終了認識構造化復号", "", "なし", "動画", "ラベル・マスク", "", "●", "", "", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39553", "summary": ["既存のセグメンタは、語彙セグメントの品質や下流認識よりも局所的な境界検出に重点を置いています。", "BEACONはBIOEラベリング、制約付きビタービデコード、教師モデルから抽出された境界知識を使用しています。", "BEACONはセグメントF1を14.58/14.59ポイント改善し、下流のWER(下流のWER)を9.10/4.15ポイント削減します。"]}], ["2026-10-29", "Comprehensive empirical evaluation of feature extractors in computer vision", "コンピュータビジョンにおける特徴抽出器の包括的な実証的評価", "", "なし", "画像・姿勢", "バウンディングボックス", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39551", "summary": ["既存の研究では、さまざまな変換下で特徴抽出器の包括的な評価が不足しています。", "本論文は、大規模なデータセット上で複数の特徴抽出器を評価し、異なる条件下での効率性と堅牢性を評価しています。", "この研究は、FASTとORBの組み合わせが最も効率的な特徴抽出とマッチングを評価し、AKAZEが困難な状況下で有効であることを強調しています。"]}], ["2026-10-29", "ROAD: Modern Adversarial Training for Simple One-Step Distillation at Scale", "ROAD:大規模での単純なワンステップ蒸留のための現代的な対抗訓練", "", "なし", "テキスト", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39539", "summary": ["既存の対抗的蒸留は、長い視野の劣化により現代のテキストから画像へのスケールに苦労しています。", "ROADは、Lipschitz制御のトランスフォーマーヘッド、周期的ランダム特徴量再描画、ヤコビアンR1を用いた1段階フレームワークを用いて、1つの敵対的な目的を持つテキスト画像モデルを抽出します。", "ROADはSDXLで11.03 FID、SD3.5-Mで13.73を単一の対立目標で達成し、マルチステップ教師を計算量のごく一部で上回ります。"]}], ["2026-10-29", "MOSAIC-Flow: Orthogonal-Axis and Status-Conditioned Fusion for Missing-Sequence Completion in Brain Tumor MRI", "MOSAICフロー:脳腫瘍MRIにおける欠損配列補完のための直交軸および状態条件融合", "", "あり", "3D データ", "3D データ", "", "", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39534", "summary": ["脳腫瘍MRIでの配列補全は、配列特異的コントラストをぼやけ、細かい三次元腫瘍の詳細を失うことがあります。", "MOSAIC-Flowは、モダリティ認識型ステム、直交軸の精緻化、状態条件付きプロトタイプ融合を用いて、ヴォクセル間の注意が密なものなしに欠落した配列を補完します。", "このフレームワークは、8つの単一ターゲット完了タスクで一貫した忠実度を実現し、構造配列で最も高い性能を発揮します。"]}], ["2026-10-29", "MorphSIG: Subject-Driven Image Generation via Decoupled Anchoring and Feature Transport", "MorphSIG:デカップルドアンカリングと特徴転送による被写体駆動画像生成", "", "なし", "画像", "動画・画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39530", "summary": ["既存の研究は、画像生成における効果的な被写体の一貫性と動的な伝播に欠けています。", "MorphSIGは、被写体駆動型画像生成を、デカップリングアンカリングと特徴転送を用いて疑似ビデオ特徴転送として再定義します。", "広範な実験により、MorphSIGは追加のトレーニングなしにベースラインに比べてポーズの多様性や被験者の忠実度を大幅に向上させることが示されています。"]}], ["2026-10-29", "BRIDGE: Learning Brain-Gut Metabolic Evidence for Alzheimer's Disease Diagnosis", "BRIDGE:アルツハイマー病診断のための脳腸代謝エビデンスを学ぶ", "", "あり", "", "位置・対応関係", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39520", "summary": ["既存のモデルは脳グルコース代謝のみに焦点を当てており、AD診断における腸内代謝情報の利用は制限されています。", "BRIDGEは、脳から腸への潜在輸送モジュールと疾患エビデンスに基づく脳経路からなる二段階のフレームワークを使用しています。", "BRIDGEは、CN/MCIおよびCN/AD診断において、それぞれ脳のみモデルに対して6.0%と5.2%のAUC向上を達成しています。"]}], ["2026-10-29", "FFAI: Flow Matching with Feedback Training and Adaptive Initialization for CT Reconstruction", "FFAI:CT再構築のためのフィードバックトレーニングと適応的初期化を用いたフローマッチング", "", "なし", "画像", "画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39517", "summary": ["低線量、視野が薄く、角度限定のCT再建は、測定情報の限界により課題に直面します。", "フィードバック認識型トレーニングと劣化適応型初期化を備えた統一条件付きフローマッチング手法を提案します。", "この方法は、3つの再構築タスクすべてにおいて比較方法よりも優れた定量的結果を達成しています。"]}], ["2026-10-29", "Robust LIDAR Sensor-to-Sensor Domain Generalization via Accumulated-Point Scene Completion", "累積点シーン補完による堅牢なLIDARセンサー間ドメインの一般化", "", "なし", "LiDAR", "マスク", "", "●", "", "", "", "●", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39516", "summary": ["既存の手法はLIDARデータのセンサー特有のサンプリングパターンに苦労しており、データセット間の転送を妨げています。", "本論文は、データに事前アクセスせずに新しいセンサーで動作するモデルを訓練する、占有予測補助目的を持つソースのみの訓練スキームを提案しています。", "この手法は、明示的なドメイン適応や予測の洗練を伴わずに、新しいドメインへの大幅な汎用を実現しつつ、競争力のあるソースドメイン性能を維持します。"]}], ["2026-10-29", "Agent-Wise Test-Time Normalization for Camera-Based Cooperative Perception with Corrupted Collaborators", "カメラベースの協調的知覚におけるエージェント間のテスト時間正規化", "", "なし", "動画・画像", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39505", "summary": ["既存の手法は、共同研究者のカメラが破損すると失敗し、共有特徴がトレーニング配布から逸脱し、協力が悪化します。", "AgentNormは、エージェントごとにテストタイム正規化を用いて各エージェントの観察から統計を推定し、エゴをその元の統計に固定します。", "AgentNormは霧下でAP@0.5ポイントを5.53〜12.94ポイント改善し、霧の重症度5の結果を29.42〜37.25から43.32〜58.86に引き上げました。"]}], ["2026-10-29", "Does Federated Training Degrade Explainability? A Comparative Analysis of Grad-CAM Faithfulness in Centralized vs. Federated Deepfake Detection", "連邦訓練は説明可能性を低下させるのか?中央集権型と連邦型ディープフェイク検出における大学院生CAMの忠実度の比較分析", "", "あり", "", "バウンディングボックス・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39483", "summary": ["連邦訓練は説明の信頼性を損なう可能性があり、ディープフェイク検出におけるプライバシーや透明性の要件と矛盾します。", "EfficientNet-B4を用いてFaceForensics++で5つのクライアントを対象に、フェデレーテッド検出と集中型ディープフェイク検出におけるGrad-CAMの忠実度を評価しました。", "連邦モデルは中程度の異質性で中央集権的忠実度に一致するかそれ以上に見られますが、極端な異質性では説明が破綻します。"]}], ["2026-10-29", "Regional Anchor Routing for Multi-Object Motion Transfer", "複数オブジェクトのモーション転送のための地域アンカールーティング", "", "なし", "動画・画像", "画像・動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39478", "summary": ["既存の手法では、異なる基準運動を正しい対象オブジェクトに確実に割り当てることに苦労し、繰り返しの転送で非効率化が難しくなります。", "RARTは、オブジェクトごとのモーション抽出、ターゲット領域のアンカリング、フレームアライメントインジェクションを凍結されたビデオ拡散トランスフォーマーに統合します。", "RARTは、動画ごとの最適化なしに新しい参照-ターゲットの組み合わせを扱い、正確なモーション保存と効率的な推論を実現します。"]}], ["2026-10-29", "Calibrating Attention-Based Token Pruning for Efficient Multi-Image Synthesis in UMMs", "UMMにおける効率的な多画像合成のための注意ベースのトークン剪定の校正", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39467", "summary": ["既存のUMMのトークン剪定手法は、参照画像探索の不足、条件付きガイダンスの混乱、プーリングによる曖昧さに悩まされています。", "CATPは、ガイダンス一貫性剪定およびテイラー校正注意メトリクスを通じて注意ベースのトークン剪定をキャリブレーションする、トレーニング不要のコンテキスト圧縮手法を提案します。", "代表的なUMMやベンチマークを横断した広範な実験により、CATPは最先端のトークン削減手法を常に上回り、最大2.09ドル×1倍の注意コア速度向上を実現していることが示されています。"]}], ["2026-10-29", "PathCowork: Learning from real-world pathology practice to build AI copilots", "PathCowork:実際の病理学の実践から学ぶことでAIコパイロットを構築する", "", "なし", "医用画像", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39441", "summary": ["既存の医療AIは病理医の証拠解釈から学ぶことができず、録音された回答だけに注目しています。", "PathCoworkは、同期した視線、ナレーション、ナビゲーションを用いて、病理医のセッションから視覚的なグラウンド化や診断手順を監督しています。", "PathCowork-1TとPathCowork-27Bは、それぞれClaude CodeとCodexより17.9ポイントと24.1ポイント高いスコアを獲得しました。"]}], ["2026-10-29", "FDSML: Formula-Driven Supervised Metric Learning with Parameter-Aware Triplet Loss", "FDSML:パラメータ認識トリプレット損失を用いた数式駆動型教師あり計量学習", "", "なし", "画像", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39423", "summary": ["既存の手法では、前学習に離散化されたラベルを使用することで生成プロセスの連続性を排除しています。", "FDSMLはパラメータ認識トリプレット損失を用いて、離散クラスラベルを超えた画像生成パラメータからリレーショナル監督を導出します。", "FDSMLはスタンフォードオンラインプロダクトで65.6%から74.0%に、スタンフォードカーズではFDSL事前訓練で56.2%から78.4%にRecall@1改善しました。"]}], ["2026-10-29", "Diagnosing the Reference Gap: What Visual Scaffolds Can and Cannot Fix in Multimodal Reasoning", "参照ギャップの診断:マルチモーダル推論において視覚的足場が修正できるものとできないもの", "Alibaba", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39419", "summary": ["マルチモーダルモデルは、視覚的枠組みだけでは解決できない参照ギャップのため、視覚コンテンツに関する信頼できる推論に苦労します。", "本論文は、課題にマッチした参照と誤った参照が視覚的推論の正確性に与える影響を検証するベンチマークであるReGap-Benchを提案しています。", "タスクマッチング参照は最大25%の精度向上をもたらし、参照ギャップが視覚知覚とは異なるボトルネックであることを示しています。"]}], ["2026-10-29", "Decoding Geometry, Not Tokens: Efficient VLMs for Robot Affordance and Trajectory Prediction", "トークンではなく幾何学のデコーディング:ロボットのアフォーダンスと軌道予測のための効率的なVLM", "", "なし", "テキスト・画像", "テキスト・軌跡・深度", "", "", "", "●", "●", "", "", "", "●", "", "●", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39416", "summary": ["既存のVLMは空間座標予測を言語生成とみなしており、そのため幾何学の誤差やロボット作業の効率低下を引き起こしています。", "軽量予測ヘッドが凍結されたバックボーンに追加され、視覚トークンのクロスアテンションを用いてアフォーダンスボックスや軌道ウェイポイントを連続値として直接回帰します。", "2Bパラメータのバリアントは軌道誤差を60%以上削減し、自己回帰ベースラインと比較してアフォーダンスmAPを85%改善します。"]}], ["2026-10-29", "Anatomical Prior-Guided Routing for 3D Lung Tumor Segmentation", "3次元肺腫瘍断片のための解剖学的事前誘導ルーティング", "", "なし", "医用画像", "マスク・医用画像", "", "●", "", "", "", "●", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39414", "summary": ["3次元肺腫瘍の断片化は、腫瘍が体積のごく一部を占め、解剖学的部位ごとに異様な外観を示すため、困難です。", "解剖学的事前誘導ルーティングモジュール(APRM)は、解剖学的な事前情報を用いてルーティングゲートを選択し、共有のエキスパートアダプタープール上でスパース特徴ルーティングを実行します。", "APRMは、異なるバックボーンネットワークを持つ2つのデータセットにおいて、ベースラインモデルに対して一貫した改善を示しています。"]}], ["2026-10-29", "YOLOF-MLD: A Multi-Level Distillation Framework for Efficient Object Detection", "YOLOF-MLD:効率的な物体検出のための多層蒸留フレームワーク", "", "あり", "", "バウンディングボックス", "●", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39408", "summary": ["YOLO26のような軽量フレームワークはパラメータ密度の高いFPNに依存しているため、軽量化の利点が制限されています。", "YOLOF-MLDはYOLO26nバックボーン、SiSoネック、多層蒸留技術を用いて異なるレベルでの特徴を整列させます。", "YOLOF-MLDはRaspberry Pi 5でYOLO26nのパラメータを35.7%削減し、62.3%の高速化を実現します。"]}], ["2026-10-29", "SymKL: A Unified Representation-Space Measure of Signal Degradation", "SymKL:信号劣化の統一表現空間測定", "", "公開予定", "画像・音声・3D データ", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39403", "summary": ["既存のフルリファレンス信号劣化測定はモダリティ特有のものです", "SymKLは暗黙の神経表現を用いて、純粋な信号と劣化信号のフィッシャー情報プロファイル間の対称KL発散を計算します", "SymKLは、破損プロセスの知識を必要とせずに、統一されたモダリティに依存しない劣化測定を提供します"]}], ["2026-10-29", "ACD-GS: Asymmetric Curvature-aware Densification for 3D Gaussian Splatting", "ACD-GS:3Dガウススプラッティングのための非対称曲率認識密度化", "", "あり", "3D ガウス・深度・多視点画像", "3D データ", "", "", "", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39399", "summary": ["3DGSの訓練時間密度化はヒューリスティックであり、冗長なガウス分布や不正確な幾何学を生み出します。", "ACD-GSは密度制御とクローニング/スプリットの非対称調整に二次深度応答を使用します。", "ACD-GSはレンダリングの忠実度を維持しつつ、ガウス数と記憶容量を60%削減します。"]}], ["2026-10-29", "CASE: Concept-Aware Segmentation from Positive and Negative Visual Exemplars", "ケース:肯定的・否定的な視覚的例からの概念認識的セグメンテーション", "", "あり", "画像・テキスト", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39396", "summary": ["既存の少数ショット分割は肯定的な例に依存していますが、正確な除外のために否定例が必要な曖昧なケースを扱うことに失敗しています。", "CASEはポジティブとネガティブのビジュアルエグランプラーを用いてターゲットコンセプトを定義し、CPAは両方のタイプのプロンプトをより良く解釈できるようにモデルを適応させています。", "CASEはSAM 3を評価し、CPAを用いてネガティブプロンプト処理を改善し、除外および曖昧さ解消タスクでより良いパフォーマンスを達成します。"]}], ["2026-10-29", "Semantic Mismapping in Generalized Category Discovery: Evaluation and Mitigation", "一般化カテゴリー発見における意味的誤写像:評価と緩和", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39356", "summary": ["既存の手法ではグローバルマッチングが適用されており、これによりアンカーされた旧インデックスを他のカテゴリに再割り当てし、予測誤差を隠すことができます。", "セマンティクス保存評価（ＳＰＥ）とミスマップ緩和最適化（ＭＭＯ）を提案し，セマンティクスを保存し，予測誤差を低減した。", "本手法は、新カテゴリの精度に対する意味的誤写す誤写による過大評価を最大25.63ポイント削減します。"]}], ["2026-10-29", "PicturePerfect: Diffusion-based Same-identity Facial Replacement", "PicturePerfect:拡散ベースの同一身元顔置換術", "Qualcomm", "なし", "テキスト・画像", "画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39344", "summary": ["既存の手法では、写真における同一身分の顔置換に効果的な解決策がありません。", "写真の顔を置き換えるために、事前学習済みのテキストから画像へのモデルを用いた拡散ベースの手法です。", "私たちのアプローチは、既存の顔再現モデルよりも現実的で一貫性のある結果をもたらします。"]}], ["2026-10-29", "Telling Is Not Seeing: Textual Personas Rarely Make Vision-Language Models Answer Like the People They Describe", "語ることは見ることではない:テキストペルソナは、視覚言語モデルが説明する人々のように答えることは稀です", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39331", "summary": ["既存の研究では、ペルソナがVLMに彼らが記述したような回答を確実にすることはできていません。", "この論文は、ペルソナの記述した事実のみを用いて、実際の人物や簡単なルールとペルソナの回答を比較しています。", "ペルソナは単純なルールを上回ることはなく、14モデルの認知度にも影響しません。"]}], ["2026-10-29", "Can Image Agents Complete Visual Commissions? A Benchmark and Modular Framework", "イメージエージェントはビジュアルコミッションを完了できるのか?ベンチマークとモジュラーフレームワーク", "", "なし", "画像", "データセット・評価", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39330", "summary": ["既存の評価は特定の能力に焦点を当てていますが、エンドツーエンドの委託完了についての理解が不足しています。", "VCBは5,039件の要件チェックと個別のビジュアル品質評価を用いて、内部ワークフローを規定することなく、コンテンツの正確性、視覚的実現、制約の保持、納品の完全性を評価しています。", "V-ProtocolはVCB上で69.0%の厳密タスク成功率を達成しており、SCOPEの42.0%を上回っています。"]}], ["2026-10-29", "MRC-MMAgent: Reinforcement Learning for Multi-Role Collaboration in Multimodal Tool-Using Agents", "MRC-MMAgent:マルチモーダルツール使用エージェントにおけるマルチロールコラボレーションのための強化学習", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39324", "summary": ["既存の強化学習パイプラインは、単一役割エージェントにエンドポイント報酬を用いて検索と回答を訓練し、人間の検査、再定式化、検索中の修正を無視します。", "MRC-MMAgentは、キャリア評価、継続、役割連結学習目標をエージェントループに統合する多役割の協働フレームワークを提案します。", "この手法はベースモデルを上回り、元のベースライントレーニングセットのみを用いてベンチマーク全体で優れたパフォーマンスを達成します。"]}], ["2026-10-29", "MemoryFusion: Cross-Temporal Memory Learning for Multimodal Video Fusion", "MemoryFusion:マルチモーダルビデオフュージョンのためのクロスタイムメモリー学習", "", "あり", "動画", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39322", "summary": ["既存の手法は短距離時間的相互作用に焦点を当てており、長期的な情報を無視し、ちらつくアーティファクトを引き起こしています。", "MemoryFusionは、短期記憶と長期記憶バンクとフュージョンのための時間平滑化モジュールを備えた2段階フレームワークを使用しています。", "MemoryFusionは、フレームベースやビデオベースの手法と比べて、優れたフュージョン品質と時間的一貫性を実現しています。"]}], ["2026-10-29", "Unlimited OCR Works 2", "無制限OCRワークス2", "", "なし", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39308", "summary": ["長い文書解析は、文書の長さに伴う計算コストの増加によりスケーラビリティの問題に直面します。", "Unlimited OCR 2は、Sparse Reference、Sliding Window Attention、Unlimited-Horizon Decoding Paradigmを用いて文書を効率的に解析します。", "100ページのスケールで、Unlimited OCR 2はFull AttentionとR-SWAに比べてそれぞれステップあたり7.0$\\times$と5.6$\\times$の高速化を実現しています。"]}], ["2026-10-29", "CAD-WAM: Anticipating Geometry for Text-to-CAD Generation", "CAD-WAM:テキストからCAD生成へのジオメトリの予測", "", "あり", "テキスト", "行動", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39306", "summary": ["既存のLLMに基づく手法には、多段階のテキストからCAD生成への明示的な幾何学的監督が欠けています。", "CAD-WAMは、事前に学習済み変分自動エンコーダとLLMバックボーンを用いて、幾何学条件付けアクション生成と次の状態予測を組み合わせます。", "次一状態の監督は、動作の予測のみを目的に訓練されたモデルと比べて、平均面取り距離を13.2%削減します。"]}], ["2026-10-29", "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "JEPAを用いたプラトン表現仮説の証明と改善", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39302", "summary": ["既存の研究では、マルチモーダルモデルがスケールするにつれて同じ表現に収束すると推測するプラトン表現仮説の証明やレシピが不足しています。", "この論文は、JEPAに対してプラトン表現定理を証明し、特定の条件下で同じ表現を1回転まで学習できることを示し、大規模な実験でこれを検証しています。", "JEPAは次のトークン予測の42分の1のサンプル数で同じアライメントに到達し、109MパラメータのテキストJEPAは72Bパラメータまでの言語モデルよりも画像エンコーダとの整合性が優れています。"]}], ["2026-10-29", "Youtu-Parsing-Omni: One Encoder, One Schema, All Modalities", "Youtu-Parsing-Omni:ワンエンコーダ、ワンスキーマ、すべてのモダリティ", "", "あり", "テキスト", "動画・画像・音声", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39301", "summary": ["既存のオムニモーダルパーサーは、複数のモダリティ間で統一された空間・時間的グラウンディングやクロスモーダル融合を欠いています。", "Youtu-Parsing-Omniは、各モダリティごとに1つのエンコーダ、各タスクに1つのスキーマを使用し、統一された時空座標系とクロスモーダル融合レイヤーを備えています。", "単一の5Bパラメータチェックポイントで2つのベンチマークで最先端の性能を達成しています。"]}], ["2026-10-29", "Unlocking Any-Order Generation in Pretrained Autoregressive Image Models", "事前学習済み自己回帰画像モデルにおける任意の順序生成の解放", "", "あり", "画像", "画像", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39293", "summary": ["自己回帰画像ジェネレーターは固定されたラスタスキャン順序訓練のため柔軟性がなく、推論時にインペイント、アウトペイント、編集を行う能力が制限されます。", "本論文は、将来認識型位置埋め込みと順序カリキュラムを用いて、事前学習済みのラスタスキャンARモデルを任意の順序生成器に適応させることを提案しています。", "この手法はImageNetのインペインテインティングでMaskGITを上回る性能(FID 6.21対10.44)であり、MAR-Lと競合し、事前学習以上の計算能力が13〜33%増加します。"]}], ["2026-10-29", "PriorMaskMap: Robust Online Vectorized Map Construction with Biased Priors", "PriorMaskMap:バイアスプリアーを用いた堅牢なオンラインベクトル化マップ構築", "", "あり", "テキスト", "マスク", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39283", "summary": ["既存の手法は、古い情報や一時的な道路変更によりバイアスされた事前処理に失敗し、性能低下を引き起こしています。", "PriorMaskMapは、事前認識信頼推定器(PRIA)を用いてマップの信頼性を評価し、事前分布のフィルタリングとマスクの精査に2つの分岐を導きます。", "PriorMaskMapは、nuScenesデータセット上の既存の手法と比較して、優れたマッピング精度と堅牢性を実現しています。"]}], ["2026-10-29", "WorldFlow: Joint Video and 3D Motion Prediction via Large-Scale Pretraining", "WorldFlow:大規模事前訓練によるジョイントビデオおよび3Dモーション予測", "", "あり", "動画・テキスト", "動画・テキスト・軌跡", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39278", "summary": ["既存のビデオ世界モデルは3Dダイナミクスを明示的にモデル化できず、3Dの動きを予測する能力にも限界があります。", "WorldFlowは生成型世界モデルを用い、Mixture-of-Transformersのバックボーンと整流型の目標を用いて将来のビデオおよび3D軌道を共同で予測します。", "WorldFlowは、最強の外部ベースラインと比較してSpatialCogセットでADEを54.2%削減しています。"]}], ["2026-10-29", "Efficient Covariance-Aware Vicinal Latent Diffusion for Continuous Conditional Image Generation", "連続条件付き画像生成のための効率的な共分散認識のビシナル潜在拡散", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39277", "summary": ["既存の連続拡散モデルは、不均衡かつ長尾ラベル分布の下でデータの疎少性に直面し、視覚的なアーティファクトや条件の不整合を引き起こします。", "CAViLDは、密度適応型近傍学習、補助意味正則化、NIQEガイド付きネガティブデータ拡張を用いて、純粋化された状態認識型潜在空間を構築します。", "CAViLDは、ラベル依存の確率フローODEに対して共分散認識の段階的蒸留を用いて、4つのNFEまでのサンプリングをサポートしています。"]}], ["2026-10-29", "DeCoRL: Decomposed Consistency Reinforcement Learning for Multi-Image Composition", "DeCoRL:マルチイメージ合成のための分解整合性強化学習", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39265", "summary": ["複数画像の構図の一貫性は、参照画像の増加とともに劣化します", "DeCoRLは、RLとVLMベースの報酬モデルを用いて一貫性をオブジェクトレベルに分解します", "DeCo-Benchで2〜6枚の参照画像間でMICoの整合性を向上させる"]}], ["2026-10-29", "Seeing and Imagining as One: Unified Video Generation and 4D Perception for Embodied World Modeling", "一体として見て想像する:身体化された世界モデリングのための統一映像生成と4D知覚", "", "なし", "動画", "動画・マスク", "", "●", "", "●", "●", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39232", "summary": ["既存の研究は映像生成と知覚を分離しており、統一された身体化された世界モデリングを制限しています。", "GenSightは、単一の事前学習済みビデオ拡散トランスを用いて、共有された時空表現とタスク変調を用いて、ビデオ生成と高密度知覚を統合します。", "GenSightは単一のモデルで統一された4D知覚と映像生成を実現し、クロスモーダルの整合性と性能を向上させます。"]}], ["2026-10-29", "Fast rigid rotational alignment of voxelized 3-D density maps in sliced Wasserstein distance", "スライスされたワッサーシュタイン距離におけるボクセル化された3次元密度マップの高速剛体回転整列", "", "なし", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39214", "summary": ["既存の3次元密度マップの剛体整列手法は遅く、最適な輸送とは互換性がありません。", "本論文は、SO(3)上でスライスされた最適輸送を用いて3次元密度マップを1次元分位関数に変換する高速手法を提案しています。", "この手法は、既存のボクセルベースのアルゴリズムと互換性のあるスライス2-ワッサーシュタイン距離を用いて堅牢なアライメントを実現します。"]}], ["2026-10-29", "COGS: A Diagnostic Benchmark for Attribute-Aware Object-Level 3D Gaussian Splatting Perception", "COGS:属性認識型オブジェクトレベル3Dガウススプラッティング知覚の診断ベンチマーク", "", "あり", "3D ガウス", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39201", "summary": ["現在の3DGSアーキテクチャは、体系的な分析が不足しているため、属性の使用解釈に苦労しています", "COGSは、15,675点のアーティファクトフィルタリングされ外観が豊富なオブジェクトを含む大規模な3DGSデータセットを導入します", "COGS-Benchは、ガウス属性がアーキテクチャ間で一様に有益ではないことを示しています"]}], ["2026-10-29", "Multi-level Constrained Learning for Underwater Image Enhancement", "水中画像強調のための多層制約学習", "", "あり", "画像", "画像", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39183", "summary": ["水中画像強調は、カラーマッピング、詳細補正の強度、劣化した観測との整合性の指定に制限があります。", "MCL-UIEは、MCT、UGWR、RADRとのペアド・スーパーバイズド・フレームワークを用いて、修復作業と訓練目標を制約しています。", "MCL-UIEは16件のフルリファレンスデータセットとメトリクス比較のうち13件で1位にランクされ、参照なしベンチマークでも競争力のある視覚的結果を生み出しています。"]}], ["2026-10-29", "EmbodiExp: Compositional Experience Transfer for Embodied Agents", "EmbodiExp:具現化されたエージェントのための構成経験移行", "", "なし", "", "行動", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39180", "summary": ["課題間での経験を移転することは依然として困難であり、これまで効果的だった戦略が現状に適用できなかったり、意図した成果を生み出せなかったりすることがあります。", "EmbodiExpは、サブ目標、適用条件、適応可能な方針、検証可能な成果を指定した成果に基づくサブゴール体験を用いて、タスク実行中に移転可能な経験を構築し、オンラインで構成します。", "複数のエボディドベンチマークをフォールドベースプロトコルと凍結した経験バンクの実験では、EmbodiExpの有効性が示されました。"]}], ["2026-10-29", "Edited Endpoints as Partial Goals for Image-to-Video Generation", "画像から映像生成への部分目標としての編集済みエンドポイント", "", "あり", "画像", "動画・画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39179", "summary": ["編集されたエンドポイントは、画像から映像生成のフルフレームコンディショニングに使用される際に時間的なアーティファクトを引き起こすことがあります。", "論文は部分的(Partial)という条件付けスキームを提案しており、これは画像編集者の注意から推定された編集関連領域のみを制約します。", "TC-Bench-I2Vの3つのバックボーンにおける部分的なアーティファクトは、フルフレームコンディショニングと比較して軽減されます。"]}], ["2026-10-29", "EgoContact: Evaluating Physical Intelligence with Egocentric Video", "EgoContact:自己中心的なビデオで身体知能を評価する", "Microsoft", "なし", "イベントカメラ・動画", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39167", "summary": ["自己中心的なビデオは、接触点予測と物体の局在化の評価に制限があるため、物理知能の検証ツールとしては十分に活用されていません。", "EgoContactは、接触前の観察、意味的意図、ピクセル単位の接触位置を含む22,500件の手動検証された相互作用イベントを含む大規模なデータセットです。", "EgoContactをメモリーバンクとして使うことで、シミュレーションでの掴み成功率は14.2%から31.2%に、実際のロボットでは16%から58%に向上します。"]}], ["2026-10-29", "A Novel Approach to Evaluating Evaluation Metrics for Multi-Output Structured Prediction", "マルチアウトプット構造化予測の評価指標を評価する新しいアプローチ", "", "なし", "画像", "ラベル", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39162", "summary": ["マルチアウトプット構造化予測タスクは、トレーニングデータに複数の有効な出力が存在するため、信頼性評価に課題があります", "拡張損失関数を用いた指標を評価する診断ツールとして、タスク固有の近似不変量を導入します", "増加損失を伴う不変量を強制すると、分布指標が大幅に改善されます"]}], ["2026-10-29", "Joint Rigid Alignment and Morphable Reconstruction from Partial 3D Face Scans", "部分3D顔スキャンからの関節剛性アライメントとモーファブル再構成", "", "公開予定", "点群・姿勢", "姿勢・点群", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39161", "summary": ["既存の手法では、3D顔スキャンにおける剛体姿勢推定と形状補完が分離されており、結果は最適とは言えません。", "単一のネットワークは、クロスアティショナル回帰器およびトランスフォーマー点特徴を用いて剛体姿勢および形状完全点群を予測します。", "この方法は頂点あたりの誤差でベースラインを3〜4倍上回り、ヘッドアライメントの1桁の改善を実現しています。"]}], ["2026-10-29", "CLaW: Codec-Guided Adaptive Latent Watermarking for Traceable Diffusion Image Generation", "CLaW:トレーサブル拡散画像生成のためのコーデック誘導適応型潜在ウォーターマーキング", "", "なし", "テキスト・画像", "画像", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39160", "summary": ["既存の透かし手法は、スケーラビリティ、コスト、効果と忠実度のトレードオフ、そして画像変換に対する堅牢性に苦労しています。", "CLaWは事前学習済みのウォーターマークコーデックを用いてメッセージを潜在残差にマッピングし、デコーダ誘導による適応キャリブレーションで遅延ノイズ除去ウィンドウに注入します。", "CLaWは画像変換において最先端の堅牢性を実現しつつ、高い視覚的忠実さを保ちます。"]}], ["2026-10-29", "VEvo-Harness: Causally-Guarded Self-Evolving Harness for Agentic Image Generation", "VEvoハーネス:エージェンティックイメージ生成のための因果的にガードされた自己進化型ハーネス", "Alibaba", "なし", "画像・テキスト", "画像・テキスト", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39158", "summary": ["既存のエージェント生成パイプラインは、浅い生成・検証・書き換えループや因果ガバナンスの欠如により、過密なユーザー仕様を満たせません。", "VEvo-Harnessは、視覚的トレースバック、継続的ガバナンス、ライフサイクル管理型ハーネス状態、そして因果的に守られた自己進化型ビジュアル生成を可能にする異種サンドボックスポリシーの4つの革新を導入しています。", "VEvo-Harnessは最先端のエージェント手法を凌駕し、GPT-ImageやNano-Proといった独自のジェネレーターに匹敵します。"]}], ["2026-10-29", "STRATA: Reinforcement-driven Active Sampling with Tri-paradigm Adaptation for Efficient 3D Spatial Transcriptomics", "STRATA:三重適応を用いた強化駆動型アクティブサンプリングによる効率的な3D空間トランスクリプトオミクス", "", "あり", "3D データ", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39151", "summary": ["3D体積ST取得は高コストで、AI駆動の手法は精度に制限がある一方、2D方式は密なグリッドサンプリングに依存しているため冗長性やアンダーサンプリングが生じます。", "STRATAは強化学習を用いて情報提供ポイントを選択し、トリトリードム、回帰、層間補補を組み合わせた三つのパターン予測器を用いて、3Dトランスクリプトムマップのスパースな再構築を実現します。", "実験では、特に低予算環境でサンプリング効率と精度が向上していることが示されています。"]}], ["2026-10-29", "Kinematic Causal Attribution: Black-Box Explanations of Motion versus Geometry for 4D Point-Cloud Video Models", "運動学的因果帰属:4D点雲ビデオモデルにおける運動と幾何学のブラックボックス的説明", "", "なし", "LiDAR・深度・動画", "動画", "", "", "", "", "●", "", "", "", "", "●", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39147", "summary": ["既存の手法では、4D点雲ビデオモデルが運動手がかりに依存しているのか、それとも幾何学的な手がかりで分類しているのかを判別できません。", "運動因果帰属(KCA)は、介入演算子を用いてモデル出力をクエリし、動き$\\時間$幾何学的相互作用を分解します。", "KCAは、従来の手法と比較して、3つのモデルで運動と幾何学の重要度の区別においてa-の向上を実現しています。"]}], ["2026-10-29", "LightGenBench: A Benchmark for 3D Emission Generation", "LightGenBench:3D放射生成のベンチマーク", "", "なし", "多視点画像・3D データ", "3D データ・画像・マスク", "", "●", "", "●", "", "●", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39038", "summary": ["既存の手法では、光を反射するが発光しない非発光3Dアセットを生成しています。", "LightGenBenchは、データセットをキュレーションし、3D放射を予測するための四つの方法ファミリを評価し、排出生成のためのベンチマークを導入します。", "スパース・ボクセル法はIoU 0.271で最良の性能を得ますが、課題は未解決のままです。"]}], ["2026-10-29", "The Search for Statistical Indistinguishability Between Real and Fake Images", "本物と偽物の画像の統計的区別不能性の探求", "", "なし", "画像", "画像・ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39014", "summary": ["既存の研究では、本物の画像と偽物の画像の統計的区別がつかないことが証明されていません。", "ディープニューラルネットワークを訓練して本物と偽物の画像を区別し、段階的な抽象化を適用してアーティファクトを除去します。", "256x256の画像を4x4に縮小すると分類器には区別がつきません。偽画像を表示することは、考えるものとは違います。"]}], ["2026-10-29", "Fed-IGTD: A federated learning-based framework for tabular-to-image encoding", "Fed-IGTD:表から画像への符号化のための連合学習ベースのフレームワーク", "", "なし", "画像", "画像", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.39008", "summary": ["タブラーから画像への符号化方法は中央集権的なパラダイムに従い、データの漏洩やプライバシー侵害のリスクがあります。", "Fed-IGTDは、フェデレーテッドラーニングを用いてクライアントが共通の特徴空間を共有し、グローバル相関行列の再構築や特徴量からピクセルへのマッピングのためにローカル統計をアップロードできるようにします。", "DP-FedAvgは、小規模なクライアント層で適度なプライバシー予算では有用性を低下させますが、マッピングから構築段階でのプライバシー保護はパフォーマンスにほとんど影響を与えません。"]}], ["2026-10-29", "AlbumVSR: Identity-Preserving Face Video Super-Resolution from a Personal Photo Album", "AlbumVSR:個人写真アルバムからのアイデンティティ保存顔ビデオ超解像度", "", "なし", "画像", "姿勢・画像", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.39001", "summary": ["既存の方法は、深刻な劣化の下で顔のアイデンティティを保持することができません。", "AlbumVSRは個人の写真アルバムを使って、拡散トランスをアイデンティティの手がかりに条件付けします。", "AlbumVSRはArcFaceの類似性とPSNRdBの類似性をベンチマークで向上させ、大幅な劣化を伴います。"]}], ["2026-10-29", "What do MLLMs know about 'Waldo'? Evaluating Visual Reasoning under Multi-Instance Multi-Object Challenges", "MLLMは『Waldo』について何を知っているのか?マルチインスタンス・マルチオブジェクトチャレンジにおける視覚的推論の評価", "Microsoft", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38957", "summary": ["既存のベンチマークは視覚的な曖昧さがなく、オブジェクトカテゴリごとのインスタンス数も少なくありません", "マルチインスタンス、マルチオブジェクト環境で3,802組の画像クエスチョンペアを持つMIMO-Benchを導入します", "MLLMは既存のベンチマークと比べてMIMO-Benchでの性能が大幅に低下しています"]}], ["2026-10-29", "GradSplat: Gradients Inside the Forward Pass for Feed-Forward 3D Gaussian Splatting", "GradSplat:フィードフォワード3Dガウススプラッティングのためのフォワードパス内部のグラデーション", "", "あり", "画像", "画像", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38951", "summary": ["フィードフォワード3Dガウススプラッティングは、ガウス形状、スケール、回転のために精度に問題があります。", "GradSplatはフォワードパス内でグラデーションステップを用いてターゲットビューなしでガウスを精錬します。", "GradSplatは、6ビューのRealEstate10Kやその他のデータセットで、ファインチューニングなしで最高のPSNRおよびSSIMを実現しています。"]}], ["2026-10-29", "OneScene-Bench: Do Vision-Language Models Integrate Evidence Across Views?", "OneScene-Bench:視覚言語モデルはビューを超えて証拠を統合しますか?", "", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38926", "summary": ["既存のマルチ画像評価では、視覚言語モデルのクロスビュー統合能力を分離することができていません。", "OneScene-Benchは、実際のマルチビューシーンにおける3つの機能を評価する管理されたベンチマークです:ユニークなオブジェクトカウント、クロスビューの整合性、空間推論です。", "補完的な視点ではカウント精度が4.5〜50.0%低下し、完全重複例では45.5〜81.5%が減少しています。"]}], ["2026-10-29", "Beyond Region Memory: Local Point Tracking for Vocal Cord Localization in Video Laryngoscopy", "領域記憶を超えて:ビデオ喉頭鏡下における声帯定位のための局所点追跡", "", "なし", "動画・テキスト", "バウンディングボックス・軌跡・動画", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38830", "summary": ["緊急ビデオ喉頭鏡検査における信頼性の高い声帯位置特定は、急速な組織変形、鏡面突出、器具閉塞のため困難です。", "ローカルポイントトラッキング(LPT)は、シングルフレーム検出器、ローカルポイント伝播、状態なしマスクの精緻化を組み合わせて、ミスフレームを通った点を追跡し、バウンディングボックスを精錬します。", "LPTは両データセットにおいて最高のmAP_50、成功率AUC、欠損率で強力なパフォーマンスを達成し、時間的追跡の堅牢性と境界の厳密性を向上させます。"]}], ["2026-10-29", "Evaluating Visual Realism of AI-Generated Videos with Eye Tracking", "アイトラッキングを用いたAI生成動画の視覚的リアリズムの評価", "", "なし", "動画", "動画・軌跡", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38825", "summary": ["AI生成動画の既存の人間の評価は明示的なフィードバックに依存しており、知覚に関する洞察が欠けています。", "本論文は、AI生成動画の視覚的リアリズムを予測するために眼線追跡データを用いる計算手法「GazeEval」を提案しています。", "GazeEvalは、視線追跡データから視覚リアリズムを予測する確率で71.3%の精度を達成しています。"]}], ["2026-10-29", "A 211K Parameter Foundation Model: Genetic Prompting in Neural Cellular Automata", "211Kパラメータ基礎モデル:神経細胞オートマトンにおける遺伝的促成", "", "なし", "医用画像", "マスク・医用画像", "", "●", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38776", "summary": ["医療画像セグメンテーションは臨床文脈を横断する柔軟性を必要としますが、現行モデルはパラメータ数の多さやインフラ要件により制約を受けています。", "Foundational-NCAは、潜在的なタスク空間上で遺伝的最適化を行うニューラルセルラーオートマトンを用いて、コンパクトなタスクベクトルでの動的適応を可能にします。", "Foundational-NCAは211Kパラメータを達成し、SAMベースのモデルの180分の1の規模でありながら、15の訓練済みタスクと6つの未確認タスクにまたがるタスクの一般化を維持しています。"]}], ["2026-10-29", "RuleForge: Inferring and Instantiating Latent Visual Rules as Executable Programs", "RuleForge:潜在的なビジュアルルールを実行可能プログラムとして推論・インスタンス化する", "", "なし", "", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38737", "summary": ["既存の手法では、視覚的なルール理解と信頼できるルール実装の関係を探ることができません。", "RuleForgeは、視覚的なルール理解とルール条件付き実行ファイル生成を共同で学習する、バックボーンに依存しないフレームワークです。", "RuleForgeは、馴染みのあるルールで選択式の正確さを20.93ポイント、保留されたルール構成で28.42ポイント向上させます。"]}], ["2026-10-29", "inkGround: Benchmarking Fine-grained Visual Grounding Capabilities of Vision-Language Models for Cursive Handwriting in the Wild", "inkGround:野生における筆記体筆跡の視覚言語モデルの細かい視覚グラウンディング能力のベンチマーク", "", "あり", "画像・テキスト", "テキスト・軌跡", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38720", "summary": ["既存の画像-軌道ペアデータセットは管理された条件下で記録されるため、作家のカバレッジや文体の多様性が制限されます。", "inkGroundは、カメラでキャプチャされた筆跡画像と、事前学習済みモデルで生成され人間の評価者によって検証された参照軌跡を組み合わせ、テキスト条件付きポイントグラウンディングでVLMを評価します。", "4つのオープンソースと3つのクローズドソースVLMが共有プロンプトでベンチマークされ、クローズドソースモデルは参照に近い判読可能な軌跡を生成します。"]}], ["2026-10-29", "Geometry Matters in Packed 3D Attention", "幾何学は詰め込まれた3Dの注意において重要です", "", "なし", "テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38694", "summary": ["詰め込まれた3D注意は、シーケンス位置に基づく位置メカニズムにより幾何学的情報を保存できません", "PACK3Dは真のトークングリッド座標に軸方向RoPEを用いて、メモリレイアウトと注意ジオメトリを分離します", "PACK3Dは15構造の共同タスクでのパフォーマンスを向上させ、65kトークンのウィンドウ付き注意遅延に匹敵します"]}], ["2026-10-29", "AskStream: When and What to Ask Proactively under Uncertainty in Streaming Video Understanding", "AskStream:ストリーミング動画理解の不確実性の中で、いつ、何を積極的に尋ねるべきか", "", "なし", "画像・テキスト・動画", "テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38678", "summary": ["既存の積極的パラダイムは完全な情報を前提とし、無限の待ち時間や不確実性下での幻覚を生み出します。", "AskStreamは、動画やユーザーの不確実性の下でいつ何を尋ねるべきかを研究する3つのアクション(待つ、質問、回答)を含むマルチターンベンチマークを導入します。", "このベンチマークはAsk-F1で52.18%の成功率を達成し、不確実性下での積極的な情報探索の限界を浮き彫りにしています。"]}], ["2026-10-28", "Cross-Primitive Consistency in Jev", "Jevにおけるクロスプリミティブ整合性", "", "あり", "テキスト", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38623", "summary": ["既存の研究では、Jevにおけるクロスプリミティブ整合性の体系的な評価が欠けています。", "PrimaConsはクエリの意味論を保持しつつ、クロスプリミティブの整合性を評価する4軸ベンチマークであり、CPRCは一貫性と精度を向上させるために凍結されたバックボーンに接続された残留ネットワークです。", "CPRCはクロスプリミティブの不整合性を58.57%削減し、精度を+2.97%向上させます。"]}], ["2026-10-28", "TRIM: Temporal Run-Time Monitoring of 3D Object Detection via Activation Statistics", "TRIM:活性化統計による3Dオブジェクト検出の時間的実行時監視", "", "なし", "3D データ", "バウンディングボックス", "●", "", "", "", "", "●", "", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38613", "summary": ["既存の3Dオブジェクト検出用ランタイムモニターは各フレームを独立して評価し、閉塞、点のスパーシティ、シーンの複雑さの時間的変化を活用できません。", "TRIMは中間活性化のコンパクトなチャネルごとの統計を用い、時間畳み込みネットワークで短系列を処理して検出器を改変せずに見逃したオブジェクトの故障を検出します。", "時間モニタリングにより、単一フレームモニタリングと比較してAUROCは0.686から0.704に改善され、誤報率は0.818から0.759に減少します。"]}], ["2026-10-28", "V-CAPE: Visual Consistency Assessment for Product Image Editing", "V-CAPE:製品画像編集のための視覚的一貫性評価", "", "なし", "画像・テキスト・3D データ", "画像・テキスト", "", "", "●", "●", "", "", "●", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38611", "summary": ["生成画像編集における視覚的一貫性の検証は、特に大規模に見ては依然として解決されていません。", "V-CAPEは、視覚的な一貫性評価のために注釈付き40,000件の製品画像ペアを用いた大規模なデータセットを導入します。", "視覚言語モデルはAutoQAで65%未満の精度にとどまり、細かな画像編集評価におけるデータセットの課題を浮き彫りにしています。"]}], ["2026-10-28", "Data Scaling Laws in Stereo Matching: From In-domain Fitting to Cross-domain Generalization", "ステレオマッチングにおけるデータスケーリングの法則:ドメイン内フィッティングからクロスドメイン一般化へ", "", "あり", "画像", "位置・対応関係", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38600", "summary": ["ステレオマッチングにおける合成データを用いたモデル性能のスケーリングは十分に探求されていません。", "本論文は、20万サンプルの合成データセットを用いて、ドメイン内およびドメイン横断のデータスケーリング法則を調査しています。", "ドメイン内訓練では、データに対して二つの体制のスケーリング振る舞いが見られ、べき乗則から飽和へと移行します。"]}], ["2026-10-28", "SpectralTF-MAE: A Pre-trained Spectral Foundation Model for Tokamak Fusion Plasma Diagnostics", "SpectralTF-MAE:トカマク融合プラズマ診断のための事前学習済みスペクトル基礎モデル", "", "なし", "医用画像", "3D データ", "", "", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38593", "summary": ["トカマクプラズマ診断における既存の学習ベースのアプローチは、ラベル付きデータに大きく依存しており、タスクごとに特化しています。", "SpectralTF-MAEは、ピーク認識マスキング戦略と共有トランスエンコーダを用いた自己教師ありスペクトル再構成を用いて、移転可能な表現を学習します。", "このモデルは、自己監督型スペクトル前学習を通じて複数の下流タスクで競争性能を達成します。"]}], ["2026-10-28", "RoSAMDepth: Robust Self-supervised Depth Estimation Leveraging Segment Anything Model", "RoSAMDepth:堅牢な自己監督深度推定(Leveraging Segment Anything Model)モデル", "", "あり", "深度", "深度", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38587", "summary": ["既存の手法はオブジェクトレベルの情報を考慮せず、悪条件下での深度のずれやぼやけを引き起こします。", "RoSAMDepthは、SAMのオブジェクトレベルの事前データを3つの側面に統合しています:セグメントガイド表現の対比、適応的な地域外れ値マスキング、そしてオブジェクトレベルの信頼性推定です。", "実験により、RoSAMDepthは複数のデータセットと気象条件において最先端手法を上回る性能を示しています。"]}], ["2026-10-28", "Detecting Fine-Grained Differences between Image Datasets", "画像データセット間の細かい差異の検出", "", "なし", "画像・テキスト", "テキスト・画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38547", "summary": ["既存の手法ではMLLMを使って概念を提案し、画像レベルの埋め込みで選択していますが、これはコストがかかり、画像データセット間の微妙な違いを見落とす可能性があります。", "本論文は、細粒度のパッチ埋め込みを用いて広範なリストから概念を選び、データにより適合するように最適化することを提案しています。", "この方法はMLLM提案をコンセプト選択に置き換えることでコストを削減し、冗長でない概念に焦点を当てることで微妙な違いの検出を改善します。"]}], ["2026-10-28", "From the Superderivative to a Relative-Gradient Edge Operator", "超微分から相対勾配辺演算子への", "", "なし", "画像", "画像", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38530", "summary": ["既存のエッジ検出器は絶対的なグレーレベル差を測定し、グローバル強度の再スケーリング下での不変性を欠いています。", "論文では、超微分から導かれる対数勾配大きさ演算子を提案しており、勾配核と点ごとの割り算による相対変化を測定します。", "演算子はグローバル強度再スケーリングに対して不変であり、ODS、OIS、APメトリクスにおいて標準フィルターを最小限の計算負荷で上回ります。"]}], ["2026-10-28", "Self-Consistency Geometry Injection for Multi-view Consistent Image Generation", "マルチビュー一貫画像生成のための自己整合ジオメトリ注入", "", "あり", "多視点画像", "画像・多視点画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38518", "summary": ["既存の手法は幾何学推論とテクスチャ合成を組み合わせているため、生成は不正確な幾何学予測に弱い。", "RGMVは、複数のジオメトリ予測を生成し、その信頼性を測定し、RGB合成におけるジオメトリ注入を変調するパラメータフリーのSCGおよびRGIモジュールを提案します。", "RGMVは、マルチビュー生成において信頼できるジオメトリの手がかりを保持し、信頼性の低い手がかりを減衰させることで幾何学的品質を向上させます。"]}], ["2026-10-28", "The Power Watershed as a Differentiable Segmentation Layer", "微分可能なセグメンテーション層としてのパワー流域", "", "あり", "画像", "ラベル・マスク・画像", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38516", "summary": ["既存のセグメンテーション手法は、正確な境界定義を欠き、手動の閾値付けによって制限されています。", "パワー・ウォーターシェッド(PW)は、pが無限大に近づくにつれてシードされたランダムウォーカー(RW)の極限として導出される微分可能なセグメンテーション層です。", "WS層は合成データに対して正確な境界分割を実現し、有限p解法でインスタンスF1スコアをベースラインより0.015〜0.020向上させます。"]}], ["2026-10-28", "Similar Scores, Opposite Failures: Human Correction as an Instrument for Video Caption Evaluation", "類似のスコア、反対の失敗:ビデオ字幕評価のための人間の修正手段", "", "なし", "動画・画像・テキスト", "テキスト・動画", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38511", "summary": ["既存の指標では、人間のレビュアーが受け入れる字幕と拒否する字幕を、密度の高い多ウィンドウの動画説明で区別できません。", "この論文は人間の修正と固定失敗分類法を用いて動画キャプションを評価し、注釈者が字幕を編集し、品質管理レビュアーが注釈をチェックしています。", "参考文献の重複指標は受け入れられたキャプションと却下されたキャプションを区別せず、異なるレビューの細分度は有意に異なる結果をもたらします。"]}], ["2026-10-28", "UnMixMamba: Unmixing Guided State Space Subpixel Mapping of Crops from MODIS Time Series", "UnMixMamba:MODIS時系列からのクロップのガイド付き状態空間サブピクセルマッピングのアンミックス", "", "なし", "画像", "画像・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38507", "summary": ["既存の手法はスペクトル時間結合、クラス内のエンドメンバーの変動性、高分解能グリッドでの均一な精緻化に苦労しています。", "UnMixMambaはこれらの課題に対応するためにTSSDの因数分解、$×8ドルのスーパー解像度、Mambaトークン予算を使用しています。", "UnMixMambaは、アルバータ州2015年のデータ上で他の手法よりも高いOA、mIoU、AA、Kappaを達成しています。"]}], ["2026-10-28", "Residual Motion Splatting for Continuous Space-Time Video Super-Resolution", "連続時空ビデオ超高解像度のための残留モーションスプラッティング", "", "なし", "画像・動画", "画像・動画・軌跡", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38499", "summary": ["既存の手法では、融合前にフレームごとのサンプルを再サンプリングするとサブピクセル位置が失われます。", "本論文は、連続軌道を予測し、低解像度の特徴を高解像度グリッドに可視性重み付きでスプラットする残留運動スプラッティング手法を提案しています。", "この方法は、最先端手法よりも1倍速く再構成の忠実度と知覚品質を向上させます。"]}], ["2026-10-28", "Vision-Based Density Estimation for Adaptive Traffic Control", "適応型交通制御のためのビジョンベースの密度推定", "", "なし", "画像", "行動・画像", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38497", "summary": ["カメラベースの交通状態推定は、車両の閉塞や異質な交通流の重複によって制限されます。", "密度推定のためのCNN、時空間予測のためのST3DNet、政策最適化のためのグラフトランスフォーマーMARLを用いたフレームワークです。", "密度推定段階は、インド・ジャイプールのランバーグ4から40枚の注釈付き交差画像で評価され、検証平均絶対誤差(MAE)は3.32ドル/分0.95ドル、平均絶対パーセンテージ誤差(MAPE)は14.5%と報告されました。"]}], ["2026-10-28", "Calibrating Track-Query Updates at Test Time for Multi-Object Tracking", "マルチオブジェクトトラッキングのためのテスト時のトラッククエリ更新のキャリブレーション", "", "なし", "動画・画像・テキスト", "軌跡", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38494", "summary": ["既存のクエリ伝播トラッカーは、視覚的に似たターゲットが重なったり交差したりすると、アイデンティティ関連に苦労します。", "テスト時トラッククエリキャリブレーション(TQC)は、更新コンポーネントから近隣のアクティブトラックに向けて有界補正を用いてトラッカー出力をキャリブレーションします。", "TQCは9つのテスト環境で推論オーバーヘッドを最小限に抑え、平均してHOTAを+0.38向上させます。"]}], ["2026-10-28", "Geometry-Aware Trajectory State Modeling for Few-Shot Action Recognition", "フットショットアクション認識のためのジオメトリ認識軌道状態モデリング", "", "なし", "動画", "ラベル", "", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38482", "summary": ["少ショットアクション認識は、ラベル付き動画が限られたものから識別的な動き動態を必要としますが、既存の軌道ベースの手法では、軌道をサンプル化された視覚特徴の担い手として扱ったり、2次元変位に基づく記述子で動きを要約したりします。", "GeoTRAMは、StateMotionとRelMotionを用いて軌道内状態の進化と状態条件局所的な局所相互作用の秩序ある進化として動作をモデル化し、", "GeoTRAMは動き中心のベンチマークで大きな進歩を達成し、外観重視のベンチマークでは効率のトレードオフという有利な精度で競争力を維持します。"]}], ["2026-10-28", "Automatic Iconographic Annotation of Medieval Illuminations: Comparing Generative Vision-Language Models and Supervised Discriminative Classifiers", "中世の装飾の自動図像学的注釈:生成視覚言語モデルと教師あり判別分類器の比較", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38462", "summary": ["大規模なデジタル化のため、中世写本の自動図像索引作成が必要です。", "注釈タスクにおける生成的視覚言語モデルと教師あり判別分類器の比較。", "SDCはより高い精度と信頼性を実現し、VLMはより良い意味的一般化と分類学的カバレッジを提供します。"]}], ["2026-10-28", "IntReal: A Real-World Dataset and Benchmark for Multimodal Interleaved Generation", "IntReal:マルチモーダルインターリーブ生成の実世界データセットとベンチマーク", "", "なし", "テキスト", "画像・テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38425", "summary": ["マルチモーダルインターリーブ生成は、明確に定義されたタスクや訓練データが不足し、細かい評価プロトコルの欠如により十分に探求されていません。", "IntRealは、実世界のデータセット(IntReal-100K)と、専門家モデルを用いて7つの次元にわたるモデルのパフォーマンスを評価する評価スイートを提案しています。", "広範な実験により、評価スイートは低い指標間冗長性(最大ペアズ絶対スピアマンの$ρ\\leq 0.42$)、人間の判断との高い一致率(83.3%の精度)、そして異なる専門家評価者間の強い一貫性(スピアマンの$ρ>0.9$)によって、私たちの指標の補完性と信頼性を支持しています。"]}], ["2026-10-28", "Structure-retained low-rank adapters for weather synthesis", "天候合成のための構造保持式低ランクアダプター", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "●", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.38413", "summary": ["悪天候などの環境干渉は、屋外シナリオでのコンピュータビジョンモデルの実際の展開を制限します。", "構造保持ローランクアダプター(LoRA)を用いて画像間変換時に構造情報を保持する新しい気象合成フレームワーク。", "私たちの手法は構造を保ちつつ、よりリアリズムを高め、既存の合成手法を改良しています。"]}], ["2026-10-28", "Visually Irrelevant Hallucinations in Medical Vision-Language Models", "医療視覚言語モデルにおける視覚的に無関係な幻覚", "", "なし", "画像・テキスト・医用画像", "医用画像・テキスト・画像", "", "", "", "●", "", "", "", "●", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38389", "summary": ["医療用VLMは、視覚的証拠や矛盾する画像内容なしに臨床的に関連性の高い陳述を生成します。", "CLEARは、視覚領域の解析や手がかりの監査を通じて、フレーズレベルの幻覚リスクを推定するためにモデル非依存の枠組みを用いています。", "CLEARはMIMIC-CXRでAUPRCを85.10%から90.23%に改善させました。"]}], ["2026-10-28", "SparseTokenGS: Gaussian-based Sparse-View CBCT Reconstruction via Reusable Token Pool", "SparseTokenGS:ガウスベースのSparse-View CBCT再構築(Reuseable Token Pool)によるもの", "", "あり", "医用画像・テキスト", "マスク", "", "●", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38360", "summary": ["スパースビューCBCT再構成は、表示数の制限により深刻なアーティファクトを発生させます。", "SparseTokenGSは再利用可能なトークンプールとガウスベースの手法を用いて、スパースビューCBCT再構築を行います。", "3つの公的胸前および歯科データセットにおいて、SparseTokenGSは比較された手法の中で最も高い再構成性能を達成しています。"]}], ["2026-10-28", "Volley3D: Unified 3D Full-Sequence Reconstruction from Monocular Broadcasts", "Volley3D:モノキュラー放送からの統一3D全シーケンス再構築", "", "なし", "深度・3D データ", "3D データ・マスク・軌跡", "", "●", "", "", "", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38358", "summary": ["単一視点のスポーツ中継からの3D再構成は、動くカメラや奥行きの曖昧さのためにポーズが悪い", "単眼放送バレーボール用の物理ベースパイプラインを提案し、補正モジュールとサブトラジェトリーセグメンテーションアーキテクチャを含む", "マルチカメラベンチマークの評価では、我々のアプローチが2D再投影ベースラインと比較して3D空間ドリフトを大幅に低減できることが示されています。"]}], ["2026-10-28", "WeVisCut: The Whole Editing Room in One Agent From Narration to Long-Form Video", "WeVisCut:ナレーションから長編動画まで、編集室全体を一人のエージェントにまとめています", "", "なし", "動画", "動画", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38352", "summary": ["既存のエージェント編集者は、一般的なモデルに基づく多段階ワークフローを使用しており、コンパクトでタスクに適したポリシーの品質とコストのトレードオフが不明瞭です。", "WeVisCutはツール実行とポリシー学習を結びつけ、共有の生産状態を維持し、ツールのフィードバックが後の意思決定や修理に反映されます。", "WeVisCutはベースモデルを上回る性能を発揮し、Claude Opus 5と同等の性能を達成しつつ、成功した出力分あたり約33倍少ないトークンの使用量を抑えています。"]}], ["2026-10-28", "Aligning Misaligned Benchmarks for Single-View Novel View Synthesis", "単一ビュー・ノベルビュー合成のためのずれたベンチマークの整合", "Google", "なし", "3D ガウス・動画・画像", "3D データ・3D ガウス", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38349", "summary": ["単一ビューの新規ビュー合成手法のパフォーマンス定量化は、参照フレーム内のアライメントの問題により標準化が不足しています。", "本論文は、2Dから2Dおよび2Dから3Dへの画像マッチングを用いて、共視領域内で3D再構成を整列させることを提案しています。", "適切な座標アライメントにより、明示的な3次元ガウスを用いた手法で最先端の結果が得られ、画像ベースの手法に対する従来の劣等性の主張に挑戦します。"]}], ["2026-10-28", "Knowledge-structured and evidence-aware semantic self-distillation for glomerular pathology foundation model", "糸球体病理基礎モデルにおける知識構造化かつ証拠認識型意味的自己蒸留", "", "なし", "画像・テキスト", "ラベル", "", "", "", "●", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.38346", "summary": ["視覚的基礎モデルには、糸球体病理に対する明確な概念レベルの監督が欠けています。", "GloSAGEは、事前訓練された視覚教師による病変プロファイルを用いて構造化された病理記述を構築し、意味的自己蒸留フ 画像を用いて、新規ビュー合成のためのマルチビュー拡散モデルを条件付けします", "GroundControlは特に重なりの少ないシナリオで、新規ビューの合成においてベースラインを上回る性能を発揮します"]}], ["2026-10-28", "A note on data-efficient finetuning of vision foundation models", "視覚基盤モデルのデータ効率的な微調整に関する注意", "", "なし", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37510", "summary": ["既存の手法では、資源の制約下でビジョン基盤モデルの効率的な微調整のための体系的な評価が不足しています。", "本論文は、VP、LP、FFT、LoRAなど、さまざまな基礎モデルファミリーやトランスファーパラダイムの性能をハイパーパラメータチューニングを用いて評価しています。", "本論文は、従来の研究と比べてモデルや技術の選択を広げています。"]}], ["2026-10-28", "ALADDIN: Adversarial Latent Diffusion Distillation for One-Step Identity Swapping", "アラジン:ワンステップアイデンティティスワッピングのための敵対的潜在拡散蒸留", "", "なし", "画像・姿勢", "位置・対応関係", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.37503", "summary": ["既存のワンステップフェイススワッパーは、アイデンティティ移行を維持しつつリアリズムやターゲット属性の保持に苦労しています。", "ALADDINは事前学習済みのフローマッチングモデルからジェネレーターを初期化し、同一性およびターゲット保持制約の下で敵対的に訓練します。", "ALADDINは、ネットワーク評価数を28倍に抑え、訓練ペア数を1桁少なくし、最先端のリアリズムとターゲット保持を実現しています。"]}], ["2026-10-28", "How Reliable Is Individualized Functional-Network Attribution in Resting-State fMRI Cognitive Prediction in ADNI?", "ADNIにおける安静状態fMRI認知予測における個別化された機能ネットワーク帰属はどの程度信頼できるのか?", "Siemens", "なし", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37472", "summary": ["安静状態fMRIにおける個別化された機能ネットワーク帰属のテスト・再検査信頼性は、ほとんど定量化されていません。", "本論文では、凍結状態機能的結合予測因子と被験者レベルの置換帰無を用いて、被験者ごとのネットワークアブレーション帰属を評価しています。", "スプリットハーフの信頼性はほぼ上限に達しますが、スキャン再スキャンで低下し、マッチしたペアはz~6.6-6.9を示します。"]}], ["2026-10-28", "PerceptRL: Making Visual Perception Rewardable in MLLMs from Answers to Interactions", "PerceptRL:MLL(MLL)における視覚知覚を報酬あるものにする、回答から交流まで", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37471", "summary": ["細粒度の視覚知覚は、知覚エラーにより推論重視の最適化が制約されるため、MLLMのポストトレーニングにおけるボトルネックとなっています。", "PerceptRLはマルチエージェントパイプラインを用いて、密
