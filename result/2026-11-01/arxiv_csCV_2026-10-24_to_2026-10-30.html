す。"]}], ["2026-10-26", "LayoutMamba: Efficient Document Layout Analysis with Hybrid Mamba-Transformer Networks", "LayoutMamba:ハイブリッドマンバ-トランスフォーマーネットワークによる効率的なドキュメントレイアウト解析", "", "なし", "テキスト", "バウンディングボックス", "●", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34879", "summary": ["ドキュメントレイアウト分析は、豊富な局所的な詳細と効率的なグローバルモデリングとのトレードオフに直面します。", "LayoutMambaは、ローカルフィーチャ用のスパースアテンショントランスフォーマーと、長距離依存モデリング用のMambaを組み合わせたものです。", "LayoutMambaはd4LAの一流の性能を維持し、PUBLAYNETのAPを改善している間8x少数の変数を達成する。"]}], ["2026-10-26", "CoDeRNet: Selective Cross-Task Routing under Heterogeneous Supervision for Change Detection and Captioning", "CoDeRNet:異種監督下の選択的クロスタスクルーティングによる変化検出と字幕作成", "", "なし", "衛星・航空画像", "バウンディングボックス", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34876", "summary": ["既存の手法では、異種監督下での効果的なコミュニケーションが不足し、変化の検出や字幕作成が困難です。", "CoDeRNetは、タスクブランチ間の選択的情報ルーティングのための信頼分解ルーティング機構を用いた統一フレームワークを提案します。", "CoDeRNetは、異質な監督の下で競争変化の局所化を維持しつつキャプション生成を改善します。"]}], ["2026-10-26", "DocTalk: Enhancing Medical Knowledge Retrieval via Fine-tuned Large Language Models with Chain-of-Thought Reasoning for Robust Clinical Decision Support", "DocTalk:シンク・オブ・シンク推論を用いた微調整された大規模言語モデルによる医療知識検索の強化", "", "あり", "医用画像・テキスト", "ラベル", "", "", "", "●", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34871", "summary": ["医療分野でのLLMの安全かつ効果的な導入は、幻覚やドメインの不整合のために困難です。", "DocTalkは、思考の連鎖推論と専門家レビューを備えた細かく調整されたLLMを用いて、退院要約からチャートに基づく回答を生成します。", "命令チューニングにより、ROUGE-L、BERTScore-F1、UMLS-F1の指標がそれぞれ0.40、0.76、0.49向上しました。"]}], ["2026-10-26", "DecoyCount: Evaluating Visual-Reasoning Misalignment in Counting", "DecoyCount:カウントにおける視覚的推論のずれの評価", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34855", "summary": ["既存のベンチマークでは、視覚的カウントにおける知覚誤差と推論誤差を区別できていません。", "DecoyCountは、設計されたデコイとペアのプロンプトを用いた1,660枚の実世界画像を用いて、視覚的推論のずれを評価します。", "フロンティアモデルは50%未満の精度にとどまり、アライメントギャップは11.8〜22.1ポイントの範囲です。"]}], ["2026-10-26", "Learning Dual-Camera Smooth Zoom via Decoupled Geometric-Photometric Data Synthesis", "分離された幾何学的・光度データ合成によるデュアルカメラの滑らかズーム学習", "", "あり", "3D データ", "動画", "", "", "", "●", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34854", "summary": ["スマートフォンのデュアルカメラ間のズームは幾何学的および色の不連続性を引き起こし、視覚体験を損なう。", "論文では、幾何学的変換と光度変換をデカップリングしてDCSZの訓練シーケンスを生成するためのZoomGS v2と、DCSZに特化したVFI用のZoomFIを提案しています。", "DCSZデータを用いたトレーニングはVFIモデルを向上させ、ZoomFIは指標と視覚品質の両面で最先端の結果を達成します。"]}], ["2026-10-26", "Recovering Black-Box Point Cloud Models from Pose Shifts via Derivative-Free Optimization", "微分フリー最適化によるポーズシフトからのブラックボックス点クラウドモデルの復元", "", "なし", "点群・姿勢", "マスク・点群", "", "●", "", "", "", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34850", "summary": ["トレーニング分布外でのテスト時間の回転は、スコアのみのブラックボックス点クラウドモデルの性能を低下させます。", "CanDOは微分なし最適化を用いて、勾配やモデルの重みなしにモデル信頼度を最大化する入力変換を見つけます。", "CanDOは方位ミスオリエンテーション下でオラクルギャップの76%を、オブジェクトパーツセグメンテーションのための任意のSO(3)回転で51%を回復します。"]}], ["2026-10-26", "Seeing Before Naming: Context-Grounded Learning of Novel Visual Concepts", "名前をつける前に見る:新しい視覚概念の文脈に基づく学習", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34846", "summary": ["新しい視覚概念を学ぶには、視覚的証拠を意味名と結びつける必要があり、既存の方法では課題です。", "SynerNetはコンテキスト基盤を持つセマンティックアンカリングを用いて、概念固有の名前埋め込みを学び、クロスモーダルコンテキストを統合します。", "SynerNetは16発の命中率74.35%を達成し、転送設定では平均命中率を45.17%から46.74%に向上させます。"]}], ["2026-10-26", "PosePlaner: Denoising Any Feed-Forward Pose Predictor from Pairwise Planar Geometry", "PosePlaner:ペアワイズ平面幾何学から任意のフィードフォワードポーズ予測器をノイズ除去する", "", "なし", "姿勢・画像・多視点画像", "画像・3D データ・姿勢", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34845", "summary": ["既存のフィードフォワードポーズ予測器には、テスト時に幾何学的誤差を補正する仕組みがありません。", "Poseplanerはフローマッチングを用いて、粗い幾何学的マッチと初期ポーズに基づいてポーズ推定値を洗練します。", "フィードフォワード予測因子の失敗を補正し、長距離シーケンスでのドリフトを低減することでポーズ推定を向上させます。"]}], ["2026-10-26", "Interpretable Brain Age Prediction Using White Matter Fiber Orientation Distributions with Rotation-Equivariant Deep Learning", "回転等変ディープラーニングを用いた白質ファイバー向き分布を用いた解釈可能な脳年齢予測", "", "なし", "医用画像", "特徴表現", "", "", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34825", "summary": ["既存のDTIスカラー指標を用いた脳の年齢予測モデルは向き情報がなく、従来のCNNは向き依存特徴の幾何学的構造を尊重していません。", "本論文は、球面調和係数を用いて白質ファイバー配向分布(WM-FODs)を処理するSE(3)等変CNNを提案し、回転特性を保持します。", "このフレームワークはDTIベースのモデルや従来のCNNを上回り、平均絶対誤差は3.54年、ピアソン相関は0.958でした。"]}], ["2026-10-26", "Selective Monocular Precession Estimation under Geometric and Evaluation Ambiguity: An Auditable Synthetic Study with ORBIT-SCOUT", "幾何学的および評価的曖昧さに基づく選択的単眼歳差推定:ORBIT-SCOUTを用いた可聴性合成研究", "", "なし", "画像・姿勢", "姿勢", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34819", "summary": ["転がる物体の単眼観察は、回収された物理軸が正しいかを証明することなく、正確な適合軌道を支持できます。", "ORBIT-SCOUTは、画像由来の線および縁のジオメトリを、定円錐およびトルクフリーの三軸軌道ファミリーと結合させます。", "支持されたシーンで25/64の正解カバレッジが達成され、そのうち38シーンは共同で正しい推定値を出し、いずれも誤った推定値を出していませんでした。"]}], ["2026-10-26", "Towards Spatio-Temporal Intelligence Systems in Urban Space: A Twin-Agent Perspective", "都市空間における時空間知能システムへ:双子エージェントの視点", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34795", "summary": ["既存の都市システムは、適応的ガバナンスのための時空間的知能の一貫した統合が欠けています。", "本論文は、持続的な都市表現とエージェント的推論を統合した双子エージェントシステムを提案し、適応型都市ガバナンスを実現しています。", "二ループ設計図は、都市領域における時空間知能のための構造化された研究課題を提供します。"]}], ["2026-10-26", "Natural Jammers: When Non-Robust Features Become Antagonistic", "ナチュラルジャマー:非強固な特徴が敵対的になるとき", "Alibaba", "なし", "画像", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34785", "summary": ["ディープネットワークにおける非ロバスト特徴は、クリーンな画像上でモデルを誤誘導します", "標準モデルとロバストモデルの不一致を利用して、ジャムされた集合を特定しスペクトル空間ロックを解析する", "ジャミングされた集合では、ロバストモデルが標準モデルよりも優れ、幾何学的シフト下でもジャミングは安定します"]}], ["2026-10-26", "ToDoPro: Faster and Better Reference-Based Generation: Early Token Reduction via Downsampled Self-Probing", "ToDoPro:より高速かつ優れた参照ベース生成:ダウンサンプリングによる早期トークン削減", "", "あり", "画像", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34782", "summary": ["既存の参照ベースの画像生成モデルは、複数の参照を扱う際にトークン爆発や高い計算複雑さに悩まされています。", "ToDoProは、参照トークンの重要度を効率的に抽出し、階層的還元を適用するためにダウンサンプリングされた自己プロービングによる早期トークン削減を提案しています。", "この手法は、$2\\times$のダウンサンプリング参照を用いて、追加のパラメータなしで有意な推論加速とメモリ削減を実現しています。"]}], ["2026-10-26", "Factorized Gradients for Scalable Highly-expressive Parametric Diffeomorphisms", "スケーラブル・ハイ表現的パラメトリック微分同相写像のための因数分解勾配", "", "なし", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34766", "summary": ["表現力が高く計算効率の良い微分同相写像を作ることは依然として困難です。", "FG-CPABは、積分とパラメータ空間投影を分離することで、スケーラブルCPAB変換のための因数分解勾配定式を導入します。", "勾配計算の計算複雑度はO(dTN)からO(TN + dC)へと減少し、2Dでは最大10^4倍の速度向上を実現できます。"]}], ["2026-10-26", "Efficient Multi-modal Video Fusion Network with Dynamic Region-Guided Temporal Interaction", "動的領域誘導時間相互作用を用いた効率的なマルチモーダルビデオ融合ネットワーク", "", "なし", "動画", "動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34765", "summary": ["既存の手法は、フレーム間のアライメントにオプティカルフローやフィーチャーワーピングに依存しているため、計算負荷が高く、フローエラーへの脆弱性が生じています。", "Test-Time Trainingを用いて、線形複雑度を持つ時間的依存関係をモデル化するために、動的な領域誘導時間的相互作用を持つ効率的なネットワークを提案します。", "動的領域に焦点を当て、MAEベースの時間指標を用いて局所的なちらつきを抑制することで、融合の品質と時間的一貫性を向上させます。"]}], ["2026-10-26", "SceneAgent: An Agentic Pipeline from 3D and 4D Captures to Simulation Environments", "SceneAgent:3Dおよび4Dキャプチャからシミュレーション環境へのエージェントパイプライン", "", "なし", "LiDAR・3D ガウス・動画", "マスク・3D ガウス・動画", "", "●", "", "", "●", "●", "", "", "", "●", "●", "", "", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34745", "summary": ["視覚的キャプチャをインタラクティブなシミュレーション環境に変換するには、オブジェクトの再構築、物理モデリング、誤り訂正が必要です。", "SceneAgentは、シミュレーターベースの視覚検査と修理を通じて、オブジェクトのセグメント化、物理パラメータ推定、部品分解、関節化、変形可能なシミュレーションを調整するパイプラインを使用しています。", "SceneAgentはSimFoundryの6.9%に対し60.75%のF1スコアを獲得し、4DCodeBenchでの動的IoUを0.86%から99.09%に引き上げました。"]}], ["2026-10-26", "From Sentinel-2 to 1-m Imagery: Real-World $\\times 10$ Cross-Sensor Super-Resolution via Visual Autoregressive Modeling", "センチネル-2から1メートル画像:実世界の$\\times 10$のクロスセンサー超分解能(ビジュアル自己回帰モデリングによる)", "", "あり", "画像", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34742", "summary": ["クロスセンサーの超分解能は、衛星の特性の違いや空間倍率の10倍の要求により課題に直面しています。", "CrossVARは、9スケール階層と拡散リファイナーを持つ視覚的自己回帰モデルを用いて、Sentinel-2入力から1mの画像を予測します。", "CrossVARは3,015のテストシーンで最高のPSNR、SSIM、LPIPS、FIDスコアを達成しています。"]}], ["2026-10-26", "FGD2HF: Frequency-guided Dual-domain Hypergraph Fusion for Semantic Segmentation", "FGD2HF:意味分割のための周波数誘導二重ドメインハイパーグラフ融合", "", "なし", "", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34734", "summary": ["既存の周波数ベースの手法は、周波数利用率の不足、核融合効率の低さ、計算の複雑さが高いという問題を抱えています。", "FGD2HFは、周波数特性を用いてハイブリッド・アテンション・エンコーダー、ウェーブレット変換・強化モジュール、周波数誘導デュアルドメイン融合モジュールを通じて空間領域の融合と強化を導く二重領域融合ネットワークを提案します。", "FGD2HFはADE20Kで48.7%のmIoU、Cityscapesで83.2%のmIoU、SBDでVWFormer-Tより1.1%高いmIoUを達成し、GFLOPは21%少ないです。"]}], ["2026-10-26", "RSKD: Grounding Semantic Consistency in Driving VLMs via Distillation", "RSKD:蒸留によるVLM駆動における意味的一貫性の根付", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34689", "summary": ["均一なトークンレベルのマッチングは計画に関連する意味論を希釈し、教師のVLM駆動における誤りを増幅させます。", "RSKDは、セマンティック・コンステイメント・ガイドド・ディスティレーションを用いて、課題の重要度や教師の予測とセマンティックな一貫性に基づいて監督をルーティングします。", "RSKDはDrivingVQAとLingoQAでのパフォーマンスを向上させつつ、MapLMv2で競争力を維持しています。"]}], ["2026-10-26", "From Speech Tokens to Stolen Voices: Attacker-Chosen-Text Speaker Impersonation via Representation Inversion", "音声トークンから盗まれた声へ:攻撃者が選んだテキストの話者なりすまし(表現反転による)", "", "なし", "音声・テキスト", "音声", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34688", "summary": ["音声フロントエンドの表現は話者の身元を明かす可能性があり、漏洩すると音声のプライバシーを脅かす可能性があります。", "スティアは音声表象を条件付けシーケンスに変換し、単一のリークされた表現と指定されたテキストを使って被害者の声で音声を生成する。", "Stiaは3秒間の音声表現漏れで平均CAM++のコサイン類似度0.78を達成します。"]}], ["2026-10-26", "Good Rankings, Poor Choices? Rethinking Language-Only Vision-Language Model Selection", "良いランキング、悪い選択?言語のみの視覚・言語モデル選択の再考", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34685", "summary": ["既存のランキング指標を用いたLOVM手法は、外れ値への感度や性能範囲の変動によりモデル性能を正確に評価できません。", "論文はTC-ESRというトレーニングフリーの手法を提案しており、ソースタスク全体で類似度加重平均後悔が最も低いモデルを選択する。", "TC-ESRは、22のターゲットタスクおよび43のVLMにおいて、比較対象のすべての手法の中で最も低い平均SRおよびORNRを達成しています。"]}], ["2026-10-26", "Exploring perceptual straightness in learned visual representations", "学習された視覚表象における知覚の直線性の探求", "", "なし", "動画", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34678", "summary": ["既存のディープネットワークでは、自然な映像をまっすぐにすることができず、時間変化する入力を効果的に表現する能力が制限されています。", "本論文は、ネットワークアーキテクチャ、堅牢性、生物学的に着想を得たフィルターが、時間変化する入力における表現的直線性にどのように影響するかを探ります。", "4つの主要な発見は、対抗的なトレーニングが直線性を高め、直線性が時間的安定性を改善し、生物学的に起因した要素が初期の層を増やし、直線性が堅牢性と安定性の指標であることを示しています。"]}], ["2026-10-26", "Benchmarking Obstacle-Conditioned Safety in Household Robot Navigation", "家庭用ロボットナビゲーションにおける障害物条件付き安全性のベンチマーク", "", "なし", "画像・テキスト", "テキスト・行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34674", "summary": ["既存の評価では、意味的安全性の区別が連続運動に反映されているかどうかを検証していません。", "OSMA-Benchは障害物タイプのみ異なる空間的にマッチしたシナリオを導入し、セマンティック・センシティブ・インデックスは動きパラメータが障害物の安全性を反映しているかどうかを測定します。", "VLMベースのポリシーは、障害物認識とナビゲーションプログラム生成の間にパラメータ推論ステップを追加することで改善が見られます。"]}], ["2026-10-26", "Video World Models Need Predictable Latents", "ビデオワールドモデルには予測可能な潜在要素が必要です", "", "なし", "画像・テキスト", "テキスト・動画", "", "", "", "●", "", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34663", "summary": ["ビデオワールドモデルは、長い地平線の展開と分布外の一般化に苦労し、推論時に計算上要求されています。", "本論文は、時間的予測可能性に最適化された潜在幾何学と、過去条件デコーダアーキテクチャを組み合わせて生成ビデオ世界モデルを改善することを提案しています。", "この手法は、最大5倍のコスト削減、7倍以上の高速トレーニング、分布外および長期的視野でのピクセル誤差および知覚誤差を15〜24%低減させます。"]}], ["2026-10-26", "StreamVibe: Proactive Video Agents for Evolving User Intent", "StreamVibe:進化するユーザー意図のための積極的なビデオエージェント", "Google", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34662", "summary": ["既存の手法は明示的なリクエストに依存しており、暗黙のユーザー意図や進化するユーザー意図を処理できません。", "StreamVibe-VLは連続的な観察から暗黙のユーザー意図を推論し、意図の進化に応じて相互作用を適応させます。一方、StreamVibe-Harnessは階層的メモリでユーザーの意図を追跡します。", "StreamVibe-VLは応答タイミングと回答の質を10.7%向上させ、StreamVibe-Harnessは先手的なインタラクション性能を12.3%向上させます。"]}], ["2026-10-26", "Regional prediction of hematoma expansion from non-contrast computed tomography in spontaneous intracerebral hemorrhage patients", "自然発生性脳内出血患者における非造影CTによる血腫拡大の局所的予測", "", "なし", "医用画像・画像", "特徴表現", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34645", "summary": ["既存の手法には、NCCTによる血腫拡大を定量的かつ解釈可能な領域ベースモデルが不足しています。", "本論文は、NCCT画像を用いて地域的特徴を解析して血腫の拡大を予測する輸送ベースの形態計測(TBM)モデルを提案しています。", "地域TBMモデルは検証でAUROC0.787を記録し、他の手法を上回る成果を上げました。"]}], ["2026-10-26", "RIDE-Splat: Reflection Removal for In-the-Wild Driving Environments", "RIDE-Splat:野外の運転環境での反射除去", "", "なし", "動画・画像", "3D データ・画像", "", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34632", "summary": ["3Dガウススプラッティングにおいて、フロントガラスを通して映像を走らせることは世界空間の整合性を破り、視差や付着反射を引き起こします。", "RIDE-Splatは2回のパイプラインを用いて、世界一貫した透過とカメラに接続された反射を個別に割り当て、クリーンな3DGSモデルを適用します。", "RIDE-Splatは複数のデータセットでPSNRを最大3.59dB向上させ、LPIPSを最大0.0876削減します。"]}], ["2026-10-26", "One Mean Log-Mel Vector per Phoneme: Simple and Fast Text Injection for Speech Recognition", "音素ごとに1つの平均対数メルベクトル:音声認識のための簡易かつ高速なテキスト注入", "NVIDIA", "あり", "テキスト・音声", "ラベル・音声", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34623", "summary": ["既存のテキスト注入手法は複雑なTTSモデルを使用しており、学習時間が遅くなります。", "ルックアップテーブルは、TTSモデルを音素ごとの平均対数ベクトルとランダムな持続時間に置き換えます。", "トレーニングは1.8倍速く、LibriSpeech上で最先端のWERを実現しています。"]}], ["2026-10-26", "P2P-Former: Bridging the Supervision Gap Between Point and Proposal in Temporal Action Localization", "P2P-Former:時間的行動局所化におけるポイントと提案の間の監督ギャップを埋める", "", "なし", "", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34618", "summary": ["ポイント注釈は提案注釈よりも不完全であり、時間的アクションの局所化における性能のギャップが生じます。", "P2P-Formerは、ポイントレベルの監督と提案レベルの学習を結びつけるポイント・トゥ・プロポーション型のトランスフォーマーベースのフレームワークを提案します。", "この手法は、信頼性の高い提案の作成と、ポイントレベルの手がかりを完全教師あり学習に統合するという2つの課題に取り組み、パフォーマンスを向上させます。"]}], ["2026-10-26", "Do Words Matter? What Text Contributes to Few and Full-Shot Vision-Language Anomaly Detection", "言葉は重要か?どのテキストが少ない、そして完全な視覚言語異常検出に寄与するのか", "", "なし", "テキスト", "バウンディングボックス・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34610", "summary": ["既存の視覚言語異常検出器は、パフォーマンス向上をテキストの意味的コンテンツに帰属させますが、視覚アダプターが関与する少数・フルショットの環境ではこれは成り立ちません。", "本論文は、テキストの埋め込みが視覚言語異常検出器に与える影響を分析し、テキスト記述の変更がモデル性能に与える影響を検証することを提案しています。", "この研究は、少ショットおよびフルショット設定において、検出器の性能はテキストの意味的内容ではなく、効果的なスケールやジョイントアンカージオメトリによって影響されることを示しています。"]}], ["2026-10-26", "FlexiMIND: Combined Pretrained Vision Features and Local Structure for Training-Free Deformable Medical Image Registration", "FlexiMIND:訓練不要の変形可能な医療画像登録のための事前学習視覚特徴と局所構造の結合", "", "あり", "医用画像", "位置・対応関係", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34600", "summary": ["変形可能な画像登録は、解剖学間の強度関係の違いから困難です。", "FlexiMINDは、事前訓練済み視覚機能とMIND-SSCを組み合わせ、トレーニング不要の登録を実現するための2段階の枠組みを行っています。", "FlexiMINDは、参照手法と比較してDiceで0.0043の改善とTRE劣化を20.6%削減しました。"]}], ["2026-10-26", "An Agentic AI Workflow for Liver Lesion Segmentation and Structured Radiology Reporting", "肝病変のセグメンテーションと構造化された放射線報告のためのエージェント型AIワークフロー", "", "なし", "医用画像", "医用画像・テキスト・マスク", "", "●", "", "●", "", "", "", "●", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34599", "summary": ["既存の研究では、画像由来の予測と臨床的に解釈可能な放射線報告との橋渡しが欠けています。", "エージェント型AIフレームワークは、肝臓および病変のセグメンテーションを、TotalSegmentatorベースのnnU-Netモデルおよび大規模言語モデルを用いて決定的な定量化および構造化レポートと結びつけます。", "このフレームワークは肝臓Diceスコア0.947を達成し、MERLIN報告における肝臓関連異常の40.0%を特定しています。"]}], ["2026-10-26", "Finetuning Prompt-Based Image Editor for Geometry-Consistent Room Defurnishing", "幾何学的に一貫した部屋の家具除去のためのFinetuningプロンプトベースの画像編集ツール", "", "なし", "画像", "画像", "", "", "●", "●", "●", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34597", "summary": ["既存の方法は家具の部分をインペインテイントしながら部屋の形状を歪めずに行うのが難しいです。", "2,500組の家具付き空室ペアでLoRAを微調整するトレーニングレシピ。", "LoRAアダプターを使ったFLUX.2は、テクスチャの忠実さを保ちつつ幾何学的な一貫性を向上させます。"]}], ["2026-10-26", "FlockWorld: Toward Population-Scale Multi-Agent Video World Models through Artificial Life Simulation", "FlockWorld:人工生命シミュレーションを通じた人口規模の多エージェントビデオ世界モデルへ", "", "なし", "動画", "動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34564", "summary": ["既存のマルチエージェントビデオワールドモデルは、小規模なエージェントグループに限定されています", "FlockWorldはレイノルズのボイドアルゴリズムを用いて、設定可能なカメラエージェントを用いた人口規模のマルチエージェント環境をシミュレートします", "FlockDiTは、FlockWorldのデータに基づくフローマッチングを用いて複数のエージェントの同期動画の共同生成を実現します"]}], ["2026-10-26", "Recursive CLIP: Vision-Language Distillation with Looped Transformer Blocks", "再帰CLIP:ループ変換ブロックを用いた視覚言語蒸留", "Samsung", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34563", "summary": ["CLIPのような既存のビジョン言語モデルは、独立パラメータ化されたトランス変換ブロックを使用し、パラメータ共有や効率を制限しています。", "論文では、$N$トランスブロックを$M回前方パスで適用し、M$を一定に保$N再帰的CLIPモデルを提案しています。", "再帰は、異なるトランスブロックの数を保存・適応することでパラメータ効率を提供します。"]}], ["2026-10-26", "GRASP: Group-Adaptive Hybrid RL-SFT Post-Training for Medical VQA without Reasoning Annotations", "GRASP:推論注釈なしの医療VQAのためのグループ適応ハイブリッドRL-SFTポストトレーニング", "", "あり", "画像・テキスト・医用画像", "テキスト・画像", "", "", "", "", "", "", "", "●", "", "", "●", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34561", "summary": ["医療用VQAには推論的な注釈がなく、注釈付きデータも乏しく、回答も短いです", "GRASPは毎回のアップデートでRLとSFTを組み合わせ、短い回答のみを用います", "GRASPは、ドメインおよび当直オープンエンドの問題において、比較されたすべての訓練目標を上回る成績を収めています"]}], ["2026-10-26", "VTC-AUDIT: An Interventional Reliability Audit for Visual-Token Compression under Paired Image Shifts", "VTC-AUDIT:ペア画像シフト下での視覚トークン圧縮のための介入的信頼性監査", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34545", "summary": ["既存の視覚トークン圧縮の評価では、圧縮されていないモデルが正しい状態で画像シフト下での失敗を検出できません。", "VTC-AUDITは、両方の画像で完全なモデルが正しく、圧縮されたモデルがクリーンな画像で正しいペアに焦点を当てて圧縮を監査します。", "この手法は、画像シフト時にDivPruneで失敗率が3.04〜9.60ポイント増加し、ApETが2.05〜4.20ポイント増加することを検出します。"]}], ["2026-10-26", "Conviction Without Evidence: Verdict Stability Is Independent of Visual Grounding in Medical Vision--Language Models", "証拠のない有罪判決:評決の安定性は医療視覚、言語モデルにおける視覚的基盤とは独立しています", "", "なし", "医用画像", "バウンディングボックス", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34520", "summary": ["既存の研究では、視覚グラウンディングが医療視覚言語モデルの診断の安定性に影響を与えると仮定しています。", "この論文は、モデルが空白の仮画像から診断された場合でも、同じく確固たる答えを持っているかを検証します。", "このモデルは、根拠のある診断と非根拠の診断の間に安定性に差がなく、従来の前提と矛盾しています。"]}], ["2026-10-26", "TRIAGE: Efficient Vision-Language-Action Inference Needs Both Reuse and Pruning", "トリアージ:効率的なビジョン・言語・行動推論には再利用と剪定の両方が必要です", "", "なし", "画像・テキスト", "行動", "", "", "", "", "", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34519", "summary": ["既存の手法では、スキップされたトークンごとに剪定か再利用のいずれかしか適用されず、組み込みシステム上でリアルタイムのビジョン・言語・アクション推論において性能が最適とは言えません。", "TRIAGEはトークンレベルの診断を用いて、ドリフトやキャッシュの有効性に基づいてトークンの再利用か編集するかを判断し、固定されたトークン予算の再計算を優先します。", "TRIAGEはJetson AGX Orinでプリフィル遅延を最大48%削減し、LIBERO-Objectでは7%の視覚的トークンのみの再計算で成功率を24.4pp向上させます。"]}], ["2026-10-26", "PhysCreator: Creating Physically-Attributed 3D Assets at Will", "PhysCreator:物理属性付きの3Dアセットを自由に作成", "", "なし", "画像・テキスト・3D データ", "3D データ・テキスト", "", "", "", "●", "", "●", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34473", "summary": ["既存の3Dアセット作成手法では、動的な相互作用下での物理的に妥当な挙動をモデル化する能力が不足しています。", "PhysCreatorは、統一されたフレームワークを用いて画像から空間的に異なる物理的特性を持つシミュレーション対応の3D表現を生成します。", "この手法は、従来の手法に比べて優れた視覚品質、物理的妥当性、汎用性を実現しています。"]}], ["2026-10-26", "Task Relevance-Driven Prompt Expansion for Federated Continual Learning", "タスク関連性駆動型プロンプト拡張による連邦継続学習", "", "なし", "テキスト", "バウンディングボックス・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34461", "summary": ["既存のFCL手法は、サーバーが新しいタスク到着時間やカテゴリカウントを知っていると仮定していますが、これは現実的ではありません。", "TRPEは分布外検出器と半径適応型DBSCANを用いて新しいタスクを検出しカテゴリカウントを推定し、勾配親和性を計算してタスク間の関係を探ります。", "TRPEは、正のタスク間関係を通じて壊滅的な忘却を減らし、新旧課題学習をソフトな直交性制約でバランスさせることで改善されます。"]}], ["2026-10-26", "On Detection Reliability for Small Object Segmentation", "小型物体分割の検出信頼性について", "", "なし", "", "マスク・バウンディングボックス", "●", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34432", "summary": ["既存の手法は、狭小なオブジェクトのセグメンテーションにおいてバウンディングボックスに依存することで偽陰性のリスクがあります。", "本論文では、アデノウイルス粒子を小さな物体として用い、YOLO26xを検出、YOLO26x-Semをセグメンテーション、Mask R-CNNを検出とセグメンテーションの両方に用いています。", "Mask R-CNNは予測ボックス内で97.18%のセグメンテーション一致率を記録し、YOLO26xの40.85%を上回っています。"]}], ["2026-10-26", "No Cones, No Duals: A Fast and Scalable Solver for NRSfM", "コーンなし、双対なし:NRSfMの高速かつ拡張可能なソルバー", "", "なし", "画像", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34403", "summary": ["既存のNRSfMソルバーは、コストのかかるSDPおよびADMMステップのため、長いシーケンスや密集した点トラックに対してスケールが悪くなっています。", "本論文は、微分可能なユークリッド補正と、FISTAスタイルの再起動・継続を持つ展開スペクトル近接ソルバーを用いることで、コストのかかるSDPおよびADMMステップを回避する高速でスケーラブルなソルバーを提案しています。", "ソルバーは密度の高いシーケンスに対して7倍から1000倍の実行時間向上を達成し、28,887点の追跡ポイントと競争力のある再構成精度を実現しています。"]}], ["2026-10-26", "AndroidFlux: Evaluating and Reward Modeling Failure Recovery Capabilities in Mobile Use Multimodal Agents", "AndroidFlux:モバイルにおける故障回復能力の評価と報酬 マルチモーダルエージェント利用", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34384", "summary": ["モバイル用途のマルチモーダルエージェントの既存の評価は、クリーンな初期状態からのタスク成功に焦点を当てており、中間エラーからの回復能力は無視されています。", "AndroidFluxは制御チェックポイントを用いて、エラーの前後の軌道を復元して故障回復を評価し、報酬モデルを用いて回復・回復の好みを評価します。", "ベンチマークは回復性能とクリーンスタート成功の間に部分的な相関関係を示しており、明示的な推論はGUIドメイン固有の強化学習で訓練されたモデルのみを助けます。"]}], ["2026-10-26", "A Computationally Efficient Non-Interpolation Virtual Trellis Approach for Mammogram Gradient-based Patterns Analysis", "マンモグラム勾配ベースのパターン解析における計算効率の良い非補間仮想トレリスアプローチ", "", "なし", "医用画像", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34352", "summary": ["従来の手法は、マンモグラム解析における最適な対角線パターン、計算効率、特徴バッファの保存に苦労しています。", "論文では、同じ正方形画像上でフィルタカーネルを用い、六角形トレリスに変換せずに非補間仮想レリス(NVHT)演算子を提案しています。", "この方法は、記憶容量が少なく、異なる方向で高い感度を持つ六角形ピクセル表現を活用することで、計算コストと記憶処理コストを削減します。"]}], ["2026-10-25", "Spatially-Aware Self-Organizing Graph Autoencoders via Localized Hebbian Learning", "局所化ヘッビアン学習による空間認識自己組織化グラフオートエンコーダ", "", "なし", "画像", "画像", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34346", "summary": ["従来のオートエンコーダは入力画像の空間情報を十分に活用できず、損失関数の急激な遷移による不安定な特徴学習に悩まされます。", "S-LooMは空間的相互相関と空間カーネルを用いて特徴マップ間の動的な接続を確立し、静的なスカラーメッセージのパスを学習可能な空間カーネルに置き換えます。", "S-LooMは、特徴のもつれやノイズに対する耐性が高く、より安定したトポロジーを実現し、高い接続密度下でも視覚的属性の関数的コミュニティを形成します。"]}], ["2026-10-25", "Birth-Death Structural Learning for 3D Gaussian Splatting", "3Dガウススプラッティングのための出生・死亡構造学習", "", "なし", "3D ガウス・多視点画像・テキスト", "3D データ・3D ガウス・テキスト", "", "", "", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34344", "summary": ["3DGSの品質と効率のトレードオフは、密度制御のためにプロキシ信号に依存しています", "第一変異出生・死亡対照は、ヒューリスティックな判断を再建損失からの変分スコアに置き換えます", "このスコアを3DGS-MCMCに統合することで、最先端の再構成品質を実現し、厳しいガウス予算の中でも大きな成果が得られます"]}], ["2026-10-25", "CrossPair: Unlocking Generalist Visual Transformation Learning in Image Editors", "CrossPair:画像編集者におけるジェネラリストのビジュアル変換学習の解放", "", "なし", "画像・テキスト", "テキスト", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.34333", "summary": ["視覚課題はしばしば修復、編集、スタイライズのために別々のシステムに依存しており、一般的視覚変換学習を制限します。", "CrossPairは、事前学習済みのマルチモーダル画像エディターを適応させ、変化に対応したDINOv3オブジェクトを用いて、コンテンツごとに異なるシーン間で多様な変換を転送します。", "CrossPairはリリースされたシステムに対してターゲットの一致や編集方向の類似性を向上させ、DINO関係の整合性をさらに強化します。"]}], ["2026-10-25", "TopX: Text-to-Motion for Unseen Skeletons from the Skeleton File Alone", "TopX:スケルトンファイルだけでも見えないスケルトンのためのテキスト・トゥ・モーション", "", "あり", "テキスト・姿勢・動画", "姿勢・ラベル・動画", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34321", "summary": ["テキストからモーションへのモデルは、訓練データやキャラクター固有の情報がなければ見えないスケルトンの動きを生成できません。", "TopXはフローマッチングトランスフォーマーを使って、クリップやテンプレート、リターゲティングを不要にスケルトンファイルだけでモーションを生成します。", "TopXは、保留されたゲーム種で0.953 R@1のテキスト-モーション検索を達成し、実際の動きでは0.929を上回っています。"]}], ["2026-10-25", "Learning Discriminative Prototypes via Boundary Repulsion MixUp for Object Re-Identification", "境界反発ミックスアップによる識別プロトタイプ学習による物体再識別", "", "あり", "", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.34305", "summary": ["既存の手法は、クラス内の変異に対して堅牢であるにもかかわらず、視覚的に似た同一性間の鋭い分離を維持するのに苦労しています。", "PBR-ReIDは、DiNOv3バックボーンと境界反発ミックスアップを用いたプロトタイプベースのフレームワークを用いて、クラス間ジオメトリを明示的に学習します。", "このフレームワークは、徹底的なアブレーション研究により効果が確認され、個人および車両のReIDベンチマークで高い性能を達成しています。"]}], ["2026-10-25", "Real-Time Conveyor Belt Defect Detection via Edge TPU-Accelerated YOLOv11 on Raspberry Pi 5", "Raspberry Pi 5上のEdge TPUアクセラレーションYOLOv11によるリアルタイムコンベヤーベルト欠陥検出", "", "あり", "赤外線・熱画像", "バウンディングボックス", "", "", "", "", "", "", "", "", "●", "●", "", "", "", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34304", "summary": ["既存の欠陥検出モデルは消費電力の高いGPUに依存しており、遠隔の工業的エッジポイントでの実用的な展開を妨げています。", "YOLOv11nを用いて、3,000+の産業用サンプルで訓練され、Raspberry Pi 5上のGoogle Coral Edge TPUによって加速されたエンドツーエンドの低消費電力エッジAIシステムです。", "システムは30〜40 FPSを達成し、70〜90 msの遅延を達成し、エッジでのリアルタイム欠陥検出において従来の作業を上回ります。"]}], ["2026-10-25", "EditDistill: Is It Possible to Guide Video Editing with Image Editing?", "EditDistill:動画編集を画像編集で導くことは可能ですか?", "", "あり", "動画・画像・テキスト", "動画・画像・テキスト", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34303", "summary": ["ビデオ編集では、正確なローカル編集、動的な時間的効果、フレーム間の一貫した照明の制御性が欠けています。", "EditDistillは、画像レベルの視覚変換を編集記述子にまとめ、拡散モデルを用いた動画編集を導きます。", "この手法はベンチマークで高い性能を発揮し、多様なシナリオで高品質な結果を生み出します。"]}], ["2026-10-25", "ChronoReplay: One Answer Interface Is Not Enough for Streaming Spatial Intelligence", "ChronoReplay:空間知能のストリーミングには1つの回答インターフェースだけでは不十分です", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34283", "summary": ["既存の手法はインターフェースロックインの問題があり、一方の読み取りに集中すると他の方法に移行する妨げがあります。", "ChronoReplayは、異種空間監督を時系列順に再生し、家族間の監督のバランスを取るためのエピソードとして再現します。", "単一のチェックポイントで3つのベンチマークをOST-Benchで13.41ポイント改善し、最高の3つのベンチマーク平均を達成します。"]}], ["2026-10-25", "Robust Single-Parameter Point Cloud Registration using Truncated Lp Functions", "切断されたLP関数を用いた堅牢な単一パラメータポイントクラウドレジストレーション", "", "なし", "点群", "位置・対応関係", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34271", "summary": ["既存の手法は、現実世界の3D特徴照合において高い外れ値率に苦戦しています。", "TLPは、$p$が異なる短縮$L_p$関数を用いてスコアを割り当て、仮説を選択し、モデルを洗練させます。", "TLPは4つのデータセットにおいて、最先端の単一パラメータ手法よりも高い精度を達成しています。"]}], ["2026-10-25", "RacerGS: Residual-Autoregressive Context for 3D Gaussian Splatting Compression", "RacerGS:3Dガウススプラッティング圧縮における残差自己回帰コンテキスト", "", "なし", "3D ガウス", "3D データ", "", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34263", "summary": ["3DGSは大きなパラメータサイズを持ち、記憶と伝送を制限しています", "RacerGSはハッシュ投影とFiLM変調の自己回帰GRUを用いて3DGSを圧縮します", "RacerGSはバニラの3DGSで150倍、Scaffold-GSで28倍の圧縮を実現しています"]}], ["2026-10-25", "$Δτ$-Bench: Pushing Agents Toward a Moving Capability", "$Δτ$-ベンチ:エージェントを移動能力へと推し進める", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34238", "summary": ["既存のベンチマークは、エージェントが進化するツールエコシステムに適応できるかどうかを検証していません。", "Δτ-Benchは、42のドメインと6つの状態にまたがる1,588のタスクを持つツールエコシステムの進化をモデル化し、エージェントが変化するツールを発見し適応する能力を評価します。", "Stewardは、オーバーヘッドの削減、混乱したワークフローからのより良い回復、効率的な代替手段の採用により、タスク成功率を42.3%向上させます。"]}], ["2026-10-25", "ParetoGS: High-Quality Continuous-Budget 3D Gaussian Splatting with Sparse Adapted Anchors", "ParetoGS:高品質連続予算の3Dガウススプラッティングとスパース適応アンカー", "", "あり", "3D ガウス", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34235", "summary": ["既存の3Dガウススプラッティングモデルは、品質と予算の曲線が、各予算ごとに個別に最適化されたモデルに比べて遅れをとっています。", "ParetoGSは、少数の適応された予算アンカーとコンパクトな残差アトラスを用いてメンバー変化やパラメータの進化を記述し、中間予算を個別の最適化なしにデコードします。", "パレートGSは、比較手法ごとに10%の完全なモデルを割り当てたものよりも、より少ないガウス数でより良い平均PSNR、SSIM、LPIPSを達成します。"]}], ["2026-10-25", "BoundedGS: Memory-Efficient High-Resolution Training for 3D Gaussian Splatting", "BoundedGS:3Dガウススプラッティングのためのメモリ効率の高い高解像度トレーニング", "", "あり", "3D ガウス・画像", "3D データ", "", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34233", "summary": ["高解像度3Dガウススプラッティング訓練は、ピクセル数やガウスタイル交差点の増加によりメモリの制約に直面します。", "BoundedGSはラスタライズと投影を分離し、測定負荷に応じてアクティブな局所ラスタライズワークセットを境界化します。", "フルトレーニングでは平均レンダリング作業セットが9.97から1.76 GiB(82.3%)に減少します。"]}], ["2026-10-25", "CropReward: A Human-Preference Benchmark and Reward Model for Aesthetic Image Cropping", "CropReward:美的画像トリミングのための人間好みベンチマークと報酬モデル", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34221", "summary": ["既存のAIC評価手法は、人間の好みを反映する上で堅牢性と信頼性に欠けています。", "CropRewardはMLLMベースの報酬モデルで、候補作物を元の画像と比較して評価し、美的改善または劣化のスコアを出力します。", "CropRewardは既存の基準よりも人間の好みに大きく適合し、CropReward監督のみで最先端のAIC手法を上回ります。"]}], ["2026-10-25", "From Presence Labels to Bounding Boxes: Can Multimodal Large Language Models Scale Surgical Instrument Localization?", "プレゼンスラベルからバウンディングボックスまで:マルチモーダル大規模言語モデルは手術器具の局在化をスケールできるのか?", "", "なし", "画像・テキスト・動画", "ラベル・バウンディングボックス・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34218", "summary": ["既存の注釈は、完全な手順ではなく、選択されたフレーム、ビデオのサブセット、またはデータセットのバリアントをカバーすることが多いです。", "本論文は、手術用フレームや既存の器具存在ラベルを正確なバウンディングボックスに変換する、スケーラブルなMLLMベースの注釈フレームワークを提案しています。", "構造化多段階注釈パイプラインは0.784 mIoUを達成し、単一通話の最良の基準は0.735 mIoUです。"]}], ["2026-10-25", "StaX-Net: Stackelberg Interleaved Asymmetric Network for Cross-Modality Medical Image Translation", "StaX-Net:クロスモーダリティ医療画像翻訳のためのStackelbergインターリーブド非対称ネットワーク", "", "あり", "医用画像", "医用画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34214", "summary": ["クロスモーダリティ医療画像翻訳は、解剖学的に一貫性のない合成が臨床診断に影響を与えるため、課題に直面しています。", "StaX-Netは、部分結合されたエンコーダ-判別器構造と2D特徴集約および空間変換層を備えたStackelbergインターリーブド非対称ネットワークを使用しています。", "この手法は、Stackelbergに触発された非対称最適化スキームと2D特徴集約および空間変換レイヤーを用いることで改良されています。"]}], ["2026-10-25", "MIS-VQA: An Annotation-Driven Surgical Vision-Language Dataset for Complex Surgical Understanding", "MIS-VQA:複雑な外科的理解のための注釈駆動型外科視覚言語データセット", "", "なし", "画像・テキスト", "テキスト・ラベル・マスク", "", "●", "", "●", "", "", "", "●", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34210", "summary": ["既存の外科用VQAデータセットは、自然な記述的監督や注釈が乏しく、空間的推論や手続き的文脈の理解を妨げています。", "MIS-VQAは、注釈駆動のパイプラインを用いて、外科的注釈を視覚言語タスクのための構造化されたテキスト表現に変換します。", "MIS-VQAは空間監督と多層的推論評価を提供し、4つの応答タイプと信頼フィルタリング注釈で従来の研究よりも向上しています。"]}], ["2026-10-25", "Knowledge distillation across teacher architectures for compact diabetic retinopathy grading", "コンパクトな糖尿病網膜症のグレーディングのための教師アーキテクチャ間の知識抽出", "", "なし", "医用画像", "", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35961", "summary": ["資源制約のあるハードウェアでの糖尿病網膜症のグレード評価は困難です", "5つの教師アーキテクチャから生徒モデルへのオフライン応答ベースの知識抽出", "学生モデルは競争力のある性能で18.07倍のパラメータ削減を実現しました"]}], ["2026-10-25", "From Slices to Volumes: Comparing 2D, 2.5D, and 3D Residual Networks for Pulmonary Nodule Malignancy-Risk Classification", "スライスから体積へ:肺結節悪性腫瘍リスク分類における2D、2.5D、3D残留ネットワークの比較", "", "あり", "医用画像", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35960", "summary": ["既存の手法では、肺結節悪性腫瘍リスク分類のための2D、2.5D、3D残留ネットワークの比較が不足しています。", "本論文では、軸方向スライス、隣接スライス、局所CT体積を用いた2D、2.5D、3D残差ネットワークを、運動量コントラスト前訓練、軽度の増強、不確定評価の除外を比較しています。", "拡張2.5Dは最高テストのMacro-F1を達成し、2D()と3D()を上回る性能を発揮しました。"]}], ["2026-10-25", "Timing Matters Twice: When to Query and When to Skip in Flow-Matching On-Policy Distillation", "タイミングは二重に重要です:フローマッチングオンポリシー蒸留において、いつクエリし、いつスキップするかです", "", "なし", "画像", "画像・軌跡", "", "", "●", "●", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34191", "summary": ["既存の手法では、あらかじめ定義されたタイムステップ分布から監督状態を選択し、位相依存の差分が見落とされ、計算負荷が増加する可能性があります。", "PhaseOPDは、生成フェーズをオンラインで特定し、不要なロールアウトをスキップしながら教師にスーパービジョンを適応的に問い合わせるフェーズ認識フレームワークを導入します。", "PhaseOPDはSD3.5-Mのトレーニング時間を41.3%短縮し、16のローズアウトポジション中5.56件のみを実行することで、美学、GenEval、OCRスコアを向上させます。"]}], ["2026-10-25", "GeoPrompt: Geometry-Conditioned Prompt Learning for Underwater Open-Vocabulary Instance Segmentation", "ジオプロンプト:水中オープン語彙インスタンスセグメンテーションのための幾何条件プロンプト学習", "", "なし", "深度・画像・テキスト", "ラベル・マスク・テキスト", "", "●", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34190", "summary": ["水中環境は視覚的特徴を劣化させ、オープン語彙インスタンスセグメンテーションにおいて視覚と言語の整合性を信頼性に欠かせます。", "GeoPromptは、幾何学条件付きプロンプト学習を用いて、幾何学認識型テキスト分類器を生成し、深度由来の構造事前処理を用いて視覚的特徴を適応させます。", "GeoPromptはMARIS-OpenISベンチマークにおいて、水中オープン語彙インスタンスセグメンテーションにおいて最先端の性能を達成しています。"]}], ["2026-10-25", "Write What Matters: Disentangling Token Selection from Slot Allocation in Recurrent Memory", "重要なことを書く:リカレントメモリにおけるスロット割り当てからのトークン選択の解き分け", "", "なし", "テキスト", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34180", "summary": ["長系列モデルは、全注意のコストや固定スロットリカレントメモリモデルの限界により情報保持に課題があります。", "論文では、トークン選択とスロット割り当てを分離し、各トークンを保持するかスキップするかを決定し、固定またはトークン適応型スロット数を選択することで、分解書き込みルーティング(FWR)を提案しています。", "この手法は密度依存の精度逆転を実現し、1回の書き込みで4スロットの精度向上が高密度コンテキストで向上し、疎コンテキストではより良いディストラクタフィルタリングが見られます。"]}], ["2026-10-25", "Freeze What Is Settled, Cache What Is Smooth: Spatial Freezing Keeps Step Caching in Its Low-Error Regime", "確定したものを凍結し、滑らかなものをキャッシュする:空間凍結はステップキャッシュを低誤差の領域に保つ", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34177", "summary": ["既存の手法はステップキャッシュとリージョンフリーズを組み合わせていますが、速度を分割する原則的な方法がありません。", "論文では、1ステップあたりのコストモデルを用いて、凍結とキャッシュの速度アップを分割する方法を決定するFreezePlanを提案しています。", "FreezePlanは29.8 dBのPSNR速度向上を実現し、リージョンセレクターを切り替えた際にPSNRで従来の方法を0.5〜0.6 dB上回ります。"]}], ["2026-10-25", "Reinforcement Learning for Adaptive Crowd Flow Control Using Dynamic Barriers", "動的障壁を用いた適応型群衆の流れ制御のための強化学習", "", "なし", "イベントカメラ", "行動", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.34163", "summary": ["固定バリケードの配置は大規模な公共イベント中に不必要な停止や混雑を引き起こします。", "シミュレーション駆動型強化学習フレームワークは、コンピュータビジョンを用いてSACエージェントにラベル付きデータなしでバリア位置を調整する訓練を行います。", "この方針は歩行者の停止を減らしつつ流量調整を維持し、手動設計を上回る性能を発揮します。"]}], ["2026-10-25", "Humans in Space: Can MLLMs Construct Human-Centric Spatial Understanding via Active Exocentric Exploration?", "宇宙における人間:MLLMは能動的な外中心的探査を通じて人間中心の空間理解を構築できるのか?", "", "あり", "テキスト・画像", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34149", "summary": ["既存のMLLMは、空間的推論の限界と受動的観察への依存により、人間中心のシーンでの能動的な外中心的探求に苦戦しています。", "本論文は、複数ターンのQAペアとステップペナルティ報酬を通じて視覚的自己認識と能動的なビュー探索を評価するインタラクティブベンチマークSATE-Benchを提案しています。", "SATE-Benchは、受動的なベンチマークは能動的な探査を捉えきれず、GRPOのファインチューニングでは探索は増加するものの精度が低下していることが明らかになっています。"]}], ["2026-10-25", "MuSTEL: A Large-Scale Multilingual Synthetic Text-Line Image Dataset for OCR", "MuSTEL:OCR用の大規模多言語合成テキストライン画像データセット", "", "なし", "画像・テキスト", "ラベル", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34148", "summary": ["既存のOCRシステムは、正確なラインレベルの認識に十分な多言語かつ多様なトレーニングデータを持っていません。", "MuSTELは、多言語コンテンツ、多様なフォント、スタイル、視覚条件を持つ合成テキストライン画像を生成します。", "データセットには、多言語OCRシステムの訓練・評価のための1,450万枚の注釈付き画像と2,009のフォントファイルが含まれています。"]}], ["2026-10-25", "Reversion, Retention, and Semantic Intervention: Measuring Functional Content in CLIP Fine-Tuning Deltas", "回復、保持、そして意味的介入:CLIPファインチューニング・デルタにおける機能的成分の測定", "", "なし", "画像", "特徴表現", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34144", "summary": ["CLIP微調整中にどの重量がサポートタスクのパフォーマンスに影響を与えるかを特定することは依然として困難です。", "本論文は、リバートと保持を組み合わせて、CLIPモデルにおける微調整のデルタの機能的含みを評価しています。", "VOの更新は精度向上の43〜87%を回復し、VOとMLPの保持は事前学習済みの誤りの25〜81%を修正します。"]}], ["2026-10-25", "StickFigure: Enabling Pose-Only IoT Cameras for Privacy-Preserving Edge Vision", "スティックフィギュア:プライバシー保護のエッジビジョンのためのポーズオンリーIoTカメラの実現", "", "なし", "動画・画像・姿勢", "姿勢・ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.34130", "summary": ["既存のIoTカメラは、身体の動きタスクのために生のRGBフレームをエクスポートすることでプライバシーの詳細を露出しています。", "StickFigureは、起動認識型バックボーンと軽量な階層型MLPリファイナーを備えたポーズオンリーシステムを用いて、リソース制約のあるIoTカメラ上でコンパクトな骨格ストリームを抽出します。", "StickFigureは、RTMPose-Sベースのベースラインに比べてパラメータ数が96.5%少なく、MAC数が99.3%少ないことで、最高のポーズ精度とHARユーティリティを実現しています。"]}], ["2026-10-25", "RoboDuo: Attempt, Check and Atomic Recovery through Code for Vision-Language-Action Models", "RoboDuo:ビジョン・言語・アクションモデルのためのコードによる試み、チェック、原子復旧", "", "なし", "画像・テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34108", "summary": ["既存のVLAモデルは命令が完了しているかどうかをチェックできず、長期的なタスクで気づかれない失敗を引き起こしています。", "RoboDuoはコードをコーディングエージェントと2つのVLA間のインターフェースとして使い、タスク完了を試みて確認し、失敗したステップを原子スキルで復元します。", "RoboDuoはLIBEROおよびLIBERO-PRO上でX-VLAおよびπ₀.₅を向上させ、長期的な課題で最大の成果を上げています。"]}], ["2026-10-25", "LegoOcc++: Towards Consistent Open-Vocabulary 3D Occupancy Prediction", "LegoOcc++:一貫したオープン語彙3D占有予測に向けて", "", "あり", "3D ガウス・多視点画像・3D データ", "画像", "", "", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34093", "summary": ["屋内環境は、密集した遮蔽、複雑な幾何学、細かな長尾セマンティクスのため、オープン語彙3D占有予測に課題をもたらします。", "本論文は、言語埋め込みガウスを用いた幾何学のみの監督アプローチと、不透明度認識型ポアソンベースのガウス占有定式化およびインスタンスレベル意味的整合性を組み合わせることを提案しています。", "この手法は屋内外のベンチマークで強いオープン語彙占有率を達成し、フレームワークの有効性と一般性を検証しています。"]}], ["2026-10-25", "Learning the Autoregressive: Direct Score-Difference Estimation with Amortized Future Credit for Video Distillation", "自己回帰の学習:ビデオ蒸留のためのアモート化未来クレジットを用いた直接スコア差推定", "", "あり", "画像", "動画・画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34092", "summary": ["自己回帰動画生成のための少ステップ蒸留は、教師と生徒の訂正を直接推定し、将来の影響のために現在のチャンクに功績を割り当てる上で課題に直面しています。", "LetaはScoreDeltaを使用してノイズ除去残差から教師-生徒補正を推定し、futurecreditを使用して次のチャンク教師残差のベクトル-ヤコビ積から補助更新信号を学習します。", "LetaはVBenchでDMDを0.9ポイント、VideoAlignで0.66ポイント向上させ、さらにVBenchで1.6ポイント、VideoAlignで0.35ポイントのジェネレーター更新頻度が高くなっています。"]}], ["2026-10-25", "Doppler-aided Position-Velocity Tracking of Hidden Objects using mmWave Radar", "ミリ波レーダーを用いた隠れた物体のドップラー支援位置速度追跡", "", "なし", "レーダー・動画", "軌跡", "", "", "", "", "", "", "", "", "", "●", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34085", "summary": ["屋内環境での非視線追跡の既存の方法は、可視物体に依存しており、低解像度のmm波レーダーによる空間的曖昧さを抱えています。", "本論文は、3次元エンコーダとリカレントブランチを用いて、逐次距離方位ドップラー(RAD)レーダーデータから位置と速度を推定するドップラー支援追跡法を提案しています。", "この方法は、保持軌道上で8.95cmの位置誤差と1.75cm/sの速度誤差を達成し、ドップラー情報を破棄する従来の方法よりも優れています。"]}], ["2026-10-25", "BEHAVIOR-Spatial Benchmark: Evaluating Spatial Understanding for Robotics", "BEHAVIOR-空間ベンチマーク:ロボティクスにおける空間理解の評価", "", "あり", "画像・テキスト", "行動・テキスト", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34051", "summary": ["既存の研究では、課題完了と並行して空間指導の評価が不足しています", "BEHAVIOR-空間ベンチマークは空間的な質問応答、ポイントベースのターゲットグラウンド、ロボットの動作を測定します", "オラクルの視覚的ターゲット手がかりは、ホールドアウトの設定精度を41.6%から60.3%に向上させます"]}], ["2026-10-25", "What Sketches Tell Us about LVLMs: Conventions, Grounding, and Localisation", "スケッチがLVLMについて語ること:コンベンション、グラウンディング、ローカライゼーション", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34037", "summary": ["LVLMベンチマークでは、モデルが保持している視覚的な規則や、それらの規則がどこにあるかを明らかにできません。", "3つの読み取り結果を持つトレーニングフリーのスケッチプローブは、スケッチ内の部分順序、注意、グラウンディングロクスのLVLMを評価します。", "3つの発見は、部分的な順序が人間の慣習を追跡し、部分レベルの接地が抽象化に耐え、接地信号が狭い中間ネットワーク帯に集中していることを示しています。"]}], ["2026-10-25", "Fovea-JEPA: Overcoming Geometric Blind Spots in V-JEPA for Camera Motion Recognition", "Fovea-JEPA:カメラ動作認識におけるV-JEPAにおける幾何学的盲点の克服", "", "公開予定", "動画", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34033", "summary": ["カメラの動き認識は、V-JEPAのような既存の手法で表現が不足しているため、幾何学的な手がかりに苦労しています。", "Fovea-JEPAはV-JEPAを基盤として、VGGTを幾何学の専門家として用いて、予測誤差から介入疑似ラベルを生成し、盲点検出のためのトークンごとの応答マップを作成し、視覚的・幾何学的特徴の適応融合を行っています。", "Fovea-JEPAは、CameraMotionDataset、CameraBench、ShotBenchの最新ベースラインと比較して9.67、8.67、24.38ポイントの上昇を達成しています。"]}], ["2026-10-25", "Explaining Navigation Decisions: Stage-Aware Visual Attribution for Vision-Language Navigation", "ナビゲーション決定の説明:視覚言語ナビゲーションのためのステージ認識視覚帰属", "", "なし", "テキスト・画像", "テキスト", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34028", "summary": ["既存の説明可能性手法は、VLNにおける過去および現在の観点にまたがる分散証拠の課題を見落としています。", "私たちは、アクション条件付き時間的指示-視覚的帰属を構築し、それを指示空間に投影して段階連合を推定する段階認識型帰属フレームワークを提案します。", "複数のVLNポリシーやベンチマークにおいて、既存手法に比べて帰属の質が向上したことが実験で示されています。"]}], ["2026-10-25", "Hybrid Mamba-Transformer Network for Single-Shot 3D Reconstruction from Fringe Patterns", "フリンジパターンからの単一ショット3D再構築のためのハイブリッドマンバ-トランスフォーマーネットワーク", "", "なし", "画像", "3D データ", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33988", "summary": ["単一の高周波フリンジ画像から正確な3D再構成を行うことは、長距離空間的一貫性と細かい幾何学的ディテールの両方を保つ必要があるため、依然として困難です。", "SwinベースのU字型アーキテクチャと可視状態空間モデリング、特徴符号化のためのADVSSブロックを組み合わせたハイブリッドマンバ-トランスフォーマーネットワークが提案されています。", "この方法はUHRNetおよびHiDNetと比較してRMSEを65.2%および59.6%削減し、RMSEは0.548mm、SSIMは0.9985となります。"]}], ["2026-10-25", "InteractiveWorld: A Verifiable Human-Centric Environment for Building Better Interactive MLLM Assistants", "InteractiveWorld:より良いインタラクティブMLLMアシスタントを構築するための検証可能な人間中心の環境", "Meta", "なし", "テキスト・画像", "テキスト", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33966", "summary": ["自己中心的なAIアシスタントのテストは、実際のインタラクションデータが不足しているため難しいです。", "InteractiveWorldは、人間エージェントが指示を観察し行動する人間とAIの相互作用をシミュレートする検証可能な環境です。", "InteractiveBenchは、120のマルチターンタスクを持つ動的ベンチマークで、物理世界のタスクにおけるMLLMの評価に対して検証可能で状態ベースの報酬を提供します。"]}], ["2026-10-25", "Accuracy Is Not Enough: An Efficiency- and Statistics-Aware Benchmark of ResNet50 and Vision Transformer for Explainable Multi-Class Gastrointestinal Diseases Classification", "精度だけでは足りない:ResNet50とVision Transformerによる説明可能な多クラス消化器疾患分類のための効率と統計を重視したベンチマーク", "", "なし", "医用画像", "ラベル・医用画像・画像", "", "", "", "", "", "", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33965", "summary": ["既存の研究では、効率や統計を無視して、正確さだけに基づいてアーキテクチャを選ぶことが多いです。", "本論文は、階層化された分割とクロスバリデーションを用いて公開データセット上でResNet50とViT-B/16をベンチマークし、精度、効率、キャリブレーションを比較しています。", "ResNet50はパラメータ効率でViT-B/16を3.6倍、動作効率で4.3倍の性能を発揮し、同様の較正で達成しました。"]}], ["2026-10-25", "Continual Learning Exam: Benchmarking Long-Horizon RSI and Experiential Learning in LLM Agents", "継続的学習試験:LLMエージェントにおける長期的RSI(長期的評価)と体験学習のベンチマーキング", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33956", "summary": ["現在の評価は、長期的な学習における経験に基づく改善よりも、個々のタスクの成果に焦点を当てています。", "本論文では、12のドメインにわたり600レベルに分けられた120の人間主導タスクを対象としたベンチマークCLEを紹介し、エージェントが次のレベルを解除するために通過する必要があります。", "フィードバックと復習により中央値の完成度は5.3ポイント向上しますが、最高のシステムは47.7%のレベルをクリアするにとどまります。"]}], ["2026-10-25", "TurboWAM: Learning What Matters for Fast World Action Models", "TurboWAM:Fast World Action Modelsにとって重要なことを学ぶ", "Huawei", "なし", "画像・動画", "画像", "", "", "", "", "", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33941", "summary": ["高い推論遅延は、ワールドアクションモデルの実際の展開を制限します。", "TurboWAMはアクション予測に基づく構造化された世界表現を集約し、推論中の計算負荷を削減します。", "TurboWAMはワールドモデル層数とキャッシュ表現の数を減らし、競争力のある性能で低遅延を実現しています。"]}], ["2026-10-25", "Texture-Aware Strategies for Subregion Style Transfer Augmentation", "サブリージョンスタイルのトランスファー増強のためのテクスチャ認識戦略", "", "なし", "画像", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33910", "summary": ["既存の手法では、情報豊かなテクスチャパターンをカバーできず、増強の多様性も制限されています。", "テクスチャ応答力の高い領域を優先し、ハイブリッド領域戦略で拡張するテクスチャ認識型サブリージョンスタイルの拡張フレームワークを提案します。", "このアプローチは、既存のスタイルベースの拡張手法と比べて、より高い分類精度と堅牢性の向上を実現しています。"]}], ["2026-10-25", "Rank-1 Weight-Corrected Trainable Weight Averaging for Out-of-Distribution Detection", "ランク1 重み補正可鍛錬可能重み平均(Rank-1 Weight-Corrected Trainable Weight)による分布外検出", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33909", "summary": ["既存のOOD検出手法は、特徴空間や重み空間における支配的な低ランク成分の過信に苦しんでいます。", "訓練可能な重み平均化は、SVDによって抽出されたランク1の重み成分を補正方向として拡張し、分布内分類を通じて学習します。", "この手法は、MSPおよびRankWeightを用いた評価データセットにおいて、Outlier Exposureの有無にかかわらず、ファインチューニングや標準TWAよりも改善されています。"]}], ["2026-10-25", "WMEval: Evaluating Interactive World Models Grounded on Physical Simulations", "WMEval:物理シミュレーションに基づくインタラクティブな世界モデルの評価", "", "あり", "テキスト", "動画", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33894", "summary": ["既存のベンチマークは、現実世界の効用のための物理的・因果的な一貫性よりも知覚の類似性に焦点を当てています。", "WMEvalはUnityシミュレーションを地につなげたオラクルとして用いて、物理的・因果的な側面で世界モデルを評価しています。", "最先端モデルでの実験は、標準的な知覚指標で隠れているが実際の展開に不可欠な次元において、改善の余地が大きいことを明らかにしています。"]}], ["2026-10-25", "Semantic Concept Steering Breaks the Explanation Drift Loop in Continual Learning", "意味概念ステアリングは継続学習における説明ドリフトループを断ち切る", "", "なし", "", "特徴表現", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33877", "summary": ["継続的な学習における壊滅的な忘却は説明ドリフトを引き起こし、モデルが予測精度を維持しながらも偽の相関に注意を移します。", "C$^3$Lはオフラインで発見されたクラス整合性のある意味概念を用いて顕著性を正則化し、人間の注釈なしに自己言及的なドリフトループを断ち切る。", "C$^3$Lは、精度、忘却、説明の質、偽相関軽減、流通外の堅牢性の面で最先端の性能を達成しています。"]}], ["2026-10-25", "Stable Dimensionality Reduction via Isometric Centroid-Encoder", "アイソメトリック・セントロイド・エンコーダによる安定次元削減", "", "なし", "画像", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33872", "summary": ["既存の手法にはクラスジオメトリに対する明示的な制約がなく、実行ごとにクラス配置にばらつきが生じています。", "アイソメトリック・セントロイド・エンコーダー(ICE)は、所定のペアワイズクラス・重心幾何学を保持しつつ、潜在空間におけるクラス重心を学習します。", "$M$クラスを表現するために必要な内在次元は最大で$M〜1$であり、距離保持飽和を説明しています。"]}], ["2026-10-25", "RelateGS: Reliable Semantic and Relational Evidence for 3D Scene Understanding with Gaussian Splatting", "RelateGS:ガウススプラッティングを用いた3Dシーン理解のための信頼できる意味論的および関係的証拠", "", "なし", "3D ガウス・多視点画像・動画", "3D データ", "", "", "", "", "●", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33868", "summary": ["関係認識的なグラウンディングは、3D視覚的グラウンディングのために、信頼性が高く十分なシーン側の証拠に依存しています。", "RelateGSは言語認識型ガウス表現を用いて、3D視覚的グラウンディングの際に意味論的および関係性の証拠を選択的に洗練させます。", "RelateGSは、Sr3D+およびNr3Dでそれぞれ3Dの地上性能を7.9ポイント向上させ、Nr3DでそれぞれAcc@0.25ポイント向上させています。"]}], ["2026-10-25", "Late Breaking Results: Audio-Language-Action Models with Direct Speech Conditioning for Robotic Manipulation", "遅れて発表された結果:ロボット操作のための直接音声条件付けを用いた音声・言語・行動モデル", "", "なし", "画像・テキスト", "音声・テキスト・行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33866", "summary": ["既存のロボット操作用VLAモデルは、音声からのテキスト書き起こしが必要であるため、遅延や誤差伝播が伴います。", "Speech-π₀.₅は、生の音声をクロスモーダル投影と分割LoRA適応を用いて、2段階のトレーニングを用いて直接運動指令にマッピングします。", "具体的には、$π_{0.5}$を基に、クロスモーダル投影を使って音声フレームを直接音声トークンに変換し、応答遅延を大幅に削減します。"]}], ["2026-10-25", "TrackTok: Object-Centric Video Tokenization with Semantically Persistent Tokens", "TrackTok:意味的に永続トークンを用いたオブジェクト中心のビデオトークン化", "", "あり", "動画・画像", "動画・画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33857", "summary": ["既存のトークナイザーはトークン識別子を固定された画像位置に結びつけており、時間を超えた一貫した意味的オブジェクトの維持に失敗しています。", "TrackTokは、フレームを超えた視覚的特徴を安定した意味単位に結びつける時間的に永続的なオブジェクト中心表現を学びます。", "TrackTokは、下流生成モデルに必要なトークン数を8倍削減しつつ、UCF-101で同等の品質を維持します。"]}], ["2026-10-25", "Grounding on Request: Learning Modality Control in Vision-Language Models", "要請に基づく基盤づくり:視覚言語モデルにおけるモダリティ制御の学習", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33841", "summary": ["既存の手法では、画像とキャプションが一致しない場合にVLMがどのモダリティに従うかを確実に特定できません。", "本論文は、Flip and Stay指標を用いた対立保存反事実介入によるモダリティコントロールの根拠を提案し、学習モダリティ語を用いた反事実ツインマージン(CTM)監督を導入しています。", "習得されたモダリティ語は自然言語指令の制御を向上させ、各モダリティごとに単一の埋め込みで強力な軽量な視覚制御を提供します。"]}], ["2026-10-25", "Grounded Exploration for Open-Ended Image Editing", "オープンエンドの画像編集のためのグラウンディング・エクスプローション", "", "なし", "画像", "画像・テキスト", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33810", "summary": ["既存の手法では、オープンエンドな画像編集において、地に足のついた多様なバリエーションを生み出すことができていません。", "多様な編集範囲を特定し、実行可能な編集命令を生成する2段階のフレームワークです。", "直接的多様性プロンプティングよりも平均意味分散が24.6%高く、平均地に足がつきが17.1%高い。"]}], ["2026-10-25", "ProMo3D: Probing Motion Cues in Frozen 3D Foundation Models", "ProMo3D:凍結3D基礎モデルにおけるプロービングモーションキュー", "", "なし", "多視点画像・動画", "マスク", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33802", "summary": ["動的な4D理解は、大規模なモーションスーパービジョンや手作りのヒューリスティックに依存します", "プロービングベースのモーションディスティレーションは、凍結された3D基礎モデルトークンを用いてモーションステート適合スコアを高密度モーションマスクに変換します", "PMDはトレーニング不要のヒューリスティックを上回り、はるかに重い監督・自己監督手法を採用します"]}], ["2026-10-25", "Whispers from the Neighbors: Rethinking Caption Consensus as Inference-Time Evidence for Vision-Language Retrieval", "隣人からの囁き:視覚言語検索のための推論時間証拠としてのキャプション・コンセンサスの再考", "", "あり", "テキスト", "画像・ラベル・テキスト", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33798", "summary": ["既存の手法では、画像とキャプションのペアを検索時に分離し、隣接するキャプションの潜在的な貢献を無視しています。", "論文では、推定時に凍結エンコーダを用いた際に画像の類似性とキャプションの類似性を融合させることを提案しています。", "同じ注釈者からのキャプションを融合させることで、9つのエンコーダーでテキストと画像の対R@1が3.4ポイントから16.8ポイント向上します。"]}], ["2026-10-25", "One Scan is Enough: Demonstration-Free Adaptation for Language-Guided Navigation", "ワンスキャンで十分:言語誘導ナビゲーションのためのデモンストレーションなし適応", "", "なし", "テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33794", "summary": ["既存の方法は、レイアウトや外観、言語のドリフトのために新築建物での適応に苦労しています。", "Scan2Instructionは単一のiPhoneスキャンでトレーニング環境を作成し、PRPT-KSはクローズドフォームのパレートユーティリティを使ってこのポリシーを適応させています。", "この手法は実際の環境で85%の成功率を達成しており、人間実験で訓練後訓練されたベースラインでは49%と比べて高いです。"]}], ["2026-10-25", "Segmentation of Moving Objects During Camera Motion Using the OWL Function", "カメラの動き中の動く物体のOWL関数によるセグメント化", "", "なし", "深度・画像", "画像・マスク", "", "●", "", "", "●", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33789", "summary": ["既存の手法では、カメラの動き中に動く物体を訓練データや深度情報なしで分割するのに苦労しています。", "本論文は、OWL関数を用いて運動手がかりから相対的な平行移動方向を復元し、分割を行う枠組みを提案しています。", "このフレームワークは、3D四元数と2D複素OWLを用いて、トレーニングデータ、深さ、意味論的事前処理を行わずにセグメンテーションを実現します。"]}], ["2026-10-25", "RoboReason: Boosting Robotics-Relevant VLM Reasoning Through Scalable Data Generation", "RoboReason:スケーラブルなデータ生成によるロボティクス関連VLM推論の強化", "", "なし", "テキスト・画像", "テキスト", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33778", "summary": ["下流のロボティクスタスクにおけるVLM能力の実世界評価は、スケールアップが困難かつコストがかかります。", "時空間的順序付けタスクにおけるVLM推論性能を向上させるスケーラブルな自律型トレーニングデータ生成パイプラインを提案します。", "生成されたデータに対する教師ありの微調整および強化学習は、時空間的および下流のタスクにおけるVLMのパフォーマンスを大幅に向上させます。"]}], ["2026-10-25", "C-DFF: Concept-Level Diagnostics for Mechanism Parity in Simulation-Based Validation of Autonomous Driving Perception", "C-DFF:自動運転知覚のシミュレーションベースの検証におけるメカニズムパリティの概念レベルの診断", "Siemens", "なし", "画像", "マスク・画像", "", "●", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33760", "summary": ["自動運転の知覚のシミュレーションベースの検証は、実際のデータと合成データの間にメカニズムのパリティを欠いています。", "C-DFFは概念レベルの診断を用いて、セグメンテーションと概念重要度ベクトルを用いて、共有された意味空間内の実際のデータと合成データを比較します。", "C-DFFは、3つのSUTを持つ2126組のマッチングペアに対してスカラー機構パリティスコアと概念シフト診断を提供します。"]}], ["2026-10-25", "Road Infrastructure Perception for Autonomous Driving: Taxonomy, Representations, Tasks, and Challenges", "自動運転における道路インフラの認識:分類、表現、課題、課題", "", "なし", "画像", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33758", "summary": ["既存の研究には、道路インフラ認識のための統一されたタスク定義、センシング仮定、評価プロトコルが欠けています。", "本論文は、道路インフラの知覚を幾何学的・構造的・機能的・空間的・規制的意味的カテゴリーに分類する機能指向の分類を提案します。", "この調査は、メトリック、ベクトル化、トポロジー認識、占有ベース、ルールに基づくシーンモデリングを重視することで、この分野を前進させます。"]}], ["2026-10-25", "Computer Vision Navigation for an Autonomous Vehicle Model Using Reinforcement Learning", "強化学習を用いた自律走行車モデルのコンピュータビジョンナビゲーション", "", "なし", "動画・画像", "行動", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33755", "summary": ["既存の手法は強化学習を用いた複雑な環境での堅牢なナビゲーションに苦労しています。", "本論文は、カメラ入力に基づいてシミュレート環境内で車両モデルの速度とステアリング角度を制御するために、近接政策最適化(PPO)を用いることを提案しています。", "PPOは、ハイパーパラメータ調整が少ない状況で先行アルゴリズムを上回る性能を発揮します。"]}], ["2026-10-25", "A SegFormer-based model for spatial Daylight Factor prediction with comprehensive obstruction encoding and regulatory validation", "包括的な障害符号化と規制検証を備えた空間的日光因子予測のためのSegFormerベースのモデル", "", "なし", "", "数値", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33737", "summary": ["既存の手法は、レイトレーシングシミュレーションに時間がかかるため、反復的なアーキテクチャ設計への統合を制限しています", "SegFormerベースのモデルは、包括的な障害符号化と規制検証を用いて空間的デイライトファクターを予測します", "このモデルは合成データで83.4%のδ₁、0.11%のMAEを達成し、実際の建物では1%未満のDF MAEを達成しています"]}], ["2026-10-24", "Traffic-Context-Aware Driver Emotion Recognition with Expectation-Deviation-Driven Inference", "期待偏差駆動推論による交通状況認識ドライバーの感情認識", "", "なし", "画像", "軌跡・ラベル", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.33713", "summary": ["既存の方法は、周囲の交通とのやり取りがドライバーの感情反応にどのように影響するかを見落としています。", "TADERはキャビン内の信号とキャビン外の交通シナリオを統合し、予測された車両軌道と観測された軌道間の期待偏差を通じて感情をモデル化します。", "TADERは交通コンテキスト統合を通じてAIDEおよびmanDデータセットの精度を5%向上させます。"]}], ["2026-10-24", "E3tereo: Improving Stereo Matching at Depth Boundaries with Learned Geometric Edges", "E3tereo: 学習した幾何学的エッジを用いた深度境界でのステレオマッチングの改善", "", "公開予定", "深度・画像", "位置・対応関係", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33704", "summary": ["深度境界はステレオマッチングに大きな誤差を引き起こします。", "E3Stereoは、ディスパリティ監督から幾何学的なエッジを学習し、それをディスパリティや画像の詳細と組み合わせて、ディスパリティ補正を予測します。", "E3Stereoは、深度境界での終端誤差を9.5%〜14.3%削減し、IGEVを11の指標で改善しています。"]}], ["2026-10-24", "Seeing the Options: Typed Decisions over Visual Candidates with Reusable Option Memory", "オプションの見方:再利用可能なオプションメモリを持つ視覚候補に対するタイプされた決定", "", "あり", "画像・テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33702", "summary": ["既存のモデルは順序不変性を維持できず、候補が画像の場合に候補計算を再利用します。", "Irisは状態の後に各候補をエンコードし、フォークされたキャッシュを使って順序不変性を維持し、計算を再利用します。", "Irisは画像候補においてOneJevより37倍速い遅延で92.1/87.0/90.2%の精度を達成しています。"]}], ["2026-10-24", "Scalable Unrolled Chains for MRI Reconstruction", "MRI再構築のためのスケーラブルアンロールドチェーン", "", "あり", "医用画像", "3D データ", "", "", "", "", "", "", "", "", "●", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33695", "summary": ["標準的なエンドツーエンドトレーニングは、MRI再構築におけるカスケードの数と幅が増えるにつれてメモリ負荷が増します。", "ランダムにサンプリングされたカスケードを更新しつつ、最終的な再構築損失からの監督を維持しつつ、メモリ効率の高いトレーニングフレームワークです。", "このフレームワークは、パラメータ数が少なく、ピークメモリが低く、反復ごとに速い訓練を行うことで、他の局所的なMRI再構築手法よりも優れた性能を発揮します。"]}], ["2026-10-24", "PathKGen: Pathology Knowledge Assisted MLLM for Explainable Histopathology", "PathKGen:説明可能な組織病理学のための病理知識支援MLLM", "", "なし", "画像・テキスト・姿勢", "テキスト", "", "", "", "●", "", "", "", "●", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33691", "summary": ["MLLMは組織病理報告書作成におけるブラックボックス推論により知識と推論を制限します。", "PathKGenは知識グラフを用いて、MLLMに構造化された病理学知識を注入し、可視な推論を実現します。", "PathKGenは、視覚的なグラフを通じて診断推論を明らかにすることで、従来のSOTA手法を凌駕しています。"]}], ["2026-10-24", "Rescuing Your Pruning: Rethinking Visual Token Pruning and Post-Training Recovery in MLLMs", "剪定の救済:MLLMにおける視覚トークン剪定とトレーニング後の回復の再考", "", "公開予定", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33688", "summary": ["既存のビジュアルトークンプルーニング手法はトレーニング不要でプラグアンドプレイであり、パフォーマンス損失を圧縮の必然的なコストとして扱っています。", "本論文は、訓練後の回復と関節圧縮を調査し、大規模なデータセットをキュレーションし、複数の構成をテストしてトークン保持と除去を最適化することで、剪定を再考しています。", "トレーニング後の処理で損失の大部分が救われ、関節圧縮はエンコーダーに40%のトークンを残す方がプロジェクターに10%残すよりも速く動作することが示されています。"]}], ["2026-10-24", "EXE: Egocentric Cross-Embodiment Pretraining via Factorized Latent Actions for VLA Models", "EXE:VLAモデル向けの因数分解潜在アクションによる自己中心的なクロスエボディメント前学習", "", "なし", "動画・画像・テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.33685", "summary": ["VLAモデルはロボットデータの不足によってボトルネックとなっています", "EXEは、自己中心的な人間の動画から因数分解された潜在行動表象を学習し、共有操作の事前処理と身体特異的信号を分離するフレームワークを提案します", "EXEは、RoboTwin2.0、RoboCasa GR1、および実際の操作タスクの事前トレーニングなしで、ベースライン以上の一貫した利益をもたらします"]}], ["2026-10-24", "Tracking Is Not Sensing: Artifact-Aware Thermal Video Respiration Estimation in Head-Free Marmosets", "追跡は感知できない:ヘッドフリーマーモセットにおけるアーティファクト認識型熱ビデオ呼吸推定", "", "なし", "赤外線・熱画像・動画", "軌跡・動画", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33661", "summary": ["頭のないマーモセットの呼吸は弱く局所的で、動きや毛に汚染されているため、従来の追跡は生理的感覚には信頼性が低い。", "本論文では、訓練中の高運動熱不連続を減衰させ、呼吸に整合した動態にモデルを整合させるSTAR正則化技術を提案しています。", "STARは頭部フリー推定を改善し、追跡ROI分析の20.76 bpmに対し、MAEは2.23 bpmと達成しています。"]}], ["2026-10-24", "FreeView: Robust 3D Reconstruction from Uncurated Views", "FreeView:Uncurated Viewからの堅牢な3D再構築", "", "なし", "画像・3D データ", "3D データ", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33656", "summary": ["キュレーションされていない画像コレクションは、無関係または重複しないビューのために3D再構築に課題をもたらします", "FreeViewはコレクションレベルのコンセンサスを用いて代表的なビューをリファレンスとして選び、視覚的および幾何学的な証拠を補完的に適用しています", "FreeViewは、手動キュレーションやキャリブレーションなしで高いクリーンビュー保持率と妨害除去率を実現しています"]}], ["2026-10-24", "PreView: Enhancing GUI Grounding with Preprocessed Views and Cues", "PreView:事前処理されたビューやキューによるGUIグラウンディング強化", "", "なし", "画像・テキスト", "位置・対応関係", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33645", "summary": ["既存の手法は、混沌としたGUIスクリーンショットで曖昧なターゲット識別に苦労しています。", "PreViewは、グラウンディングされたモデルの入力を再学習せずにビューやキューを前処理し、入力を洗練させます。", "PreViewは、追加のトレーニングなしで5つのベンチマークにおける平均グラウンディング精度を向上させます。"]}], ["2026-10-24", "LENS: Likelihood Evaluation and Neighbor Smoothing for Attribute-Based Person Retrieval on Unseen Cameras", "レンズ:見えないカメラにおける属性ベースの人物検索のための尤度評価と近傍平滑化", "", "なし", "テキスト", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33641", "summary": ["属性ベースの人物検索は、見えないカメラでは確率分布の変化によりmADMが低下します。", "LENSは、グループのクロスエントロピー、対数尤度スコアリング、およびDINOV3機能を使用したkNNスムージングを使用して、微調整されたDinov3モデルとCLIPモデルを蒸留スチューデントと組み合わせています。", "3つの変更によりmADMが上昇しました:尤度スコアは6つの指標を改善し、トレーニングフリーのkNN平滑化は46モデルを改善しました。"]}], ["2026-10-24", "UniQuery: Unifying Vision Models with a Joint Query Head for Cross-Domain Pedestrian Attribute Recognition", "UniQuery:クロスドメインの歩行者属性認識のための視覚モデルの統合", "", "なし", "画像・テキスト", "ラベル・テキスト", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.33639", "summary": ["ドメイン間の細かな属性を正確に認識することは、遮蔽、外観の変動、画像分布の変動により依然として困難です。", "UniQueryは、2つのクエリヘッドと両方のエンコーダからのトークンに対応する共同クエリヘッドを用いて、属性特異の融合のためにDINOv3とCLIPを共同で微調整します。", "UniQueryは、保留されたデータセットの両方で独立アンサンブルをChallenge_Avg上回る性能を発揮します。"]}], ["2026-10-24", "DROA-CLIPSeg: Prompt-Guided Thin Crack Segmentation in Low-Light Conditions", "DROA-CLIPSeg: 低照度条件下でのプロンプトガイド型薄手亀裂分割", "", "あり", "画像", "テキスト・画像・マスク", "", "●", "", "", "", "", "", "", "● ": "https://www.alphaxiv.org/abs/2610.33430", "summary": ["既存のDESTRベースの微小オブジェクト検出器はクエリ数と選択を絡め、利点を曖昧にし、動的クエリ設計を複雑にしています。", "論文ではこれらの効果を解き明かし、軽量で学習されない予算管理ツールを用いてオブジェクト密度に基づいてデコーダクエリ容量を割り当てる予算管理原則を提案します。", "BUTRはAI-TOD-v2で47.8 FPSで35.7 APを達成し、軽量予算でVisDroneで42.1 FPSで29.8 APを達成しています。"]}], ["2026-10-24", "How Robust Are CNNs and Vision Transformers for Alzheimer's MRI Classification Across Datasets?", "CNNとビジョントランスフォーマーは、アルツハイマー病のMRI分類においてどの程度の堅牢なデータセットを持っているのでしょうか?", "", "なし", "医用画像", "ラベル", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33416", "summary": ["既存の手法では、単一データセットでのモデル性能が一貫した挙動を反映しているのか、それともデータセット固有の効果を反映しているのかを判断するのに苦労しています。", "クラス不均衡と分布の不一致を持つ3つのMRIデータセットにおける5つのアーキテクチャを比較し、標準化された前処理と評価を備えたマルチデータセットのベンチマーキングフレームワークを提案します。", "ViT-Largeは3つのデータセットすべてで最大99.84%の精度と99.86%のマクロF1を達成し、分布ミスマッチにおいて他のアーキテクチャを上回ります。"]}], ["2026-10-24", "AV-FABLE: Audio-Visual Manipulation Forensics in Long-Form Videos", "AV-FABLE:長尺動画における視聴覚操作法医学", "", "公開予定", "動画", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.33413", "summary": ["長尺動画における局所的なAI操作は短いイベントに影響を与え、動画レベルの分類では法科学的分析には不十分です。", "AV-FABLEは、16,650組の純正操作された双子ペアを用いたオープンシーン長尺の音響映像ビデオにおけるスパース操作のためのデュアルタイムラインベンチマークを導入しました。", "NFSRは、ドメイン内および3つのアウトオブディストリビューション環境で最高の視聴覚ローカリゼーション性能を達成しています。"]}], ["2026-10-24", "Bidirectional Cross-frequency Domain Interaction Network for UHD Low-Light Image Enhancement", "UHD低照度画像強調のための双方向クロス周波数ドメイン相互作用ネットワーク", "", "なし", "画像", "3D データ", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33402", "summary": ["既存のUHD低照度画像強調手法は、補完的な空間周波数情報や周波数間での照明と構造情報の関係を共同で活用できず、照明の不均一性、残留ノイズ、細部アーティファクトを引き起こしています。", "本論文は、デュアルドメイン特徴相互作用(DFI)モジュールをマルチスケールの事前学習VAE表現に組み込み、低周波と高周波の特徴間の相互強化を行う双方向クロス周波数ドメイン相互作用ネットワーク(BiFreqNet)を提案しています。", "BiFreqNetは、4つの一般およびUHD LLIEベンチマークにおいて、最先端手法と比較して競争力あるまたは優れている性能を達成しています。"]}], ["2026-10-24", "Rethinking Micro いて、拡散モデルを用いて動画からヒューマノイドの動きを直接生成し、ジェネレーターにモーショントラッキングフィードバックを後処理します。", "ViT-Hは動作の品質と実行可能性において従来の研究を上回っており、モデルサイズやデータスケールに対して有利にスケールします。"]}], ["2026-10-24", "Flownomaly: Single-Step Conditional-Mean Recovery for Few-Shot Anomaly Detection", "フローノマリー:少ショット異常検出のための単一ステップ条件付き平均回復法", "", "あり", "画像・テキスト", "ラベル・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32964", "summary": ["少ショットの産業異常検出は、欠陥のない数枚の画像からカテゴリ特有の正規性をモデル化する必要があります。", "フローノマリーは、凍結されたDINOv2特徴空間における正規対応の回復として問題を位置づけ、条件付きフローマッチングを通じて凍結パッチトークン上で速度場を学習し、ガウスノイズを正規特徴量に移します。", "Flownomalyは、VisAの最強ベースラインに比べて画像レベルのAUROCが2.1ポイント改善し、最新のカテゴリー別手法に対して最先端の性能を達成しています。"]}], ["2026-10-24", "Beyond Discrete Tokens: Preserving Numerical Continuity in Medical Vision-Language Models", "離散トークンを超えて：医療ビジョン言語モデルにおける数値連続性の維持", "", "なし", "画像・テキスト", "医用画像・テキスト", "", "", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32948", "summary": ["既存の研究は、医療視覚言語モデルにおける連続測定ターゲットと離散トークンベースの数値予測の不一致に苦慮しています。", "HAD-VLMは、自己回帰テキスト生成と連続的測定予測を組み合わせ、ハイブリッドな自己回帰拡散フレームワークと視覚的プロンプトチューニングを用います。", "HAD-VLMは、Vicunaベースの自己回帰ベースラインと比較して、4つの心エコー測定課題において平均絶対誤差を21.4〜37.6%削減します。"]}], ["2026-10-24", "STROKE: Simple Sparse Structural Occlusions for Black-Box Adversarial Attacks", "ストローク:ブラックボックス敵対攻撃のための単純なスパース構造的遮蔽", "", "なし", "画像・テキスト", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32932", "summary": ["既存のブラックボックス対抗攻撃には効率と効果に限界があります。", "STROKEは、単純な方向付けの長方形オクルージョンと軽量な貪欲な加算・精錬手法を用いて摂動を最適化します。", "STROKEは低いクエリ数で高い攻撃成功率を達成し、既存のパッチベースの攻撃に比べてウォールクロック攻撃時間を短縮します。"]}], ["2026-10-24", "LoCA: Enabling Multi-Modality in Geospatial Location Encoders", "LoCA:地理空間位置エンコーダにおけるマルチモーダリティの実現", "", "なし", "衛星・航空画像・多視点画像", "特徴表現", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32894", "summary": ["既存の位置エンコーダは構造的に内在次元が最大2に制限されており、コントラスト損失は漸近的最適値を超えなければなりません。", "LoCAは2段階のパイプラインを使用しています。ステージ1はSentinel-1とSentinel-2のエンコーダを共同で訓練し、高ランクのマルチモーダルターゲットを対象にします。ステージ2では位置情報と表状メタデータエンコーダを投影アダプターとして訓練し、マルチビュー対比学習を実現します。", "LoCAは17のタスクで68.8%のタスク比較で、最も多くのタスク勝利を達成し、他のモデルを上回っています。"]}], ["2026-10-24", "Closing the Modality Gap via Simplex-Constrained Representations", "単体制約表現によるモダリティギャップの解消", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32890", "summary": ["既存のマルチモーダル対照モデルは、埋め込みにおいて持続的なモダリティギャップを示しています", "論文では、定義域変換の埋め込みにおいて、単位球の代わりに確率単体を用いることを提案しています", "この手法は、5つのベンチマークで重心L2ギャップを97〜99%削減します"]}], ["2026-10-24", "VTRL-Med: Progressive Visual Refinement with Topology-Guided Regularization for Medical Image Clustering", "VTRL-MED:医療画像クラスタリングのためのトポロジーガイド正則化を用いた漸進的視覚精緻化", "", "なし", "医用画像", "画像・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32884", "summary": ["既存の手法はクラスに依存しない構造的事前分布を無視し、医療画像クラスタリングにおける位相的パターンの符号化に失敗しています。", "VTRL-Medは、特徴抽出のためのSAM、フィルタリングを伴う擬似ラベリング、そして永続的ホモロジーに基づく位相ブランチを組み合わせた、位相学習誘導による正則化を用いたプログレッシブフレームワークを使用しています。", "VTRL-Medは既存手法に比べて平均精度を4.48%向上させ、トポロジーガイド正則化は3つのデータセットで1.3〜4.3%の改善をもたらします。"]}], ["2026-10-24", "Learning Pathology-Sensitive Representations for Unsupervised Retinal OCT Anomaly Detection", "教師なし網膜OCT異常検出のための学習病理感受性表象", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33143", "summary": ["既存の方法は、あらかじめ定義された疾患カテゴリーに依存しているため、まれまたは見えない網膜異常の検出が限られています。", "教師なしフレームワークは、解剖認識再構築と合成摂動を用いた対照的な三連字学習を用いて、事前学習済みの視覚表現を正常な網膜解剖学に適応させます。", "通常構造に表現を適応させることで異常感度が向上し、ピクセルや特徴空間の偏差が検出のための補完信号を提供します。"]}], ["2026-10-24", "Multimodal Generative AI Assists Comprehensive Echocardiographic Interpretation", "マルチモーダル生成AIが包括的な心エコー解析を支援", "", "なし", "画像・テキスト・医用画像", "テキスト・ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32880", "summary": ["心エコーの世界的な有用性は、経験豊富な通訳者の不足により制限されています。", "EchoChatは生成型マルチモーダル視覚言語モデルで、医学知識と思考連鎖推論を統合して心エコー解析を行います。", "EchoChatは33の心臓疾患で最先端の性能を発揮し、そのうち15の新規疾患で平均F1スコアが73.7%に達しています。"]}], ["2026-10-24", "OpenStripe supports open-set identification and spatial stripe profiling in wild Amur tigers", "OpenStripeは、野生のアムールトラのオープンセット識別と空間ストライププロファイリングをサポートしています", "", "なし", "画像・姿勢", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32848", "summary": ["絶滅危惧種の非侵襲的なカメラトラップ監視は、個体をオープンセットで識別する必要がありますが、姿勢の変形や背景の混乱によって妨げられています。", "OpenStripeはマルチエージェントフレームワークを用いて2Dの虎の胴体パターンを再構築し、4つの解釈可能なローカルストライプ構造をエンコードしています。", "4つの構造をすべて組み合わせることで、0.90のマッチング精度と0.85のARIを記録し、49の基準構成を上回る性能を発揮しました。"]}], ["2026-10-24", "SPOOK: Sparse Pixel Optimization for Off-Manifold Knowledge in Vision Encoders", "SPOOK:ビジョンエンコーダにおけるオフマニホールド知識のためのスパースピクセル最適化", "", "なし", "画像・テキスト", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32835", "summary": ["既存の視覚エンコーダは、自然イメージ多様体から離れた場所で類似性や人間に見える意味を埋め込むことに苦労しています。", "空白キャンバス上でのスパースピクセル編集は、オフ多様体領域を探るためにピクセルレベルのヒルクライム手法を用いて適用されます。", "空白入力に対するスパース編集はOpenCLIPで高い検索性能を発揮し、DINOv3では高いターゲットアラインメントを実現します。"]}], ["2026-10-24", "Sounding Surgical Instrument Localisation through Audio-Visual Correspondence", "聴覚・映像対応による外科器具の音響定位", "", "なし", "音声・画像", "軌跡", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32816", "summary": ["既存の手法は視覚データのみに依存しており、手術的活動の定位における音響センシングの可能性が欠けています。", "本論文は、単一のマイクとカメラを用いて楽器の外観と音の対応を学習する、弱監督型の視聴覚定位法を提案しています。", "このモデルは空間的な注釈なしで正確な位置定位を実現し、ツールの活動と無音や背景雑音を分離します。"]}], ["2026-10-24", "CompMVR: Compression-Aware Multi-View Restoration Using Diffusion Models for Geometrically Consistent 3D Reconstruction", "CompMVR:幾何学的に一貫した3D再構築のための拡散モデルを用いた圧縮感知型マルチビュー復元", "Adobe", "あり", "多視点画像・動画・姿勢", "姿勢・3D データ・多視点画像", "", "", "●", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32800", "summary": ["圧縮アーティファクトは、マルチビュー3D再構築におけるクロスビュー幾何学的整合性を乱します。", "CompMVRは拡散モデルを用いて圧縮されたビューを共同で精緻化しつつ、クロスビューの整合性を保ちます。", "実験では、多様なデータセットと圧縮レベルにおいて、復元品質や下流の3Dタスクが向上していることが示されています。"]}], ["2026-10-24", "Consommé: Conditioned Token Merging for Split Inference", "Consommé: Conditioned Token Merge for Split Inference", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32794", "summary": ["分割推論はトークン伝送やバックボーンの微調整にかかるコストがかかります。", "Consomméは凍結されたバックボーンを使用し、CLSトークンを潜在的に圧縮してパッチゲートを条件付け、パッチを正確にkトークンに統合します。", "任意の予算で単一のステップで動作し、攻撃的なトークン予算や浅い分割でBPMを上回り、細かい調整された方法よりも導入コストが低いです。"]}], ["2026-10-24", "SREdit: Scene Response Guided Appearance Editing for Projection Mapping", "SREdit:プロジェクションマッピングのためのシーンレスポンスガイド外観編集", "", "なし", "画像・テキスト", "3D データ", "", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32792", "summary": ["プロジェクター補正は外観自体を修正できず、幾何学的なずれ、不均一な陰影、または利用可能な投影範囲外の変化を引き起こすことがあります。", "SREditは再構築されたシーンからシーン応答マップを推定し、編集の指針として、ソースの外観を用いて初期サンプリングを制約し、固定された物理オブジェクトとのレジストレーションを保持します。", "SREditは、1枚の画像につき1秒未満、VRAMのオーバーヘッドもほとんどないで、投影された画質と再現の忠実度を向上させます。"]}], ["2026-10-24", "Video-MemComp: Taylor-Guided Sensitivity-Aware Memory Management for Streaming Video Understanding", "Video-MemComp:テイラーガイドによる感度認識メモリ管理によるストリーミング動画理解", "", "なし", "画像・テキスト", "テキスト・動画", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32784", "summary": ["既存の手法は、ストリーミング動画理解においてメモリのボトルネックやエラーの蓄積に直面しています。", "Video-MemCompは、テイラー展開を使用して圧縮誤差を局所近似誤差と構造感度に分解し、トークン集約と動的KVキャッシュ割り当てを通じてメモリを管理します。", "特に、Qwen2.5-VL-3Bの全体的な精度を62.3%から64.1%に向上させ、KVキャッシュを1層あたり6,000トークン相当に削減し、KVメモリの90%以上を節約します。"]}], ["2026-10-24", "Matching Particle-Arrival Rates for Low-Count Image Denoising", "低カウント画像ノイズ除去のための粒子到達率のマッチング", "", "なし", "画像", "画像", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.33136", "summary": ["低カウントイメージングは粒子検出の制限によりポアソンショットノイズに直面します", "PARMはクリーンな参照なしで粒子到着率マッチングを用いてノイズ除去を行います", "PARMは合成データおよび実際の低線量データでトップクラスの性能を達成しています"]}], ["2026-10-24", "SCDM-HTD: Spectral-Wise Conditional Diffusion Model for Hyperspectral Target Detection", "SCDM-HTD:ハイパースペクトルターゲット検出のためのスペクトルごと条件付き拡散モデル", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "●", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32768", "summary": ["既存のHTD手法は背景-ターゲット分離のための分布学習を無視しており、検出の堅牢性を制限しています。", "HTDをバックグラウンドおよびターゲットの信頼度スコアを訓練サンプルとして検出マップを生成する形に再定式化したスペクトル別条件付き拡散モデルを導入します。", "この手法は、制約されたエネルギー最小化と二項交差エントロピー損失を積分し、複合損失によって背景-ターゲット分離を改善します。"]}], ["2026-10-24", "ARENA: Active Region attENtion Aggregation for interpretable solar flare prediction", "ARENA:解釈可能な太陽フレア予測のためのアクティブリージョンアトリゲーション", "", "あり", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.32758", "summary": ["太陽フレアの予測は困難であり、地球の上層大気に大きな影響を与えます。", "ARENAはニューラルネットワークを用いて活動領域カットアウトから太陽フレアを予測し、最も予測に適した領域を特定することを学習します。", "ARENAは他の方法と同等のハイドケスキルスコア0.45を達成しています。"]}]]}</script>
<script>
const {headers, groups, summaryHeaders, rows} = JSON.parse(document.getElementById("data").textContent);
// Column kinds: date, text (free-text filter), company (one dropdown entry per
// company; a cell can list several, joined by "; "), code, flag (●). Each row
// carries one extra, hidden object at the end: the alphaXiv URL and the summary.
const kinds = ["date", "text", "text", "company", "code", "text", "text"]
  .concat(Array(headers.length - 7).fill("flag"));
const widths = {1: "w-title", 2: "w-ja", 3: "w-co", 5: "w-io", 6: "w-io"};
let selected = null;  // the row shown in the lower pane
const ANY = "\u0000", SOME = "\u0001";  // "すべて" and "(企業あり)"
const companiesOf = value => value ? value.split("; ") : [];
const filters = [];
let sortCol = 0, sortDir = -1;

// Top row: group names spanning their columns, empty cells elsewhere.
const groupRow = document.getElementById("groups");
for (let i = 0; i < headers.length; i++) {
  const group = groups.find(g => g.first === i);
  const th = document.createElement("th");
  if (group) {
    th.textContent = group.name;
    th.colSpan = group.count;
    th.className = "group";
    i += group.count - 1;
  } else {
    th.className = "blank";
  }
  groupRow.appendChild(th);
}

const headRow = document.getElementById("heads");
const filterRow = document.getElementById("filters");
headers.forEach((name, i) => {
  const th = document.createElement("th");
  th.textContent = name;
  th.className = "sort " + (widths[i] || (kinds[i] === "flag" ? "w-flag" : ""));
  th.addEventListener("click", () => {
    sortDir = sortCol === i ? -sortDir : (kinds[i] === "flag" ? -1 : 1);
    sortCol = i;
    render();
  });
  headRow.appendChild(th);

  const cell = document.createElement("th");
  let control = null;
  if (kinds[i] === "text") {
    control = document.createElement("input");
    control.type = "search";
    control.placeholder = "含む文字";
  } else if (kinds[i] === "company") {
    const counts = {};
    rows.forEach(r => companiesOf(r[i]).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
    control = document.createElement("select");
    control.add(new Option("すべて", ANY));
    control.add(new Option("(企業あり)", SOME));
    control.add(new Option("(空欄)", ""));
    Object.keys(counts).sort((a, b) => a.localeCompare(b, "en", {sensitivity: "base"}))
      .forEach(c => control.add(new Option(`${c} (${counts[c]})`, c)));
  } else {
    const values = kinds[i] === "flag" ? ["●", ""]
      : [...new Set(rows.map(r => r[i]))].sort().reverse();
    control = document.createElement("select");
    control.add(new Option("すべて", ANY));
    values.forEach(v => control.add(new Option(v === "" ? "(空欄)" : v, v)));
  }
  if (control) {
    control.addEventListener("input", render);
    cell.appendChild(control);
  }
  filters[i] = control;
  filterRow.appendChild(cell);
});

function matches(row) {
  return filters.every((control, i) => {
    if (!control) return true;
    if (control.value === ANY) return true;
    if (kinds[i] === "company") {
      if (control.value === SOME) return row[i] !== "";
      return control.value === "" ? row[i] === "" : companiesOf(row[i]).includes(control.value);
    }
    if (control.tagName === "SELECT") return row[i] === control.value;
    const query = control.value.trim().toLowerCase();
    return !query || row[i].toLowerCase().includes(query);
  });
}

function link(href, text) {
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener";
  return a;
}

function render() {
  const shown = rows.filter(matches).sort((a, b) =>
    sortDir * a[sortCol].localeCompare(b[sortCol], "ja", {numeric: true}));
  const body = document.createElement("tbody");
  body.id = "rows";
  for (const row of shown) {
    const tr = body.insertRow();
    if (row === selected) tr.className = "selected";
    headers.forEach((_, i) => {
      const td = tr.insertCell();
      if (i === 1) {
        // A plain click shows the summary below; Ctrl/middle click still opens alphaXiv.
        const a = link(row[row.length - 1].alpha, row[i]);
        a.addEventListener("click", event => {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.button !== 0) return;
          event.preventDefault();
          showDetail(row, tr);
        });
        td.appendChild(a);
      } else {
        td.textContent = row[i];
      }
      if (kinds[i] === "code" || kinds[i] === "flag") td.className = "c";
      else if (kinds[i] === "date") td.className = "nw";
    });
  }
  document.getElementById("rows").replaceWith(body);
  headRow.querySelectorAll("th").forEach((th, i) => {
    th.classList.toggle("asc", i === sortCol && sortDir > 0);
    th.classList.toggle("desc", i === sortCol && sortDir < 0);
  });
  document.getElementById("count").textContent = `${rows.length} 件中 ${shown.length} 件を表示`;
}

const detail = document.getElementById("detail");
const splitter = document.getElementById("splitter");

function showDetail(row, tr) {
  selected = row;
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  tr.classList.add("selected");
  const extra = row[row.length - 1];
  document.getElementById("d-title").textContent = row[1];
  document.getElementById("d-ja").textContent = row[2];
  document.getElementById("d-alpha").href = extra.alpha;
  const body = document.getElementById("d-summary");
  body.replaceChildren();
  summaryHeaders.forEach((name, k) => {
    const line = body.insertRow();
    const th = document.createElement("th");
    th.textContent = name;
    line.appendChild(th);
    line.insertCell().textContent = extra.summary[k] || "（要約なし）";
  });
  detail.hidden = splitter.hidden = false;
}

function hideDetail() {
  selected = null;
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  detail.hidden = splitter.hidden = true;
}

document.getElementById("d-close").addEventListener("click", hideDetail);
document.addEventListener("keydown", event => { if (event.key === "Escape") hideDetail(); });
splitter.addEventListener("pointerdown", event => {
  event.preventDefault();
  splitter.setPointerCapture(event.pointerId);
  const move = e => {
    const height = Math.min(Math.max(window.innerHeight - e.clientY, 80), window.innerHeight - 160);
    detail.style.height = `${height}px`;
  };
  splitter.addEventListener("pointermove", move);
  splitter.addEventListener("pointerup", () => splitter.removeEventListener("pointermove", move), {once: true});
});

document.getElementById("reset").addEventListener("click", () => {
  filters.forEach(control => { if (control) control.value = control.tagName === "SELECT" ? ANY : ""; });
  render();
});
render();
</script>
</body>
