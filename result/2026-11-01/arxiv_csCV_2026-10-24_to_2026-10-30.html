では、CTボリュームを3DGSモデルに変換するために数分から数時間の訓練が必要です。", "CTBakeGSは、適応型オクトリーにスプラットを配置し、色、不透明度、スプラット保持を計算することで、訓練なしでCTボリュームを3DGSモデルに変換します。", "200万スプラットモデルは、骨で32.6 +/- 0.9 dB、造影強化血管で30.1 +/- 1.0 dB、皮膚・骨で32.3 +/- 1.5 dBのPSNRを記録しました。"]}], ["2026-10-28", "PDRVLA: A Vision-Language-Action Model with Physical Dynamics Representations", "PDRVLA:物理動力表現を用いた視覚・言語・行動モデル", "", "なし", "テキスト・画像", "動画・行動・深度", "", "", "", "●", "●", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37381", "summary": ["既存のVLAモデルは物理力学の理解に欠けています", "PDRVLAは軽量の物理動力モジュールを用いて、視覚言語の特徴から物理的トークンを抽出し、条件アクション生成に至ります", "PDRVLAはLIBEROで99.3%、LIBERO-Plusで89.9%の成功率を達成しています"]}], ["2026-10-28", "EmbeddingGemma 2: Unified and Efficient Multimodal Representations", "EmbeddingGemma 2:統一かつ効率的なマルチモーダル表現", "Google", "なし", "動画・画像・音声", "特徴表現", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37364", "summary": ["既存のマルチモーダルモデルは、複数のモダリティ間で統一的かつ効率的な表現が欠けています。", "EmbeddingGemma2は、単純化されたレイヤーごとの埋め込みと多段カリキュラムを使用して、テキスト、画像、オーディオ、ビデオ、およびそれらの組み合わせを統一します。", "EmbeddingGemma2は、専門モデルよりも優れており、包括的な埋め込みベンチマークでは二から十二倍大きいモデルです。"]}], ["2026-10-27", "TimeLineXR: An Interactive Exploration of Time in Vision-Language Models", "TimeLineXR:視覚言語モデルにおける時間のインタラクティブな探求", "", "あり", "画像・テキスト", "テキスト・3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37349", "summary": ["既存のVLMは物体の時間的な起源を推定できますが、時間構造のインタラクティブな探査はできません。", "TimeLineXRは、3Dインタラクティブシーンを用いて、画像をベジエ時間軸に配置することで時間構造を探ります。", "このシステムは、ユーザーがウェブデモやWebXRシーンを使って時間位置を検査・照会できるようにします。"]}], ["2026-10-27", "CodeCap-Bench: Can Code Serve as a Good Video Caption?", "CodeCap-Bench:コードは良いビデオキャプションとして使えますか?", "", "あり", "画像・テキスト", "テキスト・動画", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37341", "summary": ["自然言語の字幕は、動画の説明において細かな空間構造や時間的ダイナミクスを正確に表現できないことが多いです。", "論文は、実行可能なコードをビデオキャプションとして使用し、グラフィカルプリミティブ、レイアウトルール、時間 は、現場ハードウェア上の自己監督型ビジョントランスの推論コストの特徴付けが不足しています。", "私たちは、ハードウェア性能が異なる3つの汎用x86ノードに、事前学習済みのSAR光学マスク付きオートエンコーダエンコーダーを展開しています。", "INT8量子化によりCPUのレイテンシが1.45倍減少し、消費エネルギーも減少し、GPUからCPUへの速度向上が4.38倍に増加します。"]}], ["2026-10-27", "Learning to Code the World: Harness Evolution for Compositional 3D Reconstruction", "世界をコーディングする学習:構成的3D再構築のためのハーネス進化", "", "あり", "画像", "3D データ", "", "", "", "", "●", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37046", "summary": ["既存の手法では、実際の画像から編集可能かつ構図可能な3Dシーンを再構築するのに苦労しています。", "SceneEvolveは3Dシーンを実行可能コードとして表現するフレームワークを使用し、小さなオープンソースエージェントを中心にハーネスを進化させます。", "SceneEvolveは再構成指標を推論時間を47.0%向上させ、大規模な独自モデルよりも32.3%高い品質を実現します。"]}], ["2026-10-27", "Zooming without Zooming v2: From Seeing Details to Connecting Evidence for Generalizable Multimodal Perception", "ズームせずにズームする v2:詳細を見ることから一般化可能なマルチモーダル知覚の証拠をつなぐことへ", "", "なし", "画像・テキスト", "テキスト", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37037", "summary": ["空間認識やマルチモーダルな長文脈理解のためのターゲットを絞った高品質なトレーニングデータを統合することは困難でコストもかかります。", "EvidenceConnectは、単一の画像内で関連領域のズームビューを用いて、比較、集約、または視覚的証拠の連鎖を求める質問を生成します。", "ZwZ2は細かな知覚と空間的知覚を向上させ、身体化された空間推論、マルチモーダルの長文脈理解、マルチモーダルエージェントタスク、一般的な視覚推論においてもさらなる向上をもたらします。"]}], ["2026-10-27", "GraftRay: Physically Based Mesh Insertion into Gaussian Splatting Scenes via Path Tracing", "GraftRay:パストレーシングによるガウススプラッティングシーンへの物理ベースのメッシュ挿入", "", "なし", "メッシュ・3D ガウス・多視点画像", "3D ガウス", "", "", "", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.37036", "summary": ["2D/3Dガウスシーンにオブジェクトをリアルに挿入するには、シームレスな照明と物理的にもっともらしい影が必要であり、既存の手法ではそれを達成できません。", "GraftRayは拡散ベースの事前解析を用いてシーンマテリアルと表面法線を復元し、シーンのガウスと挿入されたメッシュの両方をパストレースしてリアルなシェーディングとシャドウを作り出します。", "GraftRayはFIPT上で忠実度とシャドウの精度を上回り、競争力を維持しながらも優れた表現を発揮しています。"]}], ["2026-10-27", "Interpretable Deep Learning Models for Breast Cancer Diagnosis Using Medical Imaging", "医療画像を用いた乳がん診断のための解釈可能な深層学習モデル", "", "なし", "医用画像", "ラベル・医用画像", ion", "脊椎ランドマーク検出のための高密度表現学習と微分可能な形状モデリング", "", "あり", "医用画像", "行動", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36951", "summary": ["脊椎X線による脊椎のランドマーク検出は、ランドマークの位置が曖昧で、従来の方法の識別力が限られているため困難です。", "本論文はスパインランドマーク検出をピクセルレベルの対比表現学習問題として再構築し、密集したピクセル埋め込みとランドマークプロトタイプをマッチングし、学習可能な形状事前分析と組み合わせています。", "このアプローチは、異なる椎骨の角の識別を向上させ、3つのデータセットで最先端の手法と競合します。"]}], ["2026-10-27", "DocXEval: A Systematic Evaluation of Explainability in Multimodal Document Understanding", "DocXEval:マルチモーダル文書理解における説明可能性の体系的評価", "", "あり", "画像・テキスト", "ラベル", "", "", "", "", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36929", "summary": ["既存のXAI研究はマルチモーダル文書理解に焦点を当てていません。", "Ｘａｉメソッドとメトリックをマルチモーダルドキュメントタスクに適応させるフレームワークを提案した。", "3つのタスク、8つのデータセット、4つのモデル、17の指標にまたがる13のXAI手法を評価しました。"]}], ["2026-10-27", "PREEN: Exemplar-Based Color Style Transfer with Smartphone Editor Presets", "PREEN:スマートフォンエディタープリセットを用いたExemplarベースのカラースタイル転送", "Samsung", "なし", "画像", "画像", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36896", "summary": ["既存のカラースタイル転送手法には、解釈可能で編集者が消費可能なプリセットがありません。", "PREENはエセンプラーベースのエディターネットワークを用いて、カラースタイル転送を29のエディターパラメータに回帰させます。", "PREENは構造的な忠実度を保ち、連続したカラー軌道を提供するコンパクトなプリセットでサブ秒単位のデバイス上推論を実現します。"]}], ["2026-10-27", "GUI-JEPA: Candidate-Conditioned JEPA Latents as a Fast Action Policy for Mobile GUI Agents", "GUI-JEPA:モバイルGUIエージェントのための迅速対応政策としての候補者条件付きJEPA潜在条件", "Alibaba", "あり", "画像・テキスト", "行動・テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36877", "summary": ["既存のモバイルGUIエージェントは、大規模なVLMを用いたテキストベースのアクション生成を採用しているため、動作が遅くメモリを消費します。", "GUI-JEPAは、ラベルなしのGUIスクリーンショットに事前学習されたJEPAエンコーダーを用いて潜在動作を生成し、デコードを回避し軽量な予測器を使用します。", "GUI-JEPAは2.8〜4.0倍の速度で、微調整VLMのパラメータの6%で86〜92%の精度を達成します。"]}], ["2026-10-27", "HoloRecon: Incremental Reconstruction of Long-Range Panoramas with Global Consistency", "HoloRecon:グローバル一貫性を持つ長期パノラマの漸進的再構築", "", "あり", "LiDAR・姿勢", "軌跡", "", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36876", "summary": ["長距離パノラマ再構築は、構造の重複や小さな部分的重複により、遠隔再訪におけるカメラポーズの全体的な一貫性を維持することに課題があります。", "本論文は、ORBベースのスパースマッピングとファインチューニングされたフィードフォワードモデルを組み合わせ、正確な局在化とグローバルに整合した濃密度マッピングを実現する枠組みを提案します。", "この手法は評価された手法の中で最も低い平均絶対軌道誤差と高いF-1スコアを達成しています。"]}], ["2026-10-27", "AdaGround: Token-Normalized Adaptive Zooming with Verifier-in-the-Loop Refinement for GUI Grounding", "AdaGround:GUIグラウンディングのためのVerifier-in-the-Loopリファイングを用いたトークン正規化適応ズーム", "Alibaba", "あり", "深度・テキスト", "特徴表現", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36874", "summary": ["高解像度画面でのGUIグラウンドは小型ターゲットで失敗します", "AdaGroundは、トークン正規化された適応型ズームと検証者によるループの精細化を用いて、トレーニング不要のGUIグラウンディングを実現します", "AdaGroundはOSWorld-GおよびScreenSpot-Proで7.4ポイントから20.6ポイントの精度向上を遂げています"]}], ["2026-10-27", "RangeRectQuant: Compressing Scientific Fields for Every Future Rectangular Sum", "RangeRectQuant: すべての将来の直方形和に対する科学場の圧縮", "", "なし", "テキスト", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36873", "summary": ["科学的ラスタは測定領域が確定する前に保存されるため、誤り管理の非効率性が生じます。", "RangeRectQuantは、誤差制約内でピクセルを量子化しながら、正確な直方形の和を維持するために協調的な変更を用います。", "1段に比例した線形の作業と作業スペースを実現し、他に比べて大幅な収納コストを節約します。"]}], ["2026-10-27", "Tail Cues, Principal Corrections: Plug-and-Play Rectification for Open-Set Test-Time Adaptation", "テールキュー、主補正:オープンセットテスト時間適応のためのプラグアンドプレイ整正", "", "なし", "", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36870", "summary": ["既存のTTA手法は、非定常ターゲットストリームにおける未知のサンプルに対してコストや脆弱性の問題に直面しており、共変量や意味のシフトが発生します。", "TALORは、源線形ヘッドを幾何学的アンカーとして用いて特徴を主座標系と尾部座標系に分解し、主部分空間におけるソフトルーティングされたアフィン補正を推定します。", "TALORはUniEntを2.2%上回るHスコアを上回り、動作速度は2.5倍で、6つのcsOODデータセットを持つImageNet-CではGPUメモリの使用量が12%少ないです。"]}], ["2026-10-27", "ActiveAlign: Aligning Egocentric Manipulation via Active Perception", "アクティブアライン:能動的知覚による自己中心的操作の整合", "NVIDIA", "あり", "", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36859", "summary": ["既存の手法は、受動的な知覚や不完全な観察のために実数からシミュレーションへのギャップに直面しています。", "ActiveAlignは、手と目のキャリブレーションを行うActiveAlign-Wavingと、触覚フィードバックによる実際の環境とシミュレーション環境の整合性を持つActiveAlign-Touchingの2つのモジュールによるアクティブ知覚を用いています。", "ActiveAlignはミリ単位の精度を実現し、実際の状況でオブジェクトの細かい操作を可能にします。"]}], ["2026-10-27", "Forget the Data, Keep the Capability: Switchable Unlearning for Retrieval", "データは忘れて、能力は維持:取得のための切り替え可能なアンラーニング", "", "あり", "", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36858", "summary": ["既存の手法は、再識別モデルにおいて検索能力を維持しつつ、個体を選択的に忘れることに苦労しています。", "MoMEは、勾配隔離の下で学習されたコアパラメータ(検索用)と寄生パラメータ(全データ知識)に分割するスイッチ可能なフレームワークです。", "コアモードは、3つのデータセットで再訓練モデルと同等の検索性能を達成し、フォーゲットセットに依存しません。"]}], ["2026-10-27", "Evaluating AlphaEarth Embeddings for Crop Classification: Separability, Temporal Dynamics, and Cross-Regional Transferability", "作物分類のためのAlphaEarth埋め込み評価:分離可能性、時間的動態、地域間移転可能性", "", "なし", "衛星・航空画像", "ラベル", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36857", "summary": ["EOに基づく農業モニタリングにおける学習表現の体系的な評価は限られています。", "表現に依存しないフレームワークは、AlphaEarthの埋め込みを複数の指標でSentinel-2のデータと比較して評価します。", "埋め込みは類似作物に対して最大1桁の分離可能性を高め、誤差の空間的自己相関を低減します。"]}], ["2026-10-27", "LingGS: Decoupling Feed-Forward Geometry Prediction from Camera Tracking for High-Fidelity Gaussian SLAM", "LingGS:高忠実度ガウスSLAMのためのカメラトラッキングからのフィードフォワードジオメトリ予測のデカップリング", "", "なし", "動画", "深度・軌跡", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36853", "summary": ["単眼RGBガウススプラッティングSLAMは、限られた最適化予算の中で高品質な再構成とレスポンシブなカメラトラッキングを実現する上で課題に直面しています。", "本論文は、学習した幾何学的事前解析と、凍結されたストリーミング3D基礎モデルと明示的幾何学的ソルバーを用いた明示的な幾何学的カメラ追跡を組み合わせたシステムを提案しています。", "この方法は従来のSLAMシステムの2〜3倍のスループットを達成し、単一のRTX 4090で約7FPSの再構築品質を向上させます。"]}], ["2026-10-27", "uTHCD-C: A Corruption-Robustness Benchmark for Tamil Handwritten Character Recognition", "uTHCD-C:タミル語手書き文字認識の汚職・堅牢性ベンチマーク", "", "なし", "画像", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36850", "summary": ["既存のタミル語手書き文字認識の評価はクリーンな画像に焦点を当てており、腐敗の堅牢性に関する標準化された基準が不足しています。", "uTHCD-CはuTHCDデータベースに基づくベンチマークであり、10種類の破損タイプを5つの重大度レベルで定義し、9つのアーキテクチャをクロスバリデーションおよび書き込み者非依存テストを用いて評価しています。", "ベンチマークは標準化された破損設定、評価プロトコル、比較結果を提供し、将来の研究のための再現可能な基盤を確立します。"]}], ["2026-10-27", "AxisQ: Depth-Adaptive Channel--Frequency Quantization for Camouflaged Object Detection", "軸Q:カモフラージュ物体検出のための深さ適応チャネル周波数量子化", "", "なし", "深度", "バウンディングボックス", "●", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36844", "summary": ["カモフラージュされた物体検出は、攻撃的なトレーニング後量子化によって弱いテクスチャや境界の手がかりが破壊されることで妨げられます。", "AxisQは深さ適応ビット割り当てフレームワークを用いており、浅い特徴にはチャネル領域、深部特徴には局所周波数領域の精度を割り当てます。", "AxisQはW2A2量子化下でCAMOベースライン上で相対的に12.7%および33.3%の相対加重F指標向上を達成しています。"]}], ["2026-10-27", "MVRCap: Towards Comprehensive Video Captioning via Hierarchical Multi-Dimensional Verifiable Rewards", "MVRCap:階層的で多次元的な検証可能な報酬による包括的なビデオ字幕制作へ", "Alibaba", "なし", "深度・動画・テキスト", "テキスト・動画", "", "", "", "●", "●", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36838", "summary": ["現在のモデルは、粗粒度の監督が空間的・時間的な動態や論理的意図を捉えきれないため、包括的なビデオキャプション生成に苦労しています。", "MVRCapは、3つの柱を持つ細粒検証可能報酬メカニズム(階層的概念カバレッジ報酬、事実性検証報酬、簡潔性制約)を用いて、ビデオ字幕を強化学習課題として再構築しています。", "MVRCapはVDC、CAPability、VC4VGベンチマークで最先端の性能を達成しています。"]}], ["2026-10-27", "Drop the Details, Get the Gist: Dynamic Conceptual Representation for Video Recognition", "詳細を伝えて、要点を掴もう:ビデオ認識のための動的概念表現", "", "なし", "動画・画像・テキスト", "ラベル・動画・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36832", "summary": ["既存の研究は静止画像に焦点を当てており、ビデオの概念表現における時間的ダイナミクスの探求が十分に不足しています。", "複数段階の動画をセグメントレベルの概念スコアベクトルの時間的シーケンスとして表現し、それらをクラス予測のためにトランスフォーマーエンコーダに入力するフレームワークを提案します。", "3つの概念セットを評価し、より粗い粒度の概念でもビデオ分類に十分であることが分かりました。"]}], ["2026-10-27", "Right Click, Wrong Box: Grading GUI Grounding by What a Click Does", "右クリック、誤ったボックス:クリックによるGUIグラウンディングの評価", "", "なし", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36831", "summary": ["既存のGUIグラウンダーは、クリックしたときに同じ結果を生み出す複数の要素を考慮していません。", "この論文は、クリックを実行し指紋採取し、ボックスの位置だけでなく効果に基づいて正しいクリックを判定するプローブを提案しています。", "この方法は、ScreenSpot-v2で0.2から1.8ポイントを補正し、フィールドで報告されたギャップを一致させることで改善されます。"]}], ["2026-10-27", "TAPESTRY: A Single Backbone for Video Generation and Robot Control", "TAPESTRY:ビデオ生成とロボット制御のための単一のバックボーン", "", "なし", "動画・画像", "行動・動画", "", "", "●", "●", "", "", "", "", "●", "", "●", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36823", "summary": ["事前学習済みのビデオ生成モデルは、ロボット制御用にゼロから訓練されたリソース集約的なビデオ生成やアクションヘッドを必要とします。", "TAPESTRYは、ロボットの動作を潜在空間のビデオパッチとして扱うことで、事前に学習済みのビデオ拡散トランスフォーマーをロボットポリシーに再利用しています。", "TAPESTRYは、同等の共同ビデオアクションポリシーよりも推論コストを大幅に低く抑えつつ、優れた性能を達成しています。"]}], ["2026-10-27", "Latent Visual Contrastive Reasoning with Multi-Branch Exploration", "多分野探求を伴う潜在視覚的対比推論", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36809", "summary": ["既存の視覚推論手法は単一の直線的な軌道をたどっており、複数の視覚仮説や競合する証拠領域を扱う能力が制限されています。", "潜在的視覚対照推論は、画像トークン上のソフト仮説として複数の疑問条件付き潜在視覚分岐を生成し、バウンディングボックス注釈を用いて分岐と証拠の整合性を訓練します。", "この手法は、3Bおよび7Bスケールの両方で対応するバックボーンおよび単一経路潜在推論ベースラインに比べて全体的な改善を達成しています。"]}], ["2026-10-27", "Visual Autoregressive Generation with Next Token Imagination", "次のトークン想像力を用いた視覚的自己回帰生成", "", "なし", "画像", "画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36793", "summary": ["既存の視覚生成モデルは訓練データに制限されており、広大な視覚空間のごく一部しか捉えられていません。", "Next Token Imagination(NTI)は、モデルが設計された基準に制約された、地上的な次のトークンを超えてトークンを生成することを可能にします。", "NTIは、訓練データを超えた探索で画像の忠実度を向上させ、より小型で低コストなモデルで最先端の結果を実現しています。"]}], ["2026-10-27", "OmniGlimpse: Asymmetric Identity Memory for Online Multi-View Tracking", "OmniGlimpse:オンラインマルチビュートラッキングのための非対称アイデンティティメモリ", "", "なし", "多視点画像・テキスト", "軌跡", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36785", "summary": ["オンラインマルチビュートラッキングは、オフラインのシーン固有のトレーニングやカメラキャリブレーションなしに異なる視点からの観測を正しい識別に一致させるのに課題があります。", "OmniGlimpseは非対称提案検証フレームワークを用いて適応的関連と安定した同一性の統合を分離し、短期的な証拠を適応空間にマッピングし、検証のために長期的な同一性分布を維持します。", "OmniGlimpseは、M3Trackでオンラインベースライン指標をIDF1で9.1ポイント、CVIDF1で22.1ポイント、MvMHATで20.3ポイントと26.2ポイント向上させています。"]}], ["2026-10-27", "CVBL-CCTV-Face Dataset for Real-World Face Enhancement and Recognition in Surveillance", "監視における実世界の顔の強調および認識のためのCVBL-CCTV顔データセット", "", "なし", "画像", "画像・ラベル", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36781", "summary": ["実際の監視画像は解像度が低く、動きのぼかし、ノイズや遮蔽が原因で、信頼できる顔認識を妨げています。", "本論文は、低品質と高品質の顔画像をペアにしたカスタムデータセットを用いて、超解像度と身元認識のためのフレームワークを提案しています。", "このデータセットには画像とアイデンティティが含まれており、リアルタイムの顔認証のためのモジュールシステムの訓練とテストを可能にします。"]}], ["2026-10-27", "Evaluation-Guided Demonstration Refinement for Vision-Language-Action Policies: The Winning Entry in the MetaFine Open Competition", "ビジョン・言語・行動方針のための評価ガイド付きデモンストレーション改良:MetaFineオープンコンペティションの受賞作品", "", "なし", "画像・テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36765", "summary": ["既存の手法は、タスク実行中のビジョン言語・アクションポリシーの繰り返しの失敗に対応していません。", "私たちは、デモと専門家の手順の混合物を使用して、タスク固有のポリシーを微調整し、実証された動きを修正し、専門家の継続を追加しました。", "私たちの手法は96.66点を獲得し、MetaFine Open Competitionで1位となりました。"]}], ["2026-10-27", "GeoGSplat: Geometry-Grounded Non-Pixel-Aligned Gaussian Splatting", "GeoGSplat:ジオメトリグラウンディング非ピクセルアラインド・ガウススプラッティング", "", "あり", "点群・3D ガウス・深度", "3D データ", "", "", "", "●", "●", "", "●", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36760", "summary": ["ピクセルアライメントされたガウススプラッティングは、画像解像度と表示数の増加により冗長性と計算コストの増加をもたらします。", "GeoGSplatは、二重分岐エンコーダと階層的デコーダを用いた幾何学基盤フィードフォワードモデルを用いて、非ピクセル整列のガウスアンを予測します。", "GeoGSplatは、DTUおよびNRGBDの従来の手法を上回り、新しいビュー合成と再構成において優れており、大きな視点変更に対してより良い一般化が可能です。"]}], ["2026-10-27", "DocSkill: Skill-Integrated Agentic Reasoning for Multilingual Multi-Hop Document Question Answering", "DocSkill:多言語マルチホップ文書質問応答のためのスキル統合エージェント推論", "", "なし", "テキスト", "行動", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36759", "summary": ["既存のアプローチは、多言語の多言語文書質問応答において、証拠取得、ページ間統合、回答検証の調整に苦労しています。", "DocSkillは、学習されたスキルオーケストレーションポリシーを使用して、進化するエビデンス状態に基づいてスキルを適応的に選択、再訪、またはスキップし、スキルトラジェクトリ探査のための有界MCTと好みのペアによる監視された微調整を使用します。", "DocSkillはMMHop-DocBenchで41.0の精度と49.2のF1を達成し、それぞれ5.5ポイントと6.3ポイントで最強のベースラインを上回っています。"]}], ["2026-10-27", "Efficient Remote Sensing Image-Text Retrieval via Interaction-Free Recall and Text-Guided Reranking", "インタラクティブなしリコールおよびテキスト誘導による効率的なリモートセンシング画像-テキスト検索", "", "なし", "衛星・航空画像・テキスト", "ラベル", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36756", "summary": ["既存の手法は、複雑な背景や多対象分布のため、密度の高いRS画像では効率的な検索に苦労しています。", "本論文は、バランスの取れたテキスト誘導インタラクションブロックを用いたインタラクションフリーリコールおよびテキストガイド付き再ランキングフレームワークを提案しています。", "公開ベンチマークでの広範な実験により、FTFは既存手法と比較して検索効率を大幅に向上し、競争力のある検索精度を達成していることが示されています。"]}], ["2026-10-27", "Multi-task Disentangling Fusion Mamba-CNN for MODIS Spectral-Temporal Unmixing with Endmember Variability Modeling", "マルチタスク解消融合 Mamba-CNN を用いたMODISスペクトル-時間アンミックスとエンドメンバー変動モデリング", "", "なし", "", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36750", "summary": ["MODIS時系列のスペクトル・時間的アンミックスは、スペクトル・時間情報の結合、クラス内のエンドメンバーの変動、専門家表現の不安定な融合により困難です。", "論文では、マンバ時分岐と畳み込みモジュールを用いた解離アーキテクチャを用いたMDF-Mambaと、専門家出力の統合のためのmHCFusionを提案しています。", "MDF-Mambaは2つのデータセットで14評価指標のうち12項目で最高のパフォーマンスを達成しています。"]}], ["2026-10-27", "Readout and Operating-Point Sensitivity in Event-Stream Candidate Selection", "イベントストリーム候補選択における読み出しおよび操作点感度", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36743", "summary": ["イベントトリガー記録はターゲットキャプチャと誤トリガーのバランスが必要ですが、表示比較は読み取りや閾値キャリブレーションによって異なります。", "本論文は、参加者と非重いトレーニング、検証、テスト、異なるエンコーダースケール、蓄積時間、時間的ビュー数を用いて、520件のDailyDVS-200クリップと47人の参加者からのイベント蓄積を評価しています。", "DINO-S CLSは101/132ターゲットを40/388の誤トリガーで捕捉し、MobileNetV3-Smallは53/388の誤トリガーで97/132を捕捉し、軽量基準線と作動ポイントの重要性を示しています。"]}], ["2026-10-27", "Hy-Nomas: Towards Free-form Interactive World Generation", "Hy-Nomas:自由形式のインタラクティブな世界生成へ", "Tencent", "なし", "動画・テキスト", "テキスト・行動", "", "", "", "●", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36729", "summary": ["インタラクティブなワールド生成には、モデルが関連する履歴やアクションの結果を保持しつつ、連続するコマンドに従う必要があります。", "Hy-Nomasは8B拡散バックボーンを用いて、構造化されたビデオキャプションとアクション認識型の因果注意を備えた可変長セグメントを生成します。", "Hy-Nomasは人間の評価において既存の世界モデルを上回る性能を示し、再現可能な研究のための軽量な適応ワークフローを提供します。"]}], ["2026-10-27", "Progressively Refining SAM for Accurate Phytoplankton Segmentation", "正確な植物プランクトン分断のためのSAMの段階的精錬", "", "あり", "", "マスク", "", "●", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36722", "summary": ["正確な植物プランクトンの分割は、微妙な視覚的特徴やピクセル単位の注釈の乏しさから困難です。", "PhySegはSAMベースのフレームワークと軽量な精錬モジュールを使用し、マルチスケールの機能融合を通じて詳細を段階的に復元します。", "実験結果は、PhySegがセグメンテーションの精度を向上させ、提案モジュールの有効性を検証していることを示しています。"]}], ["2026-10-27", "SAGE: Saliency-Annealed Gated Encoder for Universal Vision Recognition", "SAGE:ユニバーサルビジョン認識のためのサリアシティ・アニールされたゲートエンコーダー", "Huawei", "公開予定", "姿勢", "マスク・バウンディングボックス・ラベル", "●", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36719", "summary": ["既存の手法では、ViTの顕著性や高頻度の詳細といった先求が、密度の高い予測タスクで十分に活用されていません。", "SAGEは、ViTの事前設定を活用するために、顕著性ガイド型アーキテクチャ、アニーリングベースのトレーニング、2段階の品質認識トレーニングを用いています。", "SAGEは同じバックボーンで複数タスクでSOTA結果を達成し、Huawei Ascend NPUでマルチタスクSOTAを実現した初の企業です。"]}], ["2026-10-27", "Learning Where to Trust: Reliability-Guided Expert Routing and Velocity Gating for 3D Deformable Registration", "信頼する場所を学ぶ:信頼性に基づく専門家によるルーティングと速度ゲーティングによる3D変形可能な登録", "", "なし", "画像", "位置・対応関係", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36672", "summary": ["既存の手法では、局所的なマッチング信頼性と空間的文脈選択、変形更新強度を3D変形可能な登録において十分に組み合わせることができていません。", "ReliMorphは信頼性の手がかりを用いて空間的専門家の融合を導き、粗細から細かい精錬までの残留速度をゲートします。", "ReliMorphは、空間専門家のルーティングと残差速度ゲーティングを共同条件付けする初の3D変形可能なレジストレーションフレームワークです。"]}], ["2026-10-27", "Look Only When Needed: Certificate-Guided Visual Routing for Efficient Diffusion VLMs", "必要な時のみ見る:効率的な拡散VLMのための証明書ガイド付き視覚ルーティング", "", "あり", "画像・テキスト", "画像・テキスト", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36671", "summary": ["DVLMはすべてのノイズ除去ステップで入力全体を処理するため、入力の89〜97%を占める画像の計算を効率的に使わなくなります。", "OWNは証明書ガイド付きの視覚ルーティングを用いて、各ステップで画像を処理するかどうかを、直近の画像条件付き予測との一致に基づいて決定します。", "LOWNは10のベンチマークでLLaDA-Vのスコアの99.6%を維持し、平均して35.3%のデコードFLOPを達成しています。"]}], ["2026-10-27", "Haste Makes Waste? Towards Safe Few-Step Text-to-Image Models", "急ぐと無駄になるのか?安全な少ステップテキスト画像モデルへ向けて", "", "なし", "テキスト", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36665", "summary": ["少ステップのテキスト画像モデルは生成時間が速いものの、安全でない生成率に影響が出る可能性は不明です。", "DICEは、少ステップモデル向けに調整された蒸留後消去法であり、その潜在的な構築と世代保存損失を蒸留法と整合させます。", "DICEはFLUX Schnellで安全でない発生率を0.046に低下させ、従来の消去方法の0.161よりも大幅に低くします。"]}], ["2026-10-27", "SWIM: Learning What Matters from Behaviors for JEPA World Models", "SWIM:JEPAワールドモデルのための行動から学ぶ", "", "なし", "画像", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36662", "summary": ["JEPAは潜在空間においてタスクに関連する状態情報を組み込むことに失敗しています", "SWIMは、状態からの動作や将来の変位を予測することで軌道から状態の重みを学習します", "5つのロボット操作シミュレーションタスクを通じて、SWIMは一貫して計画の成功率を向上させ、均一な状態重み付けよりも優れています。"]}], ["2026-10-27", "SAGE: Semantic-Augmented Geometric Experts for Point Cloud Registration", "SAGE:ポイントクラウド登録のための意味拡張幾何学的専門家", "", "なし", "点群", "3D データ", "", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36658", "summary": ["低重なり点雲のレジストレーションは、幾何学的には類似しているが意味論的に異なる構造があるため、困難です", "SAGEは、セマンティックガイド付き専門家混合アーキテクチャを用いて、凍結された事前学習済みの意味的表現を登録パイプラインに統合します", "SAGEは、同じ改良回数で3DLoMatchと3DMatchで最高の登録リコール率と不列比を達成しています"]}], ["2026-10-27", "Image Modeling: From Handcrafted Priors to Foundation Image Models", "画像モデリング:手作りの先行から基礎的なイメージモデルへ", "Google", "なし", "画像", "画像・テキスト", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36646", "summary": ["既存の画像モデリング手法は、手作業で作られた事前モデルとデータ駆動型の深層モデルに分断されており、統一された枠組みが欠けています。", "本論文は、対数事前分布の勾配を統一数学的エンジンとして用い、データ多様体の共通確率的特徴付けの下で画像モデリングを統一するベイズ的枠組みを提案しています。", "このフレームワークは信号処理と機械学習を橋渡しし、変分最適化とスタインスコア関数を通じて後方サンプリングを結びつけます。"]}], ["2026-10-27", "Adapting Video Models for Robot Control via Motion-guided Asymmetric Prediction", "モーションガイド非対称予測によるロボット制御用ビデオモデルの適応", "", "なし", "動画", "動画・行動", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36624", "summary": ["既存の手法ではWAM内のすべての視覚領域を一様に監督し、ロボット制御における領域間の関連性の違いは無視されています。", "モーションガイド非対称予測(MoGAP)は、ノイズを領域間で非対称的に割り当て、モデルを訓練して、より汚染の少ない静的領域をコンテキストとして再構築します。", "MoGAPは政策のパフォーマンスを向上させ、GR-1テーブルトップベンチマークの成功率をFast-WAMの38.8%から47.5%に、Cosmos3-Nanoの成功率を52.3%から62.3%に引き上げました。"]}], ["2026-10-27", "4D Reconstruction with Events & RGB", "イベントとRGBを用いた4D再構成", "", "なし", "画像", "画像・3D データ", "", "", "", "", "", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36610", "summary": ["既存の4D再構成手法は、モーションブラーや時間的エイリアシングにより高速または非均一な動きで失敗します。", "既存のRGBのみの4D再構成モデルにイベントカメラ入力ブランチを追加すること。", "RGBイベント融合は、3つのベンチマークデータセットで平均してAbs Relを3.4%削減します。"]}], ["2026-10-27", "Camera-to-Quadruped Robot Pose Estimation from Sequential Images", "連続画像からカメラから四足歩行ロボットへの姿勢推定", "", "なし", "動画・画像", "姿勢", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36599", "summary": ["四足歩行ロボットは、時間変化する関節、対称性、危険な環境での自己遮蔽により姿勢推定に課題があります。", "QuadPoseは単眼ビデオシーケンスから18DFのポーズを推定し、QuadSynはカメラから四足歩行ロボットへの姿勢ベンチマークとして初めて導入されました。", "QuadPoseはQuadSynで92.18%のPCK@2.5pxを実現しています。"]}], ["2026-10-27", "WithinVAE: Compact Visual Autoencoding with Self-Distilled Semantics", "WithinVAE: 自己蒸留意味論を用いたコンパクトな視覚オートエンコーディング", "", "なし", "", "ラベル", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36593", "summary": ["既存のセマンティック・トークナイザーは、事前学習済み認識エンコーダからセマンティクスを受け継ぎ、反転に必要な外観の詳細を破棄します。", "WithinVAEは逐次ボトルネック、指数関数的に移動平均のコピーからの自己蒸留、位置依存トークンマスキングを用いて4倍圧縮を実現します。", "WithinVAEは、RPiAEに比べて4つの再構成指標を1.36dB改善し、事前学習表現を使用せずに線形プロービングを6.5ポイント向上させます。"]}], ["2026-10-27", "LabWorld: Learning Interactive 4D Worlds for Scientific Experimentation", "LabWorld:科学実験のためのインタラクティブな4Dワールドの学習", "", "なし", "動画・画像・3D データ", "3D データ", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36592", "summary": ["既存のラボシミュレーターは手動のアセットやあらかじめ定義された手順に依存しており、ラボ動画には明確なインタラクション情報がありません。", "LabWorldは、モノランクRGBビデオを用いて、3Dアセット、時間変化状態、イベント制約を持つインタラクティブな4Dラボワールドを再現します。", "LabWorldは0.501平均マスクIoUと0.638チューブ長正規化PCK-AUCを達成し、それぞれ0.033と0.035によってベースラインを超えています。"]}], ["2026-10-27", "Decoupling Consistency and Conflict across MLLM Layers for Fake News Detection", "偽ニュース検出のためのMLLM層間の一貫性と対立のデカップリング", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36569", "summary": ["既存の手法は一貫性と対立を粗く静的な方法で扱い、ままな対立を捉えたり、異なる対立レベルに適応したりする能力を制限しています。", "MLCCDは、関連するトークンを選択し、明確な表現変更でトークンを保存し、専用ルーターで証拠を集約することで、MLLMの層間での一貫性と競合を切り離します。", "3つのベンチマークでの実験により、MLCCDは既存の手法を上回る成果を示しています。"]}], ["2026-10-27", "PRISM-BENCH: Diagnosing Grounded and Faithful Multimodal Reasoning Beyond Final-Answer Accuracy", "PRISM-BENCH:最終回答の正確さを超えた地に足のついた忠実なマルチモーダル推論の診断", "", "なし", "画像・テキスト", "テキスト・ラベル・画像", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36554", "summary": ["既存の研究は最終解答の正確さに焦点を当てていますが、地に足のついた忠実なマルチモーダル推論のための診断は欠けています。", "PRISM-BENCHは、専門家が厳選した1,000の質問と理想的に推論された痕跡を用いて知覚とトレースアライメントを診断します。", "トレースアライメントは、マクロAUROC 0.66の25系の答え正解を予測し、モデルペアの24.2%を精度に対して再順序付けします。"]}], ["2026-10-27", "FrameForge: Harnessing Priors of Video Foundation Models for Unified Image Generation", "FrameForge:統一画像生成のためのビデオ基盤モデルの事前利用", "", "なし", "画像・テキスト", "画像・動画・テキスト", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36545", "summary": ["既存の手法は条件・目標時間的位置を固定するため、生成タスク間の適応性を制限しています。", "FrameForgeはMoTEとCoTRを用いて、条件付き生成のための入力適応型仮想時間関係をモデル化しています。", "FrameForgeは3つのベンチマークでの実験により、3つのタスクで優れたパフォーマンスを達成しています。"]}], ["2026-10-27", "Frugal Handwritten Text Recognition for Sub-Saharan Civil-Status Registers: A Smartphone-to-Records Pipeline with CPU-Only Inference", "サハラ以南の市民ステータスレジスタのための節約的な手書きテキスト認識:CPUのみの推論によるスマートフォンからレコードへのパイプライン", "", "なし", "画像・テキスト", "マスク・ラベル", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36540", "summary": ["サハラ以南アフリカの手書きの市民身分登録簿は写真に撮られますが、ほとんど文字起こしが行われず、その内容は検索できません。", "消費者向けスマートフォンキャプチャとCPUのみの推論を組み合わせた節約的なパイプライン、そして無料GPU上で微調整されたKraken Recognizerの組み合わせです。", "ファインチューニングにより、6コアノートパソコンCPUでは文字誤り率を14.53%から0.50%に、ワード誤り率を56.93%から3.37%に減少させます。"]}], ["2026-10-27", "RoboAuto: Autonomous Robot Program Search through Multi-Level Physical Understanding", "ロボオート:多層物理的理解による自律ロボットプログラムの検索", "", "あり", "テキスト", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36533", "summary": ["既存の手法は主に実行フィードバックに依存してプログラムの洗練を進めており、ロボット操作では物理的な問題が解決されないことが多いです。", "RoboAutoは階層的な知識ベース、シーングラウンディング、多段階計画を用いて、オブジェクト、シーン、インタラクションレベルで物理的理解を明示的に整理します。", "RoboAutoは短期間のLIBERO-PROタスクで89.1%の成功率を達成し、LIBERO-PROロングおよびLIBERO-PlusでのASPIREの平均成功率の2倍以上を達成しています。"]}], ["2026-10-27", "PRISM: Pathology Reliability In Scarce-label Medicine. A Tile-level Benchmark of Pathology Foundation Models", "PRISM:希少ラベル医薬品における病理学の信頼性。病理学基礎モデルのタイルレベルのベンチマーク", "", "あり", "", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36517", "summary": ["既存の病理学基盤モデルは、校正、低ラベル行動、機関間での堅牢性の評価が欠けています。", "PRISMは6つのタイルレベルのデータセットで、6つのラベル分数、3つのシードで8つのモデルを評価し、4軸にわたる信頼性を測定します。", "PRISMは、288セル中49セルでラベル分離依存型キャリブレーションや温度スケーリングの失敗を含む4つの現象を特定しています。"]}], ["2026-10-27", "Identity or Evidence? Auditing Evidence Dependence in Agentic Life-Science Benchmarks", "アイデンティティかエビデンスか?エージェント的生命科学ベンチマークにおけるエビデンス依存性の監査", "", "なし", "医用画像・テキスト", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36510", "summary": ["既存のベンチマークでは、エビデンス依存的推論と名前に基づく推論を区別できていません。", "論文は臨床および公開された生命科学のベンチマークに基づいて独立して識別と証拠を反映しています。", "論文は、同一性を盲検した場合とエビデンスを比較した場合の性能に0.5倍の差があることを示しています。"]}], ["2026-10-27", "ARISE: Authentic Reference-Informed Stability Enhancement for Continual Multimodal Forgery Detection", "ARISE:継続的なマルチモーダル偽造検出のためのAuthentic Reference Informed Stability Enhancement", "", "なし", "画像・テキスト", "ラベル・テキスト・バウンディングボックス", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36509", "summary": ["既存の研究は静的攻撃分布を前提としており、新たな偽造メカニズムが登場するとこの分布は失敗します。", "ARISEは、正真正銘の内容とGRASPのガウス混合モデルを用いて安定した表現を制約しつつ、可塑性を許容し、VARは再生強調のための脆弱性を推定します。", "3つの攻撃進化プロトコルと複数の検出器アーキテクチャをまたぐ実験により、代表的な継続学習ベースラインに比べて歴史的保持率と最終平均性能が向上したことが示されました。"]}], ["2026-10-27", "GarmentSegAgent: Autonomous Garment Segmentation for Web Fashion Images via Textual Self-Refinement", "GarmentSegAgent:テキストセルフファインメントによるウェブファッション画像の自律的な衣服セグメンテーション", "", "なし", "画像・テキスト", "マスク・ラベル・画像", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36506", "summary": ["ウェブファッション画像における信頼性の高い衣服セグメンテーションは、視覚的な異質性のため困難です", "GarmentSegAgentはCASTを用いて、視覚的誤りの帰属とテキスト最適化を反復的な自己改良を通じて結びつけています", "実験では、従来のTextGradに比べて領域の重なりと境界精度が一貫して改善されていることが示されています"]}], ["2026-10-27", "Spatial-Frequency Learning for Scanning Transmission Electron Microscopy Image Enhancement", "走査透過型電子顕微鏡画像強調のための空間周波数学習", "", "なし", "画像", "画像", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36487", "summary": ["既存の手法はSTEM画像の深刻な劣化に苦戦しています", "空間領域と周波数領域の特徴を別々に強化し融合する空間周波数融合ネットワークを提案します", "原子定位精度を向上させ、合成データセットおよび実データセットで最先端の性能を実現します"]}], ["2026-10-27", "Confident First, Reflective Second: Reinforcement Learning of Confidence-Preserving Reflection for Video Understanding", "自信を優先し、反省的思考を次に:ビデオ理解のための自信保持反射の強化学習", "", "なし", "動画", "動画", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36467", "summary": ["ビデオモデルは、サンプリングされたフレームから応答するときに決定的な瞬間を逃す可能性があります。", "CoFireは強化学習を用いて、自信のある初期回答と内省的な第二ステップを強制し、それがそれをさらに強化します。", "CoFireは、結果報酬RLに比べて初期回答および最終精度を平均4.1ポイントと3.7ポイント向上させます。"]}], ["2026-10-27", "Nemotron-Labs-Diffusion-Uni: Elastic Self-Refining Unified Diffusion LLM with Cross-Paradigm On-Policy Distillation", "Nemotron-Labs-Diffusion-Uni:クロスパラダイム・オン・ポリシー・ディスティレーションを備えた弾力的自己精錬統一拡散LLM。", "", "なし", "テキスト・画像", "画像・テキスト", "", "", "●", "●", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36466", "summary": ["既存の統一拡散モデルは、パラダイム間での視覚的理解や生成能力の効果的な伝達に欠けています。", "NLD-Uniは、政策の精製に関する統一されたクロスパラダイムフレームワークと、段階的な自己精錬拡散プロセスを導入します。", "NLD-Uniは統合されたDLLM間で多様なタスクで最先端の性能を発揮しています。"]}], ["2026-10-27", "ClusterSplat: Semantic Cluster Selection for 3D Visual Grounding in Gaussian Splatting", "ClusterSplat:ガウススプラッティングにおける3D視覚グラウンディングのためのセマンティッククラスター選択", "", "あり", "テキスト", "マスク・3D ガウス", "", "●", "", "", "●", "●", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36462", "summary": ["既存の手法では3DGSでヒューリスティック閾値やトップ比率フィルタリングが3Dターゲット選択に用いられており、シーンやプロンプトごとにスコアが異なるためターゲティングが不安定になります。", "ClusterSplatは、インスタンス認識型ガウス特徴を学び、シードボクセルを形成し、記述の長さ基準に基づいて統合することで、3Dターゲット選択をシーン適応候補に対するクラスタレベルの選択として再構築します。", "ClusterSplatは、ScanReferおよびScanNet v2で最高のレンダリング2Dセグメン も信頼できる性能を上回るモデルはありませんでした。"]}], ["2026-10-27", "SO-101 Bench: Accessible Spatial Manipulation", "SO-101ベンチ:アクセス可能な空間操作", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36420", "summary": ["既存の政策では、SO-101のような低コストの武器で空間的に制約された言語条件の作業を、箱から出してから実行することはできません。", "SO-101ベンチは、アイザックラボのデジタルツインを基にした実際のSO-101セットアップを基にしたシミュレートベンチマークで、4つのタスク、138個のオブジェクト、916エピソード、3,629のデモンストレーションで構成されています。", "双子は実際のロボットと同様に政策をランク付けし、Spearman rho = 1.00、MMRV = 0.000で、シミュレーションでは成功を過大評価しています。"]}], ["2026-10-27", "SpeeDiff: Scalable Pixel-Anchored End-to-End Latent Diffusion Model", "SpeeDiff:スケーラブルなピクセルアンカー型エンドツーエンド潜在拡散モデル", "ByteDance; Meta", "なし", "", "3D データ", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36419", "summary": ["既存の手法は、無制限の逆伝搬による潜在空間崩壊によりエンドツーエンド拡散モデルで性能低下に直面しています。", "SpeeDiffはTweedieピクセル再構成損失を用いてピクセルレベルのフィードバックを提供し、VAEとディフュージョンモデルを一から共同で訓練します。", "SpeeDiffは、Vanilla SiTやREPAよりも140倍と61倍の速さでトレーニングを達成し、ImageNetでのFIDスコアはそれぞれ1.50と1.53です。"]}], ["2026-10-27", "ORBITAL: Optimization of Robust Brain--Computer Inference Through Architecture-Aware Low-Precision Compression", "ORBITAL:アーキテクチャ認識型低精度圧縮による堅牢な脳-コンピュータ推論の最適化", "", "なし", "センサー信号", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36411", "summary": ["圧縮は、比例的な堅牢性向上なしにハードウェアコスト削減を招きます", "ORBITALは構造化圧縮、リカバリー認識型作動ポイント選択、マルチアタック評価、ネイティブエッジ検証を組み合わせています", "S25-TRADESは標準フルの21.27%に対し23.06%の堅牢性を達成し、パラメータ数とMAC数が26.27%少なくなっています"]}], ["2026-10-27", "SOMA: A Benchmark for Fine-Grained Egocentric Behavior and Body-Motion Understanding", "SOMA:細かい自己中心的行動と身体の動き理解のベンチマーク", "", "公開予定", "テキスト・動画・画像", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36384", "summary": ["現在のMLLMの評価は物体、シーン、粗い動作に焦点を当てており、身体運動の理解は十分に評価されていません。", "SOMAは、身体構成、運動ダイナミクス、時間的推論を含む1,632の人間検証問題を含むベンチマークを導入し、37件のMLLMを評価し、人間による nformed Decoding for Easier Training of Pixel-Space Flow Models", "推定を超えて:ピクセル空間フローモデルの訓練を容易にするためのウィーナーインフォフォームド復号", "", "なし", "テキスト", "画像", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36192", "summary": ["ピクセル空間で直接速度場を学習するのは難しく、時間もかかります。", "Wiener-informed Decoding(Wiener-informed Decoding、WiD)は、統計的知識を用いて直接予測を行い、ネイティブブロックを改変せずにデコーダ計算を組織します。", "WiDは異なる解像度でクラス条件付きおよびテキストから画像への生成を向上させ、ImageNet上で256x256の学習エポックを37.5%少なくします。"]}], ["2026-10-27", "Bayesian Evidence Accumulation for Graph-Based Learning in Dynamic Data-Driven Applications Systems", "動的データ駆動型アプリケーションシステムにおけるグラフベース学習のためのベイズエビデンス蓄積", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36190", "summary": ["既存のGNNフレームワークは静的であり、連続的で不確実な観測を持つ動的なデータ駆動型アプリケーションには適していません。", "B-EAGLeはグラフ分類をGNNエンコーダとベイズ累積器を用いた逐次的な証拠蓄積プロセスとして再定式化します。", "B-EAGLeは逐次観測における原則信頼推定により競争力のある性能を達成しています。"]}], ["2026-10-27", "PrinGS: Privacy Preservation in Gaussian Splatting", "PrinGS:ガウススプラッティングにおけるプライバシー保護", "", "なし", "画像", "3D データ", "", "", "", "●", "●", "●", "●", "●", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.36168", "summary": ["既存の3Dガウススプラッティング手法は、顔やテキストなどの機密情報を学習表現に符号化しており、共有や展開時にプライバシーの懸念が生じます。", "PrinGSは、リファレンスビューを用いて訓練済みスプラット内の敏感領域を匿名化する表現レベルの匿名化フレームワークと、最適化中に機密コンテンツの埋め込みを防ぐプライバシー・バイ・デザインのトレーニング戦略を提案しています。", "PrinGSはトレーニング後の匿名化を1秒未満で達成し、顔の類似度指標が9.79%、OCR文字誤り率が1.00のスプラットを生成します。"]}], ["2026-10-27", "Any3R: Feedforward 3D Reconstruction from Any Camera Type", "Any3R:任意のカメラタイプからのフィードフォワード3D再構築", "", "あり", "画像", "姿勢・3D データ", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36150", "summary": ["既存の手法では、画像からの3D再構成にはピンホールカメラが用いられています。", "Any3Rはフィードフォワードネットワークを用いて、レンズの種類や歪みを前提にせず、任意の中央カメラから3Dジオメトリを再構築します。", "Any3Rは、3つのデータセットにわたる13台の中央カメラで最も一貫して正確な手法です。"]}], ["2026-10-27", "Closed-Loop Aware Planning via Imitation-Free Speed Scoring for End-to-End Autonomous Driving", "模倣のない速度スコアリングによるクローズドループアウェアプランニングによるエンドツーエンド自動運転", "", "あり", "", "行動", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36079", "summary": ["既存のエンドツーエンド自動運転手法はオープンループ模倣学習に依存しており、ユーザーの好みへの適応が制限され、ノイズの多いデモンストレーションによる信頼性の低い監督を生み出しています。", "CLAP-ADは、設計のパラダイムを用いて、模倣を通じて経路を学び、安全制約に伴う学習機能を使って候補速度をスコアリングします。", "CLAP-ADはTFv6に比べてスピード準着度スコアで12.9ポイント向上し、運転スコアはUniADおよびVADに対して+28.5および+32.7向上しています。"]}], ["2026-10-27", "The Trinity:Capability-Driven Recursive Self-Improvement for Multimodal Agents", "トリニティ:マルチモーダルエージェントのための能力駆動型再帰的自己改善", "", "なし", "", "行動", "", "", "", "●", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36077", "summary": ["マルチモーダル知能のスケーリングは、異種環境の構築や手動のハーネス反復においてボトルネックに直面します。", "Trinityフレームワークは、タスク組織を共有能力要件にシフトすることで、エージェントを再帰的に改善するために3つの役割を用います。", "進化したハーネスは、28のトレーニングベンチマークで平均パフォーマンスを34ポイント向上させ、18の未確認ベンチマークで26ポイント向上させます。"]}], ["2026-10-27", "VibeVideoBench: Evaluating Multimodal Agents on Code-Driven Video Generation", "VibeVideoBench:コード駆動型ビデオ生成におけるマルチモーダルエージェントの評価", "", "なし", "画像・テキスト", "動画・音声・テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35864", "summary": ["拡散ビデオモデルは、正確な公式やチャート、同期したナレーションを画面上のイベントと確実に描画できません。", "VibeVideoBenchは、画像生成モデルやビデオ生成モデルを使用せずに、フレームごとにコードを記述し、サウンドを合成することにより、ビデオを生成するエージェン", "ベンチマークには12カテゴリーにわたる239のタスクが含まれ、13,000件のルーブリックチェックと3つのVLM審査パネルによる5つの品質次元が採点されています。"]}], ["2026-10-27", "Do vision models know that three is three?", "視覚モデルは「3」が3だと知っているのでしょうか?", "", "なし", "画像", "特徴表現", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35857", "summary": ["視覚モデルは、視覚的に無関係な領域間で概念遷移を異なる方法で符号化することがあります。", "私たちは10の概念ファミリーで46種類のビジョンエンコーダーを研究し、体制を超えた概念の方向性を分析しました。", "断片的な線形性は固定されておらず、局所-グローバル線形性は τ と [0.38, 0.89] の相関関係にあります。"]}], ["2026-10-27", "FL4N: Feed-forward Latent Model for 4D Novel View S うな既存の3D再構成モデルは、カメラポーズの不確実性を報告していません。", "VGGTの凍結した特徴に対する線形プローブは、難しい画像ペアのポーズ失敗を予測します。", "このプローブはポーズ失敗検出で93.5%のROC-AUCを達成し、他の手法を上回る性能を発揮しています。"]}], ["2026-10-27", "OmniBrain-0: A Unified Agentic Model for Embodied Intelligence", "OmniBrain-0:身体化された知性のための統一エージェントモデル", "Xiaomi", "なし", "", "軌跡", "", "", "", "", "", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.36013", "summary": ["既存の手法は、身体知能における長期的な協調、タスク進捗追跡、失敗回復に苦労しています。", "OmniBrain-0は、操作とナビゲーションを調整するために共有された高水準意思決定モデルを用い、事前訓練、エージェント蒸留、多教師による政策上の蒸留を組み合わせた進歩的トレーニングフレームワークを用いています。", "OmniBrain-0は、クローズドソースの教師よりも推論および実行のオーバーヘッドを大幅に抑えつつ、強力なクロスドメインタスクパフォーマンスを実現しています。"]}], ["2026-10-27", "Improving Signals, Declining Encoder: A Known-Answer Test of Label-Free Monitoring in Self-Supervised Learning", "信号の改善とエンコーダの低下:自己監督学習におけるラベルフリーモニタリングの既知の答えテスト", "", "なし", "画像", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35766", "summary": ["既存のラベルフリー監視手法では、エンコーダ性能の早期低下を検出できません。", "この論文は、既知の生成因子を持つ合成画像上でエンコーダを訓練し、ラベルなしの信号を追跡して性能低下を検出します。", "10件中9件のシードは可読性の低下を示し、ラベルなしのシグナルは非減少したものよりも減少した走行の方が評価が良かったです。"]}], ["2026-10-27", "VidEdit3D: Flexible 3D Gaussian Editing with Video Diffusion", "VidEdit3D:ビデオ拡散を用いた柔軟な3Dガウス編集", "", "なし", "3D ガウス・多視点画像・動画", "動画・画像・軌跡", "", "", "●", "●", "●", "●", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35756", "summary": ["既存の3D編集手法は、マルチビューの一貫性や構造の変更に苦労しつつ、2Dの柔軟性を保っています。", "Videdit3dは、事前に訓練されたビデオ拡散モデルを使用して、軌道ベースのビデオ編集タスクとして3Dシーン編集を再定式化します。", "このフレームワークは、ベースラインよりも強い命令の整合性とマルチビューの一貫性を実現しています。"]}], ["2026-10-27", "A Category-Selective Encryption Framework for Privacy Protection of UAV Images", "UAV画像のプライバシー保護のためのカテゴリー選択的暗号化フレームワーク", "", "なし", "衛星・航空画像", "バウンディングボックス・ラベル", "", "", "", "", "", "", "", "", "", "", "", "●", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35729", "summary": ["UAV画像は、通常のコンテンツと共に機密物体が撮影されるため、プライバシーの懸念を引き起こします", "80クラス検出器を用いてユーザー指定の敏感なカテゴリのみを暗号化するカテゴリ選択的暗号化フレームワーク", "このフレームワークは、センシティブなカテゴリのみを暗号化し、非センシティシティなオブジェクトはそのままにすることでセマンティックな選択性を実現しています"]}], ["2026-10-27", "MatAnyone-E: Sparse Memory Propagation for Efficient High-Resolution Video Matting", "MatAnyone-e:効率的な高解像度ビデオマットのための疎メモリ伝播", "", "なし", "動画", "位置・対応関係", "", "●", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35724", "summary": ["高解像度ビデオマットは、細かいディテールの保存やフレーム間の一貫性の維持に苦労し、計算コストも高くなります。", "MatAnyone-Eはスパースメモリ伝播を用いて不確実な領域に計算を集中させ、効率のために低解像度のマッチング結果を再利用します。", "MatAnyone-Eは推論速度を7.4倍に上げ、ピーク時GPUメモリ使用率を4K時のMatAnyone 2の7.6%に削減します。"]}], ["2026-10-27", "Triage: Skip, Skim, or Refine Attention Tiles in Video Diffusion Transformers", "トリアージ:ビデオ拡散トランスフォーマーにおける注意タイルをスキップ、スキップ、または精細化する", "", "なし", "動画", "動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35706", "summary": ["既存の方法はビデオ拡散トランスの注意コストを削減しますが、すべてのタイルに対して単一の精度を採用しているため、タイル間で誤差が大きくなります。", "トリアージは各タイルに、予測された誤差削減と計算コストに基づくスキップ、スキップ、精錬の3つの近似段階のいずれかを割り当てます。", "トリアージは、密集したFlashAttentionで最大2.32倍の高速化を実現し、5つの設定で最高PSNRベースラインより0.3〜3.0dB高いPSNRを実現しています。"]}], ["2026-10-27", "OmniShowcase: Omnidirectional Subject-Consistent Video Generation from Multi-View Images", "OmniShowcase:マルチビュー画像による全方向被写体一貫性ビデオ生成", "", "あり", "動画・画像・多視点画像", "動画・軌跡", "", "", "", "●", "", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35684", "summary": ["いくつかの参照画像から特定の被写体の動画を生成するのは、カメラが入力に見えない表面を露出させると難しいです。", "OmniShowcaseはデータ合成パイプラインとジオメトリコンディショニング手法を用いて、マルチビュー画像から動画を生成します。", "この手法は、最先端の被写体識別と3D一貫性を実現し、競争力のある映像品質と動きを実現しています。"]}], ["2026-10-27", "Printed and Scanned: Exposing the Fragility of Single-Image Morphing Attack Detectors under Print-Scan Degradation", "印刷・スキャン:単画像モーフィング攻撃検出器の脆弱性を暴露するプリントスキャン劣化", "", "なし", "画像・テキスト・姿勢", "画像・姿勢", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35682", "summary": ["既存のS-MAD検出器はプリントスキャン劣化により脆弱であり、デジタルパイプラインには存在しない現実世界のアーティファクトが生じます。", "300DPIと600DPIで画像を印刷して再スキャンすることによって得られたSYN-MAD22データセットの印刷スキャンバージョンを導入し、このデータセットのS-MADモデルを評価します。", "デジタル領域で良好に動作する検出器は、プリントスキャン劣化の下で平均等誤り率が3倍以上増加します。"]}], ["2026-10-27", "CounterFlow: Target-Conditioned Flow Matching for Visual Counterfactuals", "カウンターフロー:視覚的反事実のためのターゲット条件付きフローマッチング", "", "なし", "画像", "位置・対応関係", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35679", "summary": ["既存の手法では、計算負荷を抑えつつ現実的な視覚的反事実を生成するのに苦労しています。", "CounterFlowはターゲット条件付きベクトルフィールドを用いて、ソース画像を生のピクセル空間内で指定されたターゲットクラスに誘導することで反事実を生成します。", "CounterFlowは、GANや拡散ベースの手法よりも計算負荷を抑えつつ、視覚的リアリズムとターゲットクラス切り替えにおいて最先端の性能を実現します。"]}], ["2026-10-27", "VPR-Space: A Benchmark for Visual Place Recognition in Space Analog Domains", "VPR-Space:宇宙アナログ領域における視覚的場所認識のベンチマーク", "", "あり", "画像・テキスト・姿勢", "ラベル", "", "", "", "●", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35642", "summary": ["既存のVPRやSLAMのアプローチは、月や火星のような機能の乏しい地球外環境では苦戦しています。", "VPR-Spaceは、固定ポーズの閾値ではなくSLAM関連性に基づくグラウンドトゥルースを生成するために、RPEのアンサンブルを使用します。", "ベンチマークは、環境や照明の多様な課題を持つSADデータセットでのVPR手法を評価します。"]}], ["2026-10-27", "SeeRF: Learning to See Beyond Fields of View via Generative Image Registration and Fusion", "SeeRF:生成画像レジストレーションと融合による視野の向こうを見る学習", "", "あり", "画像", "マスク・画像", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35637", "summary": ["既存のフュージョン手法は、視点やFOVの不一致によりセンサーの視野制限を超えたシーンレベルの情報統合に苦労しています。", "SeeRFは生成画像の正位合わせと融合を用い、変形生成、特徴抽出、粗細から細かい位置合わせモジュールを組み合わせています。", "このフレームワークは、生成拡散モデルを用いて、重なりのない視野領域の効果的な完成と自然な融合を可能にします。"]}], ["2026-10-27", "Synthetic Deformable Tubular Benchmark: A mechanically annotated dataset for evaluating deformable 3D reconstruction", "合成変形管ベンチマーク:変形可能な3D再構築を評価するための機械的注釈付きデータセット", "", "あり", "医用画像・深度・動画", "3D データ", "", "", "", "", "●", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35621", "summary": ["変形可能な3D再構築を評価するには、カメラの動き、表面変形、材料対応、画像の外観を結びつける地実性が必要です。", "本論文は、チューブラーシーンの作成、注釈付け、評価のためのオープンソースツールキットLumenMorphで生成された合成変形管ベンチマークを提案しています。", "このベンチマークは解剖学的または臨床的なリアリズムを主張することなく、管理された総合的な参照を提供します。"]}], ["2026-10-27", "RoboDoctor: Training-Free Recursive Self-Improvement for Robot Policies", "ロボドクター:ロボットポリシーのためのトレーニング不要再帰的自己改善", "", "なし", "", "行動", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35604", "summary": ["既存の手法は、ロボットの方針を物理的な相互作用の結果に適応させるのに苦労しています", "RoboDoctorは、診断、行動、経験を3つの改訂目標で結びつけるために、トレーニング不要のフレームワークを用いています", "RoboDoctorは54のタスクエントリーで5次元の平均スコア57.10を達成しています"]}], ["2026-10-27", "Beyond Distribution Matching: Self-Supervised Representation Forcing for Few-Step Video Generation", "ディストリビューションマッチングを超えて:少ステップ動画生成のための自己監督表現強制", "Tencent", "なし", "動画", "動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35594", "summary": ["既存の手法では内部表現の明示的な正則化が欠けており、蒸留ステップを削減すると空間的・時間的ダイナミクスが劣化します。", "自己フロー強制法(SF$^2$)は、予測表現損失を分布マッチング蒸留に統合し、出力目標を変えません。", "SF$^2$は空間の忠実度と動きの品質を向上させ、アーキテクチャに依存しない構造で計算負荷を最小限に抑えます。"]}], ["2026-10-27", "Hyperspectral Unmixing using a Structured Linear Mixing Model with Additive Spectral Variability", "加法スペクトル変動を用いた構造化線形混合モデルを用いたハイパースペクトルアンミキシング", "", "なし", "ハイパースペクトル画像", "", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35580", "summary": ["既存の手法では、ハイパースペクトルアンミックスにおけるスペクトル変動が無視されており、誤差伝播を招いています。", "加法スペクトル変動項とSVにペナルティを与えるNMFベースのアルゴリズムを用いたSAV-LMMを提案します。", "構造化加法変動モデルを用いて、超スペクトル画像とSVのアンミクシングを改善し、初期化も改善します。"]}], ["2026-10-27", "Copying As Defense: Protecting Images from Editing By Eliciting Model Copying", "防衛としてのコピー:モデルコピーを誘導することで画像を編集から守る", "Adobe", "なし", "画像", "画像・テキスト", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35566", "summary": ["DiTベースの画像編集者は説得力のある操作画像を生成でき、既存の防御はテキストや生成トークンを使ってモデルが指示に従うことを許すため編集を防ぐことに失敗しています。", "防御としてのコピー(CaD)は、初期のトランスブロックにおけるターゲット対参照の注意を最大化することで、モデルが参照画像をコピーすることを促します。", "CaDは編集成功率を81.4%から24.0%に(相対的に70.6%の相対的な減少)に減少させ、最適化ステップごとに1.8〜2.0倍の速度を上げます。"]}], ["2026-10-26", "Metric Scale for Insta360 Structure-from-Motion from the Camera's Embedded IMU", "カメラの埋め込みIMUから得られるInsta360の構造から移動するメトリックスケール", "", "なし", "動画・センサー信号・LiDAR", "3D データ", "", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35554", "summary": ["Insta360 SfMにおける既存のメトリクススケール方法はスマートフォンのARKit/ARCoreポーズに依存しており、これがスケールバイアスを生じさせる可能性があります。", "本論文は、Insta360 X5/X6に埋め込まれたIMUを用いて、SfMポーズ上の視覚慣性整列を通じてメトリックスケールを推定することを提案しています。", "各セグメントごとに独立してスケールを推定することで、共有推定と比較してバイアスを3.4%削減します。"]}], ["2026-10-26", "EARS: Evidence-Aware Retrieval via Sound and Motion for Budgeted Video Reasoning", "EARS:予算付きビデオ推論のための音と動きによる証拠認識型検索", "", "あり", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35536", "summary": ["均一フレームサンプリングでは、スパースイベント動画で短い証拠を見逃す", "EARSは光学流の動きとオーディオエネルギーを使ってフレームをランク付けし、その後ダイバーシティに対して時間的非最大抑制を適用します", "EARSは時間的多様性で0.94 APを達成し、均一サンプリングでは0.88を達成しています"]}], ["2026-10-26", "WorldPager: Zero-Stall Tiered Memory for Long-Horizon World Models on a Single Consumer GPU", "WorldPager:単一の消費者向けGPUで開発されたLong-Horizon Worldモデル向けのゼロストール階層メモリ", "", "なし", "姿勢", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35529", "summary": ["KVメモリのヒック容量や位置の地平線制限を1GPUで長時間セッションします。", "WorldPagerはGPU/DRAM/NVMe階層を使ってint4 KVを保存し、外挿したポーズに基づいてメモリをプリフェッチし、バックグラウンドで書き込みを行います。", "37.5分の動画を、ストールゼロでホストメモリが一定に保たれ、int4ストレージで測定可能な画質損失なしに生成します。"]}], ["2026-10-26", "Generative Structure from Motion with Native 3D Diffusion", "ネイティブ3D拡散による運動からの生成構造", "Tencent", "あり", "画像・姿勢", "3D データ・姿勢", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35522", "summary": ["既存の手法では見えない領域の復元ができず、再構築と生成を組み合わせるとエラーの連鎖的な誤差が発生しやすいです。", "GenSfMは、マルチモーダル拡散トランスフォーマーを用いたネイティブ3D拡散モデルと画像ベースの3D再構築を統合します。", "Toys4kおよびGSOでは、4ドルの未キャリブレーションビューで、GenSfMは新規ビューのPSNRを3.2ドル〜4.5ドルdB向上させ、中央値面取り距離を2.8ドル〜$3.8\\時間$短縮し、外部ポーズ推定のバックボーン、事後最適化、既知の内在要素なしに入力ビューポーズを$96\\%$ Acc@$5^\\circ$以上回復します。"]}], ["2026-10-26", "Learning High-Quality Pseudo-Labels for Point-Supervised Temporal Action Localization", "点教師あり時間的行動局在化のための高品質擬似ラベルの学習", "", "あり", "動画", "ラベル・バウンディングボックス", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35516", "summary": ["既存の疑似ラベルベースの方法は、よく局所化された提案を見落とし、元の提案プールからの代替境界証拠を十分に活用できていません。", "本論文は、検出器訓練中の事前誘導初期化と合意導向の精緻化を統合するフレームワークを提案しています。", "この手法は、PseRを3.7ポイント上回る平均mAPをTHUMOS14で68.5%達成しています。"]}], ["2026-10-26", "HiFiPix: Bringing High-Fidelity Real-World Super-Resolution Back to Pixel Space", "HiFiPix:高忠実度の実世界の超解像度をピクセル空間に復活させる", "", "公開予定", "画像", "画像", "", "", "●", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35515", "summary": ["拡散ベースの実世界の画像超高解像度は、VAEベースの潜在表現における情報損失により再構成精度が限られています。", "HiFiPixは、パッチ境界アーティファクトを抑制し生成能力を向上させるために、クロススケールウェーブレット識別器とミックスアップコントラストティブセルフディスティレーションを備えたピクセル空間のReal-ISRフレームワークを提案しています。", "HiFiPixは、修復精度と知覚品質の面で、既存の最先端の潜在空間手法を大きく上回っています。"]}], ["2026-10-26", "Learning Scene Coordinate Reconstruction from Unposed Images via Pose Graph Optimization", "ポーズグラフ最適化による非ポーズ画像からのシーン座標再構成学習", "", "なし", "画像・姿勢", "姿勢", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35501", "summary": ["ACE-Zeroのような既存の手法はグローバルおよびマルチビューの整合性制約を欠いており、複雑なシーンでポーズドリフトやズアライメントを引き起こします。", "ハイブリッドフレームワークは、ポーズグラフ最適化をACE-Zeroに統合し、カメラポーズを洗練させ、予測されたシーン座標からの相対ポーズ制約を用いて誤った調整を抑制します。", "このアプローチは、グローバル幾何学的推論を取り入れることで、姿勢推定の堅牢性と精度を向上させます。"]}], ["2026-10-26", "S$^2$-RL: Sample-Set Dual Reinforcement Learning for Generative Semantic Segmentation Dataset Distillation", "S$^2$-RL: 生成的意味分割データセット蒸留のためのサンプルセット双重強化学習", "", "なし", "テキスト", "画像・マスク・ラベル", "", "●", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35491", "summary": ["セマンティックセグメンテーションのためのデータセットディスティレーションは、高い計算コストと限られたセマンティック知識の凝縮というボトルネックに直面しています。", "S$^2$-RLは、拡散モデルベースのテキストから画像生成パラダイムとグループ相対政策最適化(Group Relative Policy Optimization)を用いたサンプルセットの二重報酬を用いています。", "S$^2$-RLは、ADE20KおよびCOCOデータセットの新しいベンチマークでベースラインに対して一貫した改善を達成しています。"]}], ["2026-10-26", "TP-JSCC: Efficient Token Pruning and Joint Source-Channel Coding for LVLMs-based 3D-VQA in Cloud-Edge Collaboration", "TP-JSCC:クラウドエッジコラボレーションにおけるLVLMベースの3D-VQAにおける効率的なトークンプルーニングおよび共同ソースチャネルコーディング", "", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "●", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35489", "summary": ["3D-VQAのためにリソース制約のあるエージェントにLVLMを展開するにはクラウドエッジの連携が必要ですが、大量の視覚データのオフロードは遅延や伝送の歪みをもたらします。", "TP-JSCCはトークンプルーニングと共同ソースチャネルコーディングを組み合わせ、データ量を削減し、クラウドエッジコラボレーションにおける堅牢な伝送を実現します。", "LGS-HTPは90%の剪定比率を達成し、"]}], ["2026-10-26", "Beyond Words Alone: Disentangling Distributed Evidence for Visually Grounded Cultural Translation", "言葉だけでは:視覚的に根拠のある文化翻訳のための分散証拠の解きほぐす", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35482", "summary": ["既存の評価は、テキスト、画像、文化的知識におけるソーシャルメディアコンテンツにおける意味の分散性を見落としています。", "Culture-MMTは、20ドメインにわたる498件のキュレーションされたUGCインスタンスを用いて、分散エビデンス実践的再構築の診断ベンチマークを導入しました。", "実際の画像は、ランダム画像と比べてビジュアルで+0.280、ハイブリッドで+0.197とパフォーマンスを向上させます。"]}], ["2026-10-26", "OBB-PBD: Extending Parallel Box Decoding to Oriented Bounding Boxes for Referring Expression Grounding in Aerial Imagery", "OBB-PBD:航空画像における表現グラウンディングの参照のための並列ボックス復号を向き付けたバウンディングボックスへと拡張", "", "なし", "画像", "3D データ", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35450", "summary": ["既存の手法では航空画像に水平バウンディングボックスが使われていますが、正確な参照表現のグラウンディングには向き付きのボックスが必要です。", "OBB-PBDは、ダブルアングルパラメータ化を用いて6スロット指向のバウンディングボックスを予測するためにPBDを拡張します。", "拡張モデルは、制御に比べてrotIoUを0.055 +/- 0.008改善し、平均は0.303 +/- 0.012です。"]}], ["2026-10-26", "Model-Aware Generation of Safety-Critical Scenes for Robust End-to-End Driving via Distilled Planner Surrogates", "ディスティルドプランナー代理を用いて、堅牢なエンドツーエンド運転のための安全に重要なシーンのモデル認識生成", "", "なし", "動画", "行動", "", "", "", "●", "", "", "", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35448", "summary": ["トレーニングデータのデータの不均衡により、安全性が重要なシナリオでは、エンドツーエンドの運転モデルが失敗します。", "モデル認識型フレームワークは、プランナーの計画責任者から抽出された微分可能な代替手段を用いて、安全性に重要な訓練シーンを生成します。", "これらのシーンでの微調整により、2台のプランナーでクローズドループの衝突率が約半分に減少します。"]}], ["2026-10-26", "Omni-InteractScope: Benchmarking Proactive and Agentic Interaction in Continuous Omnimodal Streams", "Omni-InteractScope:連続的なオムニモーダルストリームにおける積極的かつエージェント的な相互作用のベンチマーク", "Alibaba", "なし", "テキスト", "軌跡", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35439", "summary": ["既存の評価では、Omni-LLMがストリームエビデンスとユーザーのニーズをタイムリーな介入とどのように確実に結びつけるかについての洞察が不足しています。", "Omni-InteractScopeは、8つのタスクグループにわたる1,479件の人間注釈付きインタラクションを含み、入力モダリティ、イベントトリガー、介入タイプ、ユーザーニーズを結びつけたベンチマークです。", "(2) \\textbf{クエリなしリマインダーは依然として十分にカバーされていません}:評価されたすべてのモデルは、クエリなしリマインダーの方が、それぞれのターゲットセットで測定した明示的な質問よりもタイムリーな参照ターゲットリマインダーが低い。"]}], ["2026-10-26", "Unveil the Mask: Jointly-Optimized Diffusion Masked Pretraining for Appearance-Agnostic Operator Verification", "マスクの公開:外観に依存しないオペレーター検証のための共同最適化拡散マスク前訓練", "", "なし", "動画", "ラベル", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35414", "summary": ["従来の顔認識では、写真写実なアバター動画では操作者を識別できず、外見が操作者と切り離されています。", "本論文は、顔のランドマークシーケンスとビデオフレームを用い、拡散マスクされた事前学習済みの動き表現を補助タスクに導き、両モダリティの埋め込みを融合させるフレームワークを提案します。", "このアプローチはWBA2026ベンチマークで全体のAUC0.769を達成し、フューズ埋め込みにより話すモードと聞くモード間での検証が向上します。"]}], ["2026-10-26", "NeSySpec: Neuro-Symbolic Technical Intelligence for Auditing Engineering Specifications with an Application to Aircraft", "NeSySpec:航空機への応用による工学仕様監査のための神経記号技術インテリジェンス", "", "なし", "衛星・航空画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35403", "summary": ["既存の手法は、航空機のような複雑なシステムにおける物理的制約違反や現場変更について、工学仕様を正確に監査することができていません。", "NeSySpecは、Logic Tensor Networksを用いたニューロシンボリックフレームワークを用いて、記号公理やニューラルネットワークを統合して仕様の監査や違反の特定を行います。", "NeSySpecは破損したレコードに対する違反制約の特定精度を94.2%達成し、従来の手法を上回る性能を発揮しています。"]}], ["2026-10-26", "Toward Clinical Translation of Deep Learning-Based Intracranial Super-Resolution 4D Flow MRI Using Multi-Cohort Transfer Learning", "マルチコホート転移学習を用いた深層学習ベースの頭蓋内超分解能4DフローMRIの臨床応用へ", "", "なし", "画像・3D データ", "画像", "", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35396", "summary": ["既存の手法は、4DフローMRI再構築におけるクロスコホートの一般化に苦労しています。", "本論文は、頭蓋内4DフローMRIの深層学習に基づく超分解能のための合成前学習およびマルチコホート転移学習を提案しています。", "プールされた転移学習は、合成前学習およびコホート特異的モデルと比較して平均vNRMSEを減少させました。"]}], ["2026-10-26", "ACSAN: All-Convolutional Self-Attention Network Integrating Convolutional Operations with Vision Transformer", "ACSAN:ビジョントランスフォーマーと畳み込み操作を統合する全畳み込み自己注意ネットワーク", "", "なし", "画像・テキスト", "ラベル・テキスト", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35375", "summary": ["Vision Transformer(ViT)は大規模データに依存しており、パラメータ数が多く学習効率が遅いため、リソース制約のシナリオでは適用性が限定的です。", "ACSANは、ViTにおける完全連結行列を畳み込み演算に置き換え、動的畳み込み自己注意(Dynamic Convolutional Self-Attention)を用いて多スケール拡張畳み込みを通じて注意特徴を生成します。", "ACSANは、パラメータ数が少なく、ViTと同等かそれ以上の精度を達成し、MLPの代わりに畳み込み層を使用します。"]}], ["2026-10-26", "GIFT: Representation Geometry Matters for Single-Domain Generalized Object Detection", "GIFT: 表現ジオメトリは単一ドメイン一般化オブジェクト検出において重要である", "", "なし", "", "バウンディングボックス", "●", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35374", "summary": ["既存の手法では、分布シフト下でのビジョン基盤モデルの本質的な一般化能力が見落とされています。", "GIFTは、Householder反射やチャネルごとのスケーリングを用いた幾何学的ファインチューニングを用いて表現ジオメトリを保持しています。", "GIFTは2つのベンチマークで"]}], ["2026-10-26", "Shared-Factor-Conditioned Diffusion for Low-Rank Tensor Recovery", "低ランクテンソル回復のための共有因子条件付き拡散", "", "あり", "画像・ハイパースペクトル画像", "画像", "", "", "", "●", "", "", "", "", "●", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35368", "summary": ["既存の手法はテンソル回復のためのモダリティやタスクの適応に苦労しています。", "DiffTRは共有因子を用いた座標条件付き拡散を用いてテンソル完備、ノイズ除去、超分解能を統一します。", "このフレームワークは表現学習とタスク固有のモデリングを分離し、複数の破損モデルやタスクをサポートします。"]}], ["2026-10-26", "SG-Splat: Stable Geometry Learning under Pose Uncertainty for Pose-Free 3D Gaussian Splatting", "SG-Splat:ポーズフリー3Dガウススプラッティングのための姿勢不確実性下での安定幾何学学習", "", "なし", "画像", "姿勢・3D データ", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35361", "summary": ["ポーズフリー3DGS手法は残差ポーズ誤差に敏感であり、幾何学や属性学習にノイズの多いスーパービジョンをもたらします。", "SG-Splatは幾何学推定とガウス属性予測を2つのブランチに分離し、FGPRやRGCを用いた粗細から細かい精細への精細パイプラインを用いて幾何学的アライメントを改善します。", "SG-SplatはDL3DVおよびRealEstate10Kで、新規ビュー合成およびポーズ推定において最先端の性能を達成しています。"]}], ["2026-10-26", "CVTSplat: Multi-view Reconstruction Using an Adaptive Centroidal Voronoi Tessellation", "CVTSplat:適応型重心ボロノイテッセレーションを用いたマルチビュー再構築", "", "なし", "多視点画像", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35347", "summary": ["既存の手法は、マルチビュー再構築最適化時に不規則なヴォロノイセルが存在するため、高い計算コストに直面しています。", "CVTSplatは適応型重心型ヴォロノイテッセレーションを用いて、規則的なセル形状を維持し、符号付き距離場に基づいてセルサイズを最適化します。", "Voronoiの構築は、特定のデータセットにおける汎用代替方法の5倍から10倍の速さです。"]}], ["2026-10-26", "Targeted Deep Regression - Initial Applications in Whole-Body Water-Fat MRI in UK Biobank", "標的型深部回帰 - 英国バイオバンクにおける全身水脂MRIへの初期応用", "", "なし", "医用画像・画像", "画像・マスク・ラベル", "", "●", "", "", "", "", "", "", "", "●", "", "", "●", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35339", "summary": ["既存の手法では、大規模研究における医療画像解析のための標的回帰が不足しています。", "MRIスキャンの標的解剖学的サブリージョンの2DマルチチャネルコラージュにResNet50スタイルのネットワークを使用します。", "回帰タスクでR2 = 0.731-0.984を、>30,000回のスキャンで達成。"]}], ["2026-10-26", "OVM-Occ: Open-Vocabulary Monocular Occupancy Prediction via Geometry-Aware Vision-Language Distillation", "OVM-OCC:幾何学認識視覚言語蒸留によるオープン語彙単眼占有予測", "", "なし", "画像", "3D データ", "", "", "", "", "", "●", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35312", "summary": ["既存の手法は閉じたあらかじめ定義されたカテゴリの集合に限定されており、屋内シーンの見えないカテゴリへの一般化が制限されています。", "OVM-Occは中間シーン表現として言語埋め込みガウスを用い、幾何学認識型変形可能な注意モジュールと、意味的監督のためのインスタンスレベルの視覚言語埋め込みを導入します。", "この方法は、Occ-ScanNetデータセット上で12.2 mIoU、0.6 IoUの先行手法を上回る性能を発揮しています。"]}], ["2026-10-26", "Low-rank MERA Decomposition of 3D OCT Image Volume for Compression, Denoising, Feature Extraction and Diagnosis of Retinal Diseases", "網膜疾患の圧縮、ノイズ除去、特徴抽出および診断のための3D OCT画像ボリュームの低ランクMERA分解", "", "なし", "画像・医用画像", "画像・マスク・ラベル", "", "●", "●", "", "", "●", "", "", "●", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35271", "summary": ["OCTボリュームはスペックルノイズの影響を受け、高解像度の記憶と伝送が必要です。", "低ランクMERAテンソルネットワークは、トップコア因子と複数の低ランク因子を用いて3D OCT体積を近似します。", "この手法はトレーニングなしで圧縮、ノイズ除去、特徴抽出を実現し、網膜層のセグメンテーション精度を向上させます。"]}], ["2026-10-26", "Beyond Vision-Language Models: Visual-Semantic Affect Graphs for Emotion Recognition in Artworks", "視覚言語モデルを超えて:美術作品における感情認識のための視覚・意味的感情グラフ", "", "なし", "画像・テキスト", "テキスト・ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35244", "summary": ["芸術作品における感情認識は、主観的、暗黙的、関係性に基づく感情的意味のため困難です", "視覚・意味的感情グラフ(VSAG)は、解釈可能な特徴ノードを用いてアートワークをモデル化し、特徴と感情の連合を学習します", "特に、VSAGの階層的価数覚醒バリアントは、直接VLM推論および感情のみのVSAGベースラインにおいて、精度、マクロF1、加重F1の精度を向上させ、全体的な性能を最も優れています。"]}], ["2026-10-26", "Reading Beyond OCR Noise: Robust Cross-Lingual RAG for Legislative Archives", "OCRノイズを超えて読む:立法アーカイブのための堅牢なクロスリンガルRAG", "", "なし", "画像・テキスト", "マスク・ラベル・テキスト", "", "●", "", "●", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35240", "summary": ["インドの歴史的公共アーカイブは、劣化した多列スキャンページ、混合されたスクリプト、複雑なレイアウト、濃密な視覚ノイズにより、コンピュータビジョンおよび文書画像解析の深刻な課題に直面しています。", "エンドツーエンドのフレームワークは、視覚ベースのレイアウトセグメンテーション、マルチスクリプトOCR、エージェントティック検索拡張生成(RAG)パイプラインを組み合わせ、視覚の劣化やレイアウト断片化を処理します。", "このシステムは、20万ページに及ぶパンジャブ州議会アーカイブにおいて標準的なテキストのみの基準を上回る性能を示し、歴史的な文書劣化に対する堅牢な対応を示しています。"]}], ["2026-10-26", "Thermal-Headroom Routing for Efficient Robot Perception in Extreme Heat", "極熱下での効率的なロボット知覚のための熱ヘッドルームルーティング", "", "なし", "赤外線・熱画像", "バウンディングボックス", "", "", "", "", "", "", "", "", "●", "●", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35231", "summary": ["既存のシステムは、極端な高温で熱スロットリングを引き起こす場合、精度、遅延、エネルギー消費のバランスを取るのに苦労しています。", "サーマルヘッドルームルーティングは、プロセッサのスロットリングを引き起こす構成を予測・回避するために熱モデルを使用します。", "THRは高温シナリオで締め切りの遅延を3.9〜7.5ポイント、エネルギーを12〜13%削減します。"]}], ["2026-10-26", "Joint Latent Reasoning and Observation for Agentic Video Understanding", "エージェント的ビデオ理解のための共同潜在推論と観察", "", "なし", "動画・テキスト", "行動", "", "", "", "", "", "", "", "●", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35229", "summary": ["小規模モデルは、回答支援と検索誘導の二重の役割を持つ観察のため、ビデオ理解能力をエージェントに伝えるのに苦労します。", "幼虫は潜在的な推論と視覚的観察を共同で学習し、観察者は行動を選択したり答えを生成したりする推論者に連続的な表現を渡します。", "7Bモデルは、テキスト型CoT学生を3つのベンチマークでそれぞれ5.1、2.5、3.7ポイント上回っています。"]}], ["2026-10-26", "GaussianSpline: Adaptive Bézier Splines for Highly Dynamic 4D Gaussian Splatting", "GaussianSpline:高動的4Dガウススプラッティングのための適応ベジエスプライン", "", "なし", "3D ガウス・動画", "軌跡", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35224", "summary": ["既存の手法は、4次元ガウススプラッティングにおける非常に動的かつ非均一な動きに苦戦しています。", "GaussianSplineは適応型ベジエスプラインを用いて、学習された制御点と時間分割を用いたパーガウス運動をモデル化します。", "GaussianSplineは$G^1$連続性を実現し、動的シーンの再構成品質を向上させます。"]}], ["2026-10-26", "O2D-MedNet: An Optimization-Aware Dual-Domain Framework for Robust Medical Image Segmentation", "O2D-MedNet:堅牢な医療画像セグメンテーションのための最適化対応型デュアルドメインフレームワーク", "", "なし", "医用画像", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35220", "summary": ["医療画像セグメンテーションは、複合画像の劣化や多スケールの幾何学的変動によって、病変と背景の分離性、構造の一貫性、最適化安定性が損なわれています。", "O2D-MedNetは、分解認識型DDIモジュール、クロスバックボーンCGFモジュール、グラデーションコンテキスト最適化戦略を備えた二重ドメインフレームワークを提案し、セグメンテーションの堅牢性を向上させます。", "6つのベンチマークでの実験では、複数の画像手法において最先端手法に比べて一貫した改善が見られました。"]}], ["2026-10-26", "Multi-Agent Relay Thinking", "マルチエージェント・リレー思考", "", "あり", "", "行動", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35219", "summary": ["既存のMAC手法は集団思考に焦点を当てていますが、エージェント間の動的な推論の伝達には欠けています", "MACRは信頼誘導リレートリガーと入札メカニズムを用いて次のエージェントを選定します", "MACRはMathVistaで+3.3%、MMStarで+3.9%の精度を達成し、トークンオーバーヘッドを6.0倍低減しています"]}], ["2026-10-26", "OrthoRF: Exploring Orthogonality in Object-Centric Representations", "OrthoRF:オブジェクト中心表現における直交性の探求", "", "なし", "", "特徴表現", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35203", "summary": ["既存のモデルは、教師なしオブジェクト発見における信頼できるグループ化や事後クラスタリングに苦労しています。", "OrthoRFは内積損失や構造的修正を通じて、向き空間における直交性を強制します。", "OrthoRFは現在のモデルに匹敵するか、それ以上の性能を発揮し、遮蔽された物体部分を復元します。"]}], ["2026-10-26", "Complexity-guided Regularization for Generalizable Human Gaussian Splatting", "一般化可能なヒューマンガウススプラッティングのための複雑性指向正則化", "", "あり", "多視点画像", "3D ガウス", "", "", "", "●", "●", "", "●", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35152", "summary": ["既存の手法は、幾何学的および質感的な複雑さのため、人間の被験者の細かい詳細を表現するのに苦労しています。", "局所的エントロピーを用いてガウス配置とパッチサンプリングを導く複雑度指向正則化スキームが提案されています。", "この手法はリアルタイム推論速度を維持しつつ、最先端の性能を実現しています。"]}], ["2026-10-26", "Temporal Slice Learning for AI-Generated Video Detection with 400$\\times$ Fewer FLOPs", "400ドル\\時間$少ないFLOPでAI生成ビデオ検出のための時間スライス学習", "", "なし", "動画", "動画", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35148", "summary": ["既存の検出器は重いバックボーンに依存してフルビデオをモデル化するため、計算コストが高く、スケーラビリティも限られています。", "本論文は、AI生成ビデオ検出における有益な時間的変化を分離するために、周波数認識時間一貫性学習を用いた軽量なフレームワークを提案します。", "GenVideoとAI-Artistでの実験では、強力なパフォーマンスを達成しつつ、強力なビデオベースのベースラインReStraV(前処理を含むエンドツーエンドで2.9ドル\\時間$高速)よりもモデルフォワードFLOP数が400ドル以上少なく、モデル推論速度が3.6ドル/時間$高速であることが示されており、スケーラブルで実用的な展開が可能であることが示されています。"]}], ["2026-10-26", "Sexual dimorphism and sex-specific features of pediatric hand bone shapes via statistical shape modeling", "小児手の骨の形状における性的二形性と性別特異的特徴を統計的形状モデリングによる研究", "", "なし", "", "マスク", "", "●", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35143", "summary": ["小児の手骨の形状変異、性二形性や成長に伴う変化を理解することは困難です。", "統計的形状モデルを用いて人口統計的層別形状パラメータを解析する2段階の検出・分割フレームワークを開発しました。", "我々の手法は、HD95 =、ASSD =、Dice =、IoU =で高いセグメンテーション精度を実現しました。"]}], ["2026-10-26", "Domain-Adapted Latent Diffusion Models for CT-to-PET Image Translation", "CTからPETへの画像翻訳のためのドメイン適応潜在拡散モデル", "", "なし", "医用画像", "画像・マスク", "", "", "", "●", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35132", "summary": ["既存の拡散ベースの手法は、画像翻訳のためのペア化されたCT/PETトレーニングデータの不足に苦戦しています。", "本論文は、署名付きパワー変換と21,930のペア化されたCT/PETスライスからなる小規模なデータセットを用いたドメイン適応型潜在拡散フレームワークを提案しています。", "このアプローチはCPDMに比べてピクセル単位の再建と腫瘍の忠実度が優れており、PETデータの稀な評価指標もより信頼性が高いです。"]}], ["2026-10-26", "Understanding and Repairing Cooperative Perception under Adverse Weather", "悪天候下での協同的認識の理解と修復", "", "なし", "LiDAR", "バウンディングボックス・LiDAR", "", "", "", "", "", "", "", "", "", "●", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35110", "summary": ["悪天候は、融合前の物体表象に干渉し、協調的知覚システムが機能しなくなります。", "本論文は、ポイント分類器や局所補正を含む、監督可能な個別実装を備えた悪天候協同修理(AWCR)を提案しています。", "AWCRは自然天候データでV2X-ViTで車両BEV AP@0を4.66ポイント、AttFuseで5.56ポイント改善しました。"]}], ["2026-10-26", "Uncertainty Evaluation to Support Safety of the Intended Functionality Analysis for Determining the Applicability of Performance Targets Across Triggering Conditions in ML-Based LiDAR Object Detection", "意図された機能の安全性を支援するための不確実性評価 MLベースのLiDARオブジェクト検出におけるトリガー条件を超えたパフォーマンスターゲットの適用可能性を判断するための分析", "", "なし", "LiDAR・点群・動画", "LiDAR・点群・バウンディングボックス", "●", "", "", "", "", "●", "", "", "", "●", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35092", "summary": ["既存の手法では、MLベースのLiDARオブジェクト検出に性能目標を適用する際、すべてのトリガー条件で意図された機能(SOTIF)の安全性を保証できません。", "論文では、閾値をトリガー条件に移し、誤差確率を条件にパフォーマンス目標が適用できるかどうかを検証する不確実性評価を提案しています。", "この手法は、受信機の動作特性曲線下の面積を減少させることなく、適用できない無差別なトリガー条件(遠距離、雨、2つの別々に訓練された検出器)を実現します。"]}], ["2026-10-26", "Test-Time Prompt-Agnostic Decomposition", "テストタイムプロンプト非依存分解", "", "なし", "テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35090", "summary": ["既存のTPT手法は、テスト時間ステップを通じてノイズやバイアスのあるラベルのない目標が蓄積されるため、プロンプト更新の軌道を安定化できません。", "本論文では、プロンプト更新を大きさと方向に分解して故障モードを解析・制御するためのテストタイムプロンプト非依存分解(TPD)と、アップデートを調整するための適応型クープマン制御(AKC)とハンケル更新ルーター(HUR)を提案しています。", "15のデータセットでの実験では、$\\mathtt{TPD}$が10のベースラインを一貫して改善し、視覚プロンプトで3ドルから8%ドル、テキストプロンプトで2ドル以上の向上が示されています。"]}], ["2026-10-26", "Reading the Registers of Honorius III without Manual Line Transcription: Forced-Aligned HTR, End to End, Modular or Hybrid", "ホノリウス3世のレジスターを手書きで読み取る際の手動行書き起こし:強制アライメントHTR、エンドツーエンド、モジュラーまたはハイブリッド", "", "なし", "画像・テキスト", "マスク・ラベル・テキスト", "", "●", "", "", "", "", "", "●", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35085", "summary": ["既存の方法は、中世写本の大幅に短縮されたラテン語の転写に苦労しており、手書きの行書きにかかるコストが高かったためです。", "本論文は、CTCと双方向サブワード注意デコーダを組み合わせたハイブリッドなコンフォーマーモデルを提案し、端から端までのHTRを実現します。", "このモデルは4.7%のCERと8.7%のWERを達成し、節末語の誤差を従来の手法と比べてほぼ半分に減少させています。"]}], ["2026-10-26", "Improving VLMs on Scientific Chart Analysis via Autonomous Evolution", "自律進化による科学的チャート解析におけるVLMの改善", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35077", "summary": ["VLMは科学的チャートの正確な質問回答に苦労しています。なぜなら、答えが不正確だからです。", "論文は自律進化を用いて凍結されたVLMを中心に推論プログラムを最適化しています。", "精度は16.6%から41.3%に向上し、最大で55.2ポイントの上昇が見られます。"]}], ["2026-10-26", "Blendshape Generation for Models with Disconnected Parts: Adding ARKit/MediaPipe Blendshapes to Anime-Style Character Models", "部品の分離したモデルのためのブレンドシェイプ生成:アニメ風キャラクターモデルにARKit/MediaPipeのブレンドシェイプを追加する", "", "なし", "メッシュ", "メッシュ・3D データ", "", "", "", "", "", "", "●", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35076", "summary": ["既存の研究では、複数の切り離されたパーツを持つ3Dモデルのブレンドシェイプ生成にはほとんど取り組んでいません。", "この論文は、ニューラルネットワークが入力メッシュの周囲に変形場を生成するように訓練し、各部分は少なくとも1つのネットワークで処理され、アンカー部分を介して調整されます。", "この方法は、ゼロ変位を予測し、ブレンドシェイプを専用ネットワークでサイズグループに分類することで精度を向上させます。"]}], ["2026-10-26", "MemVLN: Streaming Episodic Memory for Vision-Language Navigation", "MemVLN:視覚言語ナビゲーションのためのストリーミングエピソード記憶", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35066", "summary": ["VLMベースのストリーミングエージェントにとって、持続的なエピソード記憶を維持するための長期的なナビゲーションは依然として課題です。", "MEMVLNは、圧縮された知覚特徴とタイムステップとアクション由来の相対ポーズを用い、クロスアテンションを通じてコンパクトなメモリトークンを生成するストリーミングエピソード記憶フレームワークを用いています。", "MEMVLNはVLMベースライン上で成功率を17%から40%に向上させ、さらにポストトレーニングで47%に引き上げます。"]}], ["2026-10-26", "Kronecker-Structured Video Completion with Cross-Fitted Self-Supervised Residual Learning", "クロスフィット型自己教師付き残留学習を用いたクロネッカー構造化ビデオ補完", "", "なし", "動画・画像", "軌跡", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35065", "summary": ["既存の映像補完法は、フレーム間の未観測空間位置での時間的軌道再構築に苦労しています。", "2段階の枠組みは、正則化されたマスク付きクロネッカー積分解とクロスフィット型自己教師あり残差学習を組み合わせています。", "本手法はグレースケールベンチマークで最高の平均PSNRとSSIMを達成し、DAVIS RGBシーケンスでは最高の平均欠損領域PSNRおよびフルフレームSSIMを達成しています。"]}], ["2026-10-26", "LOCUS: Locate Once, Check Until Settled. Draft-and-Verify Visual Grounding with a Box Head and Coordinate-Token Verification", "ローカス:一度見つけて、確定するまで確認。ボックスヘッドと座標トークン検証によるドラフト・アンド・バリエーション・ビジュアルグラウンディング", "", "なし", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35053", "summary": ["VLMにおける既存の視覚グラウンディング手法は、高いIoUで精度が低下するか、連続的な復号ステップのために遅くなります。", "Locusは回帰ヘッドを投機的な起草者として使用して座標トークンを生成し、Jacobi反復で共有画像接頭辞を使用して検証されます。", "検証は平均してAcc@0.9を改善し、連続パス回数を18.46秒から5.60秒に短縮します。"]}], ["2026-10-26", "DriveUniTok: A Unified Multimodal Tokenizer for Driving World-Action Models", "DriveUniTok:世界行動モデルを駆動するための統一マルチモーダルトークナイザー", "Xiaomi", "なし", "LiDAR・深度", "LiDAR・深度・行動", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35044", "summary": ["既存のアプローチでは、外見、LiDARの深さ、エゴの動きが分離されており、情報の損失やモーダル間の不整合を引き起こしています。", "DriveUniTokは外観、LiDARの深さ、エゴの動きを統一された世界アクションモデルのために単一の連続的な潜在条件にエンコードします。", "実験によれば、統一設計は分離ストリームの代替案よりも計算コストを抑えつつ、より良い未来予測を実現していることが示されています。"]}], ["2026-10-26", "Revealing Imaging Characteristics of Thermal Wakes from Underwater Vehicles Without Cooling-Water Discharge", "冷却水放出なしの水中船体からの熱航跡の画像特性を明らかにする", "", "なし", "赤外線・熱画像・動画", "バウンディングボックス", "", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35038", "summary": ["既存の研究では実際の背景を捉えられず、対象と背景の区別が制限されています。", "AVP-IR-Wakeは、3年間で収集された161,485フレームの大規模な実世界ベンチマークです。", "熱的尾流は離散的な渦の拡張構造であり、コンパクトで一時的なターゲットの仮定に挑戦します。"]}], ["2026-10-26", "Zero-Shot Monocular Depth Estimation for Visual Perception in Lower-Limb Prostheses", "下肢義肢における視覚知覚のためのゼロショット単眼深度推定", "", "あり", "深度", "深度", "", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35018", "summary": ["既存のモデルでは、下肢義肢における奥行き知覚の評価が不足しています。", "人工的な観点から単眼深さ推定を評価するためにＬＰデータセットを導入した。", "私たちは義肢知覚における単眼深度推定の初の体系的なベンチマークを提供します。"]}], ["2026-10-26", "When Pointing Becomes Profiling: Social Bias and Refusal in Text-Steerable Visual Encoders", "指し示すことがプロファイリングになるとき:テキスト誘導型視覚エンコーダーにおける社会的偏見と拒否", "", "公開予定", "テキスト", "ラベル・テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", {"alpha": "https://www.alphaxiv.org/abs/2610.35017", "summary": ["既存のテキストステア可能なビジュアルエンコーダーは、社会的偏見や不適切なプロンプトを拒否できない傾向を示しています。", "論文では、学習された控除出力と反事実不変性トレーニングを加えるSafeSteerを提案しています。", "SafeSteerは、すべきポイントとすべきアブステインのプロンプトを分離する際で0.997のAUROC、遠ざかる敏感な単語への一般化で0.998を達成しています。"]}], ["2026-10-26", "Shifted Window Temporal Transformer for YOLO-Guided Phase Recognition in Laparoscopic Cholecystectomy Surgery", "腹腔鏡胆嚢摘出手術におけるYOLO誘導位相認識のためのシフトウィンドウ時間トランスフォーマー", "", "あり", "医用画像", "ラベル・医用画像", "", "", "", "", "", "", "", "", "", "", "●", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35005", "summary": ["既存のAI手法は、遷移時の予測が変動するため、手術中の位相認識に苦労しています。", "本論文は、Swinトランスフォーマーと時間トランスフォーマーエンコーダを並列YOLOv11sネットワークと組み合わせたフレームワークを提案し、リアルタイムの機器局在化と因果的な時間平滑化を実現します。", "このフレームワークは位相認識精度92%とF1スコア0.86を達成し、EndoNet、SV-RCNet、TeCNO、Trans-SVNet、LoViTなどの従来の手法を上回る性能を発揮しています。"]}], ["2026-10-26", "DUET4D: Self-Corrective Coupled Guidance for Sparse-View 4D Reconstruction", "DUET4D:スパースビュー4D再構成のための自己修正連結ガイダンス", "", "なし", "3D ガウス・動画", "動画", "", "", "", "●", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35002", "summary": ["スパースビューの4D再構成は、カメラが少ないため制約が不足しています", "DUET4Dは、疎視4Dガウススプラッティングのために自己補正結合誘導フレームワークを使用しています", "DUET4Dはレンダリング品質と効率を向上させます"]}], ["2026-10-26", "More Memory, Better Videos? A Controlled Study of Visual Memory in Long-Video Generation", "より多くのメモリ、より良い動画?長距離ビデオ生成における視覚記憶の管理研究", "", "なし", "動画・画像・テキスト", "動画・ラベル・テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.35001", "summary": ["既存の研究では、視覚記憶が増えるほど映像の一貫性が向上すると仮定されていますが、本論文はそれが現在のストーリーとの矛盾を招くことを示しています。", "本論文はVMem-Benchを用いて、異なる検索方針を持つTrack-AとTrack-Bの2つのトラックを通じて、視覚記憶が長尺動画生成に与える影響を研究しています。", "検索はエンティティのリコールを増加させますが、精度や禁止されたエンティティの回避は減少します。"]}], ["2026-10-26", "Reason or Recite: Complementary Specialists with an LLM Judge for Traffic Anomaly Reasoning", "理由か朗読:交通異常推論のためのLLM審査員による補完専門家", "", "なし", "画像・テキスト・動画", "テキスト", "", "", "", "", "", "", "", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34993", "summary": ["トラフィック異常推論は、正確な推論と注釈スタイルのマッチングの両方を必要とし、既存の視覚言語モデルと矛盾します。", "Reason-or-Recite(RoR)は、構造化注釈に基づく9Bモデルと回答に微調整された27Bモデルという二つの専門的なフレームワークを用いており、LLMの審査員によって選ばれます。", "RoRは平均スコア0.6788を記録し、インドメインリーダーボードで1位にランクインしています。"]}], ["2026-10-26", "Sparse Recovery Bird's-Eye View Model Soup for Robust Camera-Based 3D Object Detection", "スパースリカバリー鳥瞰モデルスープ:堅牢なカメラベースの3D物体検出", "", "なし", "3D データ", "バウンディングボックス", "●", "", "", "", "", "●", "●", "", "●", "", "", "●", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34976", "summary": ["既存のカメラベースのBEV方式は、実際の汚染に対する強靭性に欠けています", "SR-BEVSはスパースリカバリーを用いてレイヤーの剪定、ランダムな剪定、ランダムな学習率を持つモデルの再学習を用います", "Fast-BEVに比べて腐敗の堅牢性が33.8%向上し、クリーン精度が1.8%向上しました"]}], ["2026-10-26", "GUIFlow: Temporal Redundancy-Aware Incremental Inference for GUI Agents", "GUIFlow:GUIエージェント向けの時間冗長性認識による増分推論", "", "なし", "画像・テキスト", "テキスト・画像", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34959", "summary": ["従来のGUIエージェントの推論は重複する観測や履歴を繰り返し再計算するため、多段階の相互作用はコストがかかります。", "GUIFlowは、時間冗長性を認識した増分推論を用いて、相互作用ステップ間で計算状態を選択的に更新します。", "GUIFlowは、追加のトレーニングやモデル変更なしでオフラインベンチマークで最大3.39倍、オンラインインタラクションで最大3.49倍の高速化を実現します。"]}], ["2026-10-26", "DimFlow: Bidirectional Grid-Expert Learning for Dynamic Gaussian Reconstruction", "DimFlow:動的ガウス再構築のための双方向グリッドエキスパート学習", "", "なし", "テキスト・3D データ", "3D データ", "", "", "", "", "●", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34952", "summary": ["動的ガウス再構成では、協調的な幾何学や外観の変化のためにコンパクトな特徴量が必要です", "DimFlowは、多解像度グリッドと座標ベースのエキスパートブランチ間の双方向相互作用を利用します", "DimFlowは39.73 dBのPSNRを達成し、4D-GSより1.92 dB向上しています"]}], ["2026-10-26", "Fed-MAPTrack: Federated Modality-aware Prompt Tuning for RGB-X Tracking", "Fed-MAPTrack:RGB-XトラッキングのためのFederated Modality-Aware Prompt Tuning(連邦モダリティ認識プロンプトチューニング)", "", "なし", "赤外線・熱画像・深度・動画", "軌跡", "", "", "", "", "●", "", "", "", "", "●", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34939", "summary": ["RGB-Xトラッキングの集中訓練では、マルチモーダル動画を一箇所で収集する必要がありますが、センサーの異質性によりパラメータ共有領域とクライアントの貢献との間に不一致が生じます。", "Fed-MAPTrackは、クライアントがプロンプト関連パラメータのみを最適化・交換し、サーバーがRGB共有パラメータを集約し、熱、イベント、深度パラメータごとに別々のバンクを維持するモダリティ認識型の連邦プロンプトチューニングフレームワークを使用しています。", "Fed-MAPTrackは、LasHeRで平均FedAvgスコアを2.35AUCポイント、VisEventで3.45SRポイント、DepthTrackで2.11Fスコアポイント向上させています。"]}], ["2026-10-26", "Supervising the Visible State: Separating Representation from View Selection in Streaming Video", "可視状態の監督:ストリーミング動画における表象とビュー選択の分離", "", "なし", "動画", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34926", "summary": ["既存の手法では、ストリーミング動画における状態の未仕様化処理ができません。", "可視状態監視(ViSS)は、イベント特性のソース接地プローブを訓練し、テスト時間因果ビュー検索(TVS)は、モデルを固定したまま証拠アクセスを適応させます。", "ViSSはOVO-Benchをベースライン上で改善し、StreamingBenchでも比較可能であり、幻覚検出において最大の向上を示しています。"]}], ["2026-10-26", "Rethinking Data Imbalance in Class Incremental Surgical Instrument Segmentation", "クラスにおけるデータ不均衡の再考 段階的外科器具セグメンテーション", "", "なし", "画像", "画像・マスク・姿勢", "", "●", "", "●", "", "", "", "", "", "", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34925", "summary": ["既存のニューラルネットワークは、壊滅的な忘却やデータバランスの欠如により、手術器具の分割作業に苦戦しています。", "SurgCSSはインペインティングを用いてリアルな背景を生成し、クラス認識したブレンドを用いてデータ分布のバランスを取るほか、クラスの脱感作損失と動的な重み融合も行っています。", "このフレームワークは、データバランスの不均衡下での外科器具のセグメント化において、既存のベースラインに比べて大幅な性能向上を実現しています。"]}], ["2026-10-26", "DiffAuction: An Auction-Driven Framework for Generative Image Advertising", "DiffAuction:生成画像広告のためのオークション駆動型フレームワーク", "", "なし", "画像・テキスト", "画像・テキスト", "", "", "", "●", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34917", "summary": ["既存の手法は、異なるターゲットシェア構成で画像を生成する際に計算コストが高く、結果の評価や価格設定の方法が不明確です。", "DiffAuctionは、制御可能な生成、クリック意図評価、オークション設計を統合し、残留シェアキャリブレーション、シェア条件付きプロンプト、学習可能なアフィン最大化オークションを用います。", "その結果として得られる配分と支払いルールは、支配戦略のインセンティブ適合性と個別の合理性を保証し、AMAはより高いプラットフォーム収益を達成します。"]}], ["2026-10-26", "Accuracy and efficiency of compact foundation models for surface-water mapping during floods", "洪水時の表流水マッピングにおけるコンパクト基礎モデルの精度と効率", "", "なし", "イベントカメラ", "3D データ", "", "", "", "", "", "", "", "", "●", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34904", "summary": ["事前学習済み地球観測モデルはマッピング作業を軽減するかもしれませんが、その効果は代替モデルとの比較に依存します。", "本論文では、Prithvi-EO-2.0-TinyをU-Net、より大きなPrithviモデル、および11回の洪水事象から446枚のSentinel-2チップを用いてスペクトルインデックスの閾値を評価しています。", "微調整されたPrithvi-Tinyは252のトレーニングチップで0.833 IoUを達成し、U-Netの0.856 IoUを上回り、GPUでのチップ処理速度は16.1ms、U-Netは30.6msでした。"]}], ["2026-10-26", "LE-GDA: Layer Ensemble Gaussian Discriminant Analysis for Training-Free Few-Shot CLIP Adaptation", "LE-GDA:トレーニングフリーの少ショットCLIP適応のためのレイヤーアンサンブルガウス判別解析", "", "あり", "画像・テキスト", "テキスト", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34901", "summary": ["既存の視覚言語モデルの訓練なし少ショット適応法は、表象間に分散するクラススコアの違いにより中間表現を効果的に活用できません。", "LE-GDAは、単一の凍結されたエンコーダパスからの中間および最終表現に対するガウス判別解析を行い、クラススコアを標準化し、勾配最適化なしのゼロショット分類器と組み合わせます。", "11のデータセット、4つのCLIPバックボーン、5回のショットカウント、3つの独立サンプリングされたKショットトレーニングセットを用いて、LE-GDAはすべてのバックボーンに対して評価されたすべての手法の中で最高の平均精度を達成し、16ショット平均を78.01%から79.54%に引き上げ、すべてのバックボーンショットの組み合わせでその基準値を向上させています。"]}], ["2026-10-26", "SGDB: Semantic-Geometric Decoupling and Evidence Binding for Logical Anomaly Detection", "SGDB:論理的異常検出のための意味-幾何学的デカップリングと証拠結合", "", "なし", "", "ラベル", "", "", "", "", "", "", "", "", "", "", "", "", "", "●", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34897", "summary": ["既存の手法では、論理的異常検出において正しい同一等式と不正確な幾何学の区別に苦労しています。", "SGDBは意味情報と幾何学的情報を切り離し、証拠を同一性に結びつけ、凍結言語モデルを用いて数値的証拠を用いた主張として結果を表現します。", "SGDBは5つのMVTec LOCOタスクで98.19%のAUROCと94.52%のF1を達成し、50のVID-ADタスクすべてで93.56%のAUROCと92.76%のF1を達成しています。"]}], ["2026-10-26", "MMGNet: Multi-Modal 6-DoF Grasp Synthesis for Cluttered Scenes", "MMGNet:混沌としたシーンのためのマルチモーダル6-DoFグラスプ合成", "", "公開予定", "画像", "3D データ・点群", "", "", "", "●", "", "", "●", "", "", "", "●", "", "", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34893", "summary": ["実際の点観測はノイズが多く、不完全で、過度に平滑化されています", "MMGNetは階層的な画像から3Dへの特徴注入および回転把握モデリングを使用しています", "MMGNetはRealSenseを用いたGraspNet-1Billionで平均AP60.34を達成しています"]}], ["2026-10-26", "MedAdaptAgent: An Automatic Harness for Adapting Medical Imaging Models to New Sites", "MedAdaptAgent:医療画像モデルを新しいサイトに適応するための自動ハーネス", "", "なし", "医用画像・テキスト", "マスク・ラベル・医用画像", "", "●", "", "", "", "", "", "", "", "●", "", "", "●", "", "", {"alpha": "https://www.alphaxiv.org/abs/2610.34884", "summary": ["既存のモデルは、画像診断プロトコルや前処理の違いにより新しい病院では性能が低下しています。", "MedAdaptAgentはLLM駆動の適応プランナーを用いて、適合する実験を選択し、現場の証拠に基づいてモデルを調整します。", "このシステムは、20の局所注釈でセグメンテーションダイスで60.1%の相対的な向上を達成し、有害な置換を30.8%削減しま
